<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Texture Matériaux</title>
<meta name="description" content="Textures d'architecture aux feutres à alcool, étape par étape.">
<meta name="theme-color" content="#eff0ec">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Textures">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Caveat:wght@600&family=Architects+Daughter&display=swap">
<style>
/* Layout: table à dessin — barre fixe, grille de cases encadrées comme sur une planche, fiche avec lecteur pas à pas, mode planche guidé. Accent = bleu d'encre technique. */
:root {
  --bg: #eff0ec;
  --surface: #fbfbf8;
  --ink: #1f2226;
  --ink-2: #5a6068;
  --rule: #d6d9d3;
  --blue: #1f6aa5;
  --blue-soft: #dce9f2;
  --frame: #1b1c1f;
  --f-display: "Bricolage Grotesque", "Space Grotesk", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-hand: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
  --f-letter: "Architects Daughter", "Segoe Print", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --surface: #1e2125; --ink: #e8e9e5; --ink-2: #a3a9b1;
    --rule: #33373d; --blue: #7bbbe8; --blue-soft: #1c3243; --frame: #0c0d0f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171a; --surface: #1e2125; --ink: #e8e9e5; --ink-2: #a3a9b1;
  --rule: #33373d; --blue: #7bbbe8; --blue-soft: #1c3243; --frame: #0c0d0f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: 90px; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 56px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1120px; margin: 0 auto; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 4px; }

.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--rule); margin-bottom: 28px;
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; }
.brand b { font-family: var(--f-display); font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; }
.brand span { font-family: var(--f-mono); font-size: 0.7rem; color: var(--ink-2); letter-spacing: 0.06em; }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.nav::-webkit-scrollbar { display: none; }
.nav a { text-decoration: none; font-weight: 500; font-size: 0.9rem; color: var(--ink-2); padding: 6px 11px; border-radius: 999px; white-space: nowrap; }
.nav a[aria-current="page"] { color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--rule); }
.nav a:hover { color: var(--ink); }
.badge { font: 600 0.68rem var(--f-mono); background: var(--blue); color: var(--bg); border-radius: 999px; padding: 1px 6px; margin-left: 4px; vertical-align: 1px; }
@media (max-width: 560px) { .brand span { display: none; } }

#view > * { animation: rise .28s ease both; }
@keyframes rise { from { opacity: .5; transform: translateY(6px); } to { opacity: 1; transform: none; } }

h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.015em; }
h1 { font-size: clamp(2rem, 5vw, 3rem); line-height: 1.05; font-weight: 700; }
h2 { font-size: 1.4rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
.eyebrow { font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--blue); }
.lead { color: var(--ink-2); max-width: 64ch; font-size: 1.05rem; margin: 12px 0 0; }
.intro { display: grid; gap: 4px; margin-bottom: 24px; }
.stack { display: grid; gap: 16px; }
.section-gap { margin-top: 56px; }
.muted { color: var(--ink-2); margin: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; cursor: pointer; font: 600 0.92rem var(--f-body); color: var(--bg); background: var(--ink); border: 0; border-radius: 8px; padding: 10px 16px; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--rule); }
.btn.soft { background: var(--blue-soft); color: var(--ink); }
.btn:disabled { opacity: .35; cursor: default; }

.resume { display: flex; align-items: center; gap: 14px; text-decoration: none; margin-bottom: 24px; padding: 10px 14px 10px 10px; border-radius: 10px; background: var(--blue-soft); max-width: 520px; }
.resume img { width: 52px; height: 52px; border: 2px solid var(--frame); display: block; flex: none; background: #fbfaf6; }
.resume div { display: grid; min-width: 0; }
.resume small { font-family: var(--f-mono); font-size: 0.68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--blue); }
.resume b { font-family: var(--f-display); }
.resume span { margin-left: auto; color: var(--blue); font-weight: 600; white-space: nowrap; }

.toolbar { display: grid; gap: 12px; margin-bottom: 8px; }
.toolrow { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--rule); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 13px; border-radius: 999px; cursor: pointer; font-weight: 500; font-size: 0.86rem; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg-label { font-size: 0.85rem; color: var(--ink-2); margin-right: 8px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 500 0.85rem var(--f-body); color: var(--ink-2); background: transparent; border: 1px solid var(--rule); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.chip:hover { color: var(--ink); border-color: var(--ink-2); }
.chip[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.search { font: 400 0.95rem var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px; width: min(260px, 100%); }

.group-title { display: grid; gap: 2px; margin: 36px 0 14px; }
.group-title h2 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.group-title h2 small { font: 500 0.8rem var(--f-body); color: var(--ink-2); letter-spacing: 0; }
.group-title p { margin: 0; color: var(--ink-2); font-size: 0.92rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 24px 18px; }
.card { text-decoration: none; display: grid; gap: 8px; align-content: start; }
.thumb { position: relative; }
.sw { aspect-ratio: 1; width: 100%; height: auto; max-width: 100%; display: block; background: #fbfaf6; border: 2px solid var(--frame); }
.card .sw { transition: transform .2s ease, box-shadow .2s ease; }
.card:hover .sw { transform: translateY(-3px); box-shadow: 0 10px 22px -14px rgba(0,0,0,.45); }
.status { position: absolute; left: 8px; top: 8px; font: 600 0.72rem var(--f-body); padding: 3px 8px; border-radius: 999px; background: rgba(251,250,246,.94); color: #1b1c1f; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
.status.done { background: #2f7d4f; color: #fff; }
.card-meta { display: grid; gap: 1px; }
.card-meta b { font-family: var(--f-display); font-weight: 700; font-size: 1rem; line-height: 1.25; }
.card-meta span { font-size: 0.78rem; color: var(--ink-2); }
.dots { letter-spacing: 2px; color: var(--blue); }
.empty { color: var(--ink-2); padding: 24px 0; }
.teasers { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.teaser { display: grid; gap: 8px; align-content: start; text-decoration: none; padding: 20px; border-radius: 10px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--rule); }
.teaser:hover { box-shadow: inset 0 0 0 1px var(--ink-2); }
.teaser p { margin: 0; color: var(--ink-2); }
.teaser span { color: var(--blue); font-weight: 600; font-size: 0.92rem; }

.crumbs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 0.88rem; color: var(--ink-2); margin-bottom: 18px; }
.crumbs a { text-decoration: none; }
.crumbs a:hover { color: var(--ink); }
.sheet { display: grid; gap: 28px; }
.sheet-head { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.sheet-head > img { width: 96px; height: 96px; border: 2px solid var(--frame); flex: none; display: block; background: #fbfaf6; }
.sheet-head > div { flex: 1 1 260px; min-width: 0; }
.facts { display: flex; gap: 6px 20px; flex-wrap: wrap; margin-top: 10px; font-size: 0.9rem; color: var(--ink-2); }
.facts b { color: var(--ink); font-weight: 600; }
.use { margin: 6px 0 0; font-size: 0.9rem; color: var(--ink-2); }
.observe { border-left: 3px solid var(--blue); padding: 4px 0 4px 16px; margin: 0; font-size: 1.05rem; max-width: 72ch; }
.observe small { display: block; font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--blue); margin-bottom: 4px; }

.stepper { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px 36px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--rule); border-radius: 12px; padding: 22px; }
.stage { position: relative; touch-action: pan-y; }
.stage .sw { box-shadow: 0 16px 36px -24px rgba(0,0,0,.5); }
.arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgba(251,250,246,.94); color: #1b1c1f; font-size: 1.3rem; line-height: 1; box-shadow: 0 2px 10px rgba(0,0,0,.25); cursor: pointer; display: grid; place-items: center; }
.arrow.prev { left: 10px; } .arrow.next { right: 10px; }
.arrow:disabled { opacity: 0; pointer-events: none; }
.new-badge { position: absolute; left: 10px; top: 10px; background: #1f6aa5; color: #fff; font: 600 0.74rem var(--f-body); padding: 4px 10px; border-radius: 999px; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
.stage-text { display: grid; gap: 14px; align-content: start; }
.stage-count { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-family: var(--f-mono); font-size: 0.76rem; letter-spacing: .08em; text-transform: uppercase; color: var(--blue); }
.progress { height: 5px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--blue); transition: width .25s ease; }
.stage-p { font-size: 1.15rem; line-height: 1.5; margin: 0; }
.how { background: var(--bg); border-radius: 8px; padding: 10px 12px; font-size: 0.92rem; color: var(--ink); margin: 0; }
.how b { display: block; font: 500 0.68rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--blue); margin-bottom: 2px; }
.stage-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.stage-actions .btn { flex: 1 1 140px; }
.hint { font-size: 0.8rem; color: var(--ink-2); margin: 0; }
.toggle { display: inline-flex; gap: 10px; align-items: center; justify-self: start; border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 6px 14px 6px 8px; cursor: pointer; font-size: 0.86rem; font-weight: 500; }
.toggle i { width: 30px; height: 18px; border-radius: 999px; background: var(--rule); position: relative; flex: none; }
.toggle i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); transition: left .2s ease; }
.toggle[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); }
.toggle[aria-pressed="true"] i { background: var(--blue); }
.toggle[aria-pressed="true"] i::after { left: 14px; }
.film { grid-column: 1 / -1; list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.film button { border: 0; background: none; padding: 0; cursor: pointer; display: grid; gap: 5px; width: 100%; text-align: center; border-radius: 4px; }
.film img { width: 100%; height: auto; aspect-ratio: 1; border: 2px solid var(--frame); display: block; background: #fbfaf6; opacity: .5; transition: opacity .2s ease; }
.film button.done img { opacity: .85; }
.film button[aria-current="step"] img { opacity: 1; outline: 3px solid var(--blue); outline-offset: 2px; }
.film span { font: 500 0.72rem var(--f-mono); color: var(--ink-2); }
.film button[aria-current="step"] span { color: var(--blue); }

.tag { font: 500 0.8rem var(--f-body); padding: 4px 10px; border-radius: 999px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--rule); display: inline-flex; align-items: center; gap: 7px; justify-self: start; }
.tag i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); flex: none; }
.tag small { font: 500 0.72rem var(--f-mono); color: var(--ink-2); }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px 48px; align-items: start; }
.palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.pen { display: grid; grid-template-columns: 40px minmax(0,1fr); gap: 10px; align-items: center; }
.pen i { width: 40px; height: 40px; border-radius: 50% 50% 6px 6px; display: block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
.pen b { font-weight: 600; font-size: 0.9rem; display: block; line-height: 1.25; }
.pen span { font: 500 0.74rem var(--f-mono); color: var(--ink-2); }
.extras { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 0.92rem; }
.errors { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.errors li { display: grid; grid-template-columns: 18px minmax(0,1fr); gap: 10px; }
.errors li::before { content: "✕"; color: var(--ink-2); font-weight: 700; }
.tip { background: var(--blue-soft); border-radius: 8px; padding: 18px 20px; }
.tip b { font-family: var(--f-hand); font-size: 1.6rem; color: var(--blue); line-height: 1; display: block; margin-bottom: 6px; transform: rotate(-1.5deg); transform-origin: left; }

.related { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; }
.related a { flex: 0 0 120px; scroll-snap-align: start; text-decoration: none; display: grid; gap: 6px; align-content: start; }
.related a b { font-family: var(--f-display); font-size: 0.88rem; line-height: 1.2; }
.related a[aria-current="page"] .sw { outline: 3px solid var(--blue); outline-offset: 2px; }
.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--rule); padding-top: 20px; }
.pager a { text-decoration: none; display: grid; gap: 2px; }
.pager a small { color: var(--ink-2); font-size: 0.8rem; }
.pager a b { font-family: var(--f-display); }
.pager a.next { text-align: right; margin-left: auto; }

.gestures { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 24px; }
.gesture { display: grid; gap: 8px; align-content: start; }
.gesture img { width: 100%; height: auto; aspect-ratio: 8/5; border: 2px solid var(--frame); display: block; background: #fbfaf6; }
.gesture p { margin: 0; color: var(--ink-2); font-size: 0.92rem; }
.toolgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 0 32px; }
.toolgrid div { padding: 14px 0; border-bottom: 1px solid var(--rule); }
.toolgrid p { margin: 4px 0 0; color: var(--ink-2); font-size: 0.92rem; }
.rules { margin: 0; padding-left: 20px; display: grid; gap: 8px; max-width: 70ch; }
.table-wrap { overflow-x: auto; }
.scale-table { width: 100%; border-collapse: collapse; min-width: 520px; font-size: 0.94rem; }
.scale-table th, .scale-table td { text-align: left; padding: 12px 14px 12px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.scale-table th { font: 500 0.72rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.scale-table td:first-child { font-family: var(--f-display); font-weight: 700; white-space: nowrap; }
.kit-count { font-size: 0.78rem; color: var(--blue); font-weight: 600; }

.plate-wrap { overflow-x: auto; }
.plate { background: #fbfaf6; color: #1b1c1f; border: 2px solid #1b1c1f; padding: 18px; min-width: 520px; max-width: 760px; box-shadow: 0 20px 44px -28px rgba(0,0,0,.5); }
.plate-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px 28px; padding: 6px 18px 18px; }
.plate-grid.c2 { grid-template-columns: repeat(2, 1fr); max-width: 70%; margin: 0 auto; }
.plate-grid figure { margin: 0; display: grid; gap: 6px; position: relative; }
.plate-grid img { width: 100%; height: auto; aspect-ratio: 1; border: 2px solid #1b1c1f; display: block; background: #fbfaf6; transition: outline-color .2s ease; outline: 3px solid transparent; outline-offset: 3px; }
.plate-grid figure.active img { outline-color: #1f6aa5; }
.plate-grid figcaption { font: 0.74rem var(--f-letter); text-transform: uppercase; text-align: center; letter-spacing: .04em; line-height: 1.2; }
.plate-grid .mark { position: absolute; right: -6px; top: -8px; background: #1f6aa5; color: #fff; font: 600 0.66rem var(--f-body); padding: 2px 7px; border-radius: 999px; }
.plate-grid .mark.ok { background: #2f7d4f; }
.cartouche { display: grid; grid-template-columns: 1.2fr 1.2fr 1.3fr; border: 1.5px solid #1b1c1f; }
.cartouche div { padding: 4px 8px 6px; border-left: 1.5px solid #1b1c1f; display: grid; gap: 2px; align-content: start; min-width: 0; }
.cartouche div:first-child { border-left: 0; }
.cartouche small { font: 0.56rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: #5a6068; }
.cartouche span { font: 0.8rem var(--f-letter); text-transform: uppercase; overflow-wrap: anywhere; }
.example { font-size: 0.8rem; color: var(--ink-2); margin: 8px 0 0; }
.parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0 32px; }
.parts div { padding: 12px 0; border-bottom: 1px solid var(--rule); }
.parts p { margin: 4px 0 0; color: var(--ink-2); font-size: 0.92rem; }
.order { list-style: none; margin: 0; padding: 0; display: grid; counter-reset: o; max-width: 72ch; }
.order li { counter-increment: o; display: grid; grid-template-columns: 28px minmax(0,1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.order li::before { content: counter(o); font: 700 1rem var(--f-display); color: var(--blue); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1.5px var(--blue); }

/* Ma planche */
.sel { display: flex; flex-wrap: wrap; gap: 8px; }
.sel-item { display: inline-flex; align-items: center; gap: 8px; padding: 4px 4px 4px 4px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--rule); font-size: 0.88rem; font-weight: 500; }
.sel-item img { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--frame); display: block; background: #fbfaf6; }
.sel-item button { border: 0; background: transparent; cursor: pointer; color: var(--ink-2); font-size: 1.05rem; line-height: 1; padding: 4px 8px; border-radius: 999px; }
.sel-item button:hover { color: var(--ink); background: var(--bg); }
.presets { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
details.picker summary { cursor: pointer; font-weight: 600; color: var(--blue); padding: 6px 0; }
.pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px; margin-top: 12px; }

    tip: "Le pointillé fait tout le rendu : serre les points dans l'ombre, espace-les dans la lumière." },

  { id: "enrobe", cat: "exterieur", name: "Enrobé (asphalte)", level: 1, time: "25 min", vue: "plan", use: "Voiries, parkings, accès pompiers", tools: ["Règle"],
    observe: "L'enrobé est un gris foncé et granuleux. Le marquage au sol blanc le rend immédiatement reconnaissable.",
    steps: [
      ["Crayon", "Délimite la voie et trace le marquage au sol : lignes de rive et pointillés centraux."],
      ["C5", "Pose un aplat sur toute la chaussée, en contournant le marquage.", "Pointe biseau, traits dans le sens de la voie. Le marquage doit rester blanc."],
      ["C7", "Tapote des nuages plus sombres.", "Pointe pinceau tapotée, surtout au centre des voies."],
      ["C9", "Ajoute quelques fissures et taches très sombres.", "Pointe fine, trait brisé qui se divise."],
      ["C5", "Repasse sur les nuages pour les fondre.", "Petits cercles tant que c'est humide."],
      ["Blanc", "Nettoie le marquage au blanc et ajoute de petits points clairs.", "Posca large pour le marquage, stylo fin pour les points."]
    ],
    errors: ["Un enrobé noir pur : il écrase le plan.", "Un marquage grisé parce qu'il n'a pas été réservé.", "Des fissures partout."],
    tip: "Sur un plan masse, garde l'enrobé plus clair que dans la réalité. Il doit rester un fond, pas un bloc noir." },

  { id: "deck", cat: "exterieur", name: "Terrasse bois", level: 2, time: "35 min", vue: "plan", use: "Terrasses, pontons, plages de piscine", tools: ["Règle"],
    observe: "Des lames parallèles séparées par des vides sombres. Les joints de bout sont décalés d'une rangée à l'autre.",
    steps: [
      ["Crayon", "Trace des lames parallèles de même largeur avec un espace de 1 mm, et décale les joints de bout."],
      ["E33", "Pose un aplat sur toutes les lames.", "Pointe biseau, dans le sens des lames."],
      ["E35", "Repasse une lame sur trois.", "Pointe biseau, lame entière d'un seul passage."],
      ["E57", "Trace quelques veines fines dans le sens des lames.", "Pointe pinceau très légère, longues lignes."],
      ["C7", "Remplis les espaces entre les lames : ce sont des vides.", "Pointe fine du biseau contre la règle."],
      ["Liner", "Repasse les bords des lames et ajoute deux points de vis à chaque bout."]
    ],
    errors: ["Des espaces entre lames de largeurs différentes.", "Des joints de bout alignés.", "Oublier les vis : elles donnent l'échelle."],
    tip: "Les vis alignées d'une lame à l'autre montrent où passent les lambourdes en dessous. C'est un détail que les correcteurs remarquent." },

  /* ---------- Sols intérieurs ---------- */
  { id: "parquet", cat: "interieur", name: "Parquet", level: 2, time: "35 min", vue: "plan", use: "Sols intérieurs en plan", tools: ["Règle"],
    observe: "Chaque lame a sa propre teinte. Le veinage suit la longueur de la lame, et le vernis fait des reflets en diagonale.",
    steps: [
      ["Crayon", "À la règle, trace les lames : même largeur, longueurs variées, joints de bout décalés d'une rangée à l'autre."],
      ["E35", "Pose un aplat sur toutes les lames, dans le sens de la longueur.", "Pointe biseau, une lame à la fois."],
      ["E37", "Repasse une lame sur trois ou quatre, au hasard.", "Pointe biseau, lame entière d'un trait. Jamais deux lames voisines."],
      ["E49", "Trace des veines fines dans le sens des lames, ajoute quelques petits nœuds, et fonce le bout de certaines lames.", "Pointe pinceau très légère pour les veines ; un petit trait appuyé pour chaque nœud."],
      ["Liner", "Repasse les joints, le long des lames et en bout.", "Feutre fin 0,3 à la règle : joints longs d'abord, joints de bout ensuite."],
      ["Blanc", "Trace deux reflets fins en diagonale qui traversent plusieurs lames, et un filet clair le long du bord gauche de chaque lame pour le chanfrein.", "Règle en diagonale pour les reflets ; trait très fin et léger pour les chanfreins."]
    ],
    errors: ["Des joints de bout alignés d'une rangée à l'autre.", "Toutes les lames identiques.", "Des veines qui changent de direction."],
    tip: "Les reflets blancs doivent être parallèles et traverser toute la case. Trace-les à la règle pour qu'ils restent droits." },

  { id: "bois", cat: "interieur", name: "Bois veiné", level: 2, time: "35 min", vue: "both", use: "Plateaux, menuiseries, détails au 1/20",
    observe: "Les veines s'écartent autour des nœuds comme des courbes de niveau. Les zones entre les veines sont plus claires.",
    steps: [
      ["Crayon", "Place les nœuds en petites ellipses, puis les veines en longues lignes ondulées qui les contournent."],
      ["E33", "Pose un aplat clair sur toute la case, dans le sens des veines.", "Pointe biseau, traits verticaux."],
      ["E35", "Repasse entre certaines veines pour créer des bandes plus soutenues.", "Pointe biseau, bandes irrégulières."],
      ["E57", "Dessine les veines à la pointe pinceau en variant la pression : épaisses au milieu, fines aux bouts.", "Pointe pinceau : appuie au milieu du trait, relâche aux extrémités."],
      ["E49", "Fonce le cœur des nœuds et les veines les plus marquées.", "Pointe pinceau, petites ellipses serrées autour du nœud."],
      ["E33", "Repasse le clair sur la moitié des veines E57 pour les adoucir. Seules les plus fortes restent nettes.", "Petits mouvements sur les veines encore fraîches."]
    ],
    errors: ["Des veines parallèles et régulières.", "Des nœuds sans veines qui les contournent.", "Des veines toutes de la même épaisseur."],
    tip: "La pointe pinceau est faite pour les veines : appuie au milieu du trait et relâche aux extrémités." },

  { id: "carrelage", cat: "interieur", name: "Carrelage grand format", level: 1, time: "20 min", vue: "plan", use: "Cuisines, salles de bain, halls", tools: ["Règle", "Équerre"],
    observe: "Un carrelage se lit par son calepinage : des joints fins et réguliers, des carreaux presque identiques, et un reflet qui traverse le sol.",
    steps: [
      ["Crayon", "Trace le calepinage à la règle et à l'équerre : carreaux identiques, joints de 1 à 2 mm."],
      ["C1", "Pose un aplat sur tous les carreaux.", "Pointe biseau, traits horizontaux qui se chevauchent, carreau par carreau."],
      ["C3", "Repasse un carreau sur trois pour casser l'uniformité.", "Pointe biseau, carreau entier d'un seul passage."],
      ["C5", "Ajoute une ombre fine sur le bord bas et droit de chaque carreau.", "Pointe fine du biseau contre la règle, 1 mm."],
      ["Liner", "Repasse les joints."],
      ["Blanc", "Trace des reflets en diagonale qui traversent plusieurs carreaux.", "À la règle, deux traits parallèles : un épais, un fin."]
    ],
    errors: ["Des joints de largeurs différentes.", "Un reflet par carreau au lieu d'un reflet qui traverse le sol.", "Trop de variation : un carrelage reste régulier."],
    tip: "Au 1/100, ne dessine qu'un joint sur deux : le calepinage reste lisible sans alourdir le plan." },

  { id: "mosaique", cat: "interieur", name: "Mosaïque", level: 2, time: "40 min", vue: "both", use: "Piscines, salles de bain, crédences", tools: ["Té", "Équerre"],
    observe: "Une mosaïque est une grille de petits carreaux de teintes proches. Chaque carreau a un reflet sur le même coin.",
    steps: [
      ["Crayon", "Trace la grille au té et à l'équerre, avec des joints fins et réguliers."],
      ["C3", "Passe les joints en gris clair.", "Pointe fine du biseau, à la règle."],
      ["BG13", "Colorie environ un tiers des carreaux, répartis au hasard.", "Pointe biseau : un seul trait de la largeur d'un carreau."],
      ["B24", "Colorie un deuxième tiers.", "Même geste. Évite les lignes de carreaux de même couleur."],
      ["B29", "Colorie le reste, fonce quelques carreaux et ombre leur bord bas et droit.", "Un trait par carreau, puis un trait fin sur le bord bas et droit."],
      ["Blanc", "Ajoute un petit reflet en L sur le même coin de chaque carreau.", "Petit L sur le coin haut-gauche, au stylo blanc fin."]
    ],
    errors: ["Un motif en damier régulier.", "Du feutre qui déborde sur les joints.", "Des reflets sur des coins différents."],
    tip: "La pointe biseautée peut faire la largeur d'un carreau. Un seul trait par carreau donne un aplat propre." },

  { id: "carreaux-ciment", cat: "interieur", name: "Carreaux de ciment", level: 2, time: "40 min", vue: "plan", use: "Cuisines, entrées, cafés", tools: ["Règle", "Compas"],
    observe: "Chaque carreau porte le même motif. Posés côte à côte, les motifs forment un dessin plus grand à la jonction des carreaux.",
    steps: [
      ["Crayon", "Trace la grille, puis le motif dans chaque carreau : quarts de cercle aux coins, losange au centre."],
      ["W1", "Pose le fond clair sur tous les carreaux.", "Pointe biseau, carreau par carreau."],
      ["B24", "Colorie les quarts de cercle aux quatre coins.", "Pointe pinceau : contour d'abord, puis remplissage."],
      ["C7", "Colorie le losange central et les petits points.", "Pointe fine du biseau pour des angles nets."],
      ["Liner", "Repasse les joints entre les carreaux."],
      ["W3", "Patine : repasse légèrement quelques carreaux pour l'usure.", "Pointe biseau, un seul passage léger."]
    ],
    errors: ["Des motifs qui ne se raccordent pas d'un carreau à l'autre.", "Des couleurs qui débordent du motif.", "Une patine sur tous les carreaux."],
    tip: "Dessine le motif d'un seul carreau sur un calque, puis décalque-le dans toutes les cases : ils seront identiques." },

  { id: "terrazzo", cat: "interieur", name: "Terrazzo", level: 2, time: "35 min", vue: "plan", use: "Halls, commerces, escaliers", tools: ["Règle"],
    observe: "Le terrazzo est un fond clair moucheté de petits éclats de pierre de couleurs différentes, séparé en panneaux par des joints fins.",
    steps: [
      ["Crayon", "Trace les joints de dilatation à la règle, en grands panneaux."],
      ["W1", "Pose un aplat sur toute la surface.", "Pointe biseau, grands traits rapides."],
      ["W3", "Tapote quelques nuances pour un fond légèrement nuageux.", "Pointe pinceau tapotée et tournée."],
      ["C5", "Dessine des éclats gris irréguliers de 1 à 4 mm.", "Pointe pinceau : petites formes anguleuses, jamais rondes. Varie les tailles."],
      ["E07", "Ajoute des éclats terre cuite, moins nombreux que les gris.", "Même geste, environ deux fois moins d'éclats."],
      ["Liner", "Repasse les joints entre les panneaux."]
    ],
    errors: ["Des éclats ronds et réguliers comme des pois.", "Des éclats tous de la même taille.", "Trop d'éclats : le fond doit rester visible."],
    tip: "Répartis d'abord les gros éclats, puis remplis avec les petits. Le résultat paraît naturel sans effort." },

  { id: "marbre", cat: "interieur", name: "Marbre", level: 3, time: "40 min", vue: "both", use: "Sols et revêtements nobles, plans de travail",
    observe: "Le marbre est un fond clair et nuageux traversé de veines qui se divisent et se rejoignent, nettes par endroits et fondues ailleurs.",
    steps: [
      ["Crayon", "Repère légèrement le tracé des veines principales, en lignes brisées qui se divisent."],
      ["W1", "Pose un aplat sur toute la surface.", "Pointe biseau, traits rapides dans le sens des veines."],
      ["C3", "Tapote des nuages gris.", "Pointe pinceau tapotée, en suivant la direction générale des veines."],
      ["C5", "Trace les veines.", "Pointe pinceau, trait tremblé qui change d'épaisseur. Laisse des interruptions."],
      ["W1", "Repasse le clair sur les nuages et sur la moitié des veines pour les fondre.", "Petits mouvements le long de la veine tant qu'elle est fraîche."],
      ["Liner", "Ajoute quelques veinules très fines.", "Feutre fin 0,05 ou 0,1, sans appuyer, trait cassé."]
    ],
    errors: ["Des veines parallèles comme des rayures.", "Des veines toutes nettes : le marbre devient un dessin au trait.", "Des veines qui se croisent en X."],
    tip: "Les veines du marbre se divisent comme des rivières : une veine épaisse donne naissance à deux plus fines, jamais l'inverse." },

  { id: "beton-cire", cat: "interieur", name: "Béton ciré", level: 1, time: "20 min", vue: "both", use: "Sols et murs intérieurs, salles de bain, plans de travail",
    observe: "Le béton ciré est une surface continue, sans joints, gris doux et nuageux, avec des traces de lissoir en arcs et un léger reflet satiné.",
    steps: [
      ["Crayon", "Repère très légèrement les zones plus sombres. Pas de joints : la surface est continue."],
      ["C1", "Pose un aplat sur toute la surface.", "Pointe biseau, grands traits rapides qui se chevauchent."],
      ["C3", "Tapote des nuages irréguliers.", "Pointe pinceau tapotée et tournée, sans tirer de trait."],
      ["C5", "Ajoute quelques voiles sombres et des traces de lissoir en arcs.", "Pointe biseau couchée, arcs larges et légers, comme le geste de la taloche."],
      ["C1", "Repasse le clair sur les nuages et les arcs pour tout fondre.", "Petits cercles, puis grands arcs, tant que c'est humide."],
      ["Blanc", "Ajoute un reflet satiné doux en diagonale.", "Stylo blanc à peine appuyé, puis estompe du doigt avant séchage."]
    ],
    errors: ["Des taches aux bords nets : on dirait du béton brut.", "Des joints : le béton ciré n'en a pas.", "Un reflet trop net : il devient carrelage."],
    tip: "Les arcs du lissoir sont la signature du béton ciré. Deux ou trois arcs suffisent par case." },
  { id: "travertin", cat: "interieur", name: "Travertin", level: 2, time: "30 min", vue: "both", use: "Sols, façades, salles de bain", tools: ["Règle"],
    observe: "Le travertin est une pierre beige rayée de fines bandes horizontales et piquée de petits trous allongés dans le sens des bandes.",
    steps: [
      ["Crayon", "Trace les dalles à la règle, en rangées de longueurs variées."],
      ["E31", "Pose un aplat beige sur toutes les dalles.", "Pointe biseau, traits horizontaux."],
      ["W3", "Repasse une dalle sur trois pour varier la teinte.", "Pointe biseau, dalle entière."],
      ["W5", "Dessine les bandes horizontales fines et les petits trous allongés.", "Pointe pinceau très légère pour les bandes, pointe fine pour les trous, toujours à l'horizontale."],
      ["Liner", "Repasse les joints."],
      ["Blanc", "Si le travertin est poli, ajoute des reflets en diagonale.", "À la règle, deux traits parallèles qui traversent plusieurs dalles."]
    ],
    errors: ["Des trous ronds : ceux du travertin sont allongés.", "Des bandes verticales.", "Trop de trous : la pierre paraît rongée."],
    tip: "Toutes les bandes et tous les trous vont dans le même sens, celui du lit de la pierre. C'est ce qui rend le travertin reconnaissable." },
  { id: "granit-poli", cat: "interieur", name: "Granit poli", level: 2, time: "25 min", vue: "both", use: "Sols de halls, seuils, plans de travail, façades", tools: ["Règle"],
    observe: "Le granit poli est moucheté de grains noirs, gris et blancs, serrés et réguliers, sur un fond gris.",
    steps: [
      ["Crayon", "Trace les joints des dalles."],
      ["C3", "Pose un aplat gris sur toute la surface.", "Pointe biseau, grands traits rapides."],
      ["C5", "Tapote quelques nuances plus sombres.", "Pointe pinceau tapotée, taches de 3 à 6 mm."],
      ["C7", "Ajoute des mouchetures grises de 1 à 2 mm.", "Pointe pinceau, petites touches anguleuses, très nombreuses."],
      ["Liner", "Ajoute des points noirs et repasse les joints.", "Feutre fin 0,1, points tapés à la verticale ; joints à la règle."],
      ["Blanc", "Ajoute des points blancs et un reflet en diagonale.", "Stylo blanc fin, points tapés ; reflet à la règle."]
    ],
    errors: ["Des mouchetures trop grosses : ça devient du terrazzo.", "Un seul niveau de gris.", "Oublier les points blancs : le granit paraît terne."],
    tip: "Le granit se fait en trois couches de points : gris, noirs puis blancs. Chaque couche est plus fine et moins dense que la précédente." },
  { id: "tomettes", cat: "interieur", name: "Tomettes hexagonales", level: 2, time: "35 min", vue: "plan", use: "Sols anciens, cuisines, maisons de campagne", tools: ["Équerre 30/60"],
    observe: "Des carreaux de terre cuite à six côtés, rouge orangé, chacun d'une nuance différente, usés et patinés.",
    steps: [
      ["Crayon", "Trace la grille d'hexagones à l'équerre à 60°, en décalant chaque rangée d'un demi-carreau."],
      ["E07", "Pose un aplat sur toutes les tomettes.", "Pointe biseau, une tomette à la fois."],
      ["E09", "Repasse une tomette sur trois.", "Pointe biseau, tomette entière."],
      ["E18", "Ombre le bord bas et droit de chaque tomette.", "Pointe fine, 1 mm le long de deux côtés seulement."],
      ["Liner", "Repasse le contour des tomettes."],
      ["Blanc", "Ajoute un petit reflet sur le bord haut-gauche de quelques tomettes.", "Trait court, au tiers du bord."]
    ],
    errors: ["Des hexagones déformés : utilise l'équerre à 60°.", "Une seule teinte pour toutes les tomettes.", "Une ombre sur tous les côtés."],
    tip: "Trace une seule rangée d'hexagones sur un calque, puis décalque-la en la décalant d'un demi-carreau à chaque rang." },
  { id: "point-de-hongrie", cat: "interieur", name: "Parquet point de Hongrie", level: 3, time: "40 min", vue: "plan", use: "Appartements haussmanniens, salons, halls", tools: ["Règle", "Équerre 45°"],
    observe: "Des lames coupées en biais qui se rencontrent sur une ligne droite et forment des chevrons alignés.",
    steps: [
      ["Crayon", "Trace des axes verticaux réguliers, puis les lames à 45° de chaque côté, qui se rejoignent sur l'axe."],
      ["E35", "Pose un aplat sur toutes les lames.", "Pointe biseau, dans le sens de chaque lame."],
      ["E37", "Repasse une lame sur quatre, au hasard.", "Pointe biseau, lame entière d'un seul passage."],
      ["E49", "Ombre le bord bas de chaque lame.", "Pointe fine du biseau, 1 mm, toujours du même côté."],
      ["Liner", "Repasse les joints, en commençant par les axes.", "Feutre fin 0,1 à la règle et à l'équerre à 45°."],
      ["Blanc", "Trace un reflet en diagonale qui traverse plusieurs chevrons.", "À la règle, deux traits parallèles."]
    ],
    errors: ["Des axes qui ne sont pas parallèles.", "Des lames de largeurs différentes.", "Confondre avec les bâtons rompus, où les lames se croisent au lieu de se rejoindre sur un axe."],
    tip: "Trace d'abord tous les axes, puis toutes les lames de gauche, puis toutes celles de droite : tu ne changes d'angle d'équerre que deux fois." },
  { id: "marbre-noir", cat: "interieur", name: "Marbre noir", level: 3, time: "40 min", vue: "both", use: "Sols, salles de bain, revêtements de prestige",
    observe: "Un fond noir profond traversé de veines blanches et grises. Les veines claires se réservent dès le départ : le feutre ne peut pas éclaircir un fond sombre.",
    steps: [
      ["Crayon", "Trace le chemin des veines principales : elles resteront blanches."],
      ["C7", "Pose un aplat gris foncé partout, en contournant les veines.", "Pointe pinceau le long des veines, puis biseau pour remplir."],
      ["C9", "Tapote des nuages plus noirs.", "Pointe pinceau tapotée et tournée."],
      ["C9", "Fonce le bord des veines pour les faire ressortir.", "Pointe pinceau, touches courtes le long de chaque veine."],
      ["C3", "Colore en gris une partie des veines, pour qu'elles ne soient pas toutes blanches.", "Pointe fine, à l'intérieur des veines seulement."],
      ["Blanc", "Ajoute quelques veinules blanches très fines.", "Stylo gel blanc fin, trait cassé et léger."]
    ],
    errors: ["Oublier de réserver les veines : le blanc posé à la fin reste terne.", "Des veines toutes blanches et nettes.", "Un noir pur sans nuances."],
    tip: "C'est la texture où la réserve compte le plus : prends le temps de contourner les veines à la pointe pinceau avant de remplir le reste." },
  { id: "osb", cat: "interieur", name: "Panneau OSB", level: 1, time: "20 min", vue: "both", use: "Aménagements intérieurs, mobilier, cloisons",
    observe: "Un panneau de bois clair fait de gros copeaux allongés, orientés dans tous les sens et superposés.",
    steps: [
      ["Crayon", "Délimite les panneaux et leurs joints."],
      ["E33", "Pose un aplat clair sur toute la surface.", "Pointe biseau, traits rapides."],
      ["E35", "Tapote de petites taches.", "Pointe pinceau tapotée."],
      ["E57", "Dessine des copeaux allongés sombres, dans tous les sens.", "Pointe pinceau, touches allongées de 5 à 15 mm."],
      ["E37", "Ajoute des copeaux moyens qui chevauchent les premiers.", "Même geste, en plus grand nombre."],
      ["Liner", "Repasse les joints entre les panneaux."]
    ],
    errors: ["Des copeaux tous dans le même sens.", "Des copeaux ronds.", "Un aplat trop foncé : l'OSB est clair."],
    tip: "Alterne les tailles de copeaux : quelques grands, beaucoup de moyens. C'est ce mélange qui fait reconnaître l'OSB." },

  /* ---------- Murs et façades ---------- */
  { id: "brique", cat: "facades", name: "Brique", level: 1, time: "25 min", vue: "elev", use: "Façades, murs, cheminées", tools: ["Règle"],
    observe: "Chaque brique a sa propre teinte. Le mortier est plus clair, avec une ombre sous chaque brique.",
    steps: [
      ["Crayon", "Trace les rangs à la règle, joints verticaux décalés d'une demi-brique (appareil en panneresse)."],
      ["W1", "Passe le mortier.", "Pointe fine du biseau dans les joints, à la règle."],
      ["E07", "Colorie toutes les briques, en laissant quelques coins ébréchés en blanc, puis repasse quelques zones pour les nuancer.", "Pointe biseau, un trait horizontal par brique ; contourne les éclats aux coins."],
      ["E09", "Repasse une brique sur trois et le bas de chaque brique, puis tapote quelques taches de cuisson.", "Pointe biseau, brique entière ; trait fin en bas de chaque brique ; pointe pinceau tapotée pour les taches."],
      ["E18", "Ombre fine sous chaque brique, sur le mortier, et quelques briques plus sombres.", "Pointe fine, 1 mm sous chaque brique, toujours du même côté."],
      ["Liner", "Repasse le contour des briques, puis ajoute quelques points et éclats."]
    ],
    errors: ["Toutes les briques de la même couleur.", "Des joints verticaux alignés.", "Une ombre des deux côtés de la brique."],
    tip: "Ne change pas de feutre à chaque brique : fais tout le E07, puis tout le E09, et ainsi de suite. La surface est plus homogène." },

  { id: "pierre-taille", cat: "facades", name: "Pierre de taille", level: 2, time: "35 min", vue: "elev", use: "Façades anciennes, soubassements", tools: ["Règle"],
    observe: "Des blocs rectangulaires posés en assises horizontales. Chaque assise a sa hauteur, chaque bloc sa nuance.",

      ["Crayon", "Trace les assises horizontales à la règle, puis les joints verticaux décalés d'une assise à l'autre."],
      ["E31", "Pose un aplat sur tous les blocs.", "Pointe biseau, traits horizontaux."],
      ["W3", "Repasse un bloc sur trois.", "Pointe biseau, bloc entier."],
      ["W5", "Ombre le bas et le côté droit de chaque bloc.", "Pointe fine du biseau, 1 à 2 mm."],
      ["Liner", "Repasse les joints."],
      ["Blanc", "Souligne l'arête haute et gauche de quelques blocs.", "Trait fin à la règle, sur l'arête éclairée."]
    ],

    tip: "En élévation, la lumière vient d'en haut : l'ombre se met sous chaque bloc, et l'arête haute reste claire." },

  { id: "beton", cat: "facades", name: "Béton banché", level: 1, time: "20 min", vue: "elev", use: "Voiles béton, façades, murs de soutènement",
    observe: "Le béton brut est un gris nuageux avec des taches, des joints de coffrage et des trous de banche en grille régulière.",
    steps: [
      ["Crayon", "Trace les panneaux de coffrage (grands rectangles) et place les trous de banche en grille régulière."],
      ["C1", "Pose un aplat sur toute la surface, en traits rapides.", "Pointe biseau, grands traits verticaux."],
      ["C3", "Tamponne et tourne la pointe pinceau pour créer des nuages irréguliers, sans traits droits.", "Pointe pinceau tapotée et tournée, jamais de trait tiré."],
      ["C5", "Ajoute quelques coulures verticales sous certains trous.", "Pointe pinceau : trait vertical qui part du trou et s'éclaircit vers le bas."],
      ["Liner", "Dessine les trous en petits cercles avec un point sombre, et les joints de panneaux en trait fin."],
      ["Blanc", "Ajoute quelques petits points blancs pour les bulles d'air.", "Points minuscules, en petits groupes irréguliers."]
    ],
    errors: ["Un gris uniforme : le béton ressemble à du plastique.", "Des trous de banche placés au hasard.", "Trop de coulures."],
    tip: "La pointe pinceau tapotée donne un très bon effet nuageux. Teste d'abord sur une chute du même papier." },

  { id: "enduit", cat: "facades", name: "Enduit (crépi)", level: 1, time: "20 min", vue: "elev", use: "Façades enduites, murs de clôture",
    observe: "L'enduit est une surface continue, sans joints, légèrement nuageuse et granuleuse.",
    steps: [
      ["Crayon", "Repère très légèrement les zones où l'enduit sera plus sombre."],
      ["E31", "Pose un aplat sur tout le mur.", "Pointe biseau, grands traits rapides qui se chevauchent."],
      ["W3", "Tapote des taches irrégulières dans les zones repérées.", "Pointe pinceau tapotée et tournée."],
      ["Liner", "Pointille le grain du crépi.", "Feutre fin 0,05, points tapés, plus serrés sous les débords et les fenêtres."],
      ["E31", "Repasse le clair sur les taches pour les fondre.", "Petits cercles. L'encre pigmentée du feutre fin ne bave pas."],
      ["Blanc", "Ajoute quelques points clairs."]
    ],
    errors: ["Des taches aux bords nets.", "Un pointillé régulier comme une trame.", "Oublier les ombres sous les débords de toit."],
    tip: "Teste d'abord que ton feutre fin ne bave pas sous l'alcool. Si c'est le cas, fais le pointillé à la toute fin." },

  { id: "bardage", cat: "facades", name: "Bardage bois", level: 2, time: "30 min", vue: "elev", use: "Façades, abris, extensions", tools: ["Règle"],

    steps: [

      ["E33", "Pose un aplat sur toutes les lames.", "Pointe biseau, traits verticaux."],
      ["E35", "Repasse une lame sur trois.", "Pointe biseau, lame entière, de haut en bas."],
      ["E57", "Trace quelques veines dans le sens des lames.", "Pointe pinceau très légère, longues lignes."],
      ["C5", "Ombre fine sur le côté droit de chaque lame.", "Pointe fine du biseau contre la règle, 1 mm."],
      ["Liner", "Repasse les joints entre les lames."]

  { id: "bac-acier", cat: "facades", name: "Bac acier", level: 2, time: "25 min", vue: "elev", use: "Bâtiments industriels, hangars, toitures", tools: ["Règle"],

    steps: [
      ["Crayon", "Trace à la règle les arêtes des nervures, à intervalle régulier."],
      ["C1", "Pose un aplat sur toute la surface.", "Pointe biseau, traits verticaux."],
      ["C3", "Colorie la face à l'ombre de chaque nervure.", "Pointe biseau de la largeur de la face, à la règle."],
      ["C5", "Trace une ligne sombre au creux de chaque nervure.", "Pointe fine du biseau contre la règle."],
      ["Liner", "Repasse les arêtes et le joint de recouvrement horizontal."],

    tip: "Une bande de papier marquée à l'espacement des nervures te sert de gabarit pour toute la façade." },

  { id: "corten", cat: "facades", name: "Acier Corten", level: 2, time: "25 min", vue: "elev", use: "Façades, clôtures, jardinières, signalétique",
    observe: "Le Corten est un acier rouillé orange-brun, taché et nuancé, avec des coulures sous les joints des plaques.",

      ["E07", "Pose un aplat sur toutes les plaques.", "Pointe biseau, traits rapides."],

      ["E18", "Ajoute des coulures sous les joints et quelques taches sombres.", "Pointe pinceau : trait vertical qui s'affine vers le bas."],
      ["E07", "Repasse le clair sur les taches et les coulures pour les fondre.", "Petits cercles sur les taches, traits verticaux légers sur les coulures."],
      ["Liner", "Repasse les joints entre les plaques et les fixations."]
    ],
    errors: ["Un orange uniforme : on dirait de la peinture.", "Des coulures qui partent de nulle part.", "Trop de rouge."],
    tip: "Les coulures partent toujours d'un joint ou d'une fixation, et descendent. C'est ce détail qui rend la matière crédible." },

  { id: "gabion", cat: "facades", name: "Gabion", level: 2, time: "35 min", vue: "elev", use: "Murs de soutènement, clôtures, façades paysagères",

      ["C3", "Colore les autres pierres en gris froid.", "Pointe biseau, pierre entière."],
      ["C7", "Remplis les vides entre les pierres.", "Pointe fine, dans les creux uniquement."],
      ["C5", "Ombre le côté bas et droit de chaque pierre.", "Pointe fine, 1 à 2 mm le long du bord."],

  { id: "bois-brule", cat: "facades", name: "Bois brûlé", level: 2, time: "30 min", vue: "elev", use: "Bardages contemporains, façades, clôtures", tools: ["Règle"],

  /* ---------- Toitures ---------- */
  { id: "tuiles", cat: "toitures", name: "Tuiles", level: 2, time: "35 min", vue: "both", use: "Plans de toiture, élévations",
    observe: "Les tuiles forment des rangées en relief. Chaque tuile est bombée : claire d'un côté, foncée de l'autre.",
    steps: [
      ["Crayon", "Trace des colonnes de tuiles de même largeur, au bas arrondi, en décalant une colonne sur deux."],
      ["E07", "Pose un aplat sur toutes les tuiles.", "Pointe biseau, tuile par tuile, de haut en bas."],
      ["E09", "Repasse quelques tuiles pour varier la couleur.", "Pointe biseau, tuile entière."],
      ["E18", "Ombre la moitié droite de chaque tuile en dégradé.", "Pointe pinceau, du bord droit vers le milieu, en relâchant."],

    errors: ["Des tuiles plates, sans dégradé.", "Des colonnes non décalées.", "Un toit tout rouge : varie avec les bruns."],
    tip: "Sur un plan de toiture au 1/100, dessine les rangées et une tuile sur deux seulement." },

  { id: "ardoise", cat: "toitures", name: "Ardoise", level: 2, time: "30 min", vue: "both", use: "Toitures, bardages en ardoise", tools: ["Règle"],

      ["C5", "Pose un aplat sur toutes les ardoises.", "Pointe biseau, traits horizontaux."],
      ["C7", "Repasse une ardoise sur trois.", "Pointe biseau, ardoise entière."],
      ["C9", "Ombre le haut de chaque ardoise, sous le rang du dessus.", "Pointe fine du biseau contre la règle, 2 mm."],

  { id: "toit-vegetal", cat: "toitures", name: "Toiture végétalisée", level: 2, time: "30 min", vue: "plan", use: "Toitures terrasses, plans de toiture",

      ["YG23", "Tapote des taches de vert tendre.", "Pointe pinceau tapotée."],
      ["YG67", "Dessine de petites touffes rondes.", "Pointe pinceau, petits groupes de cercles."],
      ["G28", "Ajoute des points sombres au cœur des touffes.", "Pointe fine, un ou deux points par touffe."],

    tip: "Le sedum des toitures végétales tire vers le jaune et le rouge selon la saison : quelques touches de terre cuite claire (E07) donnent une toiture d'automne." },

  /* ---------- Verre et métal ---------- */
  { id: "vitre", cat: "verre", name: "Vitre", level: 3, time: "30 min", vue: "elev", use: "Fenêtres, baies vitrées en élévation", tools: ["Règle"],

      ["Crayon", "Trace le cadre et les montants, puis les bandes de reflet en diagonale, parallèles."],

      ["B24", "Fonce le haut de chaque vitre en dégradé.", "Pointe biseau, du haut vers le milieu, en relâchant."],
      ["YG17", "Si un arbre se reflète, pose une tache verte floue dans un coin, puis fonds son bord au B21.", "Pointe pinceau, touches rondes."],
      ["Blanc", "Nettoie les bords des reflets, repasse le contour des vitres et ajoute un filet blanc le long du cadre.", "À la règle, sur les bords des reflets et le long du cadre."]

    errors: ["Des reflets dans des directions différentes.", "Une vitre en bleu foncé uniforme.", "Oublier l'épaisseur du cadre."],
    tip: "Garde le même angle de reflet sur toutes les vitres d'une façade. C'est ce qui rend l'effet crédible." },

  { id: "mur-rideau", cat: "verre", name: "Mur-rideau", level: 3, time: "40 min", vue: "elev", use: "Façades vitrées, immeubles de bureaux", tools: ["Règle", "Équerre"],

    steps: [

      ["B24", "Fonce le haut de la façade en dégradé : c'est le ciel qui s'y reflète.", "Pointe biseau, du haut vers le milieu, en relâchant."],

  { id: "inox", cat: "verre", name: "Inox brossé", level: 2, time: "25 min", vue: "elev", use: "Cuisines, revêtements, ascenseurs, mobilier",

    steps: [
      ["Crayon", "Délimite les panneaux et le sens du brossage."],

      ["C3", "Pose des bandes horizontales plus sombres.", "Pointe biseau, bandes de largeurs variées."],
      ["C5", "Trace des stries fines et horizontales.", "Pointe fine contre la règle, traits rapides de longueurs différentes."],

  { id: "caillebotis", cat: "verre", name: "Caillebotis métallique", level: 2, time: "30 min", vue: "plan", use: "Passerelles, grilles de sol, coursives", tools: ["Règle", "Équerre"],

      ["C7", "Remplis les trous.", "Pointe biseau, un trou à la fois."],
      ["C9", "Ombre le haut et la gauche de chaque trou : c'est l'ombre des barreaux.", "Pointe fine du biseau, en L."],

      ["Blanc", "Souligne le bord haut et gauche des barreaux.", "À la règle, trait fin continu sur toute la longueur."]

  { id: "paves-verre", cat: "verre", name: "Briques de verre", level: 2, time: "30 min", vue: "elev", use: "Cloisons lumineuses, façades, salles de bain", tools: ["Règle"],

      ["BG13", "Trace le cadre intérieur de chaque bloc.", "Pointe biseau, bande de 1 à 2 mm, à 2 mm du bord."],
      ["C3", "Colore les joints en gris.", "Pointe fine du biseau, à la règle."],

  { id: "tole-perforee", cat: "verre", name: "Tôle perforée", level: 2, time: "25 min", vue: "elev", use: "Façades, garde-corps, brise-soleil", tools: ["Règle"],

      ["C3", "Ajoute des bandes plus sombres pour le reflet du métal.", "Pointe biseau, bandes larges et douces."],
      ["C7", "Remplis les trous.", "Pointe fine, un point appuyé par trou."],
      ["C9", "Fonce le bord haut et gauche de chaque trou.", "Pointe fine, petit croissant."],

function lum(k) { const [r, g, b] = P(k); return (.2126 * r + .7152 * g + .0722 * b) / 255; }

function buildPasses(ids) {

  const left = () => ids.filter(id => pos[id] < BY_ID[id].steps.length);
  while (left().length) {
    const pens = [...new Set(left().map(id => BY_ID[id].steps[pos[id]][0]))];
    const pen = pens.sort((a, b) => rank(a) - rank(b))[0];
    const items = left().filter(id => BY_ID[id].steps[pos[id]][0] === pen).map(id => ({ id, k: pos[id] }));
    items.forEach(it => pos[it.id]++);
    passes.push({ pen, items, stages: { ...pos } });
  }
  return passes;
}

    const box = document.getElementById("pl-guide");
    if (!ids.length) { box.innerHTML = `<p class="muted">Ajoute au moins une texture pour voir l'ordre de travail.</p>`; stepper = null; return; }
    const passes = buildPasses(ids), NP = passes.length;
    let p = Math.min(load("rm-pass", 0), NP - 1);
    box.innerHTML = `
      <div class="guide">
        <div class="plate-wrap"><div class="plate">
          <div class="plate-grid ${ids.length <= 4 ? "c2" : ""}">${ids.map(id => `<figure id="pf-${id}"><img src="${BLANK}" alt="" width="${S}" height="${S}"><figcaption>${BY_ID[id].name}</figcaption></figure>`).join("")}</div>
          <div class="cartouche" id="pl-cart"></div>
        </div></div>
        <div class="guide-side">
          <div class="stage-count"><span id="pc-count"></span><span id="pc-pen-count"></span></div>
          <div class="progress" aria-hidden="true"><span id="pc-bar"></span></div>
          <div id="pc-body" aria-live="polite"></div>
          <div class="stage-actions"><button class="btn ghost" id="pc-prev">← Passe précédente</button><button class="btn" id="pc-next">Passe suivante →</button></div>
          <p class="hint">Flèches ← → du clavier pour avancer.</p>
        </div>
      </div>
      <details class="section-gap" style="margin-top:20px"><summary class="muted" style="cursor:pointer">Voir toutes les passes (${NP})</summary>
        <ol class="passes-list" id="pc-list">${passes.map((ps, k) => `<li><button data-p="${k}">${ps.prep ? "Préparation de la planche" : `<i style="background:${col(ps.pen)}"></i>${penName(ps.pen)} · ${ps.items.length} case${ps.items.length > 1 ? "s" : ""}`}</button></li>`).join("")}</ol>
      </details>`;
    paintCart();
    const imgs = Object.fromEntries(ids.map(id => [id, box.querySelector(`#pf-${CSS.escape(id)} img`)]));
    function show(k) {
      p = Math.max(0, Math.min(NP - 1, k)); save("rm-pass", p);
      const ps = passes[p], act = new Set(ps.items.map(it => it.id));
      ids.forEach(id => {
        const fig = imgs[id].parentNode, stg = ps.stages[id], N = BY_ID[id].steps.length;
        fig.classList.toggle("active", act.has(id));
        fig.querySelector(".mark")?.remove();
        if (act.has(id)) fig.insertAdjacentHTML("beforeend", `<span class="mark">Étape ${stg}/${N}</span>`);
        else if (stg === N) fig.insertAdjacentHTML("beforeend", `<span class="mark ok">✓</span>`);
        if (stg === 0) imgs[id].src = BLANK; else { const im = imgs[id]; enqueue(() => { im.src = stageImg(id, stg); }); }
        imgs[id].alt = `${BY_ID[id].name}, étape ${stg} sur ${N}`;
      });
      document.getElementById("pc-count").textContent = ps.prep ? `Avant de commencer` : `Passe ${p} sur ${NP - 1}`;
      document.getElementById("pc-pen-count").textContent = ps.prep ? "" : `${ps.items.length} case${ps.items.length > 1 ? "s" : ""}`;
      document.getElementById("pc-bar").style.width = (p / (NP - 1) * 100) + "%";
      document.getElementById("pc-body").innerHTML = ps.prep
        ? `<h3>Prépare la planche</h3><ol class="prep"><li>Trace au crayon le cadre, la grille des cases et les lignes du cartouche.</li><li>Repasse le cadre, les cases et le cartouche au feutre fin, puis fais le lettrage entre deux lignes guides.</li><li>Entoure chaque case de ruban de masquage si tu veux des bords parfaitement nets.</li><li>Sors les feutres de la planche et fais un nuancier sur une chute du papier.</li></ol>`
        : `<div class="pass-pen"><i style="background:${col(ps.pen)}"></i><div><b>${penName(ps.pen)}</b><span>${penCode(ps.pen) || "Outil"}</span></div></div>
           <ul class="pass-items">${ps.items.map(it => { const s = BY_ID[it.id].steps[it.k]; return `<li><a href="#${it.id}">${BY_ID[it.id].name}</a><em>étape ${it.k + 1}/${BY_ID[it.id].steps.length}</em><p>${s[1]}</p><small>${esc(howFor(s[0], s[2]))}</small></li>`; }).join("")}</ul>`;
      document.getElementById("pc-prev").disabled = p === 0;
      const last = p === NP - 1;
      document.getElementById("pc-next").textContent = last ? "Planche terminée ✓" : "Passe suivante →";
      document.getElementById("pc-next").disabled = last;
      box.querySelectorAll("#pc-list button").forEach((b, j) => { if (j === p) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current"); });
    }
    document.getElementById("pc-prev").onclick = () => show(p - 1);
    document.getElementById("pc-next").onclick = () => show(p + 1);
    box.querySelectorAll("#pc-list button").forEach(b => b.onclick = () => { show(+b.dataset.p); box.querySelector(".guide").scrollIntoView({ behavior: "smooth", block: "start" }); });
    stepper = { next: () => show(p + 1), prev: () => show(p - 1) };
    show(p);
  }
  refresh();
}

/* ----- Techniques ----- */
function renderBases() {
  const use = {}; TEXTURES.forEach(t => t.pens.forEach(k => use[k] = (use[k] || 0) + 1));
  const kit = Object.entries(use).sort((a, b) => b[1] - a[1]).slice(0, 16);
  view.innerHTML = `
    <section class="intro">
      <span class="eyebrow">Techniques</span>
      <h1>Les gestes, la trousse, les échelles</h1>
      <p class="lead">Toutes les fiches combinent les mêmes gestes. Entraîne-toi sur une chute du papier de ta planche avant de commencer.</p>
    </section>
    <section class="stack">
      <h2>Ta trousse de départ</h2>
      <p class="muted">Ces ${kit.length} teintes couvrent la plupart des textures de l'appli. La marque n'a pas d'importance : prends la teinte la plus proche dans la gamme que tu trouves (Copic, Ohuhu, Touch, Stylefile…). Les codes Copic servent seulement de repère.</p>
      <div class="palette">${kit.map(([k, n]) => `<div class="pen"><i style="background:${col(k)}"></i><div><b>${penName(k)}</b><span>${penCode(k)}</span><div class="kit-count">${n} texture${n > 1 ? "s" : ""}</div></div></div>`).join("")}</div>
      <p class="muted">Ajoute un feutre fin pigmenté 0,1 et 0,3, un stylo gel blanc ou un Posca blanc, et un blender incolore.</p>
    </section>
    <section class="stack section-gap">
      <h2>Les sept gestes</h2>
      <div class="gestures">${GESTURES.map(g => `<div class="gesture"><img src="${BLANK}" data-gest="${g.id}" alt="Exemple : ${g.name}" width="${GW}" height="${GH}"><h3>${g.name}</h3><p>${g.text}</p></div>`).join("")}</div>
    </section>
    <section class="stack section-gap">
      <h2>Adapter le rendu à l'échelle</h2>
      <div class="table-wrap"><table class="scale-table">
        <thead><tr><th>Échelle</th><th>Ce qu'on dessine</th><th>Ce qu'on laisse de côté</th></tr></thead>
        <tbody>
          <tr><td>1/500 – 1/200</td><td>Aplats de couleur et ombres portées. Arbres en cercles simples. Marquage des voiries.</td><td>Joints, veinage, textures fines.</td></tr>
          <tr><td>1/100</td><td>Joints principaux, calepinage simplifié (un joint sur deux), textures suggérées sur quelques zones.</td><td>Rehauts sur chaque élément, détails de pose.</td></tr>
          <tr><td>1/50</td><td>Calepinage réel, textures complètes, rehauts blancs, ombres propres.</td><td>Vis, chanfreins, épaisseurs de joint.</td></tr>
          <tr><td>1/20 et plus</td><td>Tout : épaisseurs, chanfreins, vis, veinage, usure.</td><td>Rien, mais garde de la retenue.</td></tr>
        </tbody>
      </table></div>
    </section>
    <section class="stack section-gap">
      <h2>Les conventions d'architecte</h2>
      <ol class="rules">
        <li>En plan, la lumière vient du haut à gauche à 45° : les ombres portées vont vers le bas à droite, partout sur la planche.</li>
        <li>En élévation, l'ombre tombe sous les débords : toitures, balcons, appuis de fenêtre, auvents.</li>
        <li>Les éléments coupés (murs en coupe) se pochent en aplat foncé ou en hachures, jamais avec la texture du matériau.</li>
        <li>Plus un plan est loin dans une élévation, plus ses couleurs sont claires et peu contrastées.</li>
        <li>Un même matériau garde les mêmes feutres dans tout le dossier, du plan masse au détail.</li>
      </ol>
    </section>
    <section class="stack section-gap"><h2>Le matériel</h2><div class="toolgrid">${TOOLS.map(([n, d]) => `<div><h3>${n}</h3><p>${d}</p></div>`).join("")}</div></section>
    <section class="stack section-gap">
      <h2>Les règles valables pour toutes les textures</h2>
      <ol class="rules">
        <li>Travaille toujours du clair au foncé. Le feutre à alcool ne couvre pas un foncé avec un clair.</li>
        <li>Pose les aplats vite, pendant que l'encre est humide, toujours dans le même sens.</li>
        <li>Choisis trois valeurs par matériau : clair, moyen, foncé, dans la même famille de couleur.</li>
        <li>Réserve le blanc dès le crayon : marquages, fleurs, reflets larges.</li>
        <li>Garde les rehauts blancs pour la toute fin, sur une encre bien sèche.</li>
        <li>Fais un nuancier : une bande de test de chaque feutre sur ton papier, avec son nom.</li>
      </ol>
    </section>`;
  fillImages(view);
}

/* ----- Mise en page ----- */
function renderPlanche() {
  const ex = ["piscine", "eau-agitee", "eau-calme", "dalles", "parquet", "galets"];
  view.innerHTML = `
    <section class="intro">
      <span class="eyebrow">Mise en page</span>
      <h1>Monter une planche de rendu</h1>
      <p class="lead">Une planche réussie, c'est d'abord une mise en page propre : cases alignées et de même taille, lettrage soigné, cartouche complet. Les consignes de ton enseignant passent avant tout ce qui suit.</p>
    </section>
    <section class="stack">
      <div class="plate-wrap">
        <div class="plate" role="img" aria-label="Exemple de planche : six cases de textures et un cartouche en bas">
          <div class="plate-grid">${ex.map(id => `<figure>${texImg(id, 0, "", "")}<figcaption>${BY_ID[id].name}</figcaption></figure>`).join("")}</div>
          <div class="cartouche">
            <div><small>École</small><span>Nom de ton école</span></div>
            <div><small>Nom</small><span>Prénom Nom</span><small>Cours · année · section</small><span>—</span></div>
            <div><small>Titre de la planche</small><span>Rendu des textures de matériaux</span></div>
          </div>
        </div>
      </div>
      <p class="example">Exemple de mise en page. <a href="#ma-planche">Compose ta propre planche</a> pour suivre son rendu pas à pas.</p>
    </section>
    <section class="stack section-gap">
      <h2>Les éléments d'une planche</h2>
      <div class="parts">
        <div><h3>Marge et cadre</h3><p>Un cadre tracé au feutre fin, à distance égale des bords de la feuille, plus large côté reliure si elle est demandée.</p></div>
        <div><h3>Grille de cases</h3><p>Des carrés de même taille, à espacement égal, alignés au té et à l'équerre. Chaque case a son cadre net.</p></div>
        <div><h3>Légendes</h3><p>Le nom du matériau sous chaque case, en lettrage technique majuscule, centré.</p></div>
        <div><h3>Cartouche</h3><p>En bas de la planche : école, nom, cours, année et section, titre de la planche, et parfois numéro et date.</p></div>
      </div>
    </section>
    <section class="stack section-gap">
      <h2>Ordre de travail</h2>
      <ol class="order">
        <li><span>Trace au crayon léger le cadre, la grille des cases et les lignes du cartouche.</span></li>
        <li><span>Repasse le cadre, les cases et le cartouche au feutre fin pigmenté, puis fais le lettrage entre deux lignes guides.</span></li>
        <li><span>Dessine au crayon très léger le motif de chaque texture : cellules, lames, joints, galets.</span></li>
        <li><span>Entoure la case de ruban de masquage si tu veux des bords parfaitement nets.</span></li>
        <li><span>Fais le rendu feutre par feutre, du plus clair au plus foncé, en passant chaque feutre dans toutes les cases qui l'utilisent. La page « Ma planche » calcule cet ordre pour toi.</span></li>
        <li><span>Ajoute les joints et détails au feutre fin, puis les rehauts blancs une fois l'encre sèche.</span></li>
        <li><span>Retire le ruban en biais, gomme le crayon restant et repasse le cadre des cases si le feutre l'a terni.</span></li>
      </ol>
    </section>
    <section class="stack section-gap">
      <h2>Ce qui se voit à la correction</h2>
      <ol class="rules">
        <li>Les débordements hors des cases. Le ruban de masquage les évite.</li>
        <li>Des cases de tailles ou d'espacements différents.</li>
        <li>Une lumière qui vient de côtés différents d'une case à l'autre.</li>
        <li>Des aplats striés. Repasse vite tant que c'est humide.</li>
        <li>Un lettrage irrégulier. Trace toujours deux lignes guides au crayon.</li>
      </ol>
    </section>`;
  fillImages(view);
}

/* ================= Navigation ================= */
let lastView = "", homeY = 0;
function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (lastView === "accueil") homeY = window.scrollY;
  jobs.length = 0; stepper = null; if (io) io.disconnect();
  const name = BY_ID[id] ? "fiche" : ["bases", "planche", "ma-planche"].includes(id) ? id : "accueil";
  const nav = name === "fiche" ? "accueil" : name;
  document.querySelectorAll("[data-nav]").forEach(a => { if (a.dataset.nav === nav) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (name === "fiche") renderSheet(BY_ID[id]); else if (name === "bases") renderBases(); else if (name === "planche") renderPlanche(); else if (name === "ma-planche") renderMaPlanche(); else renderHome();
  window.scrollTo(0, name === "accueil" ? homeY : 0);
  lastView = name;
}
document.addEventListener("keydown", e => {
  if (!stepper || e.altKey || e.ctrlKey || e.metaKey) return;
  const tg = e.target.tagName; if (tg === "INPUT" || tg === "TEXTAREA") return;
  if (e.key === "ArrowRight") { e.preventDefault(); stepper.next(); }
  if (e.key === "ArrowLeft") { e.preventDefault(); stepper.prev(); }
});
window.addEventListener("hashchange", route);
updateNavCount();
route();
</script>
<script>
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
