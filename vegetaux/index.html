const SESSION_LEN = 10;
const INTERVALS = [0,1,2,4,8,16,32]; // jours avant révision selon la boîte
const MASTER_BOX = 3;               // boîte à partir de laquelle une plante est « connue »
const UNLOCK = 0.5;                 // part du niveau précédent à connaître pour débloquer

const byId = Object.fromEntries(PLANTS.map(p=>[p.id,p]));
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => {a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0") };
const dayDiff = (a,b) => Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/864e5);

/* ---------- Progression (dans ce navigateur) ---------- */
const KEY = "herbier-vivant-v1";
let S = load();
function load(){
  let s=null; try{ s=JSON.parse(localStorage.getItem(KEY)) }catch(e){}
  return Object.assign({cards:{}, days:{}, streak:0, lastDay:null, best:0, all:false, maxLvl:1}, s||{});
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)) }catch(e){} }
const card = id => S.cards[id] || {box:0, ok:0, ko:0, last:null};
const known = id => card(id).box >= MASTER_BOX;

function levelStats(n){
  const ps = PLANTS.filter(p=>p.lvl===n);
  const k = ps.filter(p=>known(p.id)).length;
  const seen = ps.filter(p=>card(p.id).box>0).length;
  return {total:ps.length, known:k, seen, ratio: ps.length? k/ps.length : 0};
}
function unlocked(n){ return S.all || n <= (S.maxLvl||1) }
function refreshUnlocks(){
  let m = S.maxLvl||1; const before = m;
  while (m < LEVELS.length && levelStats(m).ratio >= UNLOCK) m++;
  S.maxLvl = m; if (m!==before) save();
  return m > before;
}
function isDue(id){
  const c = card(id); if(!c.box || !c.last) return false;
  return dayDiff(c.last, today()) >= INTERVALS[Math.min(c.box, INTERVALS.length-1)];
}
function displayStreak(){
  let n = S.streak;
  if (S.lastDay && dayDiff(S.lastDay, today()) > 1) n = 0;
  $("#streakN").textContent = n;
}

/* ---------- Construction d'une séance ---------- */
function buildSession(level){
  const pool = PLANTS.filter(p => level ? p.lvl===level : unlocked(p.lvl));
  let picks = [];
  if (level){
    const due = shuffle(pool.filter(p=>isDue(p.id)));
    const fresh = pool.filter(p=>!card(p.id).box);
    const weak = shuffle(pool.filter(p=>card(p.id).box>0 && !known(p.id)));
    picks = [...due, ...fresh.slice(0,5), ...weak, ...shuffle(pool)];
  } else {
    const due = shuffle(pool.filter(p=>isDue(p.id))).sort((a,b)=>card(a.id).box-card(b.id).box);
    // nouvelles plantes : dans l'ordre, des plus communes aux plus difficiles
    const fresh = pool.filter(p=>!card(p.id).box).sort((a,b)=>a.lvl-b.lvl);
    const nNew = Math.max(3, SESSION_LEN - Math.min(due.length, 7));
    const weak = shuffle(pool.filter(p=>card(p.id).box>0 && !known(p.id)));
    picks = [...due.slice(0,7), ...fresh.slice(0,nNew), ...weak, ...shuffle(pool)];
  }
  const seen = new Set(); const out=[];
  for(const p of picks){ if(!seen.has(p.id)){ seen.add(p.id); out.push(p) } if(out.length===SESSION_LEN) break }
  return shuffle(out).map(p => makeQuestion(p));
}
function makeQuestion(p){
  const latinChance = p.lvl>=4 ? .6 : p.lvl>=2 ? .4 : .25;
  const mode = Math.random() < latinChance ? "lat" : "fr";
  const nChoices = p.lvl>=4 ? 6 : 4;
  const others = [];
  const add = q => { if(q && q.id!==p.id && !others.includes(q) && q[mode]!==p[mode]) others.push(q) };
  shuffle(p.conf).forEach(id=>add(byId[id]));
  shuffle(PLANTS.filter(q=>q.type===p.type && Math.abs(q.lvl-p.lvl)<=2)).forEach(add);
  shuffle(PLANTS.filter(q=>q.lvl===p.lvl)).forEach(add);
  shuffle(PLANTS).forEach(add);
  const choices = shuffle([p, ...others.slice(0,nChoices-1)]);
  return {p, mode, choices, answered:null};
}

/* ---------- Images ----------
   Photo locale si elle existe (dossier img/), sinon le navigateur la cherche sur Wikipédia
   (image principale de l'article, en évitant les planches dessinées). Résultat mis en cache. */
const PLATE = /k[oö]e?hler|illustration|sturm|thom[eé]|botanical|plate|flora|tafel|drawing|\.svg$|\.png$|\.tif|(?<![a-z])(map|range)(?![a-z])|distribution|herbarium/i;
const IMG_KEY = "herbier-vivant-img-v1";
let IMGC = {}; try{ IMGC = JSON.parse(localStorage.getItem(IMG_KEY))||{} }catch(e){}
const pending = {};
function localImg(p){ const m=IMAGES[p.id]; return m && m.file ? {src:m.file, commons:m.commons, artist:m.artist, license:m.license} : null }
function sized(url){ return url.split("?")[0].replace(/\/\d+px-/, "/500px-") }
async function wiki(lang, path){
  const r = await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/${path}`);
  if(!r.ok) throw new Error(r.status); return r.json();
}
async function findRemote(p){
  const t = encodeURIComponent((p.wiki||p.lat).replace(/ /g,"_"));
  const tried = [];
  for (const lang of ["fr","en"]){
    try{
      const d = await wiki(lang, "summary/"+t);
      tried.push(lang);
      if (d.originalimage && d.thumbnail){
        const name = decodeURIComponent(d.originalimage.source.split("?")[0].split("/").pop());
        if (!PLATE.test(name)){
          const src = d.originalimage.width>500 && d.thumbnail.source.includes("/thumb/") ? sized(d.thumbnail.source) : d.originalimage.source.split("?")[0];
          return {src, commons:name};
        }
      }
    }catch(e){}
  }
  for (const lang of tried){
    try{
      const d = await wiki(lang, "media-list/"+t);
      for (const it of d.items||[]){
        const name = (it.title||"").replace(/^(File|Fichier):/,"");
        if (it.type!=="image" || !/\.jpe?g$/i.test(name) || PLATE.test(name) || !(it.srcset||[]).length) continue;
        let src = it.srcset[0].src; if (src.startsWith("//")) src = "https:"+src;
        return {src: sized(src), commons:name};
      }
    }catch(e){}
  }
  return null;
}
function getImg(p){
  const l = localImg(p); if (l) return Promise.resolve(l);
  if (IMGC[p.id]) return Promise.resolve(IMGC[p.id]);
  if (!pending[p.id]) pending[p.id] = findRemote(p).then(r=>{ if(r){ IMGC[p.id]=r; try{ localStorage.setItem(IMG_KEY, JSON.stringify(IMGC)) }catch(e){} } return r });
  return pending[p.id];
}
function creditHTML(m){
  if(!m||!m.commons) return "";
  const url="https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(m.commons.replace(/ /g,"_"));
  return `Photo : ${esc(m.artist||"Wikimedia Commons")}${m.license?" · "+esc(m.license):""} · <a href="${url}" target="_blank" rel="noopener">source et licence</a>`;
}
async function fill(el){
  const p = byId[el.dataset.pid]; if(!p || el.dataset.done) return; el.dataset.done = "1";
  const m = await getImg(p);
  const box = el.closest(".photo");
  if (!m){
    if (box){ box.classList.add("noimg"); box.innerHTML = "Photo indisponible (connexion à Wikipédia impossible).<br>Fiez-vous à la description." }
    return;
  }
  el.src = m.src;
  if (box){
    const z = box.querySelector(".zoom"); if (z){ z.dataset.zoom = m.src; z.hidden = false }
    const c = box.querySelector(".credit"); if (c){ c.innerHTML = creditHTML(m); c.hidden = false }
  }
}
const io = "IntersectionObserver" in window ? new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ io.unobserve(e.target); fill(e.target) } }), {rootMargin:"400px"}) : null;
function hydrate(root){ (root||document).querySelectorAll("img[data-pid]:not([data-done])").forEach(el=> io ? io.observe(el) : fill(el)) }
new MutationObserver(()=>hydrate()).observe(document.body, {childList:true, subtree:true});
function thumb(p){ return `<img data-pid="${p.id}" alt="" loading="lazy">` }
function photo(p, hide){
  const alt = hide ? "Photo du végétal à identifier" : `${p.fr} (${p.lat})`;
  return `<div class="photo"><img data-pid="${p.id}" alt="${esc(alt)}"><button class="zoom" type="button" hidden>Agrandir</button><span class="credit" hidden></span></div>`;
}

      <select id="fl" aria-label="Filtrer par niveau"><option value="">Tous les niveaux</option>${LEVELS.map(l=>`<option value="${l.n}">${l.n}. ${esc(l.name)}</option>`).join("")}</select>
    </div>
    <p class="small muted" style="margin:0"><span class="dot"></span>pas encore vu <span class="dot m1" style="margin-left:10px"></span>en cours <span class="dot m2" style="margin-left:10px"></span>connu</p>
    <div class="grid" id="grid"></div>
  </section>`;
  const draw = ()=>{
    const q = $("#q").value.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
    const l = $("#fl").value;
    const list = PLANTS.filter(p=>(!l||p.lvl==l) && (!q || (p.fr+" "+p.lat+" "+p.fam).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").includes(q)));
    $("#grid").innerHTML = list.map(p=>{const c=card(p.id); const cls = c.box>=MASTER_BOX?"m2":c.box>0?"m1":"";
      return `<button class="mini" data-id="${p.id}" type="button">${thumb(p)}
      <span><b><i class="dot ${cls}"></i>${esc(p.fr)}</b><em>${esc(p.lat)}</em></span></button>`}).join("") || `<p class="muted">Aucun végétal ne correspond.</p>`;
    $("#grid").querySelectorAll(".mini").forEach(b=>b.onclick=()=>openSheet(byId[b.dataset.id]));
  };
  $("#q").oninput = draw; $("#fl").onchange = draw; draw();
}

function shareLink(){ return SHARE_URL || location.href.split("#")[0] }
function renderShare(){
  const url = shareLink();
  const msg = `Je m'entraîne chaque jour à reconnaître les végétaux avec Herbier Vivant (photos, noms latins, astuces de pro). Viens t'entraîner aussi : ${url}`;
  app.innerHTML = `<section class="view">
    <div><div class="eyebrow">Entre amis</div><h1 style="font-size:1.8rem">Partager l'application</h1>
    <p class="muted" style="margin:6px 0 0">Envoyez ce lien à vos amis et collègues. Chacun suit sa propre progression, enregistrée sur son téléphone ou son ordinateur.</p></div>
    <div class="card pad" style="display:flex;flex-direction:column;gap:12px">
      <div class="eyebrow">Lien de l'application</div>
      <div class="share-url" id="url">${esc(url)}</div>
      <div class="row"><button class="btn btn-main" id="cp1" type="button">Copier le lien</button><button class="btn btn-ghost" id="cp2" type="button">Copier un message d'invitation</button></div>
    </div>
    <div class="card pad" style="display:flex;flex-direction:column;gap:10px">
      <div class="eyebrow">Défiez-les</div>
      <p style="margin:0">Partagez votre score : <b>${PLANTS.filter(p=>known(p.id)).length}</b> végétaux connus sur ${PLANTS.length}, série de <b>${S.lastDay && dayDiff(S.lastDay,today())<=1 ? S.streak : 0}</b> jour(s).</p>
      <div class="row"><button class="btn btn-ghost" id="cp3" type="button">Copier mon score</button></div>
    </div>
    <div class="card pad small muted">
      Votre progression reste dans ce navigateur. Si vous videz les données du navigateur ou changez d'appareil, elle repart de zéro.
      <div class="row" style="margin-top:10px"><button class="btn btn-ghost" id="reset" type="button">Remettre ma progression à zéro</button></div>
      <div id="resetc" hidden style="margin-top:10px"><p style="margin:0 0 8px;color:var(--ko)">Toute votre progression sera effacée. Confirmer ?</p>
      <div class="row"><button class="btn btn-ghost" id="resetyes" type="button" style="color:var(--ko)">Oui, tout effacer</button><button class="btn btn-ghost" id="resetno" type="button">Annuler</button></div></div>
    </div>
  </section>`;
  const copy = (txt, ok) => {
    const fallback = ()=>{ const r=document.createRange(); r.selectNodeContents($("#url")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("Sélectionné : faites Copier") };
    try{ navigator.clipboard.writeText(txt).then(()=>toast(ok)).catch(fallback) }catch(e){ fallback() }
  };
  $("#cp1").onclick = ()=>copy(url,"Lien copié");
  $("#cp2").onclick = ()=>copy(msg,"Message copié, collez-le dans un SMS ou WhatsApp");
  $("#cp3").onclick = ()=>copy(`🌿 Herbier Vivant : je connais ${PLANTS.filter(p=>known(p.id)).length}/${PLANTS.length} végétaux, série de ${S.streak} jour(s). À toi ! ${url}`,"Score copié");
  $("#reset").onclick = ()=>{ $("#resetc").hidden=false };
  $("#resetno").onclick = ()=>{ $("#resetc").hidden=true };
  $("#resetyes").onclick = ()=>{ S = Object.assign(load(), {cards:{},days:{},streak:0,lastDay:null,best:0,all:false,maxLvl:1}); save(); toast("Progression effacée"); route() };
}

/* ---------- Séance ---------- */
function startSession(level){
  quiz = {level, qs: buildSession(level), i:0, good:0};
  quiz.qs.forEach(q=>getImg(q.p)); // précharge les photos de la séance
  if (location.hash==="#seance") renderQuiz(); else location.hash = "#seance";
}
function renderQuiz(){
  const q = quiz.qs[quiz.i];
  const p = q.p;
  const lvlName = LEVELS[p.lvl-1].name;
  app.innerHTML = `<section class="view">
    <div class="qhead"><span class="qcount">${quiz.i+1} / ${quiz.qs.length}</span><span class="bar"><i style="width:${(quiz.i)/quiz.qs.length*100}%"></i></span>
      <button class="btn btn-ghost small" id="quit" type="button" style="padding:8px 12px">Quitter</button></div>
    ${photo(p, true)}
    <div>
      <div class="eyebrow">Niveau ${p.lvl} · ${esc(lvlName)} · ${esc(p.type)}</div>
      <h2 class="qtitle">${q.mode==="lat" ? "Quel est son nom latin ?" : "Quel est ce végétal ?"}</h2>
    </div>
    <div class="choices" id="choices">${q.choices.map((c,i)=>`<button class="choice" data-i="${i}" type="button"><span class="main ${q.mode==="lat"?"latin":""}">${esc(c[q.mode])}</span></button>`).join("")}</div>
    <div id="fb"></div>
  </section>`;
  $("#quit").onclick = ()=>{ quiz=null; location.hash="#accueil" };
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  if (q.answered!==null) showFeedback(q);
}
function answer(i){
  const q = quiz.qs[quiz.i]; if(q.answered!==null) return;
  q.answered = i;
  const ok = q.choices[i].id===q.p.id;
  const c = Object.assign({box:0,ok:0,ko:0,last:null}, S.cards[q.p.id]);
  if(ok){ c.box=Math.min(c.box+1, INTERVALS.length-1); c.ok++; quiz.good++ } else { c.box=1; c.ko++ }
  c.last = today(); S.cards[q.p.id]=c; save();
  showFeedback(q);
}
function showFeedback(q){
  const p=q.p, ok=q.choices[q.answered].id===p.id;
  app.querySelectorAll(".choice").forEach((b,i)=>{
    b.disabled=true; const c=q.choices[i];
    if(c.id===p.id) b.classList.add("good"); else if(i===q.answered) b.classList.add("bad"); else b.classList.add("dim");
    b.insertAdjacentHTML("beforeend", `<span class="small muted ${q.mode==="lat"?"":"latin"}" style="${q.mode==="lat"?"":"font-size:1rem"}">${esc(q.mode==="lat"?c.fr:c.lat)}</span>`);
  });
  const wrong = q.choices[q.answered];
  const last = quiz.i===quiz.qs.length-1;
  $("#fb").innerHTML = `<div class="card answer">
    <div class="verdict ${ok?"ok":"ko"}">${ok?"✓ Bien vu !":"✗ Ce n'était pas ça"}</div>
    ${sheetBody(p, ok?null:wrong)}
    <div class="pad" style="padding-top:0"><button class="btn btn-main btn-wide" id="next" type="button">${last?"Voir le bilan":"Plante suivante"}</button></div>
  </div>`;
  $("#next").onclick = next;
  bindMinis($("#fb"));
  $("#fb").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"start"});
}
function sheetBody(p, wrong){
  const looks = [...new Set([...(wrong?[wrong.id]:[]), ...p.conf])].map(id=>byId[id]).filter(Boolean).slice(0,4);
  return `<div class="label">
    <div class="names"><div class="fr">${esc(p.fr)}</div><div class="latin">${esc(p.lat)}</div></div>
    <div class="chips"><span class="chip tagc">${esc(p.fam)}</span><span class="chip">${esc(p.type)}</span><span class="chip">Origine : ${esc(p.orig)}</span><span class="chip">Niveau ${p.lvl}</span></div>
    <div class="tip"><h4>Pour le reconnaître</h4><p>${esc(p.tip)}</p></div>
    <div class="diff"><h4>Pour ne pas confondre</h4><p>${esc(p.diff)}</p></div>
    ${wrong?`<p class="small" style="margin:0">Vous avez répondu <b>${esc(wrong.fr)}</b> (<span class="latin">${esc(wrong.lat)}</span>). Comparez les deux ci-dessous.</p>`:""}
    ${looks.length?`<div><div class="eyebrow" style="margin-bottom:6px">${wrong?"À comparer":"Ses sosies"}</div><div class="look">${looks.map(miniHTML).join("")}</div></div>`:""}
  </div>`;
}
function miniHTML(p){ return `<button class="mini" data-id="${p.id}" type="button">${thumb(p)}<span>${esc(p.fr)}<br><em>${esc(p.lat)}</em></span></button>` }
function bindMinis(root){ root.querySelectorAll(".mini").forEach(b=>b.onclick=()=>openSheet(byId[b.dataset.id])) }
function next(){
  if (quiz.i < quiz.qs.length-1){ quiz.i++; renderQuiz(); window.scrollTo(0,0); return }
  finish();
}
function finish(){
  const t = today();
  const d = S.days[t] || {sessions:0, good:0, total:0};
  const first = d.sessions===0;
  d.sessions++; d.good+=quiz.good; d.total+=quiz.qs.length; S.days[t]=d;
  if (S.lastDay !== t){
    S.streak = (S.lastDay && dayDiff(S.lastDay,t)===1) ? S.streak+1 : 1;
    S.lastDay = t;
  }
  S.best = Math.max(S.best, S.streak);
  save(); displayStreak();
  const opened = refreshUnlocks() && !S.all;
  const missed = quiz.qs.filter(q=>q.choices[q.answered].id!==q.p.id).map(q=>q.p);
  const g=quiz.good, n=quiz.qs.length;
  const word = g===n ? "Sans faute !" : g>=n*.8 ? "Très bon œil" : g>=n*.5 ? "Bonne séance" : "On progresse en se trompant";
  app.innerHTML = `<section class="view result">
    <div class="card pad" style="text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center">
      <div class="eyebrow">Bilan de la séance</div>
      <div class="score">${g}/${n}</div>
      <h2>${word}</h2>
      <p class="muted" style="margin:0">${first?`Jour validé : série de <b>${S.streak}</b> jour${S.streak>1?"s":""}.`:"Séance bonus enregistrée."} Revenez demain pour garder votre série.</p>
      ${opened?`<p style="margin:6px 0 0;color:var(--leaf);font-weight:700">Nouveau niveau débloqué : ${esc(LEVELS[S.maxLvl-1].name)}</p>`:""}
    </div>
    ${missed.length?`<div><div class="eyebrow" style="margin-bottom:8px">À revoir (elles reviendront demain)</div><div class="look">${missed.map(miniHTML).join("")}</div></div>`:""}
    <div class="row"><button class="btn btn-main" id="again" type="button" style="flex:1">Encore ${SESSION_LEN} plantes</button><a class="btn btn-ghost" href="#partager" style="flex:1">Défier un ami</a></div>
  </section>`;
  bindMinis(app);
  const lvl = quiz.level; quiz=null;
  $("#again").onclick = ()=>startSession(lvl);
}

/* ---------- Fiche & zoom ---------- */
const modal = $("#modal");
function openSheet(p){
  modal.className="";
  modal.innerHTML = `<button class="close" type="button" aria-label="Fermer">✕</button>${photo(p,false)}${sheetBody(p,null)}`;
  modal.querySelector(".close").onclick=()=>modal.close();
  bindMinis(modal);
  if(!modal.open) modal.showModal(); modal.scrollTop=0;
}
function zoom(src){
  modal.className="zoomd";
  modal.innerHTML = `<button class="close" type="button" aria-label="Fermer">✕</button><img src="${esc(src)}" alt="Photo agrandie">`;
  modal.querySelector(".close").onclick=()=>modal.close();
  if(!modal.open) modal.showModal();
}
modal.addEventListener("click", e=>{ if(e.target===modal) modal.close() });
document.addEventListener("click", e=>{ const z=e.target.closest("[data-zoom]"); if(z){ e.preventDefault(); zoom(z.dataset.zoom) } });
let tt; function toast(m){ let el=$(".toast"); if(!el){ el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el) } el.textContent=m; el.hidden=false; clearTimeout(tt); tt=setTimeout(()=>el.hidden=true,2600) }

document.addEventListener("keydown", e=>{
  if(location.hash!=="#seance"||!quiz||modal.open) return;
  const q=quiz.qs[quiz.i];
  if(q.answered===null && /^[1-6]$/.test(e.key) && +e.key<=q.choices.length) answer(+e.key-1);
  else if(q.answered!==null && e.key==="Enter"){ e.preventDefault(); next() }
});

if (location.hash==="#seance") location.hash="#accueil";
route();
</script>

</body>
</html>
