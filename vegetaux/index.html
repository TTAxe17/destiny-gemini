<style>
/* Mise en page : une colonne étroite de « fiches d'herbier » ; photo en haut, étiquette de pépinière dessous. */
:root{
  --bg:#eef2ec;          /* papier d'herbier, teinté sauge */
  --surface:#ffffff;
  --surface-2:#e3eadf;
  --ink:#18241c;
  --muted:#56655a;
  --line:#cdd8cb;
  --leaf:#2c5a3a;        /* vert feuillage */
  --leaf-soft:#d6e6d6;
  --tag:#b9761a;         /* étiquette de pépinière */
  --tag-soft:#f4e2c4;
  --ok:#2f7d45; --ok-soft:#dcefdf;
  --ko:#b23b2c; --ko-soft:#f6dcd7;
  --shadow:0 1px 2px rgba(24,36,28,.06),0 6px 20px rgba(24,36,28,.07);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-latin:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101712; --surface:#18221b; --surface-2:#202d24; --ink:#e4ece5; --muted:#9aab9e; --line:#2d3d32;
  --leaf:#8fc79d; --leaf-soft:#22382a; --tag:#e3a64a; --tag-soft:#3a2d17;
  --ok:#7fcf92; --ok-soft:#1d3524; --ko:#f08d7f; --ko-soft:#3d221e; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101712; --surface:#18221b; --surface-2:#202d24; --ink:#e4ece5; --muted:#9aab9e; --line:#2d3d32;
  --leaf:#8fc79d; --leaf-soft:#22382a; --tag:#e3a64a; --tag-soft:#3a2d17;
  --ok:#7fcf92; --ok-soft:#1d3524; --ko:#f08d7f; --ko-soft:#3d221e; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
.latin{font-family:var(--f-latin);font-style:italic;font-weight:400}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px;border-radius:8px}
a{color:var(--leaf)}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em}
.brand small{display:block;font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:-2px}
.streak{display:flex;align-items:center;gap:6px;background:var(--tag-soft);color:var(--ink);border-radius:999px;padding:6px 12px;font-weight:700;font-variant-numeric:tabular-nums;font-size:.9rem;white-space:nowrap}
.streak i{font-style:normal;color:var(--tag)}

/* Navigation basse */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.75rem;font-weight:600;padding:6px 4px;border-radius:10px}
nav.tabs a[aria-current="page"]{color:var(--leaf);background:var(--leaf-soft)}
nav.tabs svg{width:22px;height:22px}

section.view{padding-block:20px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.muted{color:var(--muted)}

/* Accueil */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.hero h1{font-size:clamp(1.6rem,5vw,2.2rem);font-weight:800;letter-spacing:-.02em}
.hero p{margin:6px 0 0;color:var(--muted);max-width:46ch}
.ring{width:96px;height:96px;flex:none}
.ring text{font-family:var(--f-display);font-weight:800;fill:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 20px;font-weight:700;cursor:pointer;text-decoration:none;font-size:1rem}
.btn-main{background:var(--leaf);color:var(--bg)}
.btn-main:hover{filter:brightness(1.08)}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.btn-ghost:hover{background:var(--line)}
.btn-wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:.72rem;color:var(--muted)}
.week .d{aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;color:var(--muted);margin-bottom:3px}
.week .d.on{background:var(--leaf);color:var(--bg)}
.week .d.today{outline:2px solid var(--tag)}

/* Niveaux */
.levels{display:flex;flex-direction:column;gap:10px}
.lvl{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);cursor:pointer}
.lvl:hover:not([disabled]){border-color:var(--leaf)}
.lvl[disabled]{cursor:not-allowed;opacity:.6}
.lvl .num{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;background:var(--leaf-soft);color:var(--leaf)}
.lvl h3{font-size:1.02rem}
.lvl p{margin:2px 0 6px;font-size:.85rem;color:var(--muted)}
.lvl .meta{font-size:.8rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--leaf);border-radius:99px}

/* Quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.qhead .bar{flex:1}
.qcount{font-variant-numeric:tabular-nums;font-weight:700;font-size:.9rem;color:var(--muted);white-space:nowrap}
.photo{position:relative;border-radius:var(--r);overflow:hidden;background:var(--surface-2);aspect-ratio:4/3;max-width:100%}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .credit{position:absolute;right:0;bottom:0;max-width:100%;background:rgba(0,0,0,.55);color:#fff;font-size:.68rem;padding:3px 8px;border-top-left-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo .credit a{color:#fff}
.photo .zoom{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.5);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:.78rem;cursor:pointer}
.photo.noimg{display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
.qtitle{font-size:1.25rem;font-weight:700}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.choices{grid-template-columns:1fr}}
.choice{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;min-height:56px;display:flex;flex-direction:column;justify-content:center}
.choice:hover:not([disabled]){border-color:var(--leaf)}
.choice .main{font-weight:600}
.choice .main.latin{font-size:1.18rem;font-weight:400}
.choice[disabled]{cursor:default}
.choice.good{border-color:var(--ok);background:var(--ok-soft)}
.choice.bad{border-color:var(--ko);background:var(--ko-soft)}
.choice.dim{opacity:.55}

/* Fiche réponse */
.answer{overflow:hidden}
.verdict{padding:12px 18px;font-weight:700;display:flex;align-items:center;gap:8px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.ko{background:var(--ko-soft);color:var(--ko)}
.label{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.names .fr{font-family:var(--f-display);font-size:1.4rem;font-weight:700}
.names .latin{font-size:1.35rem;color:var(--leaf)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.76rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chip.tagc{background:var(--tag-soft);color:var(--ink)}
.tip{border-left:3px solid var(--tag);padding:2px 0 2px 12px}
.tip h4,.diff h4{margin:0 0 3px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--tag)}
.diff h4{color:var(--leaf)}
.tip p,.diff p{margin:0}
.diff{border-left:3px solid var(--leaf);padding:2px 0 2px 12px}
.look{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:6px;border-radius:var(--r);overflow:hidden}
.g4-cell{position:relative;padding:0;border:0;background:var(--surface-2);aspect-ratio:1;cursor:zoom-in;overflow:hidden;max-width:100%}
.g4-cell img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.g4-cell:hover img{transform:scale(1.04)}
.g4-tag{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.6);color:#fff;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.vw{position:relative;background:#000;display:grid;place-items:center}
.vw img{width:100%;max-height:78vh;object-fit:contain;display:block}
.vw-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:2rem;cursor:pointer}
.vw-prev{left:0;border-radius:0 10px 10px 0}.vw-next{right:0;border-radius:10px 0 0 10px}
.vw-bar{background:#111;color:#ddd;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.vw-tabs{display:flex;gap:6px;flex-wrap:wrap}
.vw-tab{border:1px solid #444;background:transparent;color:#ddd;border-radius:999px;padding:5px 12px;font-size:.82rem;cursor:pointer}
.vw-tab[aria-current="true"]{background:#fff;color:#000;border-color:#fff}
.vw-credit{font-size:.75rem;color:#aaa}.vw-credit a{color:#ccc}
.views{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.view-btn{padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:zoom-in;background:var(--surface-2)}
.view-btn img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.mini{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);cursor:pointer;text-align:left;padding:0}
.mini img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--surface-2)}
.mini span{display:block;padding:6px 8px;font-size:.8rem;line-height:1.25}
.mini span em{font-family:var(--f-latin);font-size:.9rem;color:var(--muted)}

/* Herbier */
.search{display:flex;gap:8px;flex-wrap:wrap}
.search input,.search select{flex:1 1 180px;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.grid .mini span b{display:block;font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--line);vertical-align:middle}
.dot.m1{background:var(--tag)} .dot.m2{background:var(--leaf)}

/* Modale */
dialog{border:0;padding:0;border-radius:var(--r);max-width:min(640px,calc(100vw - 24px));width:100%;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,16,12,.6)}
dialog .close{position:absolute;right:10px;top:10px;z-index:2;border:0;border-radius:999px;width:36px;height:36px;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;font-size:1.1rem}
dialog .photo{border-radius:0;aspect-ratio:4/3}
dialog.zoomd{max-width:min(1000px,calc(100vw - 24px));background:#000}
dialog.zoomd img{width:100%;max-height:85vh;object-fit:contain;display:block}

/* Résultat */
.result h2{font-size:1.8rem}
.score{font-family:var(--f-display);font-size:3rem;font-weight:800;color:var(--leaf);font-variant-numeric:tabular-nums}
.share-url{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;background:var(--surface-2);padding:12px;border-radius:10px;word-break:break-all;user-select:all}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:calc(100vw - 32px)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.small{font-size:.85rem}
@media (prefers-reduced-motion:no-preference){
  .choice,.lvl,.btn{transition:background .15s,border-color .15s,filter .15s}
  .answer{animation:rise .25s ease-out}
  @keyframes rise{from{transform:translateY(6px)}to{transform:none}}
}
</style>

<script>
const PLANTS = [{"id":"prunus-armeniaca","lat":"Prunus armeniaca","fr":"Abricotier","fam":"Rosacées","type":"Arbre caduc","orig":"Asie centrale","lvl":1,"tip":"Feuilles presque rondes en cœur, à pointe courte, sur un pétiole rougeâtre. Fleurs blanc rosé très précoces. Écorce brun-rouge.","diff":"Le pêcher et l'amandier ont des feuilles longues et étroites ; l'abricotier a une feuille ronde comme un peuplier.","conf":["prunus-persica"]},{"id":"ulex-europaeus","lat":"Ulex europaeus","fr":"Ajonc d'Europe","fam":"Fabacées","type":"Arbuste persistant","orig":"Europe de l'Ouest","lvl":1,"tip":"Arbuste dense entièrement hérissé d'épines vertes et raides. Fleurs jaunes au parfum de noix de coco, presque toute l'année. Landes et sols acides.","diff":"Le genêt à balais n'a pas d'épines. Le calicotome a des épines mais des feuilles à 3 folioles bien visibles.","conf":["cytisus-scoparius"]},{"id":"buddleja-davidii","lat":"Buddleja davidii","fr":"Arbre aux papillons","fam":"Scrophulariacées","type":"Arbuste caduc","orig":"Chine","lvl":1,"tip":"Longues panicules parfumées, violettes, mauves ou blanches, en été, toujours entourées de papillons. Feuilles opposées lancéolées, blanches et feutrées dessous. Envahissant.","diff":"Le lilas fleurit au printemps, et ses feuilles en cœur sont lisses des deux côtés.","conf":["syringa-vulgaris"]},{"id":"crataegus-monogyna","lat":"Crataegus monogyna","fr":"Aubépine monogyne","fam":"Rosacées","type":"Arbuste caduc","orig":"Europe","lvl":1,"tip":"Rameaux épineux. Petites feuilles profondément découpées en 3-7 lobes. Fleurs blanches en mai, puis petits fruits rouges (cenelles) à un seul noyau.","diff":"Le prunellier a des feuilles ovales non lobées, fleurit avant ses feuilles et donne des fruits bleu-noir.","conf":["pyracantha-coccinea","prunus-spinosa"]},{"id":"betula-pendula","lat":"Betula pendula","fr":"Bouleau verruqueux","fam":"Bétulacées","type":"Arbre caduc","orig":"Europe","lvl":1,"tip":"Écorce blanche qui se détache en fines lanières, crevassée de noir à la base. Jeunes rameaux pendants couverts de petites verrues. Feuille en losange, doublement dentée.","diff":"Le bouleau pubescent a des rameaux dressés, duveteux et sans verrues. Le bouleau de l'Himalaya a une écorce d'un blanc pur, sans crevasses noires.","conf":["populus-nigra"]},{"id":"buxus-sempervirens","lat":"Buxus sempervirens","fr":"Buis commun","fam":"Buxacées","type":"Arbuste persistant","orig":"Europe, Afrique du Nord","lvl":1,"tip":"Petites feuilles opposées, ovales, souvent échancrées au sommet, au bord entier. Rameaux à 4 angles. Odeur caractéristique, un peu animale.","diff":"Le houx crénelé et le chèvrefeuille arbustif lui ressemblent, mais le houx crénelé a des feuilles alternes et finement dentées.","conf":[]},{"id":"ribes-nigrum","lat":"Ribes nigrum","fr":"Cassissier","fam":"Grossulariacées","type":"Arbuste caduc","orig":"Europe","lvl":1,"tip":"Feuilles à 3-5 lobes, parsemées de glandes dessous : froissées, elles sentent fort le cassis. Grappes de baies noires.","diff":"Le groseillier rouge n'a pas cette odeur et ses baies sont rouges et translucides.","conf":["ribes-rubrum","ribes-sanguineum"]},{"id":"carpinus-betulus","lat":"Carpinus betulus","fr":"Charme commun","fam":"Bétulacées","type":"Arbre caduc","orig":"Europe","lvl":1,"tip":"Feuille doublement dentée, aux nervures parallèles très marquées qui la font paraître plissée. Tronc gris cannelé. En haie taillée, il garde ses feuilles sèches en hiver.","diff":"Le hêtre a une feuille au bord entier, ondulé et cilié. Le charme est denté en scie.","conf":["fagus-sylvatica","corylus-avellana"]},{"id":"castanea-sativa","lat":"Castanea sativa","fr":"Châtaignier","fam":"Fagacées","type":"Arbre caduc","orig":"Europe du Sud","lvl":1,"tip":"Longues feuilles simples alternes, aux dents terminées par une pointe. Écorce aux crevasses souvent spiralées. Bogues couvertes de piquants serrés.","diff":"Le marronnier a des feuilles composées en main. On ne mange pas son fruit (toxique).","conf":["quercus-robur","aesculus-hippocastanum"]},{"id":"lonicera-periclymenum","lat":"Lonicera periclymenum","fr":"Chèvrefeuille des bois","fam":"Caprifoliacées","type":"Liane caduque","orig":"Europe","lvl":1,"tip":"Liane volubile aux feuilles opposées ovales, entières. Fleurs tubulaires crème et rose au parfum puissant le soir. Baies rouges groupées.","diff":"Le chèvrefeuille du Japon est persistant, ses fleurs blanches jaunissent et ses baies sont noires.","conf":["lonicera-japonica"]},{"id":"quercus-robur","lat":"Quercus robur","fr":"Chêne pédonculé","fam":"Fagacées","type":"Arbre caduc","orig":"Europe","lvl":1,"tip":"Feuille à lobes arrondis, presque sans pétiole, avec deux petites « oreillettes » à la base. Les glands pendent au bout d'un long pédoncule.","diff":"Le chêne sessile a l'inverse : une feuille bien pétiolée sans oreillettes, et des glands collés au rameau.","conf":["quercus-petraea","quercus-pubescens"]},{"id":"clematis-vitalba","lat":"Clematis vitalba","fr":"Clématite des haies","fam":"Renonculacées","type":"Liane caduque","orig":"Europe","lvl":1,"tip":"Liane vigoureuse qui couvre les haies. Feuilles opposées composées de 5 folioles, dont le pétiole s'enroule comme une vrille. En hiver, fruits plumeux blancs (« barbe de vieillard »).","diff":"La clématite brûlante est semi-persistante, du Midi, avec des folioles plus petites et des fleurs très parfumées.","conf":["clematis-flammula"]},{"id":"cydonia-oblonga","lat":"Cydonia oblonga","fr":"Cognassier","fam":"Rosacées","type":"Arbre caduc","orig":"Asie occidentale","lvl":1,"tip":"Feuilles entières, ovales, cotonneuses dessous. Grandes fleurs solitaires rose pâle en mai. Coings jaunes duveteux et parfumés. Écorce qui s'exfolie.","diff":"Le cognassier du Japon est un arbuste épineux aux fleurs rouges en bouquets ; le cognassier commun n'a pas d'épines et ses fleurs sont isolées.","conf":["mespilus-germanica"]},{"id":"ficus-carica","lat":"Ficus carica","fr":"Figuier","fam":"Moracées","type":"Arbre caduc","orig":"Méditerranée, Asie occidentale","lvl":1,"tip":"Grandes feuilles rugueuses à 3-5 lobes. Latex blanc irritant à la coupe. Écorce grise et lisse. Les figues poussent directement à l'aisselle des feuilles.","diff":"Le platane a des feuilles lobées lisses, sans latex, et une écorce en plaques.","conf":["platanus-hispanica"]},{"id":"rubus-idaeus","lat":"Rubus idaeus","fr":"Framboisier","fam":"Rosacées","type":"Arbuste caduc","orig":"Europe","lvl":1,"tip":"Tiges dressées couvertes de petits aiguillons fins. Feuilles composées de 3 à 5 folioles, blanches et feutrées dessous. Framboises rouges qui se détachent en dé à coudre.","diff":"La ronce a de forts aiguillons crochus, des tiges arquées et des mûres noires qui gardent leur réceptacle.","conf":["rubus-fruticosus"]},{"id":"fraxinus-excelsior","lat":"Fraxinus excelsior","fr":"Frêne commun","fam":"Oléacées","type":"Arbre caduc","orig":"Europe","lvl":1,"tip":"Feuilles composées opposées de 9 à 13 folioles dentées. Signe immanquable en hiver : des bourgeons noirs et veloutés, comme du charbon.","diff":"Le sorbier des oiseleurs a lui aussi des feuilles composées, mais alternes et à bourgeons violacés et poilus.","conf":["sambucus-nigra","juglans-regia"]},{"id":"cytisus-scoparius","lat":"Cytisus scoparius","fr":"Genêt à balais","fam":"Fabacées","type":"Arbuste caduc","orig":"Europe","lvl":1,"tip":"Arbuste aux tiges vertes anguleuses, presque sans feuilles (petites feuilles à 3 folioles). Fleurs jaune vif en mai, puis gousses noires qui éclatent.","diff":"L'ajonc est entièrement épineux. Le genêt d'Espagne a des tiges rondes, comme des joncs, et fleurit plus tard.","conf":["ulex-europaeus"]},{"id":"wisteria-sinensis","lat":"Wisteria sinensis","fr":"Glycine de Chine","fam":"Fabacées","type":"Liane caduque","orig":"Chine","lvl":1,"tip":"Liane volubile qui s'enroule dans le sens inverse des aiguilles d'une montre, vue d'en dessous. Feuilles composées de 7 à 13 folioles. Grappes mauves parfumées qui s'ouvrent toutes ensemble.","diff":"La glycine du Japon s'enroule dans l'autre sens, a 13 à 19 folioles et des grappes plus longues qui s'ouvrent progressivement.","conf":["robinia-pseudoacacia"]},{"id":"prunus-cerasus","lat":"Prunus cerasus","fr":"Griottier","fam":"Rosacées","type":"Arbre caduc","orig":"Asie occidentale","lvl":1,"tip":"Arbre plus petit que le merisier, qui drageonne. Feuilles plus petites, brillantes, sans grandes glandes au pétiole. Cerises acides rouge vif.","diff":"Le merisier est un grand arbre au tronc droit, aux feuilles pendantes munies de 2 glandes rouges au sommet du pétiole.","conf":["prunus-avium"]},{"id":"ribes-rubrum","lat":"Ribes rubrum","fr":"Groseillier rouge","fam":"Grossulariacées","type":"Arbuste caduc","orig":"Europe","lvl":1,"tip":"Petit arbuste sans épines. Feuilles à 3-5 lobes arrondis, dentées. Grappes pendantes de groseilles rouges translucides en juin.","diff":"Le cassissier a des feuilles très odorantes au froissement et des baies noires. Le groseillier à maquereau est épineux.","conf":["ribes-nigrum","ribes-uva-crispa"]},{"id":"hydrangea-macrophylla","lat":"Hydrangea macrophylla","fr":"Hortensia","fam":"Hydrangéacées","type":"Arbuste caduc","orig":"Japon","lvl":1,"tip":"Grandes feuilles opposées, dentées et brillantes. Fleurs en boules ou en plateaux, bleues en sol acide, roses en sol calcaire.","diff":"L'hortensia paniculé fleurit en cônes allongés blancs. L'hortensia à feuilles de chêne a des feuilles lobées.","conf":[]},{"id":"fagus-sylvatica","lat":"Fagus sylvatica","fr":"Hêtre commun","fam":"Fagacées","type":"Arbre caduc","orig":"Europe","lvl":1,"tip":"Écorce gris clair et lisse comme de la peau. Feuille ovale au bord ondulé, frangé de cils soyeux quand elle est jeune. Bourgeons très longs et pointus, en forme de cigare.","diff":"Le charme a une feuille doublement dentée et plissée, et un tronc cannelé « musclé ». Le hêtre a un bord de feuille lisse et cilié.","conf":["carpinus-betulus"]},{"id":"viburnum-tinus","lat":"Viburnum tinus","fr":"Laurier-tin","fam":"Viburnacées","type":"Arbuste persistant","orig":"Méditerranée","lvl":1,"tip":"Feuilles opposées, persistantes, ovales et entières, avec de petites touffes de poils à l'aisselle des nervures. Fleurs blanches en plein hiver, boutons roses, baies bleu métallique.","diff":"Le laurier-sauce a des feuilles alternes et aromatiques. Le laurier-tin a des feuilles opposées, sans odeur.","conf":[]},{"id":"syringa-vulgaris","lat":"Syringa vulgaris","fr":"Lilas commun","fam":"Oléacées","type":"Arbuste caduc","orig":"Balkans","lvl":1,"tip":"Feuilles opposées en cœur, au bord entier, lisses. Bourgeons verts groupés par paires. Grappes très parfumées en avril-mai.","diff":"L'arbre aux papillons fleurit en été, avec des feuilles allongées et feutrées dessous.","conf":["buddleja-davidii"]},{"id":"aesculus-hippocastanum","lat":"Aesculus hippocastanum","fr":"Marronnier d'Inde","fam":"Sapindacées","type":"Arbre caduc","orig":"Balkans","lvl":1,"tip":"Feuilles opposées en main, à 5-7 grandes folioles. Gros bourgeons bruns et collants en hiver. Chandelles de fleurs blanches en avril. Bogue à quelques piquants épars.","diff":"Le châtaignier a des feuilles simples, alternes, en dents de scie, et des bogues hérissées comme un oursin.","conf":["castanea-sativa"]},{"id":"prunus-avium","lat":"Prunus avium","fr":"Merisier","fam":"Rosacées","type":"Arbre caduc","orig":"Europe","lvl":1,"tip":"Écorce brun-rouge brillante, qui se déroule en bandes horizontales. Deux glandes rouges au sommet du pétiole. Feuilles grandes et pendantes. Fleurs blanches en bouquets.","diff":"Le cerisier du Japon a des dents de feuille terminées par un fil et des fleurs souvent doubles roses.","conf":[]},{"id":"corylus-avellana","lat":"Corylus avellana","fr":"Noisetier","fam":"Bétulacées","type":"Arbuste caduc","orig":"Europe","lvl":1,"tip":"Feuille presque ronde, doublement dentée, rugueuse au toucher, à pointe courte. Chatons jaunes dès janvier. Pousse en cépée de nombreuses tiges.","diff":"Le charme a une feuille ovale plus allongée, lisse, aux nervures très parallèles.","conf":["carpinus-betulus","alnus-glutinosa"]},{"id":"juglans-regia","lat":"Juglans regia","fr":"Noyer commun","fam":"Juglandacées","type":"Arbre caduc","orig":"Asie centrale","lvl":1,"tip":"Feuilles composées alternes de 5 à 9 grandes folioles entières, la terminale la plus grande. Odeur forte et typique au froissement. Moelle cloisonnée en échelle.","diff":"Le frêne a des folioles dentées, plus nombreuses, en feuilles opposées.","conf":["fraxinus-excelsior"]},{"id":"populus-nigra","lat":"Populus nigra","fr":"Peuplier noir","fam":"Salicacées","type":"Arbre caduc","orig":"Europe","lvl":1,"tip":"Feuille triangulaire, pointue, sur un pétiole aplati qui la fait trembler au vent. Le cultivar 'Italica' forme une colonne étroite le long des routes.","diff":"Le bouleau a une feuille proche mais doublement dentée et une écorce blanche.","conf":["betula-pendula"]},{"id":"platanus-hispanica","lat":"Platanus × hispanica","fr":"Platane commun","fam":"Platanacées","type":"Arbre caduc","orig":"Hybride horticole","lvl":1,"tip":"Écorce qui se détache en plaques et laisse un tronc marbré façon camouflage. Feuilles alternes ; la base du pétiole coiffe et cache le bourgeon. Fruits en boules pendantes qui restent l'hiver.","diff":"Les érables ont la même silhouette de feuille, mais leurs feuilles sont opposées et leur écorce n'est pas marbrée.","conf":["acer-pseudoplatanus"]},{"id":"pyrus-communis","lat":"Pyrus communis","fr":"Poirier","fam":"Rosacées","type":"Arbre caduc","orig":"Europe, Asie","lvl":1,"tip":"Feuilles ovales luisantes, finement dentées, sur un long pétiole. Fleurs blanches aux anthères rouge-violet, avant ou avec les feuilles. Écorce en petits carreaux. Port pyramidal.","diff":"Le pommier a des feuilles duveteuses dessous, des fleurs teintées de rose et une silhouette plus étalée.","conf":["malus-domestica","pyrus-calleryana"]},{"id":"malus-domestica","lat":"Malus domestica","fr":"Pommier","fam":"Rosacées","type":"Arbre caduc","orig":"Asie centrale","lvl":1,"tip":"Feuilles ovales, crénelées, duveteuses dessous. Fleurs blanc rosé à 5 pétales en bouquets, puis pommes. Rameaux courts (lambourdes) portant les fleurs.","diff":"Le poirier a des feuilles plus luisantes, glabres, sur un long pétiole, des fleurs blanc pur aux anthères violettes et un port plus élancé.","conf":["pyrus-communis","malus-sylvestris"]},{"id":"prunus-spinosa","lat":"Prunus spinosa","fr":"Prunellier (épine noire)","fam":"Rosacées","type":"Arbuste caduc","orig":"Europe","lvl":1,"tip":"Rameaux sombres et très épineux. Floraison blanche en mars, avant les feuilles. Petites feuilles ovales dentées. Prunelles bleu-noir pruinées.","diff":"L'aubépine fleurit après ses feuilles, plus tard. Ses feuilles sont lobées et ses fruits rouges.","conf":["crataegus-monogyna"]},{"id":"prunus-domestica","lat":"Prunus domestica","fr":"Prunier","fam":"Rosacées","type":"Arbre caduc","orig":"Asie occidentale","lvl":1,"tip":"Feuilles ovales, mates, crénelées, souvent duveteuses dessous. Fleurs blanches en mars-avril, puis prunes pruinées. Rameaux parfois épineux chez les formes sauvages.","diff":"Le prunellier est plus petit, très épineux, avec des fruits minuscules. Le myrobolan fleurit plus tôt et a des feuilles plus brillantes.","conf":["prunus-spinosa"]},{"id":"prunus-persica","lat":"Prunus persica","fr":"Pêcher","fam":"Rosacées","type":"Arbre caduc","orig":"Chine","lvl":1,"tip":"Feuilles longues et étroites, en lance, finement dentées, souvent pliées en gouttière. Fleurs roses directement sur le bois en mars. Fruit velouté.","diff":"L'amandier a les mêmes feuilles mais des fleurs plus pâles, presque blanches, et un fruit vert duveteux et sec.","conf":["prunus-dulcis","prunus-armeniaca"]},{"id":"robinia-pseudoacacia","lat":"Robinia pseudoacacia","fr":"Robinier faux-acacia","fam":"Fabacées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":1,"tip":"Feuilles composées de folioles ovales au bord entier, avec une paire d'épines à la base de chaque feuille. Grappes blanches parfumées en mai. Écorce très crevassée.","diff":"Le févier a des folioles bien plus petites et de grosses épines ramifiées sur le tronc.","conf":["gleditsia-triacanthos"]},{"id":"salvia-rosmarinus","lat":"Salvia rosmarinus","fr":"Romarin","fam":"Lamiacées","type":"Arbuste persistant","orig":"Méditerranée","lvl":1,"tip":"Feuilles en aiguilles coriaces, vert foncé dessus, blanches dessous, aux bords enroulés. Odeur camphrée puissante. Fleurs bleu pâle en hiver et au printemps. (Ancien nom : Rosmarinus officinalis.)","diff":"La lavande a des feuilles plus molles, grises des deux côtés, et des fleurs en épis au bout de longues tiges.","conf":["lavandula-angustifolia"]},{"id":"rubus-fruticosus","lat":"Rubus fruticosus","fr":"Ronce commune","fam":"Rosacées","type":"Arbuste caduc","orig":"Europe","lvl":1,"tip":"Tiges arquées couvertes d'aiguillons crochus. Feuilles composées de 3 à 5 folioles en main, dentées. Mûres noires. S'enracine par l'extrémité des tiges.","diff":"Le framboisier a des tiges dressées peu épineuses et des feuilles blanches dessous. L'églantier a des folioles pennées et des cynorhodons.","conf":["rubus-idaeus"]},{"id":"salix-alba","lat":"Salix alba","fr":"Saule blanc","fam":"Salicacées","type":"Arbre caduc","orig":"Europe","lvl":1,"tip":"Grand saule des bords de rivière. Feuilles étroites et lancéolées, finement dentées, couvertes de poils soyeux argentés surtout dessous : l'arbre paraît gris-blanc de loin. Écorce grise profondément crevassée.","diff":"Le saule fragile a des feuilles vert brillant, presque glabres, et ses rameaux cassent net à la base. Le saule blanc reste soyeux et argenté.","conf":[]},{"id":"salix-caprea","lat":"Salix caprea","fr":"Saule marsault","fam":"Salicacées","type":"Arbre caduc","orig":"Europe","lvl":1,"tip":"Feuilles larges, ovales, ridées, gris feutré dessous, à pointe tordue. Les chatons argentés puis jaunes (« pattes de chat ») sortent avant les feuilles en mars.","diff":"Le saule cendré a des feuilles plus étroites et des rameaux duveteux ; écorcez un rameau de 2 ans : il montre des crêtes en relief sur le bois, lisse chez le marsault.","conf":["salix-cinerea"]},{"id":"sambucus-nigra","lat":"Sambucus nigra","fr":"Sureau noir","fam":"Viburnacées","type":"Arbuste caduc","orig":"Europe","lvl":1,"tip":"Feuilles opposées composées de 5 à 7 folioles, à l'odeur désagréable une fois froissées. Moelle blanche abondante. Larges ombelles de fleurs crème, puis baies noires pendantes.","diff":"Le frêne a des folioles plus nombreuses et des bourgeons noirs. Le sureau a des tiges grises couvertes de lenticelles.","conf":["fraxinus-excelsior"]},{"id":"tilia-europaea","lat":"Tilia × europaea","fr":"Tilleul commun","fam":"Malvacées","type":"Arbre caduc","orig":"Europe","lvl":1,"tip":"Hybride des deux tilleuls indigènes, le plus planté en ville. Feuille en cœur asymétrique avec des touffes de poils blanchâtres aux aisselles. Souvent couvert de rejets à la base du tronc.","diff":"Le tilleul à petites feuilles a des touffes rousses et des feuilles plus petites ; le tilleul argenté a un revers entièrement blanc feutré.","conf":["tilia-cordata","tilia-tomentosa"]},{"id":"tilia-cordata","lat":"Tilia cordata","fr":"Tilleul à petites feuilles","fam":"Malvacées","type":"Arbre caduc","orig":"Europe","lvl":1,"tip":"Feuille en cœur, asymétrique à la base. Au revers, de petites touffes de poils roux à l'aisselle des nervures. Les fleurs pendent sous une bractée en forme de languette.","diff":"Le tilleul à grandes feuilles a une feuille plus grande et velue, avec des touffes de poils blancs au revers.","conf":[]},{"id":"populus-tremula","lat":"Populus tremula","fr":"Tremble","fam":"Salicacées","type":"Arbre caduc","orig":"Europe","lvl":1,"tip":"Feuilles presque rondes au bord ondulé et denté, sur un long pétiole aplati : elles tremblent et bruissent à la moindre brise. Écorce lisse gris-vert marquée de losanges noirs.","diff":"Le peuplier blanc a des feuilles lobées, blanches et feutrées dessous. Le tremble a des feuilles rondes, vertes des deux côtés à l'âge adulte.","conf":["populus-alba","populus-canescens"]},{"id":"vitis-vinifera","lat":"Vitis vinifera","fr":"Vigne","fam":"Vitacées","type":"Liane caduque","orig":"Europe, Asie","lvl":1,"tip":"Liane à vrilles opposées aux feuilles. Feuilles en cœur à 3-5 lobes, dentées. Écorce qui se détache en longues lanières. Grappes de raisins.","diff":"La vigne vierge a des feuilles à 5 folioles (ou à 3 lobes et ventouses chez celle de Boston) et des baies bleu-noir non comestibles.","conf":["parthenocissus-quinquefolia"]},{"id":"parthenocissus-quinquefolia","lat":"Parthenocissus quinquefolia","fr":"Vigne vierge","fam":"Vitacées","type":"Liane caduque","orig":"Amérique du Nord","lvl":1,"tip":"Liane à feuilles composées de 5 folioles dentées en main, rouge écarlate en automne. Vrilles ramifiées parfois terminées par de petites ventouses. Baies bleu-noir.","diff":"La vigne vierge de Boston a des feuilles simples à 3 lobes. Le lierre est persistant et s'accroche par des crampons.","conf":["parthenocissus-tricuspidata","vitis-vinifera"]},{"id":"rosa-canina","lat":"Rosa canina","fr":"Églantier","fam":"Rosacées","type":"Arbuste caduc","orig":"Europe","lvl":1,"tip":"Tiges arquées garnies d'aiguillons crochus. Feuilles composées de 5 à 7 folioles dentées. Fleurs simples à 5 pétales rose pâle, puis cynorhodons rouges.","diff":"La ronce a des feuilles à 3-5 folioles disposées en main, et des fruits noirs.","conf":[]},{"id":"acer-platanoides","lat":"Acer platanoides","fr":"Érable plane","fam":"Sapindacées","type":"Arbre caduc","orig":"Europe","lvl":1,"tip":"Feuilles opposées à 5 lobes terminés par de longues pointes fines. Cassez le pétiole : un latex blanc perle. Samares écartées presque à plat.","diff":"Le sycomore a des lobes à dents émoussées, sans latex. Le platane a des feuilles alternes. Retenez que tous les érables ont des feuilles opposées.","conf":["acer-pseudoplatanus","platanus-hispanica"]},{"id":"acer-pseudoplatanus","lat":"Acer pseudoplatanus","fr":"Érable sycomore","fam":"Sapindacées","type":"Arbre caduc","orig":"Europe","lvl":1,"tip":"Grandes feuilles opposées à 5 lobes peu profonds, à dents irrégulières et arrondies, dessous glauque. Écorce qui s'écaille en plaques sur les vieux sujets. Samares en V serré.","diff":"L'érable plane a des pointes effilées et du latex blanc. Le platane, lui, a des feuilles alternes.","conf":["acer-platanoides","platanus-hispanica"]},{"id":"hibiscus-syriacus","lat":"Hibiscus syriacus","fr":"Althéa (hibiscus de Syrie)","fam":"Malvacées","type":"Arbuste caduc","orig":"Chine","lvl":2,"tip":"Arbuste dressé qui débourre très tard (fin mai). Feuilles à 3 lobes dentés en losange. Grandes fleurs en coupe blanches, roses ou bleues à cœur pourpre de juillet à septembre. Capsules sèches en hiver.","diff":"Les lavatères ont des feuilles douces et grises et un port plus lâche ; l'althéa a des feuilles luisantes rappelant celles d'un chrysanthème.","conf":[]},{"id":"prunus-dulcis","lat":"Prunus dulcis","fr":"Amandier","fam":"Rosacées","type":"Arbre caduc","orig":"Asie occidentale","lvl":2,"tip":"Le premier arbre fruitier en fleurs : fleurs blanc rosé dès février sur le bois nu. Feuilles longues et étroites, finement dentées. Fruit vert duveteux contenant l'amande.","diff":"Le pêcher fleurit plus tard en rose plus vif et donne une pêche charnue.","conf":["prunus-persica"]},{"id":"amelanchier-lamarckii","lat":"Amelanchier lamarckii","fr":"Amélanchier de Lamarck","fam":"Rosacées","type":"Arbuste caduc","orig":"Amérique du Nord","lvl":2,"tip":"Nuage de fleurs blanches étoilées en avril, avec de jeunes feuilles cuivrées. Fruits ronds rouges puis pourpre-noir, sucrés. Feuilles ovales finement dentées, rouge orangé en automne.","diff":"L'amélanchier des bois est plus petit, aux feuilles duveteuses blanches dessous ; celui de Lamarck a des pousses cuivrées et glabres.","conf":["amelanchier-ovalis"]},{"id":"leycesteria-formosa","lat":"Leycesteria formosa","fr":"Arbre aux faisans","fam":"Caprifoliacées","type":"Arbuste caduc","orig":"Himalaya","lvl":2,"tip":"Tiges creuses vert bleuté comme un bambou. Feuilles opposées en cœur. Grappes pendantes de fleurs blanches entourées de bractées pourpres, puis baies noir-pourpre au goût de caramel.","diff":"Aucun autre arbuste n'a ces grappes de bractées pourpres pendantes sur tiges vertes creuses.","conf":["sambucus-nigra"]},{"id":"cercis-siliquastrum","lat":"Cercis siliquastrum","fr":"Arbre de Judée","fam":"Fabacées","type":"Arbre caduc","orig":"Méditerranée orientale","lvl":2,"tip":"Feuilles rondes en cœur, au bord entier. Au printemps, fleurs rose magenta directement sur le bois, même sur le tronc, avant les feuilles. Gousses plates violacées en hiver.","diff":"Le tilleul a aussi des feuilles en cœur, mais dentées et asymétriques.","conf":["tilia-cordata"]},{"id":"cotinus-coggygria","lat":"Cotinus coggygria","fr":"Arbre à perruque","fam":"Anacardiacées","type":"Arbuste caduc","orig":"Europe du Sud, Asie","lvl":2,"tip":"Feuilles rondes au bord entier, sur un long pétiole, souvent pourpres. Après la floraison, les inflorescences deviennent des nuages plumeux rose-gris : la « perruque ». Odeur résineuse.","diff":"Le cercis a aussi des feuilles rondes, mais en cœur, et fleurit en rose sur le bois.","conf":["cercis-siliquastrum","rhus-typhina"]},{"id":"rhododendron-luteum","lat":"Rhododendron luteum","fr":"Azalée jaune","fam":"Éricacées","type":"Arbuste caduc","orig":"Caucase, Europe de l'Est","lvl":2,"tip":"Azalée caduque. Feuilles ovales velues, en touffes au bout des rameaux, rouge-orangé en automne. Fleurs jaunes en entonnoir, très parfumées et collantes, en mai.","diff":"Le rhododendron pontique est persistant à fleurs mauves.","conf":["rhododendron-ponticum"]},{"id":"campsis-radicans","lat":"Campsis radicans","fr":"Bignone","fam":"Bignoniacées","type":"Liane caduque","orig":"Est des États-Unis","lvl":2,"tip":"Liane qui grimpe par des racines aériennes. Feuilles opposées composées de 7 à 11 folioles dentées. Grandes trompettes orange-rouge en été. Longues gousses.","diff":"La glycine a des feuilles alternes et s'enroule. La bignone s'accroche par des racines et ses feuilles sont opposées.","conf":["wisteria-sinensis"]},{"id":"camellia-sasanqua","lat":"Camellia sasanqua","fr":"Camélia d'automne","fam":"Théacées","type":"Arbuste persistant","orig":"Japon","lvl":2,"tip":"Feuilles plus petites que le camélia du Japon, finement dentées, à pétiole et nervure duveteux. Fleurs parfumées, simples, qui s'effeuillent pétale par pétale, en automne.","diff":"Le camélia du Japon fleurit en fin d'hiver et ses fleurs tombent entières.","conf":[]},{"id":"lonicera-japonica","lat":"Lonicera japonica","fr":"Chèvrefeuille du Japon","fam":"Caprifoliacées","type":"Liane persistante","orig":"Asie de l'Est","lvl":2,"tip":"Liane volubile persistante ou semi-persistante, aux tiges velues. Fleurs par paires, blanches puis jaunes, très parfumées. Baies noires.","diff":"Le chèvrefeuille des bois a des fleurs groupées en bouquet terminal et des baies rouges.","conf":["lonicera-periclymenum"]},{"id":"cornus-kousa","lat":"Cornus kousa","fr":"Cornouiller du Japon","fam":"Cornacées","type":"Arbre caduc","orig":"Japon, Corée, Chine","lvl":2,"tip":"4 bractées blanches pointues autour du bouton floral en juin, après les feuilles. Fruits ronds rouges comme des framboises sur un long pédoncule. Écorce qui s'exfolie en mosaïque.","diff":"Le cornouiller à fleurs d'Amérique a des bractées échancrées, fleurit avant les feuilles et a des fruits rouges ovales groupés.","conf":[]},{"id":"cornus-sericea","lat":"Cornus sericea","fr":"Cornouiller stolonifère","fam":"Cornacées","type":"Arbuste caduc","orig":"Amérique du Nord","lvl":2,"tip":"Arbuste drageonnant aux rameaux rouge sombre ou jaunes ('Flaviramea'). Feuilles opposées à nervures arquées. Fruits blancs.","diff":"Le cornouiller blanc ne drageonne pas et a des rameaux rouge corail plus vifs ; on les vend souvent l'un pour l'autre.","conf":["cornus-alba","cornus-sanguinea"]},{"id":"kerria-japonica","lat":"Kerria japonica","fr":"Corète du Japon","fam":"Rosacées","type":"Arbuste caduc","orig":"Chine, Japon","lvl":2,"tip":"Tiges vert vif, fines et arquées, même en hiver. Feuilles alternes doublement dentées, aux nervures marquées. Fleurs jaune d'or, simples ou en pompons, en avril.","diff":"Le forsythia a des tiges brunes et des fleurs à 4 pétales avant les feuilles. Le corète a des tiges vertes et des fleurs avec les feuilles.","conf":[]},{"id":"cotoneaster-horizontalis","lat":"Cotoneaster horizontalis","fr":"Cotonéaster horizontal","fam":"Rosacées","type":"Arbuste caduc","orig":"Chine","lvl":2,"tip":"Rameaux ramifiés en arêtes de poisson, étalés à plat. Petites feuilles rondes et brillantes. Fruits rouges. Aucune épine.","diff":"Le buisson ardent porte des épines et des feuilles crénelées.","conf":["pyracantha-coccinea"]},{"id":"laburnum-anagyroides","lat":"Laburnum anagyroides","fr":"Cytise (faux-ébénier)","fam":"Fabacées","type":"Arbre caduc","orig":"Europe centrale et du Sud","lvl":2,"tip":"Feuilles à 3 folioles sur un long pétiole. En mai, longues grappes pendantes de fleurs jaune d'or. Gousses brunes. Toutes les parties sont très toxiques, surtout les graines.","diff":"Le robinier a des feuilles à nombreuses folioles et des fleurs blanches. La glycine est une liane.","conf":["robinia-pseudoacacia","cytisus-scoparius"]},{"id":"escallonia-rubra","lat":"Escallonia rubra","fr":"Escallonia","fam":"Escalloniacées","type":"Arbuste persistant","orig":"Chili, Argentine","lvl":2,"tip":"Arbuste de bord de mer. Petites feuilles luisantes, dentées, collantes et aromatiques. Petites fleurs tubulaires roses à rouges en été. Très utilisé en haie sur le littoral.","diff":"Le photinia a des pousses rouges et des feuilles plus grandes ; l'escallonia a de petites feuilles collantes.","conf":[]},{"id":"fuchsia-magellanica","lat":"Fuchsia magellanica","fr":"Fuchsia de Magellan","fam":"Onagracées","type":"Arbuste caduc","orig":"Chili, Argentine","lvl":2,"tip":"Arbuste aux fleurs pendantes rouge et violet : un calice rouge à 4 pointes et une jupe violette. Feuilles opposées dentées. Tiges qui repartent de la souche après un hiver froid.","diff":"Les fuchsias de balcon ont de plus grosses fleurs et gèlent ; celui-ci est rustique et forme des haies en Bretagne.","conf":["leycesteria-formosa"]},{"id":"euonymus-japonicus","lat":"Euonymus japonicus","fr":"Fusain du Japon","fam":"Célastracées","type":"Arbuste persistant","orig":"Japon, Corée","lvl":2,"tip":"Feuilles opposées, épaisses et vernissées, finement crénelées. Rameaux verts et quadrangulaires. Formes panachées très fréquentes.","diff":"Le troène a des feuilles au bord entier. Le fusain a des dents fines, à sentir du bout du doigt.","conf":["euonymus-europaeus"]},{"id":"gleditsia-triacanthos","lat":"Gleditsia triacanthos","fr":"Févier d'Amérique","fam":"Fabacées","type":"Arbre caduc","orig":"Amérique du Nord","lvl":2,"tip":"Petites folioles nombreuses ; feuilles souvent deux fois divisées. Énormes épines ramifiées sur le tronc (sauf la forme 'Inermis' plantée en ville). Longues gousses tordues.","diff":"Le robinier a des folioles plus grandes et une petite paire d'épines à chaque feuille, pas sur le tronc.","conf":["robinia-pseudoacacia"]},{"id":"ribes-sanguineum","lat":"Ribes sanguineum","fr":"Groseillier à fleurs","fam":"Grossulariacées","type":"Arbuste caduc","orig":"Ouest de l'Amérique du Nord","lvl":2,"tip":"Feuilles à 3-5 lobes arrondis, aromatiques. Grappes pendantes de fleurs rose vif en mars-avril. Baies noir-bleu pruinées.","diff":"Les groseilliers fruitiers ont des fleurs verdâtres discrètes. Celui-ci est cultivé pour ses grappes roses.","conf":["ribes-rubrum","ribes-nigrum"]},{"id":"ribes-uva-crispa","lat":"Ribes uva-crispa","fr":"Groseillier à maquereau","fam":"Grossulariacées","type":"Arbuste caduc","orig":"Europe","lvl":2,"tip":"Petit arbuste épineux : 1 à 3 épines sous chaque bourgeon. Petites feuilles à 3-5 lobes arrondis. Grosses baies velues ou lisses, vertes, jaunes ou rouges, veinées.","diff":"Les autres groseilliers n'ont pas d'épines. L'épine-vinette a le bois jaune et des baies rouges en grappes.","conf":["ribes-rubrum","berberis-vulgaris"]},{"id":"hydrangea-arborescens","lat":"Hydrangea arborescens","fr":"Hortensia arborescent","fam":"Hydrangéacées","type":"Arbuste caduc","orig":"Est des États-Unis","lvl":2,"tip":"Énormes boules de fleurs blanches puis vert pâle ('Annabelle'). Feuilles opposées, minces, ovales, dentées, mates. Tiges souples qui ploient sous les fleurs.","diff":"L'hortensia commun a des feuilles épaisses et brillantes et des fleurs bleues ou roses ; l'hortensia paniculé fleurit en cônes.","conf":["hydrangea-macrophylla"]},{"id":"jasminum-officinale","lat":"Jasminum officinale","fr":"Jasmin officinal","fam":"Oléacées","type":"Liane caduque","orig":"Asie","lvl":2,"tip":"Liane aux tiges vertes. Feuilles opposées composées de 5 à 9 folioles. Fleurs blanches en étoile à 5 pétales très parfumées en été.","diff":"Le jasmin étoilé a des feuilles simples persistantes et du latex.","conf":[]},{"id":"kalmia-latifolia","lat":"Kalmia latifolia","fr":"Laurier des montagnes","fam":"Éricacées","type":"Arbuste persistant","orig":"Est de l'Amérique du Nord","lvl":2,"tip":"Feuilles persistantes coriaces, luisantes. Fleurs roses ou blanches en coupe pentagonale, avec des boutons plissés en meringue ; les étamines sont coincées dans de petites poches des pétales.","diff":"Le rhododendron a des fleurs en entonnoir plus grandes sans ces poches.","conf":["rhododendron-ponticum"]},{"id":"hedera-hibernica","lat":"Hedera hibernica","fr":"Lierre d'Irlande","fam":"Araliacées","type":"Liane persistante","orig":"Europe de l'Ouest","lvl":2,"tip":"Lierre plus vigoureux que le lierre commun, aux feuilles plus grandes, à 5 lobes larges, mates. Poils écailleux couchés sur les jeunes pousses.","diff":"Le lierre commun a des feuilles plus petites et plus découpées ; la loupe montre des poils étoilés chez lui.","conf":["hedera-colchica"]},{"id":"hedera-colchica","lat":"Hedera colchica","fr":"Lierre de Colchide","fam":"Araliacées","type":"Liane persistante","orig":"Caucase","lvl":2,"tip":"Très grandes feuilles en cœur, peu lobées, épaisses, qui sentent le céleri au froissement. Souvent panachées de jaune ('Sulphur Heart').","diff":"Les lierres commun et d'Irlande ont des feuilles plus petites et nettement lobées.","conf":["hedera-hibernica"]},{"id":"mahonia-aquifolium","lat":"Mahonia aquifolium","fr":"Mahonia à feuilles de houx","fam":"Berbéridacées","type":"Arbuste persistant","orig":"Ouest de l'Amérique du Nord","lvl":2,"tip":"Feuilles composées de 5 à 9 folioles épineuses et luisantes. Grappes de fleurs jaunes en fin d'hiver, puis baies bleu-noir pruinées. Le bois est jaune à la coupe.","diff":"Le houx a une feuille simple, unique, et des baies rouges. Comptez les folioles pour trancher.","conf":[]},{"id":"hypericum-calycinum","lat":"Hypericum calycinum","fr":"Millepertuis à grandes fleurs","fam":"Hypéricacées","type":"Arbuste persistant","orig":"Balkans, Turquie","lvl":2,"tip":"Couvre-sol aux tiges rougeâtres. Feuilles opposées ovales, sans pétiole, à points translucides. Grandes fleurs jaune d'or à étamines en houppe tout l'été.","diff":"Les autres millepertuis arbustifs sont plus hauts et ont des fleurs plus petites en coupe.","conf":["potentilla-fruticosa"]},{"id":"vaccinium-corymbosum","lat":"Vaccinium corymbosum","fr":"Myrtillier américain","fam":"Éricacées","type":"Arbuste caduc","orig":"Est de l'Amérique du Nord","lvl":2,"tip":"Arbuste de terre acide. Feuilles ovales entières, rouge vif en automne. Clochettes blanches en grappes au printemps. Grosses myrtilles bleues pruinées.","diff":"La myrtille sauvage est un sous-arbrisseau de 40 cm aux tiges vertes anguleuses.","conf":["aronia-melanocarpa"]},{"id":"morus-alba","lat":"Morus alba","fr":"Mûrier blanc","fam":"Moracées","type":"Arbre caduc","orig":"Chine","lvl":2,"tip":"Feuilles très variables, entières ou lobées sur le même arbre, lisses et brillantes dessus. Latex blanc. Mûres blanches, roses ou violettes. Cultivé pour les vers à soie.","diff":"Le mûrier noir a des feuilles rugueuses dessus, velues dessous, et des mûres noires très juteuses.","conf":["morus-nigra","broussonetia-papyrifera"]},{"id":"morus-nigra","lat":"Morus nigra","fr":"Mûrier noir","fam":"Moracées","type":"Arbre caduc","orig":"Asie occidentale","lvl":2,"tip":"Arbre trapu. Feuilles en cœur, rugueuses comme du papier de verre dessus, velues dessous. Mûres noires très juteuses qui tachent.","diff":"Le mûrier blanc a des feuilles lisses et brillantes et des fruits plus pâles et fades.","conf":["morus-alba","broussonetia-papyrifera"]},{"id":"mespilus-germanica","lat":"Mespilus germanica","fr":"Néflier","fam":"Rosacées","type":"Arbre caduc","orig":"Asie occidentale","lvl":2,"tip":"Petit arbre tortueux. Grandes feuilles oblongues, velues, presque sans pétiole. Grandes fleurs blanches isolées. Nèfles brunes couronnées de 5 longs sépales, à manger blettes.","diff":"Le cognassier a des feuilles plus rondes et des fruits jaunes ; le néflier a des fruits bruns couronnés.","conf":["cydonia-oblonga","malus-sylvestris"]},{"id":"eriobotrya-japonica","lat":"Eriobotrya japonica","fr":"Néflier du Japon","fam":"Rosacées","type":"Arbre persistant","orig":"Chine","lvl":2,"tip":"Très grandes feuilles persistantes, raides, dentées, profondément nervurées, roux feutré dessous. Fleurs blanches parfumées en automne, puis bibasses orange au printemps.","diff":"Le magnolia à grandes fleurs a des feuilles au bord lisse. Le néflier du Japon a des feuilles dentées et rugueuses.","conf":["viburnum-rhytidophyllum"]},{"id":"physocarpus-opulifolius","lat":"Physocarpus opulifolius","fr":"Physocarpe","fam":"Rosacées","type":"Arbuste caduc","orig":"Amérique du Nord","lvl":2,"tip":"Feuilles à 3 lobes rappelant la viorne obier, souvent pourpres ou dorées. Corymbes de fleurs blanches, puis fruits gonflés rougeâtres. Écorce qui pèle en lanières.","diff":"La viorne obier a des feuilles opposées ; le physocarpe a des feuilles alternes et une écorce qui s'exfolie.","conf":[]},{"id":"pyrus-calleryana","lat":"Pyrus calleryana","fr":"Poirier de Chine","fam":"Rosacées","type":"Arbre caduc","orig":"Chine","lvl":2,"tip":"Arbre d'alignement en cône étroit. Feuilles ovales, très luisantes, ondulées, rouge pourpre tardif en automne. Floraison blanche abondante en mars, à l'odeur désagréable. Petites poires brunes de 1 cm.","diff":"Le poirier commun a de gros fruits et un port plus lâche ; le poirier de Chine garde ses feuilles colorées jusqu'en décembre.","conf":["pyrus-communis","malus-floribunda"]},{"id":"malus-floribunda","lat":"Malus floribunda","fr":"Pommier d'ornement du Japon","fam":"Rosacées","type":"Arbre caduc","orig":"Japon","lvl":2,"tip":"Petit arbre étalé. Boutons rouge carmin qui s'ouvrent en fleurs blanc rosé en avril. Petites pommes jaunes ou rouges de 1 cm qui restent sur l'arbre.","diff":"Le pommier fruitier a des fleurs plus grandes et de grosses pommes ; le cerisier du Japon a une écorce brillante à lenticelles horizontales.","conf":["malus-domestica"]},{"id":"potentilla-fruticosa","lat":"Potentilla fruticosa","fr":"Potentille arbustive","fam":"Rosacées","type":"Arbuste caduc","orig":"Hémisphère Nord","lvl":2,"tip":"Petit arbuste en boule aux feuilles composées de 5 à 7 folioles étroites, soyeuses. Fleurs jaunes, blanches ou orangées en coupe tout l'été. Écorce qui s'exfolie.","diff":"Le millepertuis a des feuilles simples et des étamines en houppe très longues.","conf":["hypericum-calycinum"]},{"id":"fallopia-baldschuanica","lat":"Fallopia baldschuanica","fr":"Renouée grimpante","fam":"Polygonacées","type":"Liane caduque","orig":"Asie centrale","lvl":2,"tip":"Liane extrêmement vigoureuse. Feuilles en cœur allongé, alternes. Nuages de petites fleurs blanc crème en fin d'été. Tiges volubiles.","diff":"La clématite des haies a des feuilles composées opposées et des fruits plumeux.","conf":["clematis-vitalba"]},{"id":"rhododendron-ponticum","lat":"Rhododendron ponticum","fr":"Rhododendron pontique","fam":"Éricacées","type":"Arbuste persistant","orig":"Caucase, péninsule Ibérique","lvl":2,"tip":"Grand arbuste persistant aux feuilles longues, coriaces et glabres. Bouquets de fleurs mauves en entonnoir en mai-juin. Sol acide ; il s'est naturalisé et devient envahissant par endroits.","diff":"Le laurier des montagnes a des fleurs en coupe aux étamines insérées dans des poches ; les azalées caduques perdent leurs feuilles.","conf":["kalmia-latifolia"]},{"id":"rosa-rugosa","lat":"Rosa rugosa","fr":"Rosier rugueux","fam":"Rosacées","type":"Arbuste caduc","orig":"Asie de l'Est","lvl":2,"tip":"Tiges très denses en aiguillons fins. Feuilles composées aux folioles fortement ridées et luisantes. Grandes fleurs roses ou blanches parfumées. Gros cynorhodons ronds rouges comme des tomates cerises.","diff":"L'églantier a des folioles lisses, des aiguillons crochus et des fruits ovales.","conf":["rosa-canina","rosa-multiflora"]},{"id":"salix-babylonica","lat":"Salix babylonica","fr":"Saule pleureur","fam":"Salicacées","type":"Arbre caduc","orig":"Chine","lvl":2,"tip":"Longs rameaux fins qui retombent jusqu'au sol. Feuilles étroites lancéolées et finement dentées. On l'aime au bord de l'eau. (Les sujets plantés sont souvent l'hybride Salix × sepulcralis.)","diff":"Le bouleau pleureur a des feuilles en losange et une écorce blanche.","conf":["betula-pendula"]},{"id":"philadelphus-coronarius","lat":"Philadelphus coronarius","fr":"Seringat","fam":"Hydrangéacées","type":"Arbuste caduc","orig":"Europe du Sud","lvl":2,"tip":"Feuilles opposées ovales, à 3 nervures principales, peu dentées. Fleurs blanches à 4 pétales et étamines jaunes, au parfum de fleur d'oranger en juin. Écorce qui s'exfolie.","diff":"Le deutzia a des feuilles rugueuses (poils étoilés) et des fleurs étoilées plus petites en grappes, sans ce parfum.","conf":[]},{"id":"spiraea-japonica","lat":"Spiraea japonica","fr":"Spirée du Japon","fam":"Rosacées","type":"Arbuste caduc","orig":"Japon, Chine","lvl":2,"tip":"Petit arbuste aux feuilles ovales dentées, souvent jaunes ou cuivrées au printemps. Corymbes plats de fleurs roses au bout des tiges en été.","diff":"La spirée de Van Houtte fleurit en blanc au printemps sur des rameaux arqués.","conf":["sorbaria-sorbifolia"]},{"id":"rhus-typhina","lat":"Rhus typhina","fr":"Sumac de Virginie","fam":"Anacardiacées","type":"Arbuste caduc","orig":"Amérique du Nord","lvl":2,"tip":"Rameaux épais couverts de poils veloutés comme un bois de cerf. Grandes feuilles composées de 11 à 31 folioles, rouge feu en automne. Grappes coniques de fruits rouges veloutés. Drageonne beaucoup.","diff":"L'ailante a des folioles avec des dents glanduleuses à la base et des rameaux lisses ; le sumac a des rameaux veloutés.","conf":["cotinus-coggygria"]},{"id":"symphoricarpos-albus","lat":"Symphoricarpos albus","fr":"Symphorine blanche","fam":"Caprifoliacées","type":"Arbuste caduc","orig":"Amérique du Nord","lvl":2,"tip":"Petit arbuste drageonnant aux rameaux fins. Feuilles opposées ovales, parfois lobées sur les rejets. Grosses baies blanches spongieuses qui restent l'hiver et éclatent sous le pied.","diff":"Les baies blanches sont uniques chez les arbustes courants. Le cornouiller blanc a des fruits blanc bleuté mais des rameaux rouges.","conf":["cornus-alba"]},{"id":"parthenocissus-tricuspidata","lat":"Parthenocissus tricuspidata","fr":"Vigne vierge de Boston","fam":"Vitacées","type":"Liane caduque","orig":"Japon, Chine","lvl":2,"tip":"Liane qui colle aux murs grâce à des vrilles terminées par des ventouses. Feuilles brillantes à 3 lobes (ou à 3 folioles sur les jeunes pousses), rouge flamboyant en automne.","diff":"La vigne vierge commune a des feuilles à 5 folioles. La vigne a des vrilles sans ventouses.","conf":["parthenocissus-quinquefolia","vitis-vinifera"]},{"id":"viburnum-rhytidophyllum","lat":"Viburnum rhytidophyllum","fr":"Viorne à feuilles ridées","fam":"Viburnacées","type":"Arbuste persistant","orig":"Chine","lvl":2,"tip":"Grandes feuilles persistantes longues et étroites, profondément ridées dessus, feutrées de jaune dessous, pendantes en hiver. Boutons floraux nus et velus.","diff":"Aucun autre persistant n'a ces feuilles aussi ridées et feutrées. Le laurier-cerise a des feuilles lisses et vernissées.","conf":["prunus-laurocerasus"]},{"id":"berberis-thunbergii","lat":"Berberis thunbergii","fr":"Épine-vinette de Thunberg","fam":"Berbéridacées","type":"Arbuste caduc","orig":"Japon","lvl":2,"tip":"Petites feuilles entières en rosettes, avec une épine simple sous chacune. Le bois est jaune vif à la coupe. Souvent planté en forme pourpre ('Atropurpurea'). Baies rouges brillantes.","diff":"Le buisson ardent a des feuilles dentées et des fruits en grosses grappes. L'épine-vinette commune a des épines à 3 branches.","conf":["pyracantha-coccinea"]},{"id":"vaccinium-vitis-idaea","lat":"Vaccinium vitis-idaea","fr":"Airelle rouge","fam":"Éricacées","type":"Sous-arbrisseau","orig":"Europe, Asie, Amérique du Nord","lvl":3,"tip":"Sous-arbrisseau persistant aux petites feuilles ovales, épaisses, luisantes, ponctuées de brun dessous. Clochettes roses, baies rouges.","diff":"Le raisin d'ours a des feuilles plus étroites sans points dessous et un port rampant.","conf":[]},{"id":"amelanchier-ovalis","lat":"Amelanchier ovalis","fr":"Amélanchier des bois","fam":"Rosacées","type":"Arbuste caduc","orig":"Europe du Sud","lvl":3,"tip":"Arbuste des rocailles calcaires. Feuilles ovales dentées, feutrées de blanc dessous quand elles sont jeunes. Fleurs blanches aux pétales étroits en avril. Baies bleu-noir.","diff":"L'amélanchier de Lamarck est plus grand avec de jeunes feuilles cuivrées et glabres.","conf":["amelanchier-lamarckii","cotoneaster-integerrimus"]},{"id":"calycanthus-floridus","lat":"Calycanthus floridus","fr":"Arbre aux anémones","fam":"Calycanthacées","type":"Arbuste caduc","orig":"Sud-est des États-Unis","lvl":3,"tip":"Feuilles opposées ovales, aromatiques. Fleurs brun-rouge à nombreux pétales charnus, au parfum de fraise et de fruits. Fruits en urne.","diff":"Le chimonanthe fleurit en hiver avec des fleurs jaune pâle.","conf":[]},{"id":"buddleja-alternifolia","lat":"Buddleja alternifolia","fr":"Arbre aux papillons à feuilles alternes","fam":"Scrophulariacées","type":"Arbuste caduc","orig":"Chine","lvl":3,"tip":"Le seul buddleja à feuilles alternes. Longs rameaux pleureurs couverts de petits bouquets mauves sur le bois de l'année précédente en juin. Feuilles étroites gris-vert.","diff":"L'arbre aux papillons classique a des feuilles opposées et des panicules au bout des tiges en été.","conf":["buddleja-davidii"]},{"id":"hippophae-rhamnoides","lat":"Hippophae rhamnoides","fr":"Argousier","fam":"Élaéagnacées","type":"Arbuste caduc","orig":"Europe, Asie","lvl":3,"tip":"Arbuste épineux aux feuilles étroites argentées. En automne, les rameaux des pieds femelles sont couverts de petites baies orange vif serrées.","diff":"L'olivier de Bohême a des fruits jaunâtres et des feuilles plus larges.","conf":["elaeagnus-angustifolia","tamarix-gallica"]},{"id":"aronia-melanocarpa","lat":"Aronia melanocarpa","fr":"Aronia noir","fam":"Rosacées","type":"Arbuste caduc","orig":"Est de l'Amérique du Nord","lvl":3,"tip":"Feuilles ovales luisantes avec de petites glandes noires sur la nervure principale, rouge vif en automne. Corymbes blancs, puis baies noires luisantes astringentes.","diff":"L'aronia rouge a des feuilles feutrées dessous et des fruits rouges.","conf":["amelanchier-lamarckii"]},{"id":"colutea-arborescens","lat":"Colutea arborescens","fr":"Baguenaudier","fam":"Fabacées","type":"Arbuste caduc","orig":"Europe du Sud","lvl":3,"tip":"Feuilles composées de 7 à 13 folioles arrondies. Fleurs jaunes en papillon, puis gousses gonflées translucides qui éclatent quand on les presse.","diff":"Le robinier a de nombreuses folioles mais ses gousses sont plates.","conf":["robinia-pseudoacacia"]},{"id":"daphne-mezereum","lat":"Daphne mezereum","fr":"Bois-joli","fam":"Thyméléacées","type":"Arbuste caduc","orig":"Europe","lvl":3,"tip":"Petit arbuste. Fleurs rose vif très parfumées collées sur le bois nu en février-mars, avant les feuilles. Baies rouges très toxiques.","diff":"Le daphné lauréole est persistant, à fleurs vertes et baies noires.","conf":["daphne-laureola"]},{"id":"frangula-alnus","lat":"Frangula alnus","fr":"Bourdaine","fam":"Rhamnacées","type":"Arbuste caduc","orig":"Europe","lvl":3,"tip":"Feuilles alternes ovales au bord entier, aux nervures parallèles arquées. Écorce brune ponctuée de lenticelles blanches allongées. Fruits rouges puis noirs, toutes couleurs ensemble. Pas d'épines.","diff":"Le nerprun purgatif a des feuilles dentées, des rameaux terminés en épine et des feuilles presque opposées.","conf":["rhamnus-cathartica","cornus-sanguinea"]},{"id":"erica-arborea","lat":"Erica arborea","fr":"Bruyère arborescente","fam":"Éricacées","type":"Arbuste persistant","orig":"Méditerranée","lvl":3,"tip":"Grande bruyère du maquis pouvant faire 3 m. Rameaux duveteux blancs. Nuées de petites clochettes blanches au parfum de miel au printemps. Sa souche sert à faire les pipes.","diff":"La bruyère multiflore fleurit en rose en automne.","conf":["calluna-vulgaris"]},{"id":"erica-carnea","lat":"Erica carnea","fr":"Bruyère des neiges","fam":"Éricacées","type":"Sous-arbrisseau","orig":"Alpes","lvl":3,"tip":"Petite bruyère tapissante qui fleurit de décembre à avril en clochettes roses ou blanches. Supporte le calcaire.","diff":"La bruyère cendrée fleurit en été en sol acide.","conf":["calluna-vulgaris"]},{"id":"pyracantha-coccinea","lat":"Pyracantha coccinea","fr":"Buisson ardent","fam":"Rosacées","type":"Arbuste persistant","orig":"Sud de l'Europe","lvl":3,"tip":"Rameaux très épineux. Petites feuilles finement crénelées. En automne, masses de fruits rouges, orange ou jaunes.","diff":"Les cotonéasters ont des fruits semblables, mais ils n'ont jamais d'épines.","conf":["cotoneaster-horizontalis","crataegus-monogyna"]},{"id":"calluna-vulgaris","lat":"Calluna vulgaris","fr":"Callune","fam":"Éricacées","type":"Sous-arbrisseau","orig":"Europe","lvl":3,"tip":"Petit sous-arbrisseau aux minuscules feuilles en écailles serrées sur 4 rangs. Épis de petites fleurs rose mauve en fin d'été.","diff":"Les bruyères (Erica) ont des feuilles en aiguilles verticillées et des fleurs en clochettes ou en urnes.","conf":["erica-carnea"]},{"id":"lonicera-xylosteum","lat":"Lonicera xylosteum","fr":"Camérisier à balais","fam":"Caprifoliacées","type":"Arbuste caduc","orig":"Europe","lvl":3,"tip":"Arbuste des haies. Feuilles opposées ovales, duveteuses, grises. Fleurs blanc-jaune par paires, puis baies rouges soudées par 2 à la base. Rameaux creux.","diff":"Le camérisier noir a des baies noires ; la viorne obier a des feuilles lobées.","conf":["lonicera-nigra","lonicera-alpigena"]},{"id":"elaeagnus-pungens","lat":"Elaeagnus pungens","fr":"Chalef piquant","fam":"Élaéagnacées","type":"Arbuste persistant","orig":"Japon, Chine","lvl":3,"tip":"Persistant aux rameaux épineux couverts d'écailles brunes. Feuilles ondulées, revers argenté ponctué de brun. Souvent panaché de jaune ('Maculata'). Fleurs parfumées en automne.","diff":"Le chalef d'Ebbinge n'a pas d'épines et ses feuilles sont plates.","conf":[]},{"id":"clethra-alnifolia","lat":"Clethra alnifolia","fr":"Clèthre à feuilles d'aulne","fam":"Clethracées","type":"Arbuste caduc","orig":"Est des États-Unis","lvl":3,"tip":"Feuilles alternes obovales dentées comme l'aulne. Épis dressés de petites fleurs blanches ou roses très parfumées en août. Capsules sèches en épis.","diff":"L'itéa a des épis retombants et un feuillage rouge vif en automne.","conf":["itea-virginica","alnus-glutinosa"]},{"id":"cornus-controversa","lat":"Cornus controversa","fr":"Cornouiller des pagodes","fam":"Cornacées","type":"Arbre caduc","orig":"Asie de l'Est","lvl":3,"tip":"Branches étagées en plateaux horizontaux. Feuilles alternes à nervures arquées, regroupées au bout des rameaux. Corymbes blancs, puis fruits noirs sur pédoncules rouges.","diff":"Les autres cornouillers ont des feuilles opposées, sauf le cornouiller à feuilles alternes américain, plus petit.","conf":["cornus-alternifolia"]},{"id":"cornus-alternifolia","lat":"Cornus alternifolia","fr":"Cornouiller à feuilles alternes","fam":"Cornacées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":3,"tip":"Petit arbre étagé aux feuilles alternes à nervures arquées. Petits corymbes blancs, fruits bleu-noir sur pédoncules rouges.","diff":"Le cornouiller des pagodes est plus grand et vigoureux, aux feuilles plus grandes.","conf":["cornus-controversa"]},{"id":"cotoneaster-dammeri","lat":"Cotoneaster dammeri","fr":"Cotonéaster de Dammer","fam":"Rosacées","type":"Arbuste persistant","orig":"Chine","lvl":3,"tip":"Couvre-sol rampant qui s'enracine. Petites feuilles persistantes ovales, luisantes. Fleurs blanches isolées, puis fruits rouges.","diff":"Le cotonéaster horizontal a des rameaux en arêtes de poisson et perd ses feuilles.","conf":["cotoneaster-horizontalis","cotoneaster-salicifolius"]},{"id":"cotoneaster-franchetii","lat":"Cotoneaster franchetii","fr":"Cotonéaster de Franchet","fam":"Rosacées","type":"Arbuste semi-persistant","orig":"Chine","lvl":3,"tip":"Rameaux arqués. Petites feuilles ovales, gris-vert dessus, feutrées de blanc dessous. Fruits orange-rouge ovales en automne.","diff":"Le cotonéaster laiteux a des feuilles plus grandes et coriaces aux nervures creusées.","conf":["cotoneaster-lacteus","cotoneaster-salicifolius"]},{"id":"cotoneaster-lacteus","lat":"Cotoneaster lacteus","fr":"Cotonéaster laiteux","fam":"Rosacées","type":"Arbuste persistant","orig":"Chine","lvl":3,"tip":"Grand cotonéaster persistant. Feuilles ovales, coriaces, aux nervures profondément creusées, feutrées dessous. Corymbes de fleurs blanc laiteux, puis grappes de fruits rouges tout l'hiver.","diff":"Le buisson ardent a des épines ; les cotonéasters n'en ont jamais.","conf":["cotoneaster-franchetii","pyracantha-coccinea"]},{"id":"cotoneaster-salicifolius","lat":"Cotoneaster salicifolius","fr":"Cotonéaster à feuilles de saule","fam":"Rosacées","type":"Arbuste persistant","orig":"Chine","lvl":3,"tip":"Feuilles persistantes longues et étroites comme du saule, ridées. Rameaux souples. Grappes de petits fruits rouges.","diff":"Le cotonéaster de Franchet a des feuilles bien plus petites et ovales.","conf":["cotoneaster-franchetii","cotoneaster-dammeri"]},{"id":"celastrus-orbiculatus","lat":"Celastrus orbiculatus","fr":"Célastre","fam":"Célastracées","type":"Liane caduque","orig":"Asie de l'Est","lvl":3,"tip":"Liane volubile aux feuilles rondes finement dentées. En automne, capsules jaunes qui s'ouvrent sur des graines rouge vif.","diff":"Le fusain a des capsules roses ou rouges ; le célastre est une liane.","conf":["euonymus-europaeus"]},{"id":"daphne-laureola","lat":"Daphne laureola","fr":"Daphné lauréole","fam":"Thyméléacées","type":"Arbuste persistant","orig":"Europe","lvl":3,"tip":"Petit arbuste persistant de sous-bois. Feuilles luisantes groupées en rosette au sommet des tiges. Petites fleurs vert-jaune sous les feuilles en hiver. Baies noires toxiques.","diff":"Le bois-joli perd ses feuilles et fleurit en rose.","conf":["daphne-mezereum","ruscus-aculeatus"]},{"id":"edgeworthia-chrysantha","lat":"Edgeworthia chrysantha","fr":"Edgeworthia (buisson à papier)","fam":"Thyméléacées","type":"Arbuste caduc","orig":"Chine","lvl":3,"tip":"Rameaux souples à écorce très fibreuse (servant à faire du papier). En hiver, boules pendantes de fleurs jaunes duveteuses parfumées au bout des rameaux nus.","diff":"Le daphné bois-joli a des fleurs roses collées le long du rameau.","conf":["daphne-mezereum"]},{"id":"ruscus-aculeatus","lat":"Ruscus aculeatus","fr":"Fragon (petit houx)","fam":"Asparagacées","type":"Arbuste persistant","orig":"Europe","lvl":3,"tip":"Ce que l'on prend pour des feuilles sont des rameaux aplatis (cladodes) raides et piquants. Petites fleurs puis grosses baies rouges posées au milieu de ces cladodes.","diff":"Le houx a de vraies feuilles épineuses ondulées et des baies en bouquets.","conf":["daphne-laureola"]},{"id":"euonymus-alatus","lat":"Euonymus alatus","fr":"Fusain ailé","fam":"Célastracées","type":"Arbuste caduc","orig":"Asie de l'Est","lvl":3,"tip":"Rameaux portant 2 à 4 ailes de liège aplaties. Feuilles opposées qui virent au rouge carmin éclatant en automne. Fruits rouge-pourpre à graines orange.","diff":"Le fusain d'Europe a des rameaux verts quadrangulaires sans ailes larges et des fruits roses.","conf":["euonymus-europaeus"]},{"id":"euonymus-fortunei","lat":"Euonymus fortunei","fr":"Fusain de Fortune","fam":"Célastracées","type":"Arbuste persistant","orig":"Chine, Japon","lvl":3,"tip":"Couvre-sol ou grimpant à racines-crampons. Petites feuilles opposées ovales, dentées, souvent panachées de blanc ou de jaune, rosées en hiver.","diff":"Le fusain du Japon est un arbuste dressé à grandes feuilles. Le lierre a des feuilles alternes lobées.","conf":["euonymus-japonicus"]},{"id":"vinca-major","lat":"Vinca major","fr":"Grande pervenche","fam":"Apocynacées","type":"Sous-arbrisseau","orig":"Europe du Sud","lvl":3,"tip":"Grandes feuilles opposées ovales, ciliées au bord. Grandes fleurs bleu-violet à 5 pétales en hélice. Tiges arquées qui s'enracinent au bout.","diff":"La petite pervenche a des feuilles plus petites, étroites, glabres, et des fleurs plus petites.","conf":["vinca-minor"]},{"id":"itea-virginica","lat":"Itea virginica","fr":"Itéa de Virginie","fam":"Iteacées","type":"Arbuste caduc","orig":"Est des États-Unis","lvl":3,"tip":"Feuilles alternes ovales finement dentées, rouge pourpre très tard en automne. Épis retombants de petites fleurs blanches parfumées en juin.","diff":"La clèthre a des épis dressés.","conf":["clethra-alnifolia"]},{"id":"lindera-benzoin","lat":"Lindera benzoin","fr":"Laurier benjoin","fam":"Lauracées","type":"Arbuste caduc","orig":"Est de l'Amérique du Nord","lvl":3,"tip":"Feuilles ovales entières qui sentent l'épice froissées, jaune d'or en automne. Petites fleurs jaunes en boules sur bois nu en mars. Baies rouges.","diff":"Le cornouiller mâle a des feuilles opposées ; le laurier benjoin a des feuilles alternes aromatiques.","conf":["cornus-mas"]},{"id":"prunus-laurocerasus","lat":"Prunus laurocerasus","fr":"Laurier-cerise (laurier-palme)","fam":"Rosacées","type":"Arbuste persistant","orig":"Europe de l'Est, Asie Mineure","lvl":3,"tip":"Grandes feuilles vert vif, épaisses et brillantes. Retournez-en une : 2 à 4 petites glandes près de la base. Froissée, elle sent l'amande amère (plante toxique).","diff":"Le laurier-sauce a une feuille plus petite, au bord ondulé, très aromatique et sans glandes. Le laurier du Portugal a des pétioles rouges.","conf":[]},{"id":"rhamnus-cathartica","lat":"Rhamnus cathartica","fr":"Nerprun purgatif","fam":"Rhamnacées","type":"Arbuste caduc","orig":"Europe","lvl":3,"tip":"Rameaux presque opposés, souvent terminés par une épine. Feuilles finement dentées aux nervures arquées. Baies noires en bouquets sur pieds femelles.","diff":"La bourdaine n'a pas d'épines et ses feuilles ont un bord entier.","conf":["frangula-alnus","prunus-spinosa"]},{"id":"elaeagnus-angustifolia","lat":"Elaeagnus angustifolia","fr":"Olivier de Bohême","fam":"Élaéagnacées","type":"Arbre caduc","orig":"Asie centrale","lvl":3,"tip":"Petit arbre aux feuilles étroites, argentées des deux côtés. Rameaux parfois épineux. Fleurs jaunes très parfumées en juin. Fruits ovales jaunâtres farineux.","diff":"L'olivier est persistant, a des feuilles opposées vert-gris dessus ; l'olivier de Bohême perd ses feuilles et elles sont alternes.","conf":["hippophae-rhamnoides"]},{"id":"ptelea-trifoliata","lat":"Ptelea trifoliata","fr":"Orme de Samarie","fam":"Rutacées","type":"Arbuste caduc","orig":"Amérique du Nord","lvl":3,"tip":"Feuilles à 3 folioles, aromatiques froissées. Fleurs blanc-vert parfumées. Fruits ronds et plats entourés d'une aile, comme ceux de l'orme, en grappes.","diff":"L'orme a des feuilles simples ; le ptéléa a des feuilles à 3 folioles.","conf":[]},{"id":"salix-viminalis","lat":"Salix viminalis","fr":"Osier blanc","fam":"Salicacées","type":"Arbuste caduc","orig":"Europe","lvl":3,"tip":"Osier aux longues tiges souples. Feuilles très longues et étroites (jusqu'à 20 cm), au bord enroulé, argentées et soyeuses dessous.","diff":"Le saule pourpre a des feuilles plus courtes et des rameaux pourpres.","conf":["salix-purpurea","salix-alba"]},{"id":"pachysandra-terminalis","lat":"Pachysandra terminalis","fr":"Pachysandra","fam":"Buxacées","type":"Sous-arbrisseau","orig":"Japon, Chine","lvl":3,"tip":"Couvre-sol d'ombre persistant. Feuilles en rosettes au sommet des tiges, dentées vers la pointe. Petits épis de fleurs blanches au printemps.","diff":"La pervenche a des feuilles opposées entières et des fleurs bleues.","conf":["vinca-minor"]},{"id":"vinca-minor","lat":"Vinca minor","fr":"Petite pervenche","fam":"Apocynacées","type":"Sous-arbrisseau","orig":"Europe","lvl":3,"tip":"Couvre-sol de sous-bois aux petites feuilles opposées étroites, luisantes. Fleurs bleu lavande à 5 pétales tordus en hélice, au printemps.","diff":"La grande pervenche a des feuilles en cœur ciliées et de plus grandes fleurs.","conf":["vinca-major","pachysandra-terminalis"]},{"id":"photinia-serratifolia","lat":"Photinia serratifolia","fr":"Photinia de Chine","fam":"Rosacées","type":"Arbre persistant","orig":"Chine","lvl":3,"tip":"Grand arbuste ou petit arbre persistant aux longues feuilles coriaces finement dentées, rouge bronze au débourrement. Grandes panicules blanches au printemps, puis fruits rouges.","diff":"Le photinia 'Red Robin' a des pousses rouge plus vif et des feuilles plus petites.","conf":["prunus-laurocerasus"]},{"id":"rosa-arvensis","lat":"Rosa arvensis","fr":"Rosier des champs","fam":"Rosacées","type":"Arbuste caduc","orig":"Europe","lvl":3,"tip":"Rosier rampant ou grimpant des sous-bois. Fleurs blanches dont les styles forment une petite colonne au centre. Folioles mates.","diff":"L'églantier a des fleurs roses à styles libres en tête.","conf":["rosa-canina"]},{"id":"rosa-multiflora","lat":"Rosa multiflora","fr":"Rosier multiflore","fam":"Rosacées","type":"Arbuste caduc","orig":"Chine, Japon, Corée","lvl":3,"tip":"Rosier vigoureux aux stipules frangées en peigne à la base des feuilles. Grappes pyramidales de petites fleurs blanches parfumées. Petits fruits ronds rouges.","diff":"Les stipules découpées en peigne sont la signature de ce rosier.","conf":["rosa-arvensis","rosa-canina"]},{"id":"rosa-pimpinellifolia","lat":"Rosa pimpinellifolia","fr":"Rosier pimprenelle","fam":"Rosacées","type":"Arbuste caduc","orig":"Europe","lvl":3,"tip":"Rosier bas des dunes. Tiges couvertes d'aiguillons droits et de soies serrées. Petites folioles rondes (7-11). Fleurs blanc crème, puis fruits noir-pourpre.","diff":"Les autres églantiers ont des fruits rouges.","conf":["rosa-rugosa","rosa-canina"]},{"id":"rosa-rubiginosa","lat":"Rosa rubiginosa","fr":"Rosier rouillé","fam":"Rosacées","type":"Arbuste caduc","orig":"Europe","lvl":3,"tip":"Églantier dont les feuilles froissées sentent la pomme verte, grâce à des glandes collantes au revers. Fleurs rose vif, cynorhodons ovales.","diff":"L'églantier commun a des feuilles sans glandes, sans odeur.","conf":["rosa-canina"]},{"id":"rosa-glauca","lat":"Rosa glauca","fr":"Rosier à feuilles rouges","fam":"Rosacées","type":"Arbuste caduc","orig":"Montagnes d'Europe","lvl":3,"tip":"Feuillage bleu-gris teinté de pourpre, rameaux pourpres presque sans aiguillons. Petites fleurs rose vif à cœur blanc. Cynorhodons rouge foncé.","diff":"Aucun autre rosier courant n'a ce feuillage gris pourpré.","conf":["rosa-canina"]},{"id":"gaultheria-shallon","lat":"Gaultheria shallon","fr":"Salal","fam":"Éricacées","type":"Arbuste persistant","orig":"Ouest de l'Amérique du Nord","lvl":3,"tip":"Persistant drageonnant aux feuilles ovales coriaces, dentées, à pointe fine. Grappes de clochettes blanc rosé, puis baies pourpre-noir.","diff":"Le piéris a des feuilles plus étroites en rosettes et des pousses rouges.","conf":["vaccinium-corymbosum"]},{"id":"salix-cinerea","lat":"Salix cinerea","fr":"Saule cendré","fam":"Salicacées","type":"Arbuste caduc","orig":"Europe","lvl":3,"tip":"Saule des zones humides. Feuilles obovales, grisâtres et duveteuses, à petites stipules. Rameaux duveteux. Chatons argentés en mars.","diff":"Le saule marsault a des feuilles plus larges et des rameaux glabres ; le saule à oreillettes a de grandes stipules en oreille.","conf":["salix-caprea"]},{"id":"salix-purpurea","lat":"Salix purpurea","fr":"Saule pourpre","fam":"Salicacées","type":"Arbuste caduc","orig":"Europe","lvl":3,"tip":"Saule aux rameaux fins et pourpres. Feuilles étroites, souvent subopposées, bleutées dessous, qui noircissent en séchant. Écorce amère jaune dessous.","diff":"L'osier blanc a des feuilles beaucoup plus longues, argentées dessous.","conf":["salix-viminalis"]},{"id":"sorbaria-sorbifolia","lat":"Sorbaria sorbifolia","fr":"Sorbaria","fam":"Rosacées","type":"Arbuste caduc","orig":"Asie du Nord-Est","lvl":3,"tip":"Arbuste drageonnant aux feuilles composées pennées dentées comme le sorbier. Grandes panicules de fleurs blanches mousseuses en été.","diff":"Le sorbier est un arbre à fruits rouges ; la sorbaria est un arbuste à fruits secs.","conf":["spiraea-japonica"]},{"id":"staphylea-pinnata","lat":"Staphylea pinnata","fr":"Staphylier","fam":"Staphyléacées","type":"Arbuste caduc","orig":"Europe centrale et du Sud","lvl":3,"tip":"Feuilles opposées composées de 5 à 7 folioles. Grappes pendantes de fleurs blanches en clochettes, puis capsules vertes gonflées comme des vessies.","diff":"Le baguenaudier a aussi des fruits gonflés, mais ses feuilles sont alternes et ses fleurs jaunes.","conf":["colutea-arborescens","sambucus-nigra"]},{"id":"sambucus-rac
