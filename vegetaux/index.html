emosa","lat":"Sambucus racemosa","fr":"Sureau rouge","fam":"Viburnacées","type":"Arbuste caduc","orig":"Europe","lvl":3,"tip":"Sureau de montagne. Feuilles composées opposées. Grappes coniques de fleurs crème au printemps, puis baies rouge vif en juin-juillet. Moelle brune.","diff":"Le sureau noir a des ombelles plates, des baies noires en fin d'été et une moelle blanche.","conf":["sambucus-nigra"]},{"id":"tamarix-ramosissima","lat":"Tamarix ramosissima","fr":"Tamaris d'été","fam":"Tamaricacées","type":"Arbuste caduc","orig":"Asie","lvl":3,"tip":"Tamaris qui fleurit d'août à septembre en longues panicules rose vif sur les pousses de l'année. Feuillage en écailles bleuté.","diff":"Le tamaris à petites fleurs fleurit en avril-mai.","conf":["tamarix-gallica"]},{"id":"tamarix-gallica","lat":"Tamarix gallica","fr":"Tamaris de France","fam":"Tamaricacées","type":"Arbuste caduc","orig":"Ouest de la Méditerranée","lvl":3,"tip":"Arbuste aux rameaux fins couverts de minuscules feuilles en écailles. Nuages de petites fleurs roses en épis en été. Supporte sel et embruns.","diff":"Le tamaris d'été fleurit plus tard en rose plus vif ; le tamaris à petites fleurs fleurit au printemps sur le bois de l'année précédente.","conf":["tamarix-ramosissima"]},{"id":"ligustrum-lucidum","lat":"Ligustrum lucidum","fr":"Troène de Chine","fam":"Oléacées","type":"Arbre persistant","orig":"Chine","lvl":3,"tip":"Arbre persistant d'alignement dans le Midi. Grandes feuilles opposées, ovales pointues, luisantes. Énormes panicules blanches en été, puis grappes de baies bleu-noir pruinées.","diff":"Le troène du Japon reste arbustif avec des feuilles plus courtes et plus épaisses.","conf":[]},{"id":"viburnum-lantana","lat":"Viburnum lantana","fr":"Viorne mancienne","fam":"Viburnacées","type":"Arbuste caduc","orig":"Europe","lvl":3,"tip":"Feuilles opposées épaisses, ridées, feutrées de gris dessous, finement dentées. Bourgeons nus et duveteux. Ombelles blanches puis fruits rouges virant au noir en même temps.","diff":"La viorne obier a des feuilles lobées et des fruits rouges translucides.","conf":[]},{"id":"hebe-salicifolia","lat":"Hebe salicifolia","fr":"Véronique arbustive","fam":"Plantaginacées","type":"Arbuste persistant","orig":"Nouvelle-Zélande","lvl":3,"tip":"Persistant aux feuilles opposées étroites comme le saule, disposées en croix régulière. Longs épis de fleurs blanches ou lilas en été.","diff":"Le saule a des feuilles alternes et perd ses feuilles ; la véronique a des feuilles opposées en croix.","conf":["salix-viminalis","buddleja-davidii"]},{"id":"berberis-vulgaris","lat":"Berberis vulgaris","fr":"Épine-vinette commune","fam":"Berbéridacées","type":"Arbuste caduc","orig":"Europe","lvl":3,"tip":"Arbuste caduc aux épines à 3 branches sous chaque rosette de feuilles. Feuilles finement dentées-ciliées. Grappes pendantes de fleurs jaunes, puis baies rouges oblongues acides. Bois jaune vif.","diff":"L'épine-vinette de Thunberg a des feuilles entières et des épines simples.","conf":["berberis-thunbergii","ribes-uva-crispa"]},{"id":"berberis-darwinii","lat":"Berberis darwinii","fr":"Épine-vinette de Darwin","fam":"Berbéridacées","type":"Arbuste persistant","orig":"Chili, Argentine","lvl":3,"tip":"Petites feuilles persistantes luisantes, à 3-5 épines comme un houx miniature. Grappes de fleurs orange vif en avril, puis baies bleu-noir pruinées. Bois jaune.","diff":"Le mahonia a des feuilles composées. L'osmanthe à feuilles de houx a des feuilles opposées.","conf":["mahonia-aquifolium","berberis-julianae"]},{"id":"berberis-julianae","lat":"Berberis julianae","fr":"Épine-vinette de Julien","fam":"Berbéridacées","type":"Arbuste persistant","orig":"Chine","lvl":3,"tip":"Feuilles persistantes étroites, longues, bordées de dents épineuses, en rosettes, avec de fortes épines à 3 branches. Fleurs jaunes, baies noires pruinées.","diff":"L'épine-vinette de Darwin a des feuilles plus courtes et des fleurs orange.","conf":["berberis-darwinii","berberis-vulgaris"]},{"id":"sorbus-torminalis","lat":"Sorbus torminalis","fr":"Alisier torminal","fam":"Rosacées","type":"Arbre caduc","orig":"Europe","lvl":4,"tip":"Feuilles à lobes pointus comme un érable, mais alternes. Fruits bruns ponctués (alises), comestibles blets. Rouge en automne.","diff":"Les érables ont des feuilles opposées ; l'alisier torminal les a alternes.","conf":["sorbus-aria"]},{"id":"crataegus-laevigata","lat":"Crataegus laevigata","fr":"Aubépine épineuse","fam":"Rosacées","type":"Arbre caduc","orig":"Europe","lvl":4,"tip":"Feuilles peu lobées (3-5 lobes peu profonds), luisantes. Fleurs à 2-3 styles, souvent roses ou rouges doubles chez les variétés ('Paul's Scarlet'). Fruits à 2 noyaux.","diff":"L'aubépine monogyne a des feuilles profondément découpées et un seul noyau.","conf":["crataegus-monogyna"]},{"id":"alnus-incana","lat":"Alnus incana","fr":"Aulne blanc","fam":"Bétulacées","type":"Arbre caduc","orig":"Europe","lvl":4,"tip":"Feuilles ovales pointues, doublement dentées, grises et duveteuses dessous. Écorce grise lisse. Bords de torrents de montagne.","diff":"L'aulne glutineux a des feuilles rondes échancrées, vert foncé, collantes.","conf":["alnus-glutinosa"]},{"id":"betula-pubescens","lat":"Betula pubescens","fr":"Bouleau pubescent","fam":"Bétulacées","type":"Arbre caduc","orig":"Europe","lvl":4,"tip":"Bouleau des sols humides. Rameaux dressés, duveteux, sans verrues. Feuilles ovales simplement dentées, duveteuses. Écorce blanche sans grosses crevasses noires à la base.","diff":"Le bouleau verruqueux a des rameaux pendants couverts de verrues et des feuilles en losange doublement dentées.","conf":["betula-pendula"]},{"id":"betula-papyrifera","lat":"Betula papyrifera","fr":"Bouleau à papier","fam":"Bétulacées","type":"Arbre caduc","orig":"Amérique du Nord","lvl":4,"tip":"Écorce blanc crème qui se détache en grandes feuilles de papier horizontales. Feuilles ovales plus grandes que les autres bouleaux.","diff":"Le bouleau de l'Himalaya a une écorce plus lisse et lumineuse.","conf":["betula-pendula"]},{"id":"prunus-mahaleb","lat":"Prunus mahaleb","fr":"Cerisier de Sainte-Lucie","fam":"Rosacées","type":"Arbre caduc","orig":"Europe","lvl":4,"tip":"Petites feuilles rondes et luisantes. Bouquets de fleurs blanches parfumées. Petites cerises noires amères. Bois odorant (bois de Sainte-Lucie). Coteaux calcaires.","diff":"Le merisier a des feuilles bien plus grandes et pendantes.","conf":["prunus-avium","prunus-spinosa"]},{"id":"prunus-serotina","lat":"Prunus serotina","fr":"Cerisier tardif","fam":"Rosacées","type":"Arbre caduc","orig":"Amérique du Nord","lvl":4,"tip":"Feuilles allongées très luisantes, avec des poils roux le long de la nervure dessous. Grappes de fleurs blanches en juin. Baies noires. Espèce envahissante en forêt.","diff":"Le cerisier à grappes a des feuilles mates et fleurit plus tôt.","conf":["prunus-padus","prunus-laurocerasus"]},{"id":"prunus-padus","lat":"Prunus padus","fr":"Cerisier à grappes","fam":"Rosacées","type":"Arbre caduc","orig":"Europe","lvl":4,"tip":"Longues grappes pendantes de fleurs blanches au parfum d'amande en avril-mai. Feuilles ovales finement dentées. Écorce à odeur désagréable. Petites cerises noires amères.","diff":"Le cerisier tardif a des feuilles très luisantes et fleurit plus tard ; le laurier-cerise est persistant.","conf":["prunus-serotina","prunus-avium"]},{"id":"ostrya-carpinifolia","lat":"Ostrya carpinifolia","fr":"Charme-houblon","fam":"Bétulacées","type":"Arbre caduc","orig":"Europe du Sud","lvl":4,"tip":"Feuilles proches du charme, doublement dentées. Fruits en cônes blanchâtres pendants comme le houblon. Écorce brune qui s'écaille en lanières.","diff":"Le charme a une écorce grise cannelée et des fruits en grappes de bractées à 3 lobes.","conf":["carpinus-betulus"]},{"id":"quercus-cerris","lat":"Quercus cerris","fr":"Chêne chevelu","fam":"Fagacées","type":"Arbre caduc","orig":"Europe du Sud-Est","lvl":4,"tip":"Bourgeons entourés de longues stipules filiformes qui persistent. Feuilles rugueuses aux lobes pointus irréguliers. Glands dans une cupule hérissée comme une chevelure.","diff":"Le chêne pédonculé a des lobes arrondis et une cupule lisse.","conf":["quercus-robur"]},{"id":"quercus-palustris","lat":"Quercus palustris","fr":"Chêne des marais","fam":"Fagacées","type":"Arbre caduc","orig":"Est des États-Unis","lvl":4,"tip":"Feuilles profondément découpées en lobes pointus terminés par des soies, avec des sinus très arrondis. Branches basses retombantes. Petits glands dans une cupule plate.","diff":"Le chêne rouge a des lobes moins profonds et de plus gros glands ; le chêne écarlate a des sinus en C plus profonds.","conf":[]},{"id":"quercus-pyrenaica","lat":"Quercus pyrenaica","fr":"Chêne tauzin","fam":"Fagacées","type":"Arbre caduc","orig":"Péninsule Ibérique, France","lvl":4,"tip":"Feuilles très profondément lobées, épaisses, couvertes d'un duvet gris laineux dessous. Drageonne. Sols acides du Sud-Ouest.","diff":"Le chêne pubescent a des lobes moins profonds et préfère le calcaire.","conf":["quercus-pubescens"]},{"id":"quercus-phellos","lat":"Quercus phellos","fr":"Chêne à feuilles de saule","fam":"Fagacées","type":"Arbre caduc","orig":"Est des États-Unis","lvl":4,"tip":"Chêne aux feuilles étroites et entières comme celles du saule, terminées par une petite soie. Petits glands.","diff":"Les saules n'ont pas de glands ; ce chêne a des bourgeons groupés au bout des rameaux.","conf":["salix-alba"]},{"id":"quercus-macrocarpa","lat":"Quercus macrocarpa","fr":"Chêne à gros fruits","fam":"Fagacées","type":"Arbre caduc","orig":"Amérique du Nord","lvl":4,"tip":"Grandes feuilles avec un profond sinus au milieu : partie haute large et peu lobée, partie basse profondément lobée. Gros glands dans une cupule frangée.","diff":"Le chêne blanc d'Amérique a des lobes réguliers ; le chêne à gros fruits a une cupule frangée.","conf":["quercus-robur"]},{"id":"sorbus-domestica","lat":"Sorbus domestica","fr":"Cormier","fam":"Rosacées","type":"Arbre caduc","orig":"Europe du Sud","lvl":4,"tip":"Feuilles composées comme le sorbier des oiseleurs, mais bourgeons verts collants et écorce en carreaux. Fruits en petites poires ou pommes jaunes rougeâtres (cormes).","diff":"Le sorbier des oiseleurs a des bourgeons violets velus et de petites baies rouges.","conf":["fraxinus-excelsior"]},{"id":"cornus-mas","lat":"Cornus mas","fr":"Cornouiller mâle","fam":"Cornacées","type":"Arbuste caduc","orig":"Europe","lvl":4,"tip":"Petites fleurs jaunes en pompons dès février, avant les feuilles. Feuilles à nervures arquées. Fruits rouges oblongs comestibles (cornouilles).","diff":"Le forsythia a de plus grandes fleurs à 4 pétales. Son bois n'a pas de fils dans les feuilles. Le cornouiller mâle a de petits pompons jaunes.","conf":["cornus-sanguinea"]},{"id":"fraxinus-americana","lat":"Fraxinus americana","fr":"Frêne blanc d'Amérique","fam":"Oléacées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":4,"tip":"Folioles entières ou peu dentées, blanches dessous, sur pétiolules. Couleur d'automne pourpre. Bourgeons bruns.","diff":"Le frêne commun a des folioles dentées et des bourgeons noirs.","conf":["fraxinus-excelsior"]},{"id":"fraxinus-angustifolia","lat":"Fraxinus angustifolia","fr":"Frêne à feuilles étroites","fam":"Oléacées","type":"Arbre caduc","orig":"Sud de l'Europe","lvl":4,"tip":"Frêne aux folioles étroites et dentées, glabres. Bourgeons bruns (et non noirs). Plaines alluviales du Midi.","diff":"Le frêne commun a des bourgeons noirs veloutés.","conf":["fraxinus-excelsior","fraxinus-ornus"]},{"id":"fraxinus-ornus","lat":"Fraxinus ornus","fr":"Frêne à fleurs","fam":"Oléacées","type":"Arbre caduc","orig":"Europe du Sud","lvl":4,"tip":"Frêne aux bourgeons gris velouté. Folioles larges, pétiolulées. Panicules de fleurs blanches crème mousseuses et parfumées en mai.","diff":"Le frêne commun a des bourgeons noirs et des fleurs sans pétales discrètes.","conf":["fraxinus-excelsior","fraxinus-angustifolia"]},{"id":"cercis-canadensis","lat":"Cercis canadensis","fr":"Gainier du Canada","fam":"Fabacées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":4,"tip":"Feuilles en cœur pointues (et non arrondies au bout). Fleurs rose lilas sur le bois au printemps. Variétés pourpres ('Forest Pansy').","diff":"L'arbre de Judée a des feuilles arrondies au sommet.","conf":["cercis-siliquastrum"]},{"id":"fagus-orientalis","lat":"Fagus orientalis","fr":"Hêtre d'Orient","fam":"Fagacées","type":"Arbre caduc","orig":"Balkans, Caucase","lvl":4,"tip":"Hêtre aux feuilles plus grandes et plus allongées que le hêtre commun, avec plus de nervures (8-12 paires). Cupules aux appendices aplatis.","diff":"Le hêtre commun a des feuilles plus petites à 5-8 paires de nervures.","conf":["fagus-sylvatica"]},{"id":"ziziphus-jujuba","lat":"Ziziphus jujuba","fr":"Jujubier","fam":"Rhamnacées","type":"Arbre caduc","orig":"Chine","lvl":4,"tip":"Rameaux en zigzag avec 2 épines à chaque nœud. Feuilles luisantes à 3 nervures longitudinales. Jujubes ovales brun-rouge.","diff":"Le paliure a aussi 2 épines, mais ses fruits sont des disques ailés.","conf":[]},{"id":"melia-azedarach","lat":"Melia azedarach","fr":"Lilas de Perse (margousier)","fam":"Méliacées","type":"Arbre caduc","orig":"Asie","lvl":4,"tip":"Feuilles 2 fois composées aux folioles dentées. Panicules de fleurs lilas parfumées en mai. En hiver, grappes de baies jaunes rondes toxiques sur l'arbre nu.","diff":"Le savonnier a des fleurs jaunes et des capsules gonflées.","conf":[]},{"id":"magnolia-acuminata","lat":"Magnolia acuminata","fr":"Magnolia concombre","fam":"Magnoliacées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":4,"tip":"Grand magnolia caduc aux feuilles ovales. Fleurs vert-jaune discrètes. Fruits rouges en forme de concombre qui s'ouvrent sur des graines rouges.","diff":"Les magnolias d'ornement courants ont de grandes fleurs blanches ou roses bien visibles.","conf":[]},{"id":"celtis-occidentalis","lat":"Celtis occidentalis","fr":"Micocoulier occidental","fam":"Cannabacées","type":"Arbre caduc","orig":"Amérique du Nord","lvl":4,"tip":"Feuilles asymétriques, dentées, à pointe effilée. Écorce grise avec des crêtes liégeuses verrueuses. Petites drupes rouge-pourpre.","diff":"Le micocoulier de Provence a une écorce lisse et des fruits noirs.","conf":[]},{"id":"broussonetia-papyrifera","lat":"Broussonetia papyrifera","fr":"Mûrier à papier","fam":"Moracées","type":"Arbre caduc","orig":"Asie de l'Est","lvl":4,"tip":"Feuilles très variables (entières ou à 3-5 lobes) sur le même arbre, rugueuses dessus, veloutées dessous. Latex. Fruits ronds orange à filaments.","diff":"Le mûrier blanc a des feuilles lisses dessus ; le mûrier à papier est velouté.","conf":["morus-alba","morus-nigra"]},{"id":"juglans-nigra","lat":"Juglans nigra","fr":"Noyer noir","fam":"Juglandacées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":4,"tip":"Feuilles composées de 15 à 23 folioles dentées, la terminale souvent absente. Écorce sombre profondément sillonnée en losanges. Noix ronde à coque très dure dans un brou vert.","diff":"Le noyer commun a 5 à 9 grandes folioles entières et une écorce grise.","conf":["juglans-regia"]},{"id":"nyssa-sylvatica","lat":"Nyssa sylvatica","fr":"Nyssa","fam":"Nyssacées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":4,"tip":"Feuilles ovales luisantes au bord entier, qui virent au rouge écarlate parmi les premières en automne. Branches horizontales. Petites drupes bleu-noir.","diff":"Le copalme a des feuilles en étoile. Le nyssa a une feuille simple entière.","conf":[]},{"id":"ulmus-pumila","lat":"Ulmus pumila","fr":"Orme de Sibérie","fam":"Ulmacées","type":"Arbre caduc","orig":"Asie","lvl":4,"tip":"Petites feuilles presque symétriques, simplement dentées. Rameaux fins. Graine au centre d'une samare ronde. Très résistant et envahissant.","diff":"L'orme champêtre a une base de feuille nettement asymétrique et doublement dentée.","conf":[]},{"id":"ulmus-glabra","lat":"Ulmus glabra","fr":"Orme des montagnes","fam":"Ulmacées","type":"Arbre caduc","orig":"Europe","lvl":4,"tip":"Grandes feuilles très rugueuses, asymétriques à la base, souvent à 3 pointes au sommet. Pétiole très court. Samares larges.","diff":"L'orme champêtre a des feuilles plus petites et plus lisses, avec un pétiole visible.","conf":["ulmus-laevis"]},{"id":"ulmus-laevis","lat":"Ulmus laevis","fr":"Orme lisse","fam":"Ulmacées","type":"Arbre caduc","orig":"Europe","lvl":4,"tip":"Feuilles asymétriques doublement dentées. Fleurs et fruits ciliés pendant sur de longs pédoncules. Tronc à contreforts. Bords de rivières.","diff":"Les autres ormes ont des fruits presque sessiles.","conf":["ulmus-glabra"]},{"id":"populus-alba","lat":"Populus alba","fr":"Peuplier blanc","fam":"Salicacées","type":"Arbre caduc","orig":"Europe, Asie","lvl":4,"tip":"Feuilles à 3-5 lobes comme l'érable, couvertes d'un feutre blanc dessous et sur les jeunes rameaux. Écorce blanche ponctuée de losanges noirs. Drageonne beaucoup.","diff":"Le peuplier grisard a des feuilles moins lobées et moins blanches ; le tremble a des feuilles rondes.","conf":["populus-canescens","populus-tremula"]},{"id":"populus-deltoides","lat":"Populus deltoides","fr":"Peuplier deltoïde","fam":"Salicacées","type":"Arbre caduc","orig":"Amérique du Nord","lvl":4,"tip":"Grandes feuilles triangulaires à base en cœur, à grosses dents courbées, avec 2-3 glandes au sommet du pétiole. Bourgeons collants et odorants.","diff":"Le peuplier hybride a une base de feuille tronquée.","conf":["populus-nigra"]},{"id":"populus-canescens","lat":"Populus × canescens","fr":"Peuplier grisard","fam":"Salicacées","type":"Arbre caduc","orig":"Europe","lvl":4,"tip":"Hybride du peuplier blanc et du tremble. Feuilles rondes ou peu lobées, grisâtres dessous. Écorce gris-blanc à losanges.","diff":"Le peuplier blanc a des feuilles lobées très blanches ; le tremble a des feuilles vertes des deux côtés.","conf":["populus-alba","populus-tremula"]},{"id":"diospyros-lotus","lat":"Diospyros lotus","fr":"Plaqueminier d'Europe","fam":"Ébénacées","type":"Arbre caduc","orig":"Asie occidentale","lvl":4,"tip":"Feuilles ovales luisantes. Petits fruits ronds jaunes puis noirâtres de la taille d'une cerise. Écorce en petits carreaux.","diff":"Le kaki a de gros fruits orange.","conf":["diospyros-virginiana"]},{"id":"diospyros-virginiana","lat":"Diospyros virginiana","fr":"Plaqueminier de Virginie","fam":"Ébénacées","type":"Arbre caduc","orig":"Est des États-Unis","lvl":4,"tip":"Feuilles ovales luisantes. Fruits orange de 3-4 cm, très astringents avant les gelées. Écorce en carreaux noirs très nets.","diff":"Le kaki a des fruits bien plus gros ; le plaqueminier d'Europe a des fruits plus petits.","conf":["diospyros-lotus"]},{"id":"platanus-occidentalis","lat":"Platanus occidentalis","fr":"Platane d'Occident","fam":"Platanacées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":4,"tip":"Feuilles à 3-5 lobes peu profonds. Fruits en boules pendantes isolées (une par pédoncule). Écorce blanche en haut du tronc.","diff":"Le platane commun a des feuilles plus lobées et 2 boules par pédoncule.","conf":["platanus-hispanica","platanus-orientalis"]},{"id":"platanus-orientalis","lat":"Platanus orientalis","fr":"Platane d'Orient","fam":"Platanacées","type":"Arbre caduc","orig":"Balkans, Asie occidentale","lvl":4,"tip":"Feuilles profondément découpées en 5-7 lobes étroits. Boules par 3 à 6 sur le même pédoncule. Arbres très vieux sur les places du Midi.","diff":"Le platane commun a des lobes moins profonds et 1-2 boules par pédoncule.","conf":["platanus-hispanica","platanus-occidentalis"]},{"id":"malus-sylvestris","lat":"Malus sylvestris","fr":"Pommier sauvage","fam":"Rosacées","type":"Arbre caduc","orig":"Europe","lvl":4,"tip":"Petit arbre parfois épineux. Feuilles ovales glabres dessous à l'âge adulte. Fleurs blanc rosé, petites pommes vertes acides.","diff":"Le pommier cultivé a des feuilles duveteuses dessous et de gros fruits.","conf":["malus-domestica"]},{"id":"pterocarya-fraxinifolia","lat":"Pterocarya fraxinifolia","fr":"Ptérocaryer du Caucase","fam":"Juglandacées","type":"Arbre caduc","orig":"Caucase, Iran","lvl":4,"tip":"Très longues feuilles composées (jusqu'à 25 folioles). Longs chapelets pendants de fruits ailés verts en été. Drageonne beaucoup au bord de l'eau.","diff":"Le noyer a moins de folioles et des noix ; le ptérocaryer a des chaînes de fruits ailés.","conf":["juglans-regia"]},{"id":"sassafras-albidum","lat":"Sassafras albidum","fr":"Sassafras","fam":"Lauracées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":4,"tip":"Trois formes de feuilles sur le même arbre : entières, en mitaine (2 lobes) et à 3 lobes. Odeur de racinette au froissement. Couleurs d'automne orange.","diff":"Le mûrier a des feuilles variables aussi, mais dentées et du latex.","conf":["morus-alba"]},{"id":"tilia-tomentosa","lat":"Tilia tomentosa","fr":"Tilleul argenté","fam":"Malvacées","type":"Arbre caduc","orig":"Balkans, Turquie","lvl":4,"tip":"Feuilles en cœur au revers entièrement feutré de blanc argenté : l'arbre scintille au vent. Fleurs très parfumées en juillet.","diff":"Les autres tilleuls ont seulement des touffes de poils aux aisselles des nervures.","conf":["tilia-europaea"]},{"id":"tilia-americana","lat":"Tilia americana","fr":"Tilleul d'Amérique","fam":"Malvacées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":4,"tip":"Très grandes feuilles en cœur (jusqu'à 20 cm), vertes et glabres des deux côtés, à grosses dents.","diff":"Le tilleul à grandes feuilles européen a des feuilles velues dessous.","conf":["tilia-europaea"]},{"id":"acer-monspessulanum","lat":"Acer monspessulanum","fr":"Érable de Montpellier","fam":"Sapindacées","type":"Arbre caduc","orig":"Méditerranée","lvl":4,"tip":"Petites feuilles opposées coriaces à 3 lobes arrondis égaux, au bord entier. Samares rougeâtres presque parallèles. Coteaux secs du Midi.","diff":"L'érable champêtre a 5 lobes et du latex ; l'érable de Montpellier a 3 lobes égaux.","conf":["acer-opalus"]},{"id":"acer-negundo","lat":"Acer negundo","fr":"Érable negundo","fam":"Sapindacées","type":"Arbre caduc","orig":"Amérique du Nord","lvl":4,"tip":"Le seul érable courant à feuilles composées : 3 à 7 folioles dentées, opposées. Rameaux verts souvent couverts d'une pruine bleutée. Samares en V. Formes panachées fréquentes.","diff":"Le frêne a des folioles plus nombreuses et des bourgeons noirs ; le negundo a des rameaux verts pruinés.","conf":["fraxinus-excelsior","sambucus-nigra"]},{"id":"acer-opalus","lat":"Acer opalus","fr":"Érable à feuilles d'obier","fam":"Sapindacées","type":"Arbre caduc","orig":"Europe du Sud","lvl":4,"tip":"Feuilles opposées à 5 lobes peu profonds et arrondis, plus larges que longues. Floraison jaune avant les feuilles. Montagnes calcaires du Sud.","diff":"L'érable sycomore a des feuilles plus grandes à lobes plus marqués ; l'érable de Montpellier n'a que 3 lobes.","conf":["acer-pseudoplatanus","acer-monspessulanum"]},{"id":"cupressus-macrocarpa","lat":"Cupressus macrocarpa","fr":"Cyprès de Lambert","fam":"Cupressacées","type":"Conifère persistant","orig":"Californie","lvl":5,"tip":"Cyprès du littoral à la couronne étalée, tabulaire avec l'âge. Feuillage vert vif à odeur de citron. Gros cônes de 3-4 cm.","diff":"Le cyprès de Provence est une colonne étroite ; le Leyland a un feuillage plus plat.","conf":[]},{"id":"cupressus-arizonica","lat":"Cupressus arizonica","fr":"Cyprès de l'Arizona","fam":"Cupressacées","type":"Conifère persistant","orig":"Sud-ouest des États-Unis","lvl":5,"tip":"Feuillage en écailles bleu-gris, avec des points de résine blanche. Écorce rouge-brun qui s'exfolie en plaques. Cônes ronds de 2-3 cm.","diff":"Le cyprès de Provence est vert sombre et très étroit.","conf":["cupressus-macrocarpa"]},{"id":"cedrus-atlantica","lat":"Cedrus atlantica","fr":"Cèdre de l'Atlas","fam":"Pinacées","type":"Conifère persistant","orig":"Afrique du Nord","lvl":5,"tip":"Aiguilles courtes en rosettes sur de petits rameaux courts. Cônes en forme de tonnelets dressés sur les branches. La flèche (sommet) se tient droite. Forme bleue 'Glauca' très plantée.","diff":"Le cèdre du Liban a des étages horizontaux en plateaux. Le déodar a une flèche qui retombe. Le mélèze perd ses aiguilles en hiver.","conf":["larix-decidua","cedrus-deodara"]},{"id":"cedrus-deodara","lat":"Cedrus deodara","fr":"Cèdre de l'Himalaya","fam":"Pinacées","type":"Conifère persistant","orig":"Himalaya","lvl":5,"tip":"Aiguilles longues (jusqu'à 5 cm) et souples. Branches et flèche retombantes, ce qui lui donne un port pleureur gracieux.","diff":"Les cèdres de l'Atlas et du Liban ont des aiguilles plus courtes et un sommet qui ne retombe pas.","conf":["cedrus-atlantica"]},{"id":"calocedrus-decurrens","lat":"Calocedrus decurrens","fr":"Cèdre à encens","fam":"Cupressacées","type":"Conifère persistant","orig":"Ouest des États-Unis","lvl":5,"tip":"Colonne étroite et dense. Rameaux plats aux écailles allongées par 4, vert foncé. Petits cônes en bec de canard. Écorce rouge fibreuse.","diff":"Le thuya géant a un port plus large et une odeur d'ananas.","conf":["thuja-plicata"]},{"id":"pseudotsuga-menziesii","lat":"Pseudotsuga menziesii","fr":"Douglas","fam":"Pinacées","type":"Conifère persistant","orig":"Ouest de l'Amérique du Nord","lvl":5,"tip":"Aiguilles souples, plates, à odeur d'agrume. Bourgeons pointus brun-rouge, comme ceux du hêtre. Cônes pendants avec des bractées à 3 pointes qui dépassent (« queues de souris »).","diff":"Le sapin a des cônes dressés ; l'épicéa a des aiguilles piquantes sur coussinets.","conf":["abies-alba","picea-abies","tsuga-heterophylla"]},{"id":"chamaecyparis-lawsoniana","lat":"Chamaecyparis lawsoniana","fr":"Faux-cyprès de Lawson","fam":"Cupressacées","type":"Conifère persistant","orig":"Ouest des États-Unis","lvl":5,"tip":"Rameaux plats en éventail, avec de fines marques blanches en X dessous. Flèche qui retombe. Petits cônes ronds. Odeur de persil au froissement.","diff":"Le thuya a des cônes allongés en tulipe et pas de marques en X. Le Leyland a une flèche dressée et des cônes bruns plus gros.","conf":["thuja-occidentalis"]},{"id":"juniperus-communis","lat":"Juniperus communis","fr":"Genévrier commun","fam":"Cupressacées","type":"Conifère persistant","orig":"Hémisphère Nord","lvl":5,"tip":"Aiguilles par 3, très piquantes, avec une bande blanche dessus. Baies bleu-noir pruinées (galbules) qui mettent 2 ans à mûrir.","diff":"Le genévrier cade a 2 bandes blanches sur l'aiguille et des baies rouge-brun.","conf":[]},{"id":"juniperus-virginiana","lat":"Juniperus virginiana","fr":"Genévrier de Virginie","fam":"Cupressacées","type":"Conifère persistant","orig":"Est de l'Amérique du Nord","lvl":5,"tip":"Arbre conique à feuilles en écailles (aiguilles chez les jeunes). Écorce brun-rouge fibreuse en lanières. Petites baies bleues pruinées. Bois à odeur de crayon.","diff":"Le genévrier de Chine a des baies plus grosses et un feuillage moins fin.","conf":["thuja-occidentalis"]},{"id":"juniperus-horizontalis","lat":"Juniperus horizontalis","fr":"Genévrier rampant","fam":"Cupressacées","type":"Conifère persistant","orig":"Amérique du Nord","lvl":5,"tip":"Genévrier rampant à feuillage en écailles, bleu-vert, qui vire au pourpre en hiver. Rameaux plaqués au sol.","diff":"Le genévrier sabine a des rameaux plus dressés et une odeur forte.","conf":["juniperus-sabina"]},{"id":"juniperus-sabina","lat":"Juniperus sabina","fr":"Genévrier sabine","fam":"Cupressacées","type":"Conifère persistant","orig":"Montagnes d'Europe","lvl":5,"tip":"Genévrier bas aux feuilles en écailles qui dégagent une odeur forte et désagréable au froissement. Très toxique.","diff":"Le genévrier rampant n'a pas cette odeur forte.","conf":["juniperus-horizontalis"]},{"id":"larix-decidua","lat":"Larix decidua","fr":"Mélèze d'Europe","fam":"Pinacées","type":"Conifère caduc","orig":"Alpes, Carpates","lvl":5,"tip":"Conifère qui perd ses aiguilles : elles virent au jaune d'or en automne. Aiguilles tendres en touffes sur des rameaux courts. Petits cônes dressés.","diff":"Le cèdre a des rosettes similaires, mais persistantes et raides, et de gros cônes en tonneau.","conf":["cedrus-atlantica"]},{"id":"larix-kaempferi","lat":"Larix kaempferi","fr":"Mélèze du Japon","fam":"Pinacées","type":"Conifère caduc","orig":"Japon","lvl":5,"tip":"Mélèze aux rameaux roux-orangé l'hiver et aux aiguilles bleutées. Cônes aux écailles retournées vers l'extérieur comme des roses.","diff":"Le mélèze d'Europe a des rameaux jaune paille et des cônes aux écailles droites.","conf":["larix-decidua"]},{"id":"pinus-cembra","lat":"Pinus cembra","fr":"Pin cembro","fam":"Pinacées","type":"Conifère persistant","orig":"Alpes, Carpates","lvl":5,"tip":"Aiguilles par 5, souples, vert-bleu. Cônes violacés qui ne s'ouvrent pas et contiennent de grosses graines comestibles. Haute montagne.","diff":"Le pin de Weymouth a aussi 5 aiguilles mais longues et fines, et des cônes allongés pendants.","conf":["pinus-strobus"]},{"id":"pinus-radiata","lat":"Pinus radiata","fr":"Pin de Monterey","fam":"Pinacées","type":"Conifère persistant","orig":"Californie","lvl":5,"tip":"Aiguilles par 3, vert vif, fines. Cônes asymétriques serrés contre la branche, qui restent fermés des années. Littoral atlantique.","diff":"Le pin maritime a 2 aiguilles par gaine, plus épaisses.","conf":["pinus-pinaster","pinus-nigra"]},{"id":"pinus-strobus","lat":"Pinus strobus","fr":"Pin de Weymouth","fam":"Pinacées","type":"Conifère persistant","orig":"Est de l'Amérique du Nord","lvl":5,"tip":"Aiguilles par 5, fines et douces au toucher, bleu-vert. Longs cônes étroits et pendants, souvent résineux. Écorce lisse sur les jeunes arbres.","diff":"Le pin de l'Himalaya a des aiguilles bien plus longues et pendantes.","conf":["pinus-cembra"]},{"id":"pinus-mugo","lat":"Pinus mugo","fr":"Pin des montagnes","fam":"Pinacées","type":"Conifère persistant","orig":"Montagnes d'Europe","lvl":5,"tip":"Pin rampant ou buissonnant à plusieurs tiges. Aiguilles par 2, courtes, vert sombre, serrées. Très utilisé en rocaille.","diff":"Le pin à crochets est un arbre à tronc unique.","conf":["pinus-sylvestris"]},{"id":"pinus-pinaster","lat":"Pinus pinaster","fr":"Pin maritime","fam":"Pinacées","type":"Conifère persistant","orig":"Ouest de la Méditerranée","lvl":5,"tip":"Aiguilles par 2, très longues (15-25 cm), épaisses et raides. Gros cônes brillants brun-rouge, coniques. Écorce épaisse rouge-brun en plaques. Forêt des Landes.","diff":"Le pin noir a des aiguilles plus courtes et sombres ; le pin parasol a des cônes ronds et une couronne plate.","conf":["pinus-nigra"]},{"id":"pinus-nigra","lat":"Pinus nigra","fr":"Pin noir d'Autriche","fam":"Pinacées","type":"Conifère persistant","orig":"Europe du Sud","lvl":5,"tip":"Aiguilles par 2, longues (8-15 cm), raides et vert très sombre. Écorce grise à noirâtre jusqu'en haut. Cône brillant symétrique. Supporte le calcaire et les embruns.","diff":"Le pin sylvestre a des aiguilles courtes et bleutées et une écorce orangée en haut du tronc.","conf":["pinus-sylvestris"]},{"id":"pinus-ponderosa","lat":"Pinus ponderosa","fr":"Pin ponderosa","fam":"Pinacées","type":"Conifère persistant","orig":"Ouest de l'Amérique du Nord","lvl":5,"tip":"Aiguilles par 3, très longues (15-25 cm), groupées en touffes au bout des rameaux. Écorce orange en grandes plaques à odeur de vanille.","diff":"Le pin maritime a 2 aiguilles par gaine.","conf":["pinus-pinaster","pinus-radiata"]},{"id":"pinus-sylvestris","lat":"Pinus sylvestris","fr":"Pin sylvestre","fam":"Pinacées","type":"Conifère persistant","orig":"Europe, Asie","lvl":5,"tip":"Aiguilles par 2, courtes (4-7 cm), torsadées et bleutées. Le haut du tronc a une écorce orange saumoné, très reconnaissable de loin.","diff":"Le pin noir d'Autriche a des aiguilles plus longues, raides et vert sombre, et une écorce grise jusqu'en haut.","conf":["pinus-nigra"]},{"id":"pinus-contorta","lat":"Pinus contorta","fr":"Pin tordu","fam":"Pinacées","type":"Conifère persistant","orig":"Ouest de l'Amérique du Nord","lvl":5,"tip":"Aiguilles par 2, courtes, souvent tordues, vert-jaune. Petits cônes asymétriques épineux qui restent sur l'arbre.","diff":"Le pin sylvestre a une écorce orangée et des aiguilles bleutées.","conf":["pinus-sylvestris","pinus-mugo"]},{"id":"tsuga-heterophylla","lat":"Tsuga heterophylla","fr":"Pruche de l'Ouest","fam":"Pinacées","type":"Conifère persistant","orig":"Ouest de l'Amérique du Nord","lvl":5,"tip":"Petites aiguilles plates de longueurs inégales sur le même rameau. La flèche retombe gracieusement. Très petits cônes au bout des rameaux.","diff":"Le douglas a des aiguilles égales et des cônes à bractées en fourche.","conf":["tsuga-canadensis"]},{"id":"tsuga-canadensis","lat":"Tsuga canadensis","fr":"Pruche du Canada","fam":"Pinacées","type":"Conifère persistant","orig":"Est de l'Amérique du Nord","lvl":5,"tip":"Aiguilles plates courtes, avec une rangée d'aiguilles retournées sur le dessus du rameau montrant leur revers blanc. Petits cônes.","diff":"La pruche de l'Ouest n'a pas cette rangée d'aiguilles retournées.","conf":["tsuga-heterophylla"]},{"id":"abies-pinsapo","lat":"Abies pinsapo","fr":"Sapin d'Espagne","fam":"Pinacées","type":"Conifère persistant","orig":"Sud de l'Espagne","lvl":5,"tip":"Aiguilles courtes, épaisses et raides, disposées tout autour du rameau comme un goupillon. Bleuté chez certaines formes. Cônes dressés.","diff":"Les autres sapins ont des aiguilles plates en peigne. Le pinsapo a des aiguilles en brosse radiale.","conf":["picea-omorika"]},{"id":"abies-nordmanniana","lat":"Abies nordmanniana","fr":"Sapin de Nordmann","fam":"Pinacées","type":"Conifère persistant","orig":"Caucase","lvl":5,"tip":"Aiguilles plates, vert foncé brillant, denses, couchées vers l'avant sur le dessus du rameau, avec 2 bandes blanches dessous. Bourgeons non résineux. Le sapin de Noël qui ne perd pas ses aiguilles.","diff":"Le sapin pectiné a des aiguilles étalées en peigne de chaque côté ; l'épicéa a des aiguilles piquantes sur coussinets.","conf":["abies-alba","picea-abies"]},{"id":"abies-alba","lat":"Abies alba","fr":"Sapin pectiné","fam":"Pinacées","type":"Conifère persistant","orig":"Montagnes d'Europe","lvl":5,"tip":"Aiguilles plates, souples, échancrées au bout, avec 2 bandes blanches dessous. L'aiguille arrachée laisse une cicatrice ronde et plate. Cônes dressés qui se désagrègent sur l'arbre.","diff":"L'épicéa a des aiguilles piquantes sur un petit coussinet, et des cônes pendants qui tombent entiers. « Le sapin se tient, l'épicéa pend. »","conf":["picea-abies"]},{"id":"thuja-occidentalis","lat":"Thuja occidentalis","fr":"Thuya du Canada","fam":"Cupressacées","type":"Conifère persistant","orig":"Amérique du Nord","lvl":5,"tip":"Rameaux aplatis en éventails, couverts de petites écailles. Petits cônes allongés dressés, qui s'ouvrent comme une tulipe. Odeur fruitée au froissement.","diff":"Le faux-cyprès de Lawson a des cônes ronds et des marques blanches en X sous les rameaux. Le Leyland a des rameaux moins plats et pousse bien plus vite.","conf":["chamaecyparis-lawsoniana"]},{"id":"thuja-plicata","lat":"Thuja plicata","fr":"Thuya géant","fam":"Cupressacées","type":"Conifère persistant","orig":"Ouest de l'Amérique du Nord","lvl":5,"tip":"Rameaux plats luisants à l'odeur fruitée d'ananas. Marques blanchâtres en papillon dessous. Écorce rouge fibreuse. Très grand arbre.","diff":"Le thuya du Canada a un feuillage plus terne et jaunit en hiver.","conf":["thuja-occidentalis","chamaecyparis-lawsoniana"]},{"id":"picea-abies","lat":"Picea abies","fr":"Épicéa commun","fam":"Pinacées","type":"Conifère persistant","orig":"Europe","lvl":5,"tip":"Aiguilles piquantes, à 4 faces, fixées sur un petit coussinet qui rend le rameau rugueux une fois dénudé. Cônes pendants qui tombent entiers. C'est le « sapin de Noël » classique.","diff":"Le sapin a des aiguilles plates, souples et non piquantes, et des cônes dressés.","conf":["abies-alba"]},{"id":"picea-orientalis","lat":"Picea orientalis","fr":"Épicéa d'Orient","fam":"Pinacées","type":"Conifère persistant","orig":"Caucase, Turquie","lvl":5,"tip":"Aiguilles très courtes (moins d'1 cm), émoussées, vert foncé brillant, serrées contre le rameau.","diff":"L'épicéa commun a des aiguilles 2 fois plus longues et pointues.","conf":["picea-abies","abies-nordmanniana"]},{"id":"picea-omorika","lat":"Picea omorika","fr":"Épicéa de Serbie","fam":"Pinacées","type":"Conifère persistant","orig":"Serbie, Bosnie","lvl":5,"tip":"Silhouette en flèche très étroite aux branches pendantes relevées au bout. Aiguilles plates pour un épicéa, avec 2 bandes blanches dessous.","diff":"L'épicéa commun est bien plus large avec des aiguilles vertes à 4 faces.","conf":["picea-abies","abies-alba"]},{"id":"picea-sitchensis","lat":"Picea sitchensis","fr":"Épicéa de Sitka","fam":"Pinacées","type":"Conifère persistant","orig":"Côte pacifique nord-américaine","lvl":5,"tip":"Aiguilles plates, très raides et très piquantes, bleutées dessous. Cônes pendants aux écailles ondulées papyracées. Planté en forêt en Bretagne et dans le Massif central.","diff":"L'épicéa commun a des aiguilles vertes moins piquantes.","conf":["picea-abies","picea-pungens"]},{"id":"picea-pungens","lat":"Picea pungens","fr":"Épicéa du Colorado","fam":"Pinacées","type":"Conifère persistant","orig":"Montagnes Rocheuses","lvl":5,"tip":"Aiguilles raides, très piquantes, à 4 faces, souvent bleu argenté ('Glauca'), sur des coussinets. Cônes pendants.","diff":"Le sapin du Colorado est bleu mais ses aiguilles sont plates et souples.","conf":["picea-abies"]},{"id":"picea-glauca","lat":"Picea glauca","fr":"Épinette blanche","fam":"Pinacées","type":"Conifère persistant","orig":"Canada","lvl":5,"tip":"Aiguilles bleu-vert qui sentent le cassis ou la souris au froissement. Forme naine en cône parfait très répandue ('Conica').","diff":"L'épicéa du Colorado est plus piquant ; la forme 'Conica' est un cône dense vert clair.","conf":["picea-abies","picea-pungens"]},{"id":"artemisia-absinthium","lat":"Artemisia absinthium","fr":"Absinthe","fam":"Astéracées","type":"Sous-arbrisseau","orig":"Europe, Asie","lvl":6,"tip":"Feuilles découpées gris argenté, soyeuses, très amères et aromatiques. Panicules de petites boules jaunes.","diff":"La santoline a des feuilles en petits peignes et des boutons ronds bien visibles.","conf":["santolina-chamaecyparissus"]},{"id":"acanthus-mollis","lat":"Acanthus mollis","fr":"Acanthe","fam":"Acanthacées","type":"Vivace","orig":"Méditerranée","lvl":6,"tip":"Grandes feuilles vert foncé brillant, profondément découpées. Hampes de fleurs blanches et pourpres protégées par des bractées épineuses. Feuille du chapiteau corinthien.","diff":"Le panicaut a des feuilles épineuses bleues et des fleurs en têtes.","conf":["eryngium-planum"]},{"id":"achillea-millefolium","lat":"Achillea millefolium","fr":"Achillée millefeuille","fam":"Astéracées","type":"Vivace","orig":"Hémisphère Nord","lvl":6,"tip":"Feuilles très finement découpées comme une plume, aromatiques. Corymbes plats de petites fleurs blanches ou roses.","diff":"La carotte sauvage a des ombelles et des feuilles moins fines.","conf":["leucanthemum-vulgare"]},{"id":"alchemilla-mollis","lat":"Alchemilla mollis","fr":"Alchémille","fam":"Rosacées","type":"Vivace","orig":"Europe de l'Est, Caucase","lvl":6,"tip":"Feuilles rondes, plissées en éventail, veloutées. Les gouttes d'eau perlent à leur surface. Nuages de petites fleurs vert-jaune en juin.","diff":"L'heuchère a des feuilles lisses et colorées. L'alchémille, elle, a des feuilles veloutées vert tendre.","conf":[]},{"id":"aquilegia-vulgaris","lat":"Aquilegia vulgaris","fr":"Ancolie","fam":"Renonculacées","type":"Vivace","orig":"Europe","lvl":6,"tip":"Feuilles divisées en folioles lobées comme le trèfle, bleutées. Fleurs pendantes bleues, roses ou blanches, munies de 5 éperons recourbés.","diff":"Les éperons en crochet sont uniques.","conf":["geranium-sanguineum"]},{"id":"aster-amellus","lat":"Aster amellus","fr":"Aster amelle","fam":"Astéracées","type":"Vivace","orig":"Europe","lvl":6,"tip":"Marguerites violettes à cœur jaune en fin d'été. Feuilles rugueuses ovales. Coteaux calcaires.","diff":"L'érigéron fleurit au printemps en petites pâquerettes blanches et roses.","conf":["echinacea-purpurea","erigeron-karvinskianus"]},{"id":"bergenia-cordifolia","lat":"Bergenia cordifolia","fr":"Bergénia (plante des savetiers)","fam":"Saxifragacées","type":"Vivace","orig":"Sibérie, Altaï","lvl":6,"tip":"Grandes feuilles rondes, épaisses et luisantes, persistantes, qui rougissent en hiver. Frottées entre les doigts, elles grincent. Fleurs roses en fin d'hiver.","diff":"Le hosta a des feuilles fines aux nervures parallèles, qui disparaissent en hiver.","conf":[]},{"id":"arundo-donax","lat":"Arundo donax","fr":"Canne de Provence","fam":"Poacées","type":"Graminée","orig":"Asie, Méditerranée","lvl":6,"tip":"Énorme roseau de 3 à 5 m aux tiges épaisses comme un bambou mais pleines aux nœuds. Feuilles larges bleutées, alternes sur deux rangs. Plumet en automne.","diff":"Le bambou a des feuilles en éventail au bout de rameaux et des tiges creuses à nœuds marqués.","conf":["cortaderia-selloana"]},{"id":"digitalis-purpurea","lat":"Digitalis purpurea","fr":"Digitale pourpre","fam":"Plantaginacées","type":"Bisannuelle","orig":"Europe de l'Ouest","lvl":6,"tip":"Rosette de feuilles velues la 1re année. La 2e année, hampe de fleurs en doigts de gant pourpres tachetées à l'intérieur. Très toxique.","diff":"La rose trémière a des fleurs ouvertes en coupe.","conf":["alcea-rosea"]},{"id":"euphorbia-characias","lat":"Euphorbia characias","fr":"Euphorbe characias","fam":"Euphorbiacées","type":"Vivace","orig":"Méditerranée","lvl":6,"tip":"Tiges dressées couvertes de feuilles étroites bleu-vert, en goupillon. Grosses inflorescences vert-jaune au printemps. Latex blanc irritant à la coupe.","diff":"Tout latex blanc sur une vivace doit faire penser à une euphorbe. Portez des gants.","conf":[]},{"id":"pteridium-aquilinum","lat":"Pteridium aquilinum","fr":"Fougère aigle","fam":"Dennstaedtiacées","type":"Fougère","orig":"Monde entier","lvl":6,"tip":"Grandes frondes 3 fois divisées, isolées sur une longue tige raide. Forme d'immenses colonies sur sol acide.","diff":"Les autres fougères forment des touffes en couronne.","conf":["dryopteris-filix-mas"]},{"id":"dryopteris-filix-mas","lat":"Dryopteris filix-mas","fr":"Fougère mâle","fam":"Dryoptéridacées","type":"Fougère","orig":"Hémisphère Nord","lvl":6,"tip":"Fougère en entonnoir aux frondes 2 fois divisées, aux pinnules arrondies. Spores en points ronds sous les frondes.","diff":"La fougère aigle a une fronde isolée sur une longue tige ; le polystic a des pinnules pointues.","conf":["polystichum-setiferum","pteridium-aquilinum"]},{"id":"festuca-glauca","lat":"Festuca glauca","fr":"Fétuque bleue","fam":"Poacées","type":"Graminée","orig":"Sud de l'Europe","lvl":6,"tip":"Petit coussin dense de feuilles fines, raides, d'un bleu argenté. Courts épis paille en début d'été.","diff":"L'avoine bleue (Helictotrichon) est bien plus grande, avec des feuilles plus larges et plates.","conf":[]},{"id":"geranium-sanguineum","lat":"Geranium sanguineum","fr":"Géranium sanguin","fam":"Géraniacées","type":"Vivace","orig":"Europe","lvl":6,"tip":"Feuilles découpées en 5 à 7 lanières profondes. Fleurs magenta à 5 pétales. Le fruit pointu ressemble à un bec de grue. Feuillage rouge en automne.","diff":"Le « géranium » des balcons est un Pelargonium : feuilles rondes, épaisses et odorantes, non rustique.","conf":[]},{"id":"helleborus-foetidus","lat":"Helleborus foetidus","fr":"Hellébore fétide","fam":"Renonculacées","type":"Vivace","orig":"Europe de l'Ouest","lvl":6,"tip":"Feuilles découpées en lanières étroites, vert foncé, à odeur désagréable. Clochettes vert pâle bordées de pourpre en hiver.","diff":"L'hellébore d'Orient a des feuilles palmées larges et de grandes fleurs ouvertes.","conf":[]},{"id":"pennisetum-alopecuroides","lat":"Pennisetum alopecuroides","fr":"Herbe aux écouvillons","fam":"Poacées","type":"Graminée","orig":"Asie, Australie","lvl":6,"tip":"Touffe arrondie de feuilles fines. Épis cylindriques duveteux, comme des goupillons à biberon, en fin d'été.","diff":"Le miscanthus porte des plumeaux en éventail, pas des épis en écouvillon.","conf":["miscanthus-sinensis"]},{"id":"cortaderia-selloana","lat":"Cortaderia selloana","fr":"Herbe de la pampa","fam":"Poacées","type":"Graminée","orig":"Amérique du Sud","lvl":6,"tip":"Énorme touffe de feuilles très coupantes, retombantes. Grands plumets denses, blancs ou rosés, sur des tiges de 2 à 3 m. Envahissante sur le littoral atlantique.","diff":"Le miscanthus est plus petit, ses feuilles ne coupent pas et ses plumeaux sont plus lâches.","conf":["miscanthus-sinensis"]},{"id":"humulus-lupulus","lat":"Humulus lupulus","fr":"Houblon","fam":"Cannabacées","type":"Liane vivace","orig":"Europe","lvl":6,"tip":"Liane volubile qui meurt chaque hiver. Feuilles opposées rugueuses à 3-5 lobes. Cônes verts papyracés et parfumés sur les pieds femelles.","diff":"La vigne a des vrilles ; le houblon s'enroule et a des feuilles rêches.","conf":["vitis-vinifera"]},{"id":"hyssopus-officinalis","lat":"Hyssopus officinalis","fr":"Hysope","fam":"Lamiacées","type":"Sous-arbrisseau","orig":"Europe du Sud","lvl":6,"tip":"Sous-arbrisseau aux feuilles étroites opposées, aromatiques. Épis de fleurs bleu-violet tournés d'un même côté.","diff":"La lavande a des feuilles grises et des épis sur de longues tiges nues.","conf":["lavandula-angustifolia","thymus-vulgaris"]},{"id":"hemerocallis-fulva","lat":"Hemerocallis fulva","fr":"Hémérocalle fauve","fam":"Asphodélacées","type":"Vivace","orig":"Asie","lvl":6,"tip":"Feuilles en lanières arquées, pliées en V. Grandes fleurs orange en entonnoir, qui ne durent qu'un jour (d'où le nom anglais « daylily »).","diff":"L'agapanthe a des fleurs bleues regroupées en boule au sommet de la tige.","conf":[]},{"id":"helichrysum-italicum","lat":"Helichrysum italicum","fr":"Immortelle d'Italie","fam":"Astéracées","type":"Sous-arbrisseau","orig":"Méditerranée","lvl":6,"tip":"Feuilles linéaires argentées à l'odeur de curry. Bouquets de petits boutons jaunes secs en été.","diff":"La santoline a des feuilles découpées en peigne.","conf":["santolina-chamaecyparissus","lavandula-angustifolia"]},{"id":"iris-germanica","lat":"Iris germanica","fr":"Iris des jardins","fam":"Iridacées","type":"Vivace","orig":"Méditerranée","lvl":6,"tip":"Rhizomes en surface. Feuilles en éventail plat, en sabre, bleutées. Fleurs à 3 pétales dressés et 3 pétales retombants à barbe.","diff":"L'iris des marais a des fleurs jaunes et pousse dans l'eau.","conf":["iris-pseudacorus"]},{"id":"iris-pseudacorus","lat":"Iris pseudacorus","fr":"Iris des marais","fam":"Iridacées","type":"Vivace","orig":"Europe","lvl":6,"tip":"Iris des bords de l'eau. Feuilles en glaive vert vif. Fleurs jaune vif en mai. Grosses capsules vertes.","diff":"L'iris des jardins pousse au sec avec des fleurs à barbe.","conf":["iris-germanica","typha-latifolia"]},{"id":"lavandula-latifolia","lat":"Lavandula latifolia","fr":"Lavande aspic","fam":"Lamiacées","type":"Sous-arbrisseau","orig":"Ouest de la Méditerranée","lvl":6,"tip":"Lavande aux feuilles plus larges et grises. Tiges longues souvent ramifiées en 3. Odeur camphrée forte. Fleurit en fin d'été.","diff":"La lavande vraie a des feuilles plus étroites et une tige à un seul épi.","conf":["lavandula-angustifolia"]},{"id":"lavandula-angustifolia","lat":"Lavandula angustifolia","fr":"Lavande vraie","fam":"Lamiacées","type":"Sous-arbrisseau","orig":"Méditerranée","lvl":6,"tip":"Feuilles étroites gris-vert. Chaque tige florale porte un seul épi, court et compact. Plante compacte au parfum fin.","diff":"Le lavandin est plus grand, et ses tiges se ramifient en 3 épis. La lavande papillon porte de grandes bractées en oreilles de lapin.","conf":[]},{"id":"carex-pendula","lat":"Carex pendula","fr":"Laîche pendante","fam":"Cypéracées","type":"Vivace","orig":"Europe","lvl":6,"tip":"Grande laîche aux feuilles larges et brillantes. Longs épis pendants, comme des chatons, sur des tiges triangulaires. Lieux humides et ombragés.","diff":"Les graminées ont des tiges rondes et creuses ; les laîches ont des tiges triangulaires.","conf":["molinia-caerulea"]},{"id":"ligularia-dentata","lat":"Ligularia dentata","fr":"Ligulaire","fam":"Astéracées","type":"Vivace","orig":"Chine, Japon","lvl":6,"tip":"Grandes feuilles rondes en cœur, souvent pourpres dessous. Marguerites orange en corymbes en été. Sol humide.","diff":"Le bergénia a des feuilles épaisses persistantes et des fleurs roses.","conf":["bergenia-cordifolia"]},{"id":"leucanthemum-vulgare","lat":"Leucanthemum vulgare","fr":"Marguerite","fam":"Astéracées","type":"Vivace","orig":"Europe","lvl":6,"tip":"Grandes marguerites blanches à cœur jaune sur tiges simples. Feuilles du bas en spatule dentée.","diff":"La pâquerette est bien plus petite, en rosette au ras du sol.","conf":["achillea-millefolium","erigeron-karvinskianus"]},{"id":"typha-latifolia","lat":"Typha latifolia","fr":"Massette","fam":"Typhacées","type":"Vivace","orig":"Hémisphère Nord","lvl":6,"tip":"Plante aquatique aux longues feuilles plates. Épi brun en forme de saucisse veloutée au sommet de la tige.","diff":"L'iris des marais a des fleurs jaunes et des feuilles en éventail.","conf":["iris-pseudacorus"]},{"id":"miscanthus-sinensis","lat":"Miscanthus sinensis","fr":"Miscanthus (roseau de Chine)","fam":"Poacées","type":"Graminée","orig":"Asie de l'Est","lvl":6,"tip":"Grosse touffe de feuilles marquées d'une nervure centrale blanche. En fin d'été, plumeaux soyeux en éventail, argentés ou rosés, qui tiennent l'hiver.","diff":"L'herbe de la pampa est bien plus grande. Ses feuilles sont coupantes et ses plumets denses en épi.","conf":["cortaderia-selloana","pennisetum-alopecuroides"]},{"id":"molinia-caerulea","lat":"Molinia caerulea","fr":"Molinie bleue","fam":"Poacées","type":"Graminée","orig":"Europe","lvl":6,"tip":"Graminée en touffe aux feuilles fines. Tiges florales hautes, raides et nues, avec un épi lâche violacé. Jaune d'or en automne.","diff":"Le calamagrostis a des épis plus serrés et précoces.","conf":[]},{"id":"stachys-byzantina","lat":"Stachys byzantina","fr":"Oreille d'ours","fam":"Lamiacées","type":"Vivace","orig":"Turquie, Caucase","lvl":6,"tip":"Feuilles épaisses couvertes d'un feutre blanc très doux. Tiges carrées. Épis laineux de petites fleurs roses.","diff":"La sauge officinale a des feuilles plus fermes et grisâtres.","conf":["salvia-officinalis"]},{"id":"osmunda-regalis","lat":"Osmunda regalis","fr":"Osmonde royale","fam":"Osmondacées","type":"Fougère","orig":"Europe","lvl":6,"tip":"Grande fougère des zones humides. Frondes 2 fois divisées à pinnules larges. Les frondes fertiles portent au sommet des grappes brunes de spores.","diff":"La fougère plume d'autruche a des frondes fertiles séparées, brunes et raides.","conf":[]},{"id":"eryngium-planum","lat":"Eryngium planum","fr":"Panicaut bleu","fam":"Apiacées","type":"Vivace","orig":"Europe centrale, Asie","lvl":6,"tip":"Petites têtes de fleurs bleu métallique entourées de bractées épineuses étroites. Tiges bleues ramifiées.","diff":"L'échinops a des boules rondes sans collerette.","conf":["echinops-ritro"]},{"id":"polystichum-setiferum","lat":"Polystichum setiferum","fr":"Polystic à soies","fam":"Dryoptéridacées","type":"Fougère","orig":"Europe","lvl":6,"tip":"Fougère persistante aux frondes 2 fois divisées, aux pinnules munies d'une petite pointe sétacée. Pétiole couvert d'écailles brunes.","diff":"La fougère mâle n'a pas de pointes aux pinnules et perd ses frondes.","conf":["dryopteris-filix-mas"]},{"id":"persicaria-amplexicaulis","lat":"Persicaria amplexicaulis","fr":"Renouée amplexicaule","fam":"Polygonacées","type":"Vivace","orig":"Himalaya","lvl":6,"tip":"Grandes feuilles en cœur qui embrassent la tige. Épis fins rouge vif de juillet aux gelées.","diff":"La salicaire a des épis plus longs et des feuilles étroites.","conf":["lythrum-salicaria"]},{"id":"fallopia-japonica","lat":"Fallopia japonica","fr":"Renouée du Japon","fam":"Polygonacées","type":"Vivace","orig":"Japon","lvl":6,"tip":"Tiges creuses à nœuds comme un bambou, tachées de rouge. Grandes feuilles en cœur tronqué. Petites fleurs blanches en grappes. Espèce très envahissante.","diff":"Le bambou garde ses feuilles l'hiver ; la renouée meurt jusqu'au sol.","conf":["fallopia-baldschuanica"]},{"id":"rodgersia-podophylla","lat":"Rodgersia podophylla","fr":"Rodgersia","fam":"Saxifragacées","type":"Vivace","orig":"Japon, Corée","lvl":6,"tip":"Feuilles palmées à 5 folioles dentées au bout, bronze. Panicules de fleurs crème. Lieux frais.","diff":"Le marronnier a des feuilles palmées aussi, mais c'est un arbre.","conf":["aesculus-hippocastanum"]},{"id":"alcea-rosea","lat":"Alcea rosea","fr":"Rose trémière","fam":"Malvacées","type":"Bisannuelle","orig":"Asie occidentale","lvl":6,"tip":"Grandes feuilles rondes rugueuses. Hautes hampes de grandes fleurs en coupe de toutes couleurs le long de la tige.","diff":"La digitale a des fleurs tubulaires pendantes.","conf":["digitalis-purpurea","hibiscus-syriacus"]},{"id":"rudbeckia-fulgida","lat":"Rudbeckia fulgida","fr":"Rudbeckia","fam":"Astéracées","type":"Vivace","orig":"Amérique du Nord","lvl":6,"tip":"Marguerites jaune d'or au cœur noir-brun bombé, de juillet à octobre. Feuilles rugueuses et poilues.","diff":"L'échinacée a des pétales roses et un cœur orange piquant.","conf":["echinacea-purpurea"]},{"id":"ruta-graveolens","lat":"Ruta graveolens","fr":"Rue officinale","fam":"Rutacées","type":"Sous-arbrisseau","orig":"Balkans","lvl":6,"tip":"Feuilles bleu-vert découpées en lobes arrondis, à forte odeur. Petites fleurs jaunes à pétales en cuillère. Le contact au soleil brûle la peau.","diff":"Les bleus de la rue et sa forte odeur la distinguent ; attention aux brûlures.","conf":["santolina-chamaecyparissus"]},{"id":"lythrum-salicaria","lat":"Lythrum salicaria","fr":"Salicaire","fam":"Lythracées","type":"Vivace","orig":"Europe","lvl":6,"tip":"Plante des berges. Tiges carrées, feuilles opposées lancéolées. Longs épis de fleurs rose pourpre en été.","diff":"La salicaire a des tiges dressées en épis bien plus denses que la verveine.","conf":["salvia-nemorosa","verbena-bonariensis"]},{"id":"smilax-aspera","lat":"Smilax aspera","fr":"Salsepareille d'Europe","fam":"Smilacacées","type":"Liane persistante","orig":"Méditerranée","lvl":6,"tip":"Liane épineuse du maquis aux tiges en zigzag. Feuilles en cœur ou en flèche, coriaces, avec des vrilles à la base. Baies rouges en grappes.","diff":"Le lierre n'a pas d'épines ni de vrilles.","conf":["tamus-communis"]},{"id":"santolina-chamaecyparissus","lat":"Santolina chamaecyparissus","fr":"Santoline","fam":"Astéracées","type":"Sous-arbrisseau","orig":"Ouest de la Méditerranée","lvl":6,"tip":"Coussin argenté aux feuilles découpées comme de petits peignes, à odeur forte. Boutons jaunes ronds en juillet.","diff":"L'immortelle a des feuilles étroites entières à odeur de curry.","conf":["helichrysum-italicum","artemisia-absinthium"]},{"id":"phlomis-fruticosa","lat":"Phlomis fruticosa","fr":"Sauge de Jérusalem","fam":"Lamiacées","type":"Arbuste persistant","orig":"Méditerranée orientale","lvl":6,"tip":"Arbuste aux feuilles opposées gris-vert, laineuses. Fleurs jaune vif en casque, en verticilles étagés le long de la tige.","diff":"La sauge officinale a des fleurs bleues.","conf":["salvia-officinalis"]},{"id":"salvia-nemorosa","lat":"Salvia nemorosa","fr":"Sauge des bois","fam":"Lamiacées","type":"Vivace","orig":"Europe centrale, Asie","lvl":6,"tip":"Épis dressés et serrés de fleurs violet profond. Les bractées violettes restent après la fleur. Feuilles ridées et aromatiques. Tige carrée.","diff":"La népéta a des épis plus lâches, bleu pâle, et un port en coussin étalé.","conf":[]},{"id":"salvia-officinalis","lat":"Salvia officinalis","fr":"Sauge officinale","fam":"Lamiacées","type":"Sous-arbrisseau","orig":"Méditerranée","lvl":6,"tip":"Feuilles opposées gris-vert, épaisses, granuleuses, au parfum caractéristique. Tiges carrées. Épis de fleurs bleu-violet en juin.","diff":"La sauge de Jérusalem a des fleurs jaunes et des feuilles plus feutrées.","conf":["phlomis-fruticosa","stachys-byzantina"]},{"id":"asplenium-scolopendrium","lat":"Asplenium scolopendrium","fr":"Scolopendre","fam":"Aspléniacées","type":"Fougère","orig":"Europe","lvl":6,"tip":"Fougère aux frondes entières, en langue, brillantes. Spores en lignes parallèles dessous comme des pattes de mille-pattes.","diff":"Les autres fougères ont des frondes découpées.","conf":["polystichum-setiferum"]},{"id":"tamus-communis","lat":"Tamus communis","fr":"Tamier","fam":"Dioscoréacées","type":"Liane vivace","orig":"Europe","lvl":6,"tip":"Liane volubile sans vrilles. Feuilles en cœur, entières, luisantes. Grappes de baies rouges toxiques en automne.","diff":"La bryone a des feuilles lobées rugueuses et des vrilles.","conf":["smilax-aspera"]},{"id":"thymus-vulgaris","lat":"Thymus vulgaris","fr":"Thym commun","fam":"Lamiacées","type":"Sous-arbrisseau","orig":"Ouest de la Méditerranée","lvl":6,"tip":"Petit sous-arbrisseau en coussin. Minuscules feuilles grises aux bords enroulés, très aromatiques. Fleurs roses ou blanches.","diff":"Le serpolet est rampant et ses feuilles sont plates.","conf":["salvia-rosmarinus","hyssopus-officinalis"]},{"id":"centranthus-ruber","lat":"Centranthus ruber","fr":"Valériane rouge","fam":"Caprifoliacées","type":"Vivace","orig":"Méditerranée","lvl":6,"tip":"Feuilles opposées glauques, charnues. Bouquets de petites fleurs rouges, roses ou blanches à éperon. Pousse dans les vieux murs.","diff":"L'érigéron pousse aussi dans les murs mais ses fleurs sont des pâquerettes.","conf":["erigeron-karvinskianus"]},{"id":"erigeron-karvinskianus","lat":"Erigeron karvinskianus","fr":"Vergerette de Karvinski","fam":"Astéracées","type":"Vivace","orig":"Mexique","lvl":6,"tip":"Coussin de petites pâquerettes blanches qui virent au rose, d'avril aux gelées. Se ressème dans les murets et les fissures.","diff":"La pâquerette pousse en rosette au ras du gazon, avec une seule fleur par tige.","conf":[]},{"id":"verbena-bonariensis","lat":"Verbena bonariensis","fr":"Verveine de Buenos Aires","fam":"Verbénacées","type":"Vivace","orig":"Amérique du Sud","lvl":6,"tip":"Hautes tiges raides et carrées, presque sans feuilles, portant de petits bouquets plats violets. Effet transparent dans les massifs. Se ressème partout.","diff":"La sauge d'Afghanistan a des épis bleu lavande et un feuillage gris argenté.","conf":[]},{"id":"yucca-filamentosa","lat":"Yucca filamentosa","fr":"Yucca filamenteux","fam":"Asparagacées","type":"Arbuste persistant","orig":"Sud-est des États-Unis","lvl":6,"tip":"Rosette sans tronc de feuilles en glaive bordées de fils blancs qui se détachent. Hampe de clochettes blanches en été.","diff":"Le yucca glorieux a un court tronc et des feuilles plus raides sans fils.","conf":[]},{"id":"echinacea-purpurea","lat":"Echinacea purpurea","fr":"Échinacée pourpre","fam":"Astéracées","type":"Vivace","orig":"Amérique du Nord","lvl":6,"tip":"Grandes marguerites rose pourpré aux pétales retombants, autour d'un cœur orangé bombé et piquant au toucher.","diff":"La rudbeckia a des pétales jaunes et un cœur noir. Ses pétales sont moins retombants.","conf":["rudbeckia-fulgida"]},{"id":"echinops-ritro","lat":"Echinops ritro","fr":"Échinops","fam":"Astéracées","type":"Vivace","orig":"Europe du Sud","lvl":6,"tip":"Boules parfaites de fleurs bleu métallique en été. Feuilles découpées et épineuses, blanches dessous.","diff":"Le panicaut a des fleurs entourées d'une collerette de bractées.","conf":["eryngium-planum"]},{"id":"sorbus-aria","lat":"Sorbus aria","fr":"Alisier blanc","fam":"Rosacées","type":"Arbre caduc","orig":"Europe","lvl":7,"tip":"Feuille simple ovale doublement dentée, dont le revers est blanc feutré : l'arbre scintille au vent. Fruits rouges. (Nom récent : Aria edulis.)","diff":"Le sorbier des oiseleurs a des feuilles composées. Le peuplier blanc a des feuilles lobées.","conf":[]},{"id":"sorbus-chamaemespilus","lat":"Sorbus chamaemespilus","fr":"Alisier nain","fam":"Rosacées","type":"Arbuste caduc","orig":"Montagnes d'Europe","lvl":7,"tip":"Petit arbuste de montagne aux feuilles ovales dentées. Fleurs roses en corymbes serrés. Fruits rouges.","diff":"L'alisier blanc est un arbre à revers blanc ; l'alisier nain est bas à fleurs roses.","conf":["sorbus-aria","cotoneaster-integerrimus"]},{"id":"alnus-glutinosa","lat":"Alnus glutinosa","fr":"Aulne glutineux","fam":"Bétulacées","type":"Arbre caduc","orig":"Europe","lvl":7,"tip":"Feuille ronde, souvent tronquée ou échancrée au sommet, collante quand elle est jeune. Petits cônes ligneux noirs (strobiles) qui restent l'hiver. Pousse au bord de l'eau.","diff":"Le noisetier a une feuille pointue et ne porte pas de petits cônes. Les petits cônes noirs signent l'aulne.","conf":["corylus-avellana"]},{"id":"empetrum-nigrum","lat":"Empetrum nigrum","fr":"Camarine noire","fam":"Éricacées","type":"Sous-arbrisseau","orig":"Hémisphère Nord","lvl":7,"tip":"Sous-arbrisseau rampant aux feuilles en aiguilles roulées, comme une bruyère. Petites baies noires luisantes.","diff":"La callune et les bruyères ont des fleurs roses mais pas de baies noires.","conf":["calluna-vulgaris"]},{"id":"lonicera-alpigena","lat":"Lonicera alpigena","fr":"Camérisier des Alpes","fam":"Caprifoliacées","type":"Arbuste caduc","orig":"Montagnes d'Europe","lvl":7,"tip":"Feuilles opposées grandes et luisantes. Fleurs rouge brunâtre par paires. Baies rouges brillantes soudées par deux comme des cerises jumelles.","diff":"Le camérisier à balais a des baies rouges plus petites et des feuilles grises duveteuses.","conf":["lonicera-xylosteum","lonicera-nigra"]},{"id":"lonicera-nigra","lat":"Lonicera nigra","fr":"Camérisier noir","fam":"Caprifoliacées","type":"Arbuste caduc","orig":"Montagnes d'Europe","lvl":7,"tip":"Camérisier des montagnes. Feuilles opposées ovales, glabres. Fleurs roses par paires sur un long pédoncule, puis 2 baies noires soudées à la base.","diff":"Le camérisier à balais a des baies rouges et des feuilles duveteuses.","conf":["lonicera-xylosteum","lonicera-alpigena"]},{"id":"lonicera-etrusca","lat":"Lonicera etrusca","fr":"Chèvrefeuille d'Étrurie","fam":"Caprifoliacées","type":"Liane caduque","orig":"Méditerranée","lvl":7,"tip":"Chèvrefeuille caduc des garrigues. Feuilles du haut soudées autour de la tige. Fleurs crème et rose groupées sur un long pédoncule.","diff":"Le chèvrefeuille des Baléares est persistant à fleurs sans pédoncule.","conf":["lonicera-implexa","lonicera-periclymenum"]},{"id":"lonicera-implexa","lat":"Lonicera implexa","fr":"Chèvrefeuille des Baléares","fam":"Caprifoliacées","type":"Liane persistante","orig":"Méditerranée","lvl":7,"tip":"Chèvrefeuille persistant du Midi. Feuilles du haut soudées en coupe autour de la tige, glauques dessous. Fleurs crème rosé parfumées.","diff":"Le chèvrefeuille d'Étrurie est caduc et ses fleurs sont sur de longs pédoncules.","conf":["lonicera-etrusca","lonicera-periclymenum"]},{"id":"quercus-pubescens","lat":"Quercus pubescens","fr":"Chêne pubescent","fam":"Fagacées","type":"Arbre caduc","orig":"Europe du Sud","lvl":7,"tip":"Feuille plus petite, aux lobes souvent ondulés. Le revers et les jeunes rameaux sont couverts d'un duvet gris doux au toucher. Chêne des coteaux secs et calcaires.","diff":"Passez le doigt sous la feuille : le pubescent est velouté, le sessile presque glabre.","conf":["quercus-robur","quercus-petraea"]},{"id":"quercus-petraea","lat":"Quercus petraea","fr":"Chêne sessile (rouvre)","fam":"Fagacées","type":"Arbre caduc","orig":"Europe","lvl":7,"tip":"Feuille à pétiole bien visible (1-2 cm), lobes réguliers, base en coin sans oreillettes. Glands collés directement au rameau.","diff":"Retenez le croisement : le chêne pédonculé a une feuille sans pétiole et des glands à long pédoncule. Le sessile a l'inverse.","conf":["quercus-robur","quercus-pubescens"]},{"id":"clematis-flammula","lat":"Clematis flammula","fr":"Clématite brûlante","fam":"Renonculacées","type":"Liane persistante","orig":"Méditerranée","lvl":7,"tip":"Clématite du Midi aux feuilles 2 fois divisées en petites folioles étroites. Nuages de fleurs blanches au parfum d'amande en fin d'été. Sève irritante.","diff":"La clématite des haies a des folioles plus grandes, dentées.","conf":["clematis-vitalba"]},{"id":"cornus-alba","lat":"Cornus alba","fr":"Cornouiller blanc","fam":"Cornacées","type":"Arbuste caduc","orig":"Sibérie, Chine","lvl":7,"tip":"Rameaux rouge corail éclatant en hiver. Feuilles opposées aux nervures arquées (fils blancs à la déchirure). Petits fruits blancs bleutés. Formes panachées.","diff":"Le cornouiller sanguin a des rameaux rouge sombre, surtout côté soleil, et des fruits noirs.","conf":["cornus-sanguinea"]},{"id":"cornus-sanguinea","lat":"Cornus sanguinea","fr":"Cornouiller sanguin","fam":"Cornacées","type":"Arbuste caduc","orig":"Europe","lvl":7,"tip":"Feuilles opposées aux nervures arquées qui convergent vers la pointe. Déchirez doucement une feuille : de fins fils blancs la retiennent. Rameaux rouges en hiver.","diff":"Le cornouiller blanc a des rameaux rouge plus vif et des fruits blancs. Le cornouiller sanguin a des fruits noirs.","conf":["cornus-alba","cornus-mas"]},{"id":"cotoneaster-integerrimus","lat":"Cotoneaster integerrimus","fr":"Cotonéaster commun","fam":"Rosacées","type":"Arbuste caduc","orig":"Europe","lvl":7,"tip":"Petit arbuste des rocailles. Petites feuilles ovales, gris feutré dessous. Fleurs rosées, fruits rouges pendants.","diff":"L'amélanchier des bois a des fleurs blanches à pétales étroits et des fruits noirs.","conf":["amelanchier-ovalis","cotoneaster-horizontalis"]},{"id":"euonymus-europaeus","lat":"Euonymus europaeus","fr":"Fusain d'Europe (bonnet d'évêque)","fam":"Célastracées","type":"Arbuste caduc","orig":"Europe","lvl":7,"tip":"Fruits rose vif à 4 lobes qui s'ouvrent sur des graines orange. Jeunes rameaux verts à 4 angles, parfois liégeux. Feuilles opposées finement dentées.","diff":"Le cornouiller sanguin a lui aussi des feuilles opposées, mais à nervures arquées et sans dents.","conf":["cornus-sanguinea"]},{"id":"daphne-gnidium","lat":"Daphne gnidium","fr":"Garou","fam":"Thyméléacées","type":"Arbuste persistant","orig":"Méditerranée","lvl":7,"tip":"Garou de la garrigue : tiges dressées couvertes de feuilles étroites, gris-vert, serrées. Petites fleurs blanches parfumées en fin d'été, baies rouges toxiques.","diff":"Le romarin a des feuilles aromatiques aux bords enroulés.","conf":["salvia-rosmarinus","daphne-laureola"]}];

const SESSION_LEN = 10;
const INTERVALS = [0,1,2,4,8,16,32]; // jours avant révision selon la boîte
const MASTER_BOX = 3;               // boîte à partir de laquelle une plante est « connue »
const UNLOCK = 0.5;                 // part du niveau précédent à connaître pour débloquer

const byId = Object.fromEntries(PLANTS.map(p=>[p.id,p]));
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => {a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0") };
const dayDiff = (a,b) => Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/864e5);

/* ---------- Progression (dans ce navigateur) ---------- */
const KEY = "herbier-vivant-v1";
let S = load();
function load(){
  let s=null; try{ s=JSON.parse(localStorage.getItem(KEY)) }catch(e){}
  return Object.assign({cards:{}, days:{}, streak:0, lastDay:null, best:0, all:false, maxLvl:1}, s||{});
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)) }catch(e){} }
const card = id => S.cards[id] || {box:0, ok:0, ko:0, last:null};
const known = id => card(id).box >= MASTER_BOX;

function levelStats(n){
  const ps = PLANTS.filter(p=>p.lvl===n);
  const k = ps.filter(p=>known(p.id)).length;
  const seen = ps.filter(p=>card(p.id).box>0).length;
  return {total:ps.length, known:k, seen, ratio: ps.length? k/ps.length : 0};
}
function unlocked(n){ return S.all || n <= (S.maxLvl||1) }
function refreshUnlocks(){
  let m = S.maxLvl||1; const before = m;
  while (m < LEVELS.length && levelStats(m).ratio >= UNLOCK) m++;
  S.maxLvl = m; if (m!==before) save();
  return m > before;
}
function isDue(id){
  const c = card(id); if(!c.box || !c.last) return false;
  return dayDiff(c.last, today()) >= INTERVALS[Math.min(c.box, INTERVALS.length-1)];
}
function displayStreak(){
  let n = S.streak;
  if (S.lastDay && dayDiff(S.lastDay, today()) > 1) n = 0;
  $("#streakN").textContent = n;
}

/* ---------- Construction d'une séance ---------- */
function buildSession(level){
  const pool = PLANTS.filter(p => level ? p.lvl===level : unlocked(p.lvl));
  let picks = [];
  if (level){
    const due = shuffle(pool.filter(p=>isDue(p.id)));
    const fresh = pool.filter(p=>!card(p.id).box);
    const weak = shuffle(pool.filter(p=>card(p.id).box>0 && !known(p.id)));
    picks = [...due, ...fresh.slice(0,5), ...weak, ...shuffle(pool)];
  } else {
    const due = shuffle(pool.filter(p=>isDue(p.id))).sort((a,b)=>card(a.id).box-card(b.id).box);
    // nouvelles plantes : dans l'ordre, des plus communes aux plus difficiles
    const fresh = pool.filter(p=>!card(p.id).box).sort((a,b)=>a.lvl-b.lvl);
    const nNew = Math.max(3, SESSION_LEN - Math.min(due.length, 7));
    const weak = shuffle(pool.filter(p=>card(p.id).box>0 && !known(p.id)));
    picks = [...due.slice(0,7), ...fresh.slice(0,nNew), ...weak, ...shuffle(pool)];
  }
  const seen = new Set(); const out=[];
  for(const p of picks){ if(!seen.has(p.id)){ seen.add(p.id); out.push(p) } if(out.length===SESSION_LEN) break }
  return shuffle(out).map(p => makeQuestion(p));
}
function makeQuestion(p){
  const latinChance = p.lvl>=4 ? .6 : p.lvl>=2 ? .4 : .25;
  const mode = Math.random() < latinChance ? "lat" : "fr";
  const nChoices = p.lvl>=4 ? 6 : 4;
  const others = [];
  const add = q => { if(q && q.id!==p.id && !others.includes(q) && q[mode]!==p[mode]) others.push(q) };
  shuffle(p.conf).forEach(id=>add(byId[id]));
  shuffle(PLANTS.filter(q=>q.type===p.type && Math.abs(q.lvl-p.lvl)<=2)).forEach(add);
  shuffle(PLANTS.filter(q=>q.lvl===p.lvl)).forEach(add);
  shuffle(PLANTS).forEach(add);
  const choices = shuffle([p, ...others.slice(0,nChoices-1)]);
  return {p, mode, choices, answered:null};
}

/* ---------- Images ----------
   4 photos par plante (Pl@ntNet, licences Creative Commons) : feuille, fruit, écorce, port. */
const SLOTS = [["leaf","Feuille"],["fruit","Fruit"],["bark","Écorce"],["habit","Port"]];
function slotLabel(p, slot){
  const m = (IMAGES[p.id]||{})[slot] || {};
  const organ = m.organ || slot;
  const woody = /^(Arbre|Arbuste|Conifère|Liane|Palmier)/.test(p.type);
  return {leaf:"Feuille", flower:"Fleur", fruit:"Fruit", bark: woody?"Écorce":"Tige", twig: woody?"Rameau":"Tige", spores:"Spores", habit:"Port"}[organ] || "Photo";
}
function photos(p){ return SLOTS.map(([k])=>({slot:k, label:slotLabel(p,k), ...((IMAGES[p.id]||{})[k]||{})})).filter(x=>x.file) }
function thumb(p){ const m=(IMAGES[p.id]||{}); const f=(m.leaf||m.habit||m.fruit||m.bark||{}).file; return f ? `<img src="${esc(f)}" alt="" loading="lazy">` : `<img alt="">` }
function creditHTML(m){
  if(!m) return "";
  return `Photo : ${esc(m.by||"Pl@ntNet")} · ${esc(m.lic||"")}${m.src?` · <a href="${esc(m.src)}" target="_blank" rel="noopener">Pl@ntNet</a>`:""}`;
}
function gallery(p, hide){
  const ph = photos(p);
  if (!ph.length) return `<div class="photo noimg">Photos indisponibles pour cette plante.</div>`;
  return `<div class="g4" data-pid="${p.id}">${ph.map((m,i)=>`<button class="g4-cell" type="button" data-gal="${p.id}" data-i="${i}" data-hide="${hide?1:0}" aria-label="Agrandir : ${esc(m.label)}">
    <img src="${esc(m.file)}" alt="${esc(hide?m.label+" du végétal à identifier":m.label+" de "+p.fr)}" loading="${hide?"eager":"lazy"}">
    <span class="g4-tag">${esc(m.label)}</span></button>`).join("")}</div>`;
}
/* Visionneuse plein écran : glisser ou flèches pour passer d'une photo à l'autre */
let viewer = null;
function openViewer(p, i, hide){
  const ph = photos(p); if(!ph.length) return;
  viewer = {p, ph, i, hide};
  modal.className = "zoomd";
  drawViewer();
  if(!modal.open) modal.showModal();
}
function drawViewer(){
  const {p, ph, i, hide} = viewer; const m = ph[i];
  modal.innerHTML = `<button class="close" type="button" aria-label="Fermer">✕</button>
    <div class="vw"><img src="${esc(m.file)}" alt="${esc(m.label)}">
      <button class="vw-nav vw-prev" type="button" aria-label="Photo précédente">‹</button>
      <button class="vw-nav vw-next" type="button" aria-label="Photo suivante">›</button></div>
    <div class="vw-bar"><div class="vw-tabs">${ph.map((x,j)=>`<button type="button" class="vw-tab" data-j="${j}" aria-current="${j===i}">${esc(x.label)}</button>`).join("")}</div>
      <div class="vw-credit">${hide?"":`<b>${esc(p.fr)}</b> · `}${creditHTML(m)}</div></div>`;
  modal.querySelector(".close").onclick=()=>modal.close();
  modal.querySelector(".vw-prev").onclick=()=>step(-1);
  modal.querySelector(".vw-next").onclick=()=>step(1);
  modal.querySelectorAll(".vw-tab").forEach(b=>b.onclick=()=>{ viewer.i=+b.dataset.j; drawViewer() });
  let x0=null; const im=modal.querySelector(".vw");
  im.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});
  im.addEventListener("touchend",e=>{ if(x0==null) return; const dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>40) step(dx<0?1:-1); x0=null });
}
function step(d){ if(!viewer) return; viewer.i=(viewer.i+d+viewer.ph.length)%viewer.ph.length; drawViewer() }
document.addEventListener("click", e=>{ const g=e.target.closest("[data-gal]"); if(g){ e.preventDefault(); openViewer(byId[g.dataset.gal], +g.dataset.i, g.dataset.hide==="1") } });
document.addEventListener("keydown", e=>{ if(modal.open && viewer && modal.classList.contains("zoomd")){ if(e.key==="ArrowRight") step(1); if(e.key==="ArrowLeft") step(-1) } });

  const v = (location.hash||"#accueil").slice(1);

  else ({accueil:renderHome, niveaux:renderLevels, herbier:renderHerbier, partager:renderShare})[view]();
  window.scrollTo(0,0);
}

    <div class="card pad small" id="offline" hidden style="display:flex;flex-direction:column;gap:8px">
      <b>Hors connexion</b>
      <span class="muted">Les photos vues une fois restent sur le téléphone. Pour réviser sur un chantier sans réseau, téléchargez d'avance celles des niveaux ouverts.</span>
      <button class="btn btn-ghost" id="dl" type="button">Télécharger les photos des niveaux ouverts</button>
    </div>
    <label class="card pad row small" style="align-items:center;cursor:pointer">
      <input type="checkbox" id="all" ${S.all?"checked":""}> <span>Tout débloquer (pour les paysagistes déjà expérimentés)</span>
    </label>
  </section>`;
  app.querySelectorAll(".lvl").forEach(b=>b.onclick=()=>startSession(+b.dataset.l));
  $("#all").onchange = e => { S.all = e.target.checked; save(); renderLevels() };
  const sw = navigator.serviceWorker && navigator.serviceWorker.controller;
  if (sw){
    const files = PLANTS.filter(p=>unlocked(p.lvl)).flatMap(p=>photos(p).map(m=>m.file));
    $("#offline").hidden = false;
    $("#dl").textContent = `Télécharger les photos des niveaux ouverts (${files.length} photos, environ ${Math.round(files.length*0.13)} Mo)`;
    $("#dl").onclick = ()=>{ sw.postMessage({type:"precache", files}); toast("Téléchargement lancé : gardez l'appli ouverte quelques minutes") };
  }
}

function renderHerbier(){
  app.innerHTML = `<section class="view">
    <div><div class="eyebrow">Catalogue</div><h1 style="font-size:1.8rem">L'herbier</h1>
    <p class="muted" style="margin:6px 0 0">Les ${PLANTS.length} végétaux du parcours. Touchez une fiche pour l'étudier.</p></div>
    <div class="search">
      <input id="q" type="search" placeholder="Chercher un nom français ou latin…" aria-label="Chercher">
      <select id="fl" aria-label="Filtrer par niveau"><option value="">Tous les niveaux</option>${LEVELS.map(l=>`<option value="${l.n}">${l.n}. ${esc(l.name)}</option>`).join("")}</select>
    </div>
    <p class="small muted" style="margin:0"><span class="dot"></span>pas encore vu <span class="dot m1" style="margin-left:10px"></span>en cours <span class="dot m2" style="margin-left:10px"></span>connu</p>
    <div class="grid" id="grid"></div>
  </section>`;
  const draw = ()=>{
    const q = $("#q").value.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
    const l = $("#fl").value;
    const list = PLANTS.filter(p=>(!l||p.lvl==l) && (!q || (p.fr+" "+p.lat+" "+p.fam).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").includes(q)));
    $("#grid").innerHTML = list.map(p=>{const c=card(p.id); const cls = c.box>=MASTER_BOX?"m2":c.box>0?"m1":"";
      return `<button class="mini" data-id="${p.id}" type="button">${thumb(p)}
      <span><b><i class="dot ${cls}"></i>${esc(p.fr)}</b><em>${esc(p.lat)}</em></span></button>`}).join("") || `<p class="muted">Aucun végétal ne correspond.</p>`;
    $("#grid").querySelectorAll(".mini").forEach(b=>b.onclick=()=>openSheet(byId[b.dataset.id]));
  };
  $("#q").oninput = draw; $("#fl").onchange = draw; draw();
}

  const url = shareLink();
  const msg = `Je m'entraîne chaque jour à reconnaître les végétaux avec Herbier Vivant (photos, noms latins, astuces de pro). Viens t'entraîner aussi : ${url}`;
  app.innerHTML = `<section class="view">
    <div><div class="eyebrow">Entre amis</div><h1 style="font-size:1.8rem">Partager l'application</h1>
    <p class="muted" style="margin:6px 0 0">Envoyez ce lien à vos amis et collègues. Chacun suit sa propre progression, enregistrée sur son téléphone ou son ordinateur.</p></div>
    <div class="card pad" style="display:flex;flex-direction:column;gap:12px">
      <div class="eyebrow">Lien de l'application</div>
      <div class="share-url" id="url">${esc(url)}</div>
      <div class="row"><button class="btn btn-main" id="cp1" type="button">Copier le lien</button><button class="btn btn-ghost" id="cp2" type="button">Copier un message d'invitation</button></div>
    </div>
    <div class="card pad" style="display:flex;flex-direction:column;gap:10px">
      <div class="eyebrow">Défiez-les</div>
      <p style="margin:0">Partagez votre score : <b>${PLANTS.filter(p=>known(p.id)).length}</b> végétaux connus sur ${PLANTS.length}, série de <b>${S.lastDay && dayDiff(S.lastDay,today())<=1 ? S.streak : 0}</b> jour(s).</p>
      <div class="row"><button class="btn btn-ghost" id="cp3" type="button">Copier mon score</button></div>
    </div>
    <div class="card pad small muted">
      Votre progression reste dans ce navigateur. Si vous videz les données du navigateur ou changez d'appareil, elle repart de zéro.
      <div class="row" style="margin-top:10px"><button class="btn btn-ghost" id="reset" type="button">Remettre ma progression à zéro</button></div>
      <div id="resetc" hidden style="margin-top:10px"><p style="margin:0 0 8px;color:var(--ko)">Toute votre progression sera effacée. Confirmer ?</p>
      <div class="row"><button class="btn btn-ghost" id="resetyes" type="button" style="color:var(--ko)">Oui, tout effacer</button><button class="btn btn-ghost" id="resetno" type="button">Annuler</button></div></div>
    </div>
  </section>`;
  const copy = (txt, ok) => {
