aisses, luisantes, ponctuées de brun dessous. Clochettes roses, baies rouges.","diff":"Le raisin d'ours a des feuilles plus étroites sans points dessous et un port rampant.","conf":["arctostaphylos-uva-ursi","vaccinium-myrtillus"]},{"id":"amelanchier-ovalis","lat":"Amelanchier ovalis","fr":"Amélanchier des bois","fam":"Rosacées","type":"Arbuste caduc","orig":"Europe du Sud","lvl":3,"tip":"Arbuste des rocailles calcaires. Feuilles ovales dentées, feutrées de blanc dessous quand elles sont jeunes. Fleurs blanches aux pétales étroits en avril. Baies bleu-noir.","diff":"L'amélanchier de Lamarck est plus grand avec de jeunes feuilles cuivrées et glabres.","conf":["amelanchier-lamarckii","cotoneaster-integerrimus"]},{"id":"pieris-japonica","lat":"Pieris japonica","fr":"Andromède du Japon (piéris)","fam":"Éricacées","type":"Arbuste persistant","orig":"Japon","lvl":3,"tip":"Feuilles étroites serrées en rosettes au bout des rameaux. Jeunes pousses rouge vif ou bronze. Grappes pendantes de clochettes blanches comme du muguet, au printemps. Terre de bruyère.","diff":"Le photinia a aussi des pousses rouges, mais des feuilles plus grandes, réparties le long des tiges, et des fleurs en corymbes plats.","conf":["photinia-fraseri"]},{"id":"calycanthus-floridus","lat":"Calycanthus floridus","fr":"Arbre aux anémones","fam":"Calycanthacées","type":"Arbuste caduc","orig":"Sud-est des États-Unis","lvl":3,"tip":"Feuilles opposées ovales, aromatiques. Fleurs brun-rouge à nombreux pétales charnus, au parfum de fraise et de fruits. Fruits en urne.","diff":"Le chimonanthe fleurit en hiver avec des fleurs jaune pâle.","conf":[]},{"id":"buddleja-alternifolia","lat":"Buddleja alternifolia","fr":"Arbre aux papillons à feuilles alternes","fam":"Scrophulariacées","type":"Arbuste caduc","orig":"Chine","lvl":3,"tip":"Le seul buddleja à feuilles alternes. Longs rameaux pleureurs couverts de petits bouquets mauves sur le bois de l'année précédente en juin. Feuilles étroites gris-vert.","diff":"L'arbre aux papillons classique a des feuilles opposées et des panicules au bout des tiges en été.","conf":["buddleja-davidii"]},{"id":"hippophae-rhamnoides","lat":"Hippophae rhamnoides","fr":"Argousier","fam":"Élaéagnacées","type":"Arbuste caduc","orig":"Europe, Asie","lvl":3,"tip":"Arbuste épineux aux feuilles étroites argentées. En automne, les rameaux des pieds femelles sont couverts de petites baies orange vif serrées.","diff":"L'olivier de Bohême a des fruits jaunâtres et des feuilles plus larges.","conf":["elaeagnus-angustifolia","tamarix-gallica"]},{"id":"aronia-melanocarpa","lat":"Aronia melanocarpa","fr":"Aronia noir","fam":"Rosacées","type":"Arbuste caduc","orig":"Est de l'Amérique du Nord","lvl":3,"tip":"Feuilles ovales luisantes avec de petites glandes noires sur la nervure principale, rouge vif en automne. Corymbes blancs, puis baies noires luisantes astringentes.","diff":"L'aronia rouge a des feuilles feutrées dessous et des fruits rouges.","conf":["amelanchier-lamarckii"]},{"id":"colutea-arborescens","lat":"Colutea arborescens","fr":"Baguenaudier","fam":"Fabacées","type":"Arbuste caduc","orig":"Europe du Sud","lvl":3,"tip":"Feuilles composées de 7 à 13 folioles arrondies. Fleurs jaunes en papillon, puis gousses gonflées translucides qui éclatent quand on les presse.","diff":"Le robinier a de nombreuses folioles mais ses gousses sont plates.","conf":["robinia-pseudoacacia"]},{"id":"daphne-mezereum","lat":"Daphne mezereum","fr":"Bois-joli","fam":"Thyméléacées","type":"Arbuste caduc","orig":"Europe","lvl":3,"tip":"Petit arbuste. Fleurs rose vif très parfumées collées sur le bois nu en février-mars, avant les feuilles. Baies rouges très toxiques.","diff":"Le daphné lauréole est persistant, à fleurs vertes et baies noires.","conf":["daphne-laureola"]},{"id":"frangula-alnus","lat":"Frangula alnus","fr":"Bourdaine","fam":"Rhamnacées","type":"Arbuste caduc","orig":"Europe","lvl":3,"tip":"Feuilles alternes ovales au bord entier, aux nervures parallèles arquées. Écorce brune ponctuée de lenticelles blanches allongées. Fruits rouges puis noirs, toutes couleurs ensemble. Pas d'épines.","diff":"Le nerprun purgatif a des feuilles dentées, des rameaux terminés en épine et des feuilles presque opposées.","conf":["rhamnus-cathartica","cornus-sanguinea"]},{"id":"erica-arborea","lat":"Erica arborea","fr":"Bruyère arborescente","fam":"Éricacées","type":"Arbuste persistant","orig":"Méditerranée","lvl":3,"tip":"Grande bruyère du maquis pouvant faire 3 m. Rameaux duveteux blancs. Nuées de petites clochettes blanches au parfum de miel au printemps. Sa souche sert à faire les pipes.","diff":"La bruyère multiflore fleurit en rose en automne.","conf":["erica-multiflora","calluna-vulgaris"]},{"id":"erica-carnea","lat":"Erica carnea","fr":"Bruyère des neiges","fam":"Éricacées","type":"Sous-arbrisseau","orig":"Alpes","lvl":3,"tip":"Petite bruyère tapissante qui fleurit de décembre à avril en clochettes roses ou blanches. Supporte le calcaire.","diff":"La bruyère cendrée fleurit en été en sol acide.","conf":["calluna-vulgaris"]},{"id":"pyracantha-coccinea","lat":"Pyracantha coccinea","fr":"Buisson ardent","fam":"Rosacées","type":"Arbuste persistant","orig":"Sud de l'Europe","lvl":3,"tip":"Rameaux très épineux. Petites feuilles finement crénelées. En automne, masses de fruits rouges, orange ou jaunes.","diff":"Les cotonéasters ont des fruits semblables, mais ils n'ont jamais d'épines.","conf":["cotoneaster-horizontalis","crataegus-monogyna"]},{"id":"calluna-vulgaris","lat":"Calluna vulgaris","fr":"Callune","fam":"Éricacées","type":"Sous-arbrisseau","orig":"Europe","lvl":3,"tip":"Petit sous-arbrisseau aux minuscules feuilles en écailles serrées sur 4 rangs. Épis de petites fleurs rose mauve en fin d'été.","diff":"Les bruyères (Erica) ont des feuilles en aiguilles verticillées et des fleurs en clochettes ou en urnes.","conf":["erica-carnea"]},{"id":"lonicera-xylosteum","lat":"Lonicera xylosteum","fr":"Camérisier à balais","fam":"Caprifoliacées","type":"Arbuste caduc","orig":"Europe","lvl":3,"tip":"Arbuste des haies. Feuilles opposées ovales, duveteuses, grises. Fleurs blanc-jaune par paires, puis baies rouges soudées par 2 à la base. Rameaux creux.","diff":"Le camérisier noir a des baies noires ; la viorne obier a des feuilles lobées.","conf":["lonicera-nigra","lonicera-alpigena"]},{"id":"caragana-arborescens","lat":"Caragana arborescens","fr":"Caraganier de Sibérie","fam":"Fabacées","type":"Arbuste caduc","orig":"Sibérie","lvl":3,"tip":"Arbuste aux feuilles composées de 8 à 12 folioles, sans foliole terminale. Stipules épineuses. Fleurs jaunes en papillon, gousses cylindriques.","diff":"Le baguenaudier a une foliole terminale et des gousses gonflées.","conf":["colutea-arborescens","laburnum-anagyroides"]},{"id":"elaeagnus-umbellata","lat":"Elaeagnus umbellata","fr":"Chalef en ombelle","fam":"Élaéagnacées","type":"Arbuste caduc","orig":"Asie de l'Est","lvl":3,"tip":"Arbuste caduc aux feuilles vertes dessus, argentées dessous, parfois épineux. Fleurs crème très parfumées. Petits fruits rouges ponctués d'argent.","diff":"L'argousier a des fruits orange serrés et des feuilles très étroites.","conf":["hippophae-rhamnoides","elaeagnus-angustifolia"]},{"id":"elaeagnus-pungens","lat":"Elaeagnus pungens","fr":"Chalef piquant","fam":"Élaéagnacées","type":"Arbuste persistant","orig":"Japon, Chine","lvl":3,"tip":"Persistant aux rameaux épineux couverts d'écailles brunes. Feuilles ondulées, revers argenté ponctué de brun. Souvent panaché de jaune ('Maculata'). Fleurs parfumées en automne.","diff":"Le chalef d'Ebbinge n'a pas d'épines et ses feuilles sont plates.","conf":["elaeagnus-submacrophylla","olea-europaea"]},{"id":"clethra-alnifolia","lat":"Clethra alnifolia","fr":"Clèthre à feuilles d'aulne","fam":"Clethracées","type":"Arbuste caduc","orig":"Est des États-Unis","lvl":3,"tip":"Feuilles alternes obovales dentées comme l'aulne. Épis dressés de petites fleurs blanches ou roses très parfumées en août. Capsules sèches en épis.","diff":"L'itéa a des épis retombants et un feuillage rouge vif en automne.","conf":["itea-virginica","alnus-glutinosa"]},{"id":"cornus-controversa","lat":"Cornus controversa","fr":"Cornouiller des pagodes","fam":"Cornacées","type":"Arbre caduc","orig":"Asie de l'Est","lvl":3,"tip":"Branches étagées en plateaux horizontaux. Feuilles alternes à nervures arquées, regroupées au bout des rameaux. Corymbes blancs, puis fruits noirs sur pédoncules rouges.","diff":"Les autres cornouillers ont des feuilles opposées, sauf le cornouiller à feuilles alternes américain, plus petit.","conf":["cornus-alternifolia","viburnum-plicatum"]},{"id":"cornus-alternifolia","lat":"Cornus alternifolia","fr":"Cornouiller à feuilles alternes","fam":"Cornacées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":3,"tip":"Petit arbre étagé aux feuilles alternes à nervures arquées. Petits corymbes blancs, fruits bleu-noir sur pédoncules rouges.","diff":"Le cornouiller des pagodes est plus grand et vigoureux, aux feuilles plus grandes.","conf":["cornus-controversa"]},{"id":"cotoneaster-bullatus","lat":"Cotoneaster bullatus","fr":"Cotonéaster bullé","fam":"Rosacées","type":"Arbuste caduc","orig":"Chine","lvl":3,"tip":"Feuilles grandes, ovales, cloquées (bullées) entre les nervures, rouge vif en automne. Fruits rouge brillant en grappes.","diff":"Le cotonéaster laiteux est persistant à feuilles plus lisses.","conf":["cotoneaster-lacteus","cotoneaster-divaricatus"]},{"id":"cotoneaster-dammeri","lat":"Cotoneaster dammeri","fr":"Cotonéaster de Dammer","fam":"Rosacées","type":"Arbuste persistant","orig":"Chine","lvl":3,"tip":"Couvre-sol rampant qui s'enracine. Petites feuilles persistantes ovales, luisantes. Fleurs blanches isolées, puis fruits rouges.","diff":"Le cotonéaster horizontal a des rameaux en arêtes de poisson et perd ses feuilles.","conf":["cotoneaster-horizontalis","cotoneaster-salicifolius"]},{"id":"cotoneaster-franchetii","lat":"Cotoneaster franchetii","fr":"Cotonéaster de Franchet","fam":"Rosacées","type":"Arbuste semi-persistant","orig":"Chine","lvl":3,"tip":"Rameaux arqués. Petites feuilles ovales, gris-vert dessus, feutrées de blanc dessous. Fruits orange-rouge ovales en automne.","diff":"Le cotonéaster laiteux a des feuilles plus grandes et coriaces aux nervures creusées.","conf":["cotoneaster-lacteus","cotoneaster-salicifolius"]},{"id":"cotoneaster-divaricatus","lat":"Cotoneaster divaricatus","fr":"Cotonéaster divariqué","fam":"Rosacées","type":"Arbuste caduc","orig":"Chine","lvl":3,"tip":"Rameaux étalés en éventail. Petites feuilles ovales luisantes, rouge vif en automne. Fruits ovales rouges.","diff":"Le cotonéaster horizontal a des rameaux en arêtes de poisson plaqués au sol.","conf":["cotoneaster-horizontalis","cotoneaster-bullatus"]},{"id":"cotoneaster-lacteus","lat":"Cotoneaster lacteus","fr":"Cotonéaster laiteux","fam":"Rosacées","type":"Arbuste persistant","orig":"Chine","lvl":3,"tip":"Grand cotonéaster persistant. Feuilles ovales, coriaces, aux nervures profondément creusées, feutrées dessous. Corymbes de fleurs blanc laiteux, puis grappes de fruits rouges tout l'hiver.","diff":"Le buisson ardent a des épines ; les cotonéasters n'en ont jamais.","conf":["cotoneaster-franchetii","pyracantha-coccinea"]},{"id":"cotoneaster-salicifolius","lat":"Cotoneaster salicifolius","fr":"Cotonéaster à feuilles de saule","fam":"Rosacées","type":"Arbuste persistant","orig":"Chine","lvl":3,"tip":"Feuilles persistantes longues et étroites comme du saule, ridées. Rameaux souples. Grappes de petits fruits rouges.","diff":"Le cotonéaster de Franchet a des feuilles bien plus petites et ovales.","conf":["cotoneaster-franchetii","cotoneaster-dammeri"]},{"id":"celastrus-orbiculatus","lat":"Celastrus orbiculatus","fr":"Célastre","fam":"Célastracées","type":"Liane caduque","orig":"Asie de l'Est","lvl":3,"tip":"Liane volubile aux feuilles rondes finement dentées. En automne, capsules jaunes qui s'ouvrent sur des graines rouge vif.","diff":"Le fusain a des capsules roses ou rouges ; le célastre est une liane.","conf":["euonymus-europaeus"]},{"id":"daphne-laureola","lat":"Daphne laureola","fr":"Daphné lauréole","fam":"Thyméléacées","type":"Arbuste persistant","orig":"Europe","lvl":3,"tip":"Petit arbuste persistant de sous-bois. Feuilles luisantes groupées en rosette au sommet des tiges. Petites fleurs vert-jaune sous les feuilles en hiver. Baies noires toxiques.","diff":"Le bois-joli perd ses feuilles et fleurit en rose.","conf":["daphne-mezereum","ruscus-aculeatus"]},{"id":"edgeworthia-chrysantha","lat":"Edgeworthia chrysantha","fr":"Edgeworthia (buisson à papier)","fam":"Thyméléacées","type":"Arbuste caduc","orig":"Chine","lvl":3,"tip":"Rameaux souples à écorce très fibreuse (servant à faire du papier). En hiver, boules pendantes de fleurs jaunes duveteuses parfumées au bout des rameaux nus.","diff":"Le daphné bois-joli a des fleurs roses collées le long du rameau.","conf":["daphne-mezereum"]},{"id":"amorpha-fruticosa","lat":"Amorpha fruticosa","fr":"Faux indigo","fam":"Fabacées","type":"Arbuste caduc","orig":"Amérique du Nord","lvl":3,"tip":"Feuilles composées de nombreuses folioles ponctuées de glandes, aromatiques. Épis dressés de petites fleurs violet foncé à étamines orange. Envahissant au bord des rivières.","diff":"Le robinier a des grappes blanches pendantes ; l'amorpha a des épis dressés violets.","conf":["robinia-pseudoacacia"]},{"id":"ruscus-aculeatus","lat":"Ruscus aculeatus","fr":"Fragon (petit houx)","fam":"Asparagacées","type":"Arbuste persistant","orig":"Europe","lvl":3,"tip":"Ce que l'on prend pour des feuilles sont des rameaux aplatis (cladodes) raides et piquants. Petites fleurs puis grosses baies rouges posées au milieu de ces cladodes.","diff":"Le houx a de vraies feuilles épineuses ondulées et des baies en bouquets.","conf":["ilex-aquifolium","daphne-laureola"]},{"id":"euonymus-alatus","lat":"Euonymus alatus","fr":"Fusain ailé","fam":"Célastracées","type":"Arbuste caduc","orig":"Asie de l'Est","lvl":3,"tip":"Rameaux portant 2 à 4 ailes de liège aplaties. Feuilles opposées qui virent au rouge carmin éclatant en automne. Fruits rouge-pourpre à graines orange.","diff":"Le fusain d'Europe a des rameaux verts quadrangulaires sans ailes larges et des fruits roses.","conf":["euonymus-europaeus"]},{"id":"euonymus-fortunei","lat":"Euonymus fortunei","fr":"Fusain de Fortune","fam":"Célastracées","type":"Arbuste persistant","orig":"Chine, Japon","lvl":3,"tip":"Couvre-sol ou grimpant à racines-crampons. Petites feuilles opposées ovales, dentées, souvent panachées de blanc ou de jaune, rosées en hiver.","diff":"Le fusain du Japon est un arbuste dressé à grandes feuilles. Le lierre a des feuilles alternes lobées.","conf":["euonymus-japonicus","hedera-helix"]},{"id":"euonymus-latifolius","lat":"Euonymus latifolius","fr":"Fusain à larges feuilles","fam":"Célastracées","type":"Arbuste caduc","orig":"Europe centrale et du Sud","lvl":3,"tip":"Fusain aux grandes feuilles et aux longs bourgeons pointus. Gros fruits rouges pendants à 4-5 ailes, qui s'ouvrent sur des graines orange.","diff":"Le fusain d'Europe a des fruits roses à lobes arrondis et des bourgeons courts.","conf":["euonymus-europaeus"]},{"id":"vinca-major","lat":"Vinca major","fr":"Grande pervenche","fam":"Apocynacées","type":"Sous-arbrisseau","orig":"Europe du Sud","lvl":3,"tip":"Grandes feuilles opposées ovales, ciliées au bord. Grandes fleurs bleu-violet à 5 pétales en hélice. Tiges arquées qui s'enracinent au bout.","diff":"La petite pervenche a des feuilles plus petites, étroites, glabres, et des fleurs plus petites.","conf":["vinca-minor"]},{"id":"itea-virginica","lat":"Itea virginica","fr":"Itéa de Virginie","fam":"Iteacées","type":"Arbuste caduc","orig":"Est des États-Unis","lvl":3,"tip":"Feuilles alternes ovales finement dentées, rouge pourpre très tard en automne. Épis retombants de petites fleurs blanches parfumées en juin.","diff":"La clèthre a des épis dressés.","conf":["clethra-alnifolia"]},{"id":"lindera-benzoin","lat":"Lindera benzoin","fr":"Laurier benjoin","fam":"Lauracées","type":"Arbuste caduc","orig":"Est de l'Amérique du Nord","lvl":3,"tip":"Feuilles ovales entières qui sentent l'épice froissées, jaune d'or en automne. Petites fleurs jaunes en boules sur bois nu en mars. Baies rouges.","diff":"Le cornouiller mâle a des feuilles opposées ; le laurier benjoin a des feuilles alternes aromatiques.","conf":["cornus-mas"]},{"id":"prunus-laurocerasus","lat":"Prunus laurocerasus","fr":"Laurier-cerise (laurier-palme)","fam":"Rosacées","type":"Arbuste persistant","orig":"Europe de l'Est, Asie Mineure","lvl":3,"tip":"Grandes feuilles vert vif, épaisses et brillantes. Retournez-en une : 2 à 4 petites glandes près de la base. Froissée, elle sent l'amande amère (plante toxique).","diff":"Le laurier-sauce a une feuille plus petite, au bord ondulé, très aromatique et sans glandes. Le laurier du Portugal a des pétioles rouges.","conf":["laurus-nobilis","prunus-lusitanica"]},{"id":"rhamnus-alpina","lat":"Rhamnus alpina","fr":"Nerprun des Alpes","fam":"Rhamnacées","type":"Arbuste caduc","orig":"Montagnes d'Europe du Sud","lvl":3,"tip":"Nerprun sans épines aux grandes feuilles ovales aux nervures parallèles très marquées (10-20 paires). Baies noires.","diff":"La bourdaine a des feuilles au bord entier avec moins de nervures.","conf":["frangula-alnus","rhamnus-cathartica"]},{"id":"rhamnus-saxatilis","lat":"Rhamnus saxatilis","fr":"Nerprun des rochers","fam":"Rhamnacées","type":"Arbuste caduc","orig":"Europe du Sud","lvl":3,"tip":"Petit nerprun épineux des rochers calcaires. Petites feuilles ovales finement dentées, presque opposées. Baies noires.","diff":"Le nerprun purgatif est plus grand avec des feuilles plus larges.","conf":["rhamnus-cathartica","prunus-spinosa"]},{"id":"rhamnus-cathartica","lat":"Rhamnus cathartica","fr":"Nerprun purgatif","fam":"Rhamnacées","type":"Arbuste caduc","orig":"Europe","lvl":3,"tip":"Rameaux presque opposés, souvent terminés par une épine. Feuilles finement dentées aux nervures arquées. Baies noires en bouquets sur pieds femelles.","diff":"La bourdaine n'a pas d'épines et ses feuilles ont un bord entier.","conf":["frangula-alnus","prunus-spinosa"]},{"id":"elaeagnus-angustifolia","lat":"Elaeagnus angustifolia","fr":"Olivier de Bohême","fam":"Élaéagnacées","type":"Arbre caduc","orig":"Asie centrale","lvl":3,"tip":"Petit arbre aux feuilles étroites, argentées des deux côtés. Rameaux parfois épineux. Fleurs jaunes très parfumées en juin. Fruits ovales jaunâtres farineux.","diff":"L'olivier est persistant, a des feuilles opposées vert-gris dessus ; l'olivier de Bohême perd ses feuilles et elles sont alternes.","conf":["olea-europaea","hippophae-rhamnoides"]},{"id":"choisya-ternata","lat":"Choisya ternata","fr":"Oranger du Mexique","fam":"Rutacées","type":"Arbuste persistant","orig":"Mexique","lvl":3,"tip":"Feuilles opposées à 3 folioles brillantes. Froissées, elles sentent fort, entre agrume et épices. Fleurs blanches étoilées au printemps.","diff":"Sa feuille en trèfle à 3 doigts et son odeur forte le distinguent des autres arbustes à feuilles vernissées.","conf":["skimmia-japonica"]},{"id":"ptelea-trifoliata","lat":"Ptelea trifoliata","fr":"Orme de Samarie","fam":"Rutacées","type":"Arbuste caduc","orig":"Amérique du Nord","lvl":3,"tip":"Feuilles à 3 folioles, aromatiques froissées. Fleurs blanc-vert parfumées. Fruits ronds et plats entourés d'une aile, comme ceux de l'orme, en grappes.","diff":"L'orme a des feuilles simples ; le ptéléa a des feuilles à 3 folioles.","conf":["ulmus-minor","choisya-ternata"]},{"id":"salix-viminalis","lat":"Salix viminalis","fr":"Osier blanc","fam":"Salicacées","type":"Arbuste caduc","orig":"Europe","lvl":3,"tip":"Osier aux longues tiges souples. Feuilles très longues et étroites (jusqu'à 20 cm), au bord enroulé, argentées et soyeuses dessous.","diff":"Le saule pourpre a des feuilles plus courtes et des rameaux pourpres.","conf":["salix-purpurea","salix-alba"]},{"id":"pachysandra-terminalis","lat":"Pachysandra terminalis","fr":"Pachysandra","fam":"Buxacées","type":"Sous-arbrisseau","orig":"Japon, Chine","lvl":3,"tip":"Couvre-sol d'ombre persistant. Feuilles en rosettes au sommet des tiges, dentées vers la pointe. Petits épis de fleurs blanches au printemps.","diff":"La pervenche a des feuilles opposées entières et des fleurs bleues.","conf":["vinca-minor"]},{"id":"vinca-minor","lat":"Vinca minor","fr":"Petite pervenche","fam":"Apocynacées","type":"Sous-arbrisseau","orig":"Europe","lvl":3,"tip":"Couvre-sol de sous-bois aux petites feuilles opposées étroites, luisantes. Fleurs bleu lavande à 5 pétales tordus en hélice, au printemps.","diff":"La grande pervenche a des feuilles en cœur ciliées et de plus grandes fleurs.","conf":["vinca-major","pachysandra-terminalis"]},{"id":"photinia-serratifolia","lat":"Photinia serratifolia","fr":"Photinia de Chine","fam":"Rosacées","type":"Arbre persistant","orig":"Chine","lvl":3,"tip":"Grand arbuste ou petit arbre persistant aux longues feuilles coriaces finement dentées, rouge bronze au débourrement. Grandes panicules blanches au printemps, puis fruits rouges.","diff":"Le photinia 'Red Robin' a des pousses rouge plus vif et des feuilles plus petites.","conf":["photinia-fraseri","prunus-laurocerasus"]},{"id":"rosa-arvensis","lat":"Rosa arvensis","fr":"Rosier des champs","fam":"Rosacées","type":"Arbuste caduc","orig":"Europe","lvl":3,"tip":"Rosier rampant ou grimpant des sous-bois. Fleurs blanches dont les styles forment une petite colonne au centre. Folioles mates.","diff":"L'églantier a des fleurs roses à styles libres en tête.","conf":["rosa-canina","rosa-sempervirens"]},{"id":"rosa-multiflora","lat":"Rosa multiflora","fr":"Rosier multiflore","fam":"Rosacées","type":"Arbuste caduc","orig":"Chine, Japon, Corée","lvl":3,"tip":"Rosier vigoureux aux stipules frangées en peigne à la base des feuilles. Grappes pyramidales de petites fleurs blanches parfumées. Petits fruits ronds rouges.","diff":"Les stipules découpées en peigne sont la signature de ce rosier.","conf":["rosa-arvensis","rosa-canina"]},{"id":"rosa-pimpinellifolia","lat":"Rosa pimpinellifolia","fr":"Rosier pimprenelle","fam":"Rosacées","type":"Arbuste caduc","orig":"Europe","lvl":3,"tip":"Rosier bas des dunes. Tiges couvertes d'aiguillons droits et de soies serrées. Petites folioles rondes (7-11). Fleurs blanc crème, puis fruits noir-pourpre.","diff":"Les autres églantiers ont des fruits rouges.","conf":["rosa-rugosa","rosa-canina"]},{"id":"rosa-rubiginosa","lat":"Rosa rubiginosa","fr":"Rosier rouillé","fam":"Rosacées","type":"Arbuste caduc","orig":"Europe","lvl":3,"tip":"Églantier dont les feuilles froissées sentent la pomme verte, grâce à des glandes collantes au revers. Fleurs rose vif, cynorhodons ovales.","diff":"L'églantier commun a des feuilles sans glandes, sans odeur.","conf":["rosa-canina"]},{"id":"rosa-tomentosa","lat":"Rosa tomentosa","fr":"Rosier tomenteux","fam":"Rosacées","type":"Arbuste caduc","orig":"Europe","lvl":3,"tip":"Églantier aux folioles grises veloutées des deux côtés, à dents doubles glanduleuses. Fleurs rose pâle. Fruits hérissés de soies glanduleuses.","diff":"L'églantier commun a des folioles lisses glabres.","conf":["rosa-canina"]},{"id":"rosa-glauca","lat":"Rosa glauca","fr":"Rosier à feuilles rouges","fam":"Rosacées","type":"Arbuste caduc","orig":"Montagnes d'Europe","lvl":3,"tip":"Feuillage bleu-gris teinté de pourpre, rameaux pourpres presque sans aiguillons. Petites fleurs rose vif à cœur blanc. Cynorhodons rouge foncé.","diff":"Aucun autre rosier courant n'a ce feuillage gris pourpré.","conf":["rosa-canina"]},{"id":"gaultheria-shallon","lat":"Gaultheria shallon","fr":"Salal","fam":"Éricacées","type":"Arbuste persistant","orig":"Ouest de l'Amérique du Nord","lvl":3,"tip":"Persistant drageonnant aux feuilles ovales coriaces, dentées, à pointe fine. Grappes de clochettes blanc rosé, puis baies pourpre-noir.","diff":"Le piéris a des feuilles plus étroites en rosettes et des pousses rouges.","conf":["pieris-japonica","vaccinium-corymbosum"]},{"id":"salix-cinerea","lat":"Salix cinerea","fr":"Saule cendré","fam":"Salicacées","type":"Arbuste caduc","orig":"Europe","lvl":3,"tip":"Saule des zones humides. Feuilles obovales, grisâtres et duveteuses, à petites stipules. Rameaux duveteux. Chatons argentés en mars.","diff":"Le saule marsault a des feuilles plus larges et des rameaux glabres ; le saule à oreillettes a de grandes stipules en oreille.","conf":["salix-caprea","salix-aurita"]},{"id":"salix-myrsinifolia","lat":"Salix myrsinifolia","fr":"Saule noircissant","fam":"Salicacées","type":"Arbuste caduc","orig":"Europe","lvl":3,"tip":"Saule aux feuilles ovales qui noircissent en séchant. Feuilles luisantes dessus, glauques dessous sauf à la pointe.","diff":"Le saule marsault a des feuilles grises feutrées dessous qui ne noircissent pas.","conf":["salix-caprea","salix-cinerea"]},{"id":"salix-purpurea","lat":"Salix purpurea","fr":"Saule pourpre","fam":"Salicacées","type":"Arbuste caduc","orig":"Europe","lvl":3,"tip":"Saule aux rameaux fins et pourpres. Feuilles étroites, souvent subopposées, bleutées dessous, qui noircissent en séchant. Écorce amère jaune dessous.","diff":"L'osier blanc a des feuilles beaucoup plus longues, argentées dessous.","conf":["salix-viminalis"]},{"id":"salix-pentandra","lat":"Salix pentandra","fr":"Saule à cinq étamines","fam":"Salicacées","type":"Arbre caduc","orig":"Europe","lvl":3,"tip":"Saule aux feuilles ovales très luisantes, comme vernies, aromatiques quand on les froisse. Chatons jaunes tardifs, en juin.","diff":"Le saule fragile a des feuilles plus longues et étroites.","conf":["salix-triandra"]},{"id":"sorbaria-sorbifolia","lat":"Sorbaria sorbifolia","fr":"Sorbaria","fam":"Rosacées","type":"Arbuste caduc","orig":"Asie du Nord-Est","lvl":3,"tip":"Arbuste drageonnant aux feuilles composées pennées dentées comme le sorbier. Grandes panicules de fleurs blanches mousseuses en été.","diff":"Le sorbier est un arbre à fruits rouges ; la sorbaria est un arbuste à fruits secs.","conf":["sorbus-aucuparia","spiraea-japonica"]},{"id":"staphylea-pinnata","lat":"Staphylea pinnata","fr":"Staphylier","fam":"Staphyléacées","type":"Arbuste caduc","orig":"Europe centrale et du Sud","lvl":3,"tip":"Feuilles opposées composées de 5 à 7 folioles. Grappes pendantes de fleurs blanches en clochettes, puis capsules vertes gonflées comme des vessies.","diff":"Le baguenaudier a aussi des fruits gonflés, mais ses feuilles sont alternes et ses fleurs jaunes.","conf":["colutea-arborescens","sambucus-nigra"]},{"id":"sambucus-racemosa","lat":"Sambucus racemosa","fr":"Sureau rouge","fam":"Viburnacées","type":"Arbuste caduc","orig":"Europe","lvl":3,"tip":"Sureau de montagne. Feuilles composées opposées. Grappes coniques de fleurs crème au printemps, puis baies rouge vif en juin-juillet. Moelle brune.","diff":"Le sureau noir a des ombelles plates, des baies noires en fin d'été et une moelle blanche.","conf":["sambucus-nigra","sorbus-aucuparia"]},{"id":"baccharis-halimifolia","lat":"Baccharis halimifolia","fr":"Séneçon en arbre","fam":"Astéracées","type":"Arbuste caduc","orig":"Amérique du Nord","lvl":3,"tip":"Arbuste des littoraux atlantiques. Feuilles grisâtres en losange, dentées au sommet. En automne, les pieds femelles se couvrent d'aigrettes blanches cotonneuses. Très envahissant.","diff":"L'arroche halime a des feuilles argentées entières et ne fait pas d'aigrettes.","conf":["atriplex-halimus"]},{"id":"tamarix-ramosissima","lat":"Tamarix ramosissima","fr":"Tamaris d'été","fam":"Tamaricacées","type":"Arbuste caduc","orig":"Asie","lvl":3,"tip":"Tamaris qui fleurit d'août à septembre en longues panicules rose vif sur les pousses de l'année. Feuillage en écailles bleuté.","diff":"Le tamaris à petites fleurs fleurit en avril-mai.","conf":["tamarix-gallica","tamarix-parviflora"]},{"id":"tamarix-gallica","lat":"Tamarix gallica","fr":"Tamaris de France","fam":"Tamaricacées","type":"Arbuste caduc","orig":"Ouest de la Méditerranée","lvl":3,"tip":"Arbuste aux rameaux fins couverts de minuscules feuilles en écailles. Nuages de petites fleurs roses en épis en été. Supporte sel et embruns.","diff":"Le tamaris d'été fleurit plus tard en rose plus vif ; le tamaris à petites fleurs fleurit au printemps sur le bois de l'année précédente.","conf":["tamarix-ramosissima","tamarix-parviflora"]},{"id":"ligustrum-lucidum","lat":"Ligustrum lucidum","fr":"Troène de Chine","fam":"Oléacées","type":"Arbre persistant","orig":"Chine","lvl":3,"tip":"Arbre persistant d'alignement dans le Midi. Grandes feuilles opposées, ovales pointues, luisantes. Énormes panicules blanches en été, puis grappes de baies bleu-noir pruinées.","diff":"Le troène du Japon reste arbustif avec des feuilles plus courtes et plus épaisses.","conf":["ligustrum-ovalifolium"]},{"id":"ligustrum-sinense","lat":"Ligustrum sinense","fr":"Troène à feuilles de buis","fam":"Oléacées","type":"Arbuste semi-persistant","orig":"Chine","lvl":3,"tip":"Troène aux petites feuilles ovales, rameaux duveteux. Panicules de fleurs blanches à l'odeur forte. Baies noir-pourpre. Envahissant.","diff":"Le troène commun a des feuilles plus étroites et des rameaux presque glabres.","conf":["ligustrum-vulgare","ligustrum-ovalifolium"]},{"id":"viburnum-lantana","lat":"Viburnum lantana","fr":"Viorne mancienne","fam":"Viburnacées","type":"Arbuste caduc","orig":"Europe","lvl":3,"tip":"Feuilles opposées épaisses, ridées, feutrées de gris dessous, finement dentées. Bourgeons nus et duveteux. Ombelles blanches puis fruits rouges virant au noir en même temps.","diff":"La viorne obier a des feuilles lobées et des fruits rouges translucides.","conf":["viburnum-opulus"]},{"id":"hebe-salicifolia","lat":"Hebe salicifolia","fr":"Véronique arbustive","fam":"Plantaginacées","type":"Arbuste persistant","orig":"Nouvelle-Zélande","lvl":3,"tip":"Persistant aux feuilles opposées étroites comme le saule, disposées en croix régulière. Longs épis de fleurs blanches ou lilas en été.","diff":"Le saule a des feuilles alternes et perd ses feuilles ; la véronique a des feuilles opposées en croix.","conf":["salix-viminalis","buddleja-davidii"]},{"id":"berberis-vulgaris","lat":"Berberis vulgaris","fr":"Épine-vinette commune","fam":"Berbéridacées","type":"Arbuste caduc","orig":"Europe","lvl":3,"tip":"Arbuste caduc aux épines à 3 branches sous chaque rosette de feuilles. Feuilles finement dentées-ciliées. Grappes pendantes de fleurs jaunes, puis baies rouges oblongues acides. Bois jaune vif.","diff":"L'épine-vinette de Thunberg a des feuilles entières et des épines simples.","conf":["berberis-thunbergii","ribes-uva-crispa"]},{"id":"berberis-darwinii","lat":"Berberis darwinii","fr":"Épine-vinette de Darwin","fam":"Berbéridacées","type":"Arbuste persistant","orig":"Chili, Argentine","lvl":3,"tip":"Petites feuilles persistantes luisantes, à 3-5 épines comme un houx miniature. Grappes de fleurs orange vif en avril, puis baies bleu-noir pruinées. Bois jaune.","diff":"Le mahonia a des feuilles composées. L'osmanthe à feuilles de houx a des feuilles opposées.","conf":["mahonia-aquifolium","osmanthus-heterophyllus","berberis-julianae"]},{"id":"berberis-julianae","lat":"Berberis julianae","fr":"Épine-vinette de Julien","fam":"Berbéridacées","type":"Arbuste persistant","orig":"Chine","lvl":3,"tip":"Feuilles persistantes étroites, longues, bordées de dents épineuses, en rosettes, avec de fortes épines à 3 branches. Fleurs jaunes, baies noires pruinées.","diff":"L'épine-vinette de Darwin a des feuilles plus courtes et des fleurs orange.","conf":["berberis-darwinii","berberis-vulgaris"]},{"id":"sorbus-latifolia","lat":"Sorbus latifolia","fr":"Alisier de Fontainebleau","fam":"Rosacées","type":"Arbre caduc","orig":"France","lvl":4,"tip":"Hybride de l'alisier blanc et de l'alisier torminal. Feuilles largement ovales à lobes triangulaires, gris feutré dessous. Fruits brun-orange ponctués.","diff":"L'alisier torminal a des lobes profonds et des feuilles vertes des deux côtés.","conf":["sorbus-torminalis","sorbus-aria"]},{"id":"sorbus-mougeotii","lat":"Sorbus mougeotii","fr":"Alisier de Mougeot","fam":"Rosacées","type":"Arbre caduc","orig":"Montagnes d'Europe","lvl":4,"tip":"Alisier des Vosges et des Alpes aux feuilles ovales légèrement lobées, gris-blanc dessous. Fruits rouges.","diff":"L'alisier blanc a des feuilles non lobées plus blanches dessous.","conf":["sorbus-aria"]},{"id":"sorbus-torminalis","lat":"Sorbus torminalis","fr":"Alisier torminal","fam":"Rosacées","type":"Arbre caduc","orig":"Europe","lvl":4,"tip":"Feuilles à lobes pointus comme un érable, mais alternes. Fruits bruns ponctués (alises), comestibles blets. Rouge en automne.","diff":"Les érables ont des feuilles opposées ; l'alisier torminal les a alternes.","conf":["acer-campestre","sorbus-aria"]},{"id":"crataegus-laevigata","lat":"Crataegus laevigata","fr":"Aubépine épineuse","fam":"Rosacées","type":"Arbre caduc","orig":"Europe","lvl":4,"tip":"Feuilles peu lobées (3-5 lobes peu profonds), luisantes. Fleurs à 2-3 styles, souvent roses ou rouges doubles chez les variétés ('Paul's Scarlet'). Fruits à 2 noyaux.","diff":"L'aubépine monogyne a des feuilles profondément découpées et un seul noyau.","conf":["crataegus-monogyna"]},{"id":"alnus-incana","lat":"Alnus incana","fr":"Aulne blanc","fam":"Bétulacées","type":"Arbre caduc","orig":"Europe","lvl":4,"tip":"Feuilles ovales pointues, doublement dentées, grises et duveteuses dessous. Écorce grise lisse. Bords de torrents de montagne.","diff":"L'aulne glutineux a des feuilles rondes échancrées, vert foncé, collantes.","conf":["alnus-glutinosa"]},{"id":"alnus-alnobetula","lat":"Alnus alnobetula","fr":"Aulne vert","fam":"Bétulacées","type":"Arbuste caduc","orig":"Montagnes d'Europe","lvl":4,"tip":"Aulne arbustif des couloirs d'avalanche. Feuilles ovales pointues, finement doublement dentées, collantes jeunes. Chatons et petits cônes.","diff":"L'aulne glutineux est un arbre aux feuilles rondes échancrées.","conf":["alnus-glutinosa","alnus-incana"]},{"id":"betula-pubescens","lat":"Betula pubescens","fr":"Bouleau pubescent","fam":"Bétulacées","type":"Arbre caduc","orig":"Europe","lvl":4,"tip":"Bouleau des sols humides. Rameaux dressés, duveteux, sans verrues. Feuilles ovales simplement dentées, duveteuses. Écorce blanche sans grosses crevasses noires à la base.","diff":"Le bouleau verruqueux a des rameaux pendants couverts de verrues et des feuilles en losange doublement dentées.","conf":["betula-pendula"]},{"id":"betula-papyrifera","lat":"Betula papyrifera","fr":"Bouleau à papier","fam":"Bétulacées","type":"Arbre caduc","orig":"Amérique du Nord","lvl":4,"tip":"Écorce blanc crème qui se détache en grandes feuilles de papier horizontales. Feuilles ovales plus grandes que les autres bouleaux.","diff":"Le bouleau de l'Himalaya a une écorce plus lisse et lumineuse.","conf":["betula-pendula"]},{"id":"prunus-mahaleb","lat":"Prunus mahaleb","fr":"Cerisier de Sainte-Lucie","fam":"Rosacées","type":"Arbre caduc","orig":"Europe","lvl":4,"tip":"Petites feuilles rondes et luisantes. Bouquets de fleurs blanches parfumées. Petites cerises noires amères. Bois odorant (bois de Sainte-Lucie). Coteaux calcaires.","diff":"Le merisier a des feuilles bien plus grandes et pendantes.","conf":["prunus-avium","prunus-spinosa"]},{"id":"prunus-virginiana","lat":"Prunus virginiana","fr":"Cerisier de Virginie","fam":"Rosacées","type":"Arbre caduc","orig":"Amérique du Nord","lvl":4,"tip":"Petit cerisier aux feuilles ovales finement dentées, souvent pourpres ('Schubert'). Grappes de fleurs blanches, baies rouges puis noires.","diff":"Le cerisier à grappes a des feuilles vertes et fleurit plus tôt.","conf":["prunus-padus","prunus-serotina"]},{"id":"prunus-serotina","lat":"Prunus serotina","fr":"Cerisier tardif","fam":"Rosacées","type":"Arbre caduc","orig":"Amérique du Nord","lvl":4,"tip":"Feuilles allongées très luisantes, avec des poils roux le long de la nervure dessous. Grappes de fleurs blanches en juin. Baies noires. Espèce envahissante en forêt.","diff":"Le cerisier à grappes a des feuilles mates et fleurit plus tôt.","conf":["prunus-padus","prunus-laurocerasus"]},{"id":"prunus-padus","lat":"Prunus padus","fr":"Cerisier à grappes","fam":"Rosacées","type":"Arbre caduc","orig":"Europe","lvl":4,"tip":"Longues grappes pendantes de fleurs blanches au parfum d'amande en avril-mai. Feuilles ovales finement dentées. Écorce à odeur désagréable. Petites cerises noires amères.","diff":"Le cerisier tardif a des feuilles très luisantes et fleurit plus tard ; le laurier-cerise est persistant.","conf":["prunus-serotina","prunus-avium"]},{"id":"carpinus-orientalis","lat":"Carpinus orientalis","fr":"Charme d'Orient","fam":"Bétulacées","type":"Arbre caduc","orig":"Balkans, Turquie","lvl":4,"tip":"Petit charme aux feuilles de 3 à 5 cm, doublement dentées. Fruits à bractées non lobées, dentées.","diff":"Le charme commun a des feuilles plus grandes et des bractées à 3 lobes.","conf":["carpinus-betulus","ostrya-carpinifolia"]},{"id":"ostrya-carpinifolia","lat":"Ostrya carpinifolia","fr":"Charme-houblon","fam":"Bétulacées","type":"Arbre caduc","orig":"Europe du Sud","lvl":4,"tip":"Feuilles proches du charme, doublement dentées. Fruits en cônes blanchâtres pendants comme le houblon. Écorce brune qui s'écaille en lanières.","diff":"Le charme a une écorce grise cannelée et des fruits en grappes de bractées à 3 lobes.","conf":["carpinus-betulus"]},{"id":"quercus-bicolor","lat":"Quercus bicolor","fr":"Chêne bicolore","fam":"Fagacées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":4,"tip":"Feuilles ovales à grosses dents arrondies, vert foncé dessus et blanc argenté dessous. Glands sur de longs pédoncules.","diff":"Le chêne à feuilles de châtaignier a des dents pointues.","conf":["quercus-robur"]},{"id":"quercus-cerris","lat":"Quercus cerris","fr":"Chêne chevelu","fam":"Fagacées","type":"Arbre caduc","orig":"Europe du Sud-Est","lvl":4,"tip":"Bourgeons entourés de longues stipules filiformes qui persistent. Feuilles rugueuses aux lobes pointus irréguliers. Glands dans une cupule hérissée comme une chevelure.","diff":"Le chêne pédonculé a des lobes arrondis et une cupule lisse.","conf":["quercus-robur"]},{"id":"quercus-palustris","lat":"Quercus palustris","fr":"Chêne des marais","fam":"Fagacées","type":"Arbre caduc","orig":"Est des États-Unis","lvl":4,"tip":"Feuilles profondément découpées en lobes pointus terminés par des soies, avec des sinus très arrondis. Branches basses retombantes. Petits glands dans une cupule plate.","diff":"Le chêne rouge a des lobes moins profonds et de plus gros glands ; le chêne écarlate a des sinus en C plus profonds.","conf":["quercus-rubra"]},{"id":"quercus-faginea","lat":"Quercus faginea","fr":"Chêne du Portugal","fam":"Fagacées","type":"Arbre semi-persistant","orig":"Péninsule Ibérique","lvl":4,"tip":"Chêne semi-persistant aux feuilles ovales dentées, grisâtres et duveteuses dessous, qui restent sèches tard sur l'arbre.","diff":"Le chêne pubescent a des feuilles lobées ; celui-ci a des feuilles dentées.","conf":["quercus-pubescens","quercus-ilex"]},{"id":"quercus-velutina","lat":"Quercus velutina","fr":"Chêne noir","fam":"Fagacées","type":"Arbre caduc","orig":"Est des États-Unis","lvl":4,"tip":"Chêne rouge aux feuilles luisantes à lobes pointus. Bourgeons gris velus et anguleux. Écorce interne jaune orangé.","diff":"Le chêne rouge a des bourgeons glabres et une écorce plus lisse.","conf":["quercus-rubra"]},{"id":"quercus-pyrenaica","lat":"Quercus pyrenaica","fr":"Chêne tauzin","fam":"Fagacées","type":"Arbre caduc","orig":"Péninsule Ibérique, France","lvl":4,"tip":"Feuilles très profondément lobées, épaisses, couvertes d'un duvet gris laineux dessous. Drageonne. Sols acides du Sud-Ouest.","diff":"Le chêne pubescent a des lobes moins profonds et préfère le calcaire.","conf":["quercus-pubescens"]},{"id":"quercus-phellos","lat":"Quercus phellos","fr":"Chêne à feuilles de saule","fam":"Fagacées","type":"Arbre caduc","orig":"Est des États-Unis","lvl":4,"tip":"Chêne aux feuilles étroites et entières comme celles du saule, terminées par une petite soie. Petits glands.","diff":"Les saules n'ont pas de glands ; ce chêne a des bourgeons groupés au bout des rameaux.","conf":["salix-alba","quercus-ilex"]},{"id":"quercus-macrocarpa","lat":"Quercus macrocarpa","fr":"Chêne à gros fruits","fam":"Fagacées","type":"Arbre caduc","orig":"Amérique du Nord","lvl":4,"tip":"Grandes feuilles avec un profond sinus au milieu : partie haute large et peu lobée, partie basse profondément lobée. Gros glands dans une cupule frangée.","diff":"Le chêne blanc d'Amérique a des lobes réguliers ; le chêne à gros fruits a une cupule frangée.","conf":["quercus-robur"]},{"id":"sorbus-domestica","lat":"Sorbus domestica","fr":"Cormier","fam":"Rosacées","type":"Arbre caduc","orig":"Europe du Sud","lvl":4,"tip":"Feuilles composées comme le sorbier des oiseleurs, mais bourgeons verts collants et écorce en carreaux. Fruits en petites poires ou pommes jaunes rougeâtres (cormes).","diff":"Le sorbier des oiseleurs a des bourgeons violets velus et de petites baies rouges.","conf":["sorbus-aucuparia","fraxinus-excelsior"]},{"id":"cornus-mas","lat":"Cornus mas","fr":"Cornouiller mâle","fam":"Cornacées","type":"Arbuste caduc","orig":"Europe","lvl":4,"tip":"Petites fleurs jaunes en pompons dès février, avant les feuilles. Feuilles à nervures arquées. Fruits rouges oblongs comestibles (cornouilles).","diff":"Le forsythia a de plus grandes fleurs à 4 pétales. Son bois n'a pas de fils dans les feuilles. Le cornouiller mâle a de petits pompons jaunes.","conf":["forsythia-intermedia","cornus-sanguinea"]},{"id":"fraxinus-americana","lat":"Fraxinus americana","fr":"Frêne blanc d'Amérique","fam":"Oléacées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":4,"tip":"Folioles entières ou peu dentées, blanches dessous, sur pétiolules. Couleur d'automne pourpre. Bourgeons bruns.","diff":"Le frêne commun a des folioles dentées et des bourgeons noirs.","conf":["fraxinus-excelsior"]},{"id":"fraxinus-pennsylvanica","lat":"Fraxinus pennsylvanica","fr":"Frêne rouge","fam":"Oléacées","type":"Arbre caduc","orig":"Amérique du Nord","lvl":4,"tip":"Frêne aux bourgeons bruns et aux folioles peu dentées, souvent duveteuses dessous. Samares étroites. Planté le long des rivières.","diff":"Le frêne commun a des bourgeons noirs.","conf":["fraxinus-excelsior","fraxinus-americana"]},{"id":"fraxinus-angustifolia","lat":"Fraxinus angustifolia","fr":"Frêne à feuilles étroites","fam":"Oléacées","type":"Arbre caduc","orig":"Sud de l'Europe","lvl":4,"tip":"Frêne aux folioles étroites et dentées, glabres. Bourgeons bruns (et non noirs). Plaines alluviales du Midi.","diff":"Le frêne commun a des bourgeons noirs veloutés.","conf":["fraxinus-excelsior","fraxinus-ornus"]},{"id":"fraxinus-ornus","lat":"Fraxinus ornus","fr":"Frêne à fleurs","fam":"Oléacées","type":"Arbre caduc","orig":"Europe du Sud","lvl":4,"tip":"Frêne aux bourgeons gris velouté. Folioles larges, pétiolulées. Panicules de fleurs blanches crème mousseuses et parfumées en mai.","diff":"Le frêne commun a des bourgeons noirs et des fleurs sans pétales discrètes.","conf":["fraxinus-excelsior","fraxinus-angustifolia"]},{"id":"cercis-canadensis","lat":"Cercis canadensis","fr":"Gainier du Canada","fam":"Fabacées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":4,"tip":"Feuilles en cœur pointues (et non arrondies au bout). Fleurs rose lilas sur le bois au printemps. Variétés pourpres ('Forest Pansy').","diff":"L'arbre de Judée a des feuilles arrondies au sommet.","conf":["cercis-siliquastrum"]},{"id":"fagus-orientalis","lat":"Fagus orientalis","fr":"Hêtre d'Orient","fam":"Fagacées","type":"Arbre caduc","orig":"Balkans, Caucase","lvl":4,"tip":"Hêtre aux feuilles plus grandes et plus allongées que le hêtre commun, avec plus de nervures (8-12 paires). Cupules aux appendices aplatis.","diff":"Le hêtre commun a des feuilles plus petites à 5-8 paires de nervures.","conf":["fagus-sylvatica"]},{"id":"ziziphus-jujuba","lat":"Ziziphus jujuba","fr":"Jujubier","fam":"Rhamnacées","type":"Arbre caduc","orig":"Chine","lvl":4,"tip":"Rameaux en zigzag avec 2 épines à chaque nœud. Feuilles luisantes à 3 nervures longitudinales. Jujubes ovales brun-rouge.","diff":"Le paliure a aussi 2 épines, mais ses fruits sont des disques ailés.","conf":["paliurus-spina-christi"]},{"id":"melia-azedarach","lat":"Melia azedarach","fr":"Lilas de Perse (margousier)","fam":"Méliacées","type":"Arbre caduc","orig":"Asie","lvl":4,"tip":"Feuilles 2 fois composées aux folioles dentées. Panicules de fleurs lilas parfumées en mai. En hiver, grappes de baies jaunes rondes toxiques sur l'arbre nu.","diff":"Le savonnier a des fleurs jaunes et des capsules gonflées.","conf":["koelreuteria-paniculata","ailanthus-altissima"]},{"id":"magnolia-acuminata","lat":"Magnolia acuminata","fr":"Magnolia concombre","fam":"Magnoliacées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":4,"tip":"Grand magnolia caduc aux feuilles ovales. Fleurs vert-jaune discrètes. Fruits rouges en forme de concombre qui s'ouvrent sur des graines rouges.","diff":"Les magnolias d'ornement courants ont de grandes fleurs blanches ou roses bien visibles.","conf":["liriodendron-tulipifera"]},{"id":"celtis-occidentalis","lat":"Celtis occidentalis","fr":"Micocoulier occidental","fam":"Cannabacées","type":"Arbre caduc","orig":"Amérique du Nord","lvl":4,"tip":"Feuilles asymétriques, dentées, à pointe effilée. Écorce grise avec des crêtes liégeuses verrueuses. Petites drupes rouge-pourpre.","diff":"Le micocoulier de Provence a une écorce lisse et des fruits noirs.","conf":["celtis-australis","ulmus-minor"]},{"id":"broussonetia-papyrifera","lat":"Broussonetia papyrifera","fr":"Mûrier à papier","fam":"Moracées","type":"Arbre caduc","orig":"Asie de l'Est","lvl":4,"tip":"Feuilles très variables (entières ou à 3-5 lobes) sur le même arbre, rugueuses dessus, veloutées dessous. Latex. Fruits ronds orange à filaments.","diff":"Le mûrier blanc a des feuilles lisses dessus ; le mûrier à papier est velouté.","conf":["morus-alba","morus-nigra"]},{"id":"juglans-nigra","lat":"Juglans nigra","fr":"Noyer noir","fam":"Juglandacées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":4,"tip":"Feuilles composées de 15 à 23 folioles dentées, la terminale souvent absente. Écorce sombre profondément sillonnée en losanges. Noix ronde à coque très dure dans un brou vert.","diff":"Le noyer commun a 5 à 9 grandes folioles entières et une écorce grise.","conf":["juglans-regia"]},{"id":"nyssa-sylvatica","lat":"Nyssa sylvatica","fr":"Nyssa","fam":"Nyssacées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":4,"tip":"Feuilles ovales luisantes au bord entier, qui virent au rouge écarlate parmi les premières en automne. Branches horizontales. Petites drupes bleu-noir.","diff":"Le copalme a des feuilles en étoile. Le nyssa a une feuille simple entière.","conf":["liquidambar-styraciflua"]},{"id":"ulmus-americana","lat":"Ulmus americana","fr":"Orme d'Amérique","fam":"Ulmacées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":4,"tip":"Orme au port en vase très élégant. Feuilles asymétriques doublement dentées. Fruits ciliés sur longs pédoncules.","diff":"L'orme lisse européen a les mêmes fruits ciliés mais un tronc à contreforts.","conf":["ulmus-laevis","ulmus-minor"]},{"id":"ulmus-pumila","lat":"Ulmus pumila","fr":"Orme de Sibérie","fam":"Ulmacées","type":"Arbre caduc","orig":"Asie","lvl":4,"tip":"Petites feuilles presque symétriques, simplement dentées. Rameaux fins. Graine au centre d'une samare ronde. Très résistant et envahissant.","diff":"L'orme champêtre a une base de feuille nettement asymétrique et doublement dentée.","conf":["ulmus-minor"]},{"id":"ulmus-glabra","lat":"Ulmus glabra","fr":"Orme des montagnes","fam":"Ulmacées","type":"Arbre caduc","orig":"Europe","lvl":4,"tip":"Grandes feuilles très rugueuses, asymétriques à la base, souvent à 3 pointes au sommet. Pétiole très court. Samares larges.","diff":"L'orme champêtre a des feuilles plus petites et plus lisses, avec un pétiole visible.","conf":["ulmus-minor","ulmus-laevis"]},{"id":"ulmus-laevis","lat":"Ulmus laevis","fr":"Orme lisse","fam":"Ulmacées","type":"Arbre caduc","orig":"Europe","lvl":4,"tip":"Feuilles asymétriques doublement dentées. Fleurs et fruits ciliés pendant sur de longs pédoncules. Tronc à contreforts. Bords de rivières.","diff":"Les autres ormes ont des fruits presque sessiles.","conf":["ulmus-minor","ulmus-glabra"]},{"id":"populus-balsamifera","lat":"Populus balsamifera","fr":"Peuplier baumier","fam":"Salicacées","type":"Arbre caduc","orig":"Amérique du Nord","lvl":4,"tip":"Peuplier aux bourgeons très collants à forte odeur de baume au printemps. Feuilles ovales blanchâtres dessous.","diff":"Le peuplier noir a des feuilles triangulaires vertes des deux côtés.","conf":["populus-nigra","populus-deltoides"]},{"id":"populus-alba","lat":"Populus alba","fr":"Peuplier blanc","fam":"Salicacées","type":"Arbre caduc","orig":"Europe, Asie","lvl":4,"tip":"Feuilles à 3-5 lobes comme l'érable, couvertes d'un feutre blanc dessous et sur les jeunes rameaux. Écorce blanche ponctuée de losanges noirs. Drageonne beaucoup.","diff":"Le peuplier grisard a des feuilles moins lobées et moins blanches ; le tremble a des feuilles rondes.","conf":["populus-canescens","populus-tremula"]},{"id":"populus-deltoides","lat":"Populus deltoides","fr":"Peuplier deltoïde","fam":"Salicacées","type":"Arbre caduc","orig":"Amérique du Nord","lvl":4,"tip":"Grandes feuilles triangulaires à base en cœur, à grosses dents courbées, avec 2-3 glandes au sommet du pétiole. Bourgeons collants et odorants.","diff":"Le peuplier hybride a une base de feuille tronquée.","conf":["populus-nigra"]},{"id":"populus-canescens","lat":"Populus × canescens","fr":"Peuplier grisard","fam":"Salicacées","type":"Arbre caduc","orig":"Europe","lvl":4,"tip":"Hybride du peuplier blanc et du tremble. Feuilles rondes ou peu lobées, grisâtres dessous. Écorce gris-blanc à losanges.","diff":"Le peuplier blanc a des feuilles lobées très blanches ; le tremble a des feuilles vertes des deux côtés.","conf":["populus-alba","populus-tremula"]},{"id":"diospyros-lotus","lat":"Diospyros lotus","fr":"Plaqueminier d'Europe","fam":"Ébénacées","type":"Arbre caduc","orig":"Asie occidentale","lvl":4,"tip":"Feuilles ovales luisantes. Petits fruits ronds jaunes puis noirâtres de la taille d'une cerise. Écorce en petits carreaux.","diff":"Le kaki a de gros fruits orange.","conf":["diospyros-virginiana"]},{"id":"diospyros-virginiana","lat":"Diospyros virginiana","fr":"Plaqueminier de Virginie","fam":"Ébénacées","type":"Arbre caduc","orig":"Est des États-Unis","lvl":4,"tip":"Feuilles ovales luisantes. Fruits orange de 3-4 cm, très astringents avant les gelées. Écorce en carreaux noirs très nets.","diff":"Le kaki a des fruits bien plus gros ; le plaqueminier d'Europe a des fruits plus petits.","conf":["diospyros-lotus"]},{"id":"platanus-occidentalis","lat":"Platanus occidentalis","fr":"Platane d'Occident","fam":"Platanacées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":4,"tip":"Feuilles à 3-5 lobes peu profonds. Fruits en boules pendantes isolées (une par pédoncule). Écorce blanche en haut du tronc.","diff":"Le platane commun a des feuilles plus lobées et 2 boules par pédoncule.","conf":["platanus-hispanica","platanus-orientalis"]},{"id":"platanus-orientalis","lat":"Platanus orientalis","fr":"Platane d'Orient","fam":"Platanacées","type":"Arbre caduc","orig":"Balkans, Asie occidentale","lvl":4,"tip":"Feuilles profondément découpées en 5-7 lobes étroits. Boules par 3 à 6 sur le même pédoncule. Arbres très vieux sur les places du Midi.","diff":"Le platane commun a des lobes moins profonds et 1-2 boules par pédoncule.","conf":["platanus-hispanica","platanus-occidentalis"]},{"id":"malus-sylvestris","lat":"Malus sylvestris","fr":"Pommier sauvage","fam":"Rosacées","type":"Arbre caduc","orig":"Europe","lvl":4,"tip":"Petit arbre parfois épineux. Feuilles ovales glabres dessous à l'âge adulte. Fleurs blanc rosé, petites pommes vertes acides.","diff":"Le pommier cultivé a des feuilles duveteuses dessous et de gros fruits.","conf":["malus-domestica"]},{"id":"pterocarya-fraxinifolia","lat":"Pterocarya fraxinifolia","fr":"Ptérocaryer du Caucase","fam":"Juglandacées","type":"Arbre caduc","orig":"Caucase, Iran","lvl":4,"tip":"Très longues feuilles composées (jusqu'à 25 folioles). Longs chapelets pendants de fruits ailés verts en été. Drageonne beaucoup au bord de l'eau.","diff":"Le noyer a moins de folioles et des noix ; le ptérocaryer a des chaînes de fruits ailés.","conf":["juglans-regia","ailanthus-altissima"]},{"id":"robinia-hispida","lat":"Robinia hispida","fr":"Robinier hispide","fam":"Fabacées","type":"Arbuste caduc","orig":"Sud-est des États-Unis","lvl":4,"tip":"Arbuste drageonnant aux rameaux couverts de soies rouges hérissées. Grandes fleurs roses en grappes courtes.","diff":"Le robinier visqueux a des rameaux collants sans soies.","conf":["robinia-pseudoacacia"]},{"id":"sassafras-albidum","lat":"Sassafras albidum","fr":"Sassafras","fam":"Lauracées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":4,"tip":"Trois formes de feuilles sur le même arbre : entières, en mitaine (2 lobes) et à 3 lobes. Odeur de racinette au froissement. Couleurs d'automne orange.","diff":"Le mûrier a des feuilles variables aussi, mais dentées et du latex.","conf":["morus-alba","liriodendron-tulipifera"]},{"id":"tilia-tomentosa","lat":"Tilia tomentosa","fr":"Tilleul argenté","fam":"Malvacées","type":"Arbre caduc","orig":"Balkans, Turquie","lvl":4,"tip":"Feuilles en cœur au revers entièrement feutré de blanc argenté : l'arbre scintille au vent. Fleurs très parfumées en juillet.","diff":"Les autres tilleuls ont seulement des touffes de poils aux aisselles des nervures.","conf":["tilia-europaea","tilia-platyphyllos"]},{"id":"tilia-americana","lat":"Tilia americana","fr":"Tilleul d'Amérique","fam":"Malvacées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":4,"tip":"Très grandes feuilles en cœur (jusqu'à 20 cm), vertes et glabres des deux côtés, à grosses dents.","diff":"Le tilleul à grandes feuilles européen a des feuilles velues dessous.","conf":["tilia-platyphyllos","tilia-europaea"]},{"id":"acer-monspessulanum","lat":"Acer monspessulanum","fr":"Érable de Montpellier","fam":"Sapindacées","type":"Arbre caduc","orig":"Méditerranée","lvl":4,"tip":"Petites feuilles opposées coriaces à 3 lobes arrondis égaux, au bord entier. Samares rougeâtres presque parallèles. Coteaux secs du Midi.","diff":"L'érable champêtre a 5 lobes et du latex ; l'érable de Montpellier a 3 lobes égaux.","conf":["acer-campestre","acer-opalus"]},{"id":"acer-negundo","lat":"Acer negundo","fr":"Érable negundo","fam":"Sapindacées","type":"Arbre caduc","orig":"Amérique du Nord","lvl":4,"tip":"Le seul érable courant à feuilles composées : 3 à 7 folioles dentées, opposées. Rameaux verts souvent couverts d'une pruine bleutée. Samares en V. Formes panachées fréquentes.","diff":"Le frêne a des folioles plus nombreuses et des bourgeons noirs ; le negundo a des rameaux verts pruinés.","conf":["fraxinus-excelsior","sambucus-nigra"]},{"id":"acer-opalus","lat":"Acer opalus","fr":"Érable à feuilles d'obier","fam":"Sapindacées","type":"Arbre caduc","orig":"Europe du Sud","lvl":4,"tip":"Feuilles opposées à 5 lobes peu profonds et arrondis, plus larges que longues. Floraison jaune avant les feuilles. Montagnes calcaires du Sud.","diff":"L'érable sycomore a des feuilles plus grandes à lobes plus marqués ; l'érable de Montpellier n'a que 3 lobes.","conf":["acer-pseudoplatanus","acer-monspessulanum"]},{"id":"cupressus-macrocarpa","lat":"Cupressus macrocarpa","fr":"Cyprès de Lambert","fam":"Cupressacées","type":"Conifère persistant","orig":"Californie","lvl":5,"tip":"Cyprès du littoral à la couronne étalée, tabulaire avec l'âge. Feuillage vert vif à odeur de citron. Gros cônes de 3-4 cm.","diff":"Le cyprès de Provence est une colonne étroite ; le Leyland a un feuillage plus plat.","conf":["cupressus-sempervirens","cuprocyparis-leylandii"]},{"id":"cuprocyparis-leylandii","lat":"× Cuprocyparis leylandii","fr":"Cyprès de Leyland","fam":"Cupressacées","type":"Conifère persistant","orig":"Hybride horticole","lvl":5,"tip":"Croissance très rapide (plus d'1 m par an). Rameaux denses, légèrement aplatis, irréguliers en 3D, vert grisé. Flèche dressée. Le grand classique des haies hautes.","diff":"Le thuya a des rameaux bien plus plats et réguliers, à l'odeur fruitée. Le faux-cyprès a une flèche retombante.","conf":["thuja-occidentalis","chamaecyparis-lawsoniana"]},{"id":"cupressus-arizonica","lat":"Cupressus arizonica","fr":"Cyprès de l'Arizona","fam":"Cupressacées","type":"Conifère persistant","orig":"Sud-ouest des États-Unis","lvl":5,"tip":"Feuillage en écailles bleu-gris, avec des points de résine blanche. Écorce rouge-brun qui s'exfolie en plaques. Cônes ronds de 2-3 cm.","diff":"Le cyprès de Provence est vert sombre et très étroit.","conf":["cupressus-sempervirens","cupressus-macrocarpa"]},{"id":"cupressus-lusitanica","lat":"Cupressus lusitanica","fr":"Cyprès du Portugal","fam":"Cupressacées","type":"Conifère persistant","orig":"Mexique, Amérique centrale","lvl":5,"tip":"Cyprès aux rameaux pendants, au feuillage gris-bleu. Petits cônes ronds glauques.","diff":"Le cyprès de l'Arizona a une écorce rouge qui s'exfolie et des rameaux plus raides.","conf":["cupressus-arizonica","cupressus-sempervirens"]},{"id":"cedrus-atlantica","lat":"Cedrus atlantica","fr":"Cèdre de l'Atlas","fam":"Pinacées","type":"Conifère persistant","orig":"Afrique du Nord","lvl":5,"tip":"Aiguilles courtes en rosettes sur de petits rameaux courts. Cônes en forme de tonnelets dressés sur les branches. La flèche (sommet) se tient droite. Forme bleue 'Glauca' très plantée.","diff":"Le cèdre du Liban a des étages horizontaux en plateaux. Le déodar a une flèche qui retombe. Le mélèze perd ses aiguilles en hiver.","conf":["larix-decidua","cedrus-libani","cedrus-deodara"]},{"id":"cedrus-deodara","lat":"Cedrus deodara","fr":"Cèdre de l'Himalaya","fam":"Pinacées","type":"Conifère persistant","orig":"Himalaya","lvl":5,"tip":"Aiguilles longues (jusqu'à 5 cm) et souples. Branches et flèche retombantes, ce qui lui donne un port pleureur gracieux.","diff":"Les cèdres de l'Atlas et du Liban ont des aiguilles plus courtes et un sommet qui ne retombe pas.","conf":["cedrus-atlantica","cedrus-libani"]},{"id":"cedrus-libani","lat":"Cedrus libani","fr":"Cèdre du Liban","fam":"Pinacées","type":"Conifère persistant","orig":"Liban, Turquie","lvl":5,"tip":"Adulte, il forme de grands étages horizontaux en plateaux et un sommet aplati. Aiguilles vert sombre un peu plus longues que l'Atlas. Jeune, sa flèche s'incline légèrement.","diff":"Le cèdre de l'Atlas a des branches qui montent en oblique et des aiguilles courtes, souvent bleutées. Le déodar a des rameaux retombants.","conf":["cedrus-atlantica","cedrus-deodara"]},{"id":"calocedrus-decurrens","lat":"Calocedrus decurrens","fr":"Cèdre à encens","fam":"Cupressacées","type":"Conifère persistant","orig":"Ouest des États-Unis","lvl":5,"tip":"Colonne étroite et dense. Rameaux plats aux écailles allongées par 4, vert foncé. Petits cônes en bec de canard. Écorce rouge fibreuse.","diff":"Le thuya géant a un port plus large et une odeur d'ananas.","conf":["thuja-plicata","cupressus-sempervirens"]},{"id":"pseudotsuga-menziesii","lat":"Pseudotsuga menziesii","fr":"Douglas","fam":"Pinacées","type":"Conifère persistant","orig":"Ouest de l'Amérique du Nord","lvl":5,"tip":"Aiguilles souples, plates, à odeur d'agrume. Bourgeons pointus brun-rouge, comme ceux du hêtre. Cônes pendants avec des bractées à 3 pointes qui dépassent (« queues de souris »).","diff":"Le sapin a des cônes dressés ; l'épicéa a des aiguilles piquantes sur coussinets.","conf":["abies-alba","picea-abies","tsuga-heterophylla"]},{"id":"chamaecyparis-lawsoniana","lat":"Chamaecyparis lawsoniana","fr":"Faux-cyprès de Lawson","fam":"Cupressacées","type":"Conifère persistant","orig":"Ouest des États-Unis","lvl":5,"tip":"Rameaux plats en éventail, avec de fines marques blanches en X dessous. Flèche qui retombe. Petits cônes ronds. Odeur de persil au froissement.","diff":"Le thuya a des cônes allongés en tulipe et pas de marques en X. Le Leyland a une flèche dressée et des cônes bruns plus gros.","conf":["thuja-occidentalis","cuprocyparis-leylandii"]},{"id":"juniperus-communis","lat":"Juniperus communis","fr":"Genévrier commun","fam":"Cupressacées","type":"Conifère persistant","orig":"Hémisphère Nord","lvl":5,"tip":"Aiguilles par 3, très piquantes, avec une bande blanche dessus. Baies bleu-noir pruinées (galbules) qui mettent 2 ans à mûrir.","diff":"Le genévrier cade a 2 bandes blanches sur l'aiguille et des baies rouge-brun.","conf":["juniperus-oxycedrus","taxus-baccata"]},{"id":"juniperus-virginiana","lat":"Juniperus virginiana","fr":"Genévrier de Virginie","fam":"Cupressacées","type":"Conifère persistant","orig":"Est de l'Amérique du Nord","lvl":5,"tip":"Arbre conique à feuilles en écailles (aiguilles chez les jeunes). Écorce brun-rouge fibreuse en lanières. Petites baies bleues pruinées. Bois à odeur de crayon.","diff":"Le genévrier de Chine a des baies plus grosses et un feuillage moins fin.","conf":["thuja-occidentalis"]},{"id":"juniperus-horizontalis","lat":"Juniperus horizontalis","fr":"Genévrier rampant","fam":"Cupressacées","type":"Conifère persistant","orig":"Amérique du Nord","lvl":5,"tip":"Genévrier rampant à feuillage en écailles, bleu-vert, qui vire au pourpre en hiver. Rameaux plaqués au sol.","diff":"Le genévrier sabine a des rameaux plus dressés et une odeur forte.","conf":["juniperus-sabina"]},{"id":"juniperus-sabina","lat":"Juniperus sabina","fr":"Genévrier sabine","fam":"Cupressacées","type":"Conifère persistant","orig":"Montagnes d'Europe","lvl":5,"tip":"Genévrier bas aux feuilles en écailles qui dégagent une odeur forte et désagréable au froissement. Très toxique.","diff":"Le genévrier rampant n'a pas cette odeur forte.","conf":["juniperus-horizontalis"]},{"id":"larix-decidua","lat":"Larix decidua","fr":"Mélèze d'Europe","fam":"Pinacées","type":"Conifère caduc","orig":"Alpes, Carpates","lvl":5,"tip":"Conifère qui perd ses aiguilles : elles virent au jaune d'or en automne. Aiguilles tendres en touffes sur des rameaux courts. Petits cônes dressés.","diff":"Le cèdre a des rosettes similaires, mais persistantes et raides, et de gros cônes en tonneau.","conf":["cedrus-atlantica","metasequoia-glyptostroboides"]},{"id":"larix-kaempferi","lat":"Larix kaempferi","fr":"Mélèze du Japon","fam":"Pinacées","type":"Conifère caduc","orig":"Japon","lvl":5,"tip":"Mélèze aux rameaux roux-orangé l'hiver et aux aiguilles bleutées. Cônes aux écailles retournées vers l'extérieur comme des roses.","diff":"Le mélèze d'Europe a des rameaux jaune paille et des cônes aux écailles droites.","conf":["larix-decidua"]},{"id":"pinus-cembra","lat":"Pinus cembra","fr":"Pin cembro","fam":"Pinacées","type":"Conifère persistant","orig":"Alpes, Carpates","lvl":5,"tip":"Aiguilles par 5, souples, vert-bleu. Cônes violacés qui ne s'ouvrent pas et contiennent de grosses graines comestibles. Haute montagne.","diff":"Le pin de Weymouth a aussi 5 aiguilles mais longues et fines, et des cônes allongés pendants.","conf":["pinus-strobus"]},{"id":"pinus-coulteri","lat":"Pinus coulteri","fr":"Pin de Coulter","fam":"Pinacées","type":"Conifère persistant","orig":"Californie","lvl":5,"tip":"Pin aux aiguilles par 3, très longues. Cônes énormes et lourds (jusqu'à 2-3 kg) aux écailles en crochets très épais.","diff":"Le pin de Jeffrey a des cônes plus légers aux pointes rentrées.","conf":["pinus-pinea"]},{"id":"pinus-radiata","lat":"Pinus radiata","fr":"Pin de Monterey","fam":"Pinacées","type":"Conifère persistant","orig":"Californie","lvl":5,"tip":"Aiguilles par 3, vert vif, fines. Cônes asymétriques serrés contre la branche, qui restent fermés des années. Littoral atlantique.","diff":"Le pin maritime a 2 aiguilles par gaine, plus épaisses.","conf":["pinus-pinaster","pinus-nigra"]},{"id":"pinus-strobus","lat":"Pinus strobus","fr":"Pin de Weymouth","fam":"Pinacées","type":"Conifère persistant","orig":"Est de l'Amérique du Nord","lvl":5,"tip":"Aiguilles par 5, fines et douces au toucher, bleu-vert. Longs cônes étroits et pendants, souvent résineux. Écorce lisse sur les jeunes arbres.","diff":"Le pin de l'Himalaya a des aiguilles bien plus longues et pendantes.","conf":["pinus-cembra"]},{"id":"pinus-mugo","lat":"Pinus mugo","fr":"Pin des montagnes","fam":"Pinacées","type":"Conifère persistant","orig":"Montagnes d'Europe","lvl":5,"tip":"Pin rampant ou buissonnant à plusieurs tiges. Aiguilles par 2, courtes, vert sombre, serrées. Très utilisé en rocaille.","diff":"Le pin à crochets est un arbre à tronc unique.","conf":["pinus-sylvestris"]},{"id":"pinus-banksiana","lat":"Pinus banksiana","fr":"Pin gris","fam":"Pinacées","type":"Conifère persistant","orig":"Canada","lvl":5,"tip":"Pin aux aiguilles par 2, très courtes, tordues et écartées. Cônes recourbés vers le bout du rameau, qui restent fermés.","diff":"Le pin tordu a des cônes épineux droits.","conf":["pinus-contorta","pinus-sylvestris"]},{"id":"pinus-pinaster","lat":"Pinus pinaster","fr":"Pin maritime","fam":"Pinacées","type":"Conifère persistant","orig":"Ouest de la Méditerranée","lvl":5,"tip":"Aiguilles par 2, très longues (15-25 cm), épaisses et raides. Gros cônes brillants brun-rouge, coniques. Écorce épaisse rouge-brun en plaques. Forêt des Landes.","diff":"Le pin noir a des aiguilles plus courtes et sombres ; le pin parasol a des cônes ronds et une couronne plate.","conf":["pinus-nigra","pinus-pinea","pinus-halepensis"]},{"id":"pinus-nigra","lat":"Pinus nigra","fr":"Pin noir d'Autriche","fam":"Pinacées","type":"Conifère persistant","orig":"Europe du Sud","lvl":5,"tip":"Aiguilles par 2, longues (8-15 cm), raides et vert très sombre. Écorce grise à noirâtre jusqu'en haut. Cône brillant symétrique. Supporte le calcaire et les embruns.","diff":"Le pin sylvestre a des aiguilles courtes et bleutées et une écorce orangée en haut du tronc.","conf":["pinus-sylvestris","pinus-pinea"]},{"id":"pinus-ponderosa","lat":"Pinus ponderosa","fr":"Pin ponderosa","fam":"Pinacées","type":"Conifère persistant","orig":"Ouest de l'Amérique du Nord","lvl":5,"tip":"Aiguilles par 3, très longues (15-25 cm), groupées en touffes au bout des rameaux. Écorce orange en grandes plaques à odeur de vanille.","diff":"Le pin maritime a 2 aiguilles par gaine.","conf":["pinus-pinaster","pinus-radiata"]},{"id":"pinus-sylvestris","lat":"Pinus sylvestris","fr":"Pin sylvestre","fam":"Pinacées","type":"Conifère persistant","orig":"Europe, Asie","lvl":5,"tip":"Aiguilles par 2, courtes (4-7 cm), torsadées et bleutées. Le haut du tronc a une écorce orange saumoné, très reconnaissable de loin.","diff":"Le pin noir d'Autriche a des aiguilles plus longues, raides et vert sombre, et une écorce grise jusqu'en haut.","conf":["pinus-nigra","pinus-pinea"]},{"id":"pinus-contorta","lat":"Pinus contorta","fr":"Pin tordu","fam":"Pinacées","type":"Conifère persistant","orig":"Ouest de l'Amérique du Nord","lvl":5,"tip":"Aiguilles par 2, courtes, souvent tordues, vert-jaune. Petits cônes asymétriques épineux qui restent sur l'arbre.","diff":"Le pin sylvestre a une écorce orangée et des aiguilles bleutées.","conf":["pinus-sylvestris","pinus-mugo"]},{"id":"tsuga-heterophylla","lat":"Tsuga heterophylla","fr":"Pruche de l'Ouest","fam":"Pinacées","type":"Conifère persistant","orig":"Ouest de l'Amérique du Nord","lvl":5,"tip":"Petites aiguilles plates de longueurs inégales sur le même rameau. La flèche retombe gracieusement. Très petits cônes au bout des rameaux.","diff":"Le douglas a des aiguilles égales et des cônes à bractées en fourche.","conf":["tsuga-canadensis","taxus-baccata"]},{"id":"tsuga-canadensis","lat":"Tsuga canadensis","fr":"Pruche du Canada","fam":"Pinacées","type":"Conifère persistant","orig":"Est de l'Amérique du Nord","lvl":5,"tip":"Aiguilles plates courtes, avec une rangée d'aiguilles retournées sur le dessus du rameau montrant leur revers blanc. Petits cônes.","diff":"La pruche de l'Ouest n'a pas cette rangée d'aiguilles retournées.","conf":["tsuga-heterophylla","taxus-baccata"]},{"id":"abies-balsamea","lat":"Abies balsamea","fr":"Sapin baumier","fam":"Pinacées","type":"Conifère persistant","orig":"Canada","lvl":5,"tip":"Sapin aux aiguilles plates très odorantes (baume), à 2 bandes blanches dessous. Écorce lisse avec des poches de résine.","diff":"Le sapin de Corée a des aiguilles plus courtes et des cônes violets dès le jeune âge.","conf":["abies-alba"]},{"id":"abies-pinsapo","lat":"Abies pinsapo","fr":"Sapin d'Espagne","fam":"Pinacées","type":"Conifère persistant","orig":"Sud de l'Espagne","lvl":5,"tip":"Aiguilles courtes, épaisses et raides, disposées tout autour du rameau comme un goupillon. Bleuté chez certaines formes. Cônes dressés.","diff":"Les autres sapins ont des aiguilles plates en peigne. Le pinsapo a des aiguilles en brosse radiale.","conf":["picea-omorika"]},{"id":"abies-nordmanniana","lat":"Abies nordmanniana","fr":"Sapin de Nordmann","fam":"Pinacées","type":"Conifère persistant","orig":"Caucase","lvl":5,"tip":"Aiguilles plates, vert foncé brillant, denses, couchées vers l'avant sur le dessus du rameau, avec 2 bandes blanches dessous. Bourgeons non résineux. Le sapin de Noël qui ne perd pas ses aiguilles.","diff":"Le sapin pectiné a des aiguilles étalées en peigne de chaque côté ; l'épicéa a des aiguilles piquantes sur coussinets.","conf":["abies-alba","picea-abies"]},{"id":"abies-alba","lat":"Abies alba","fr":"Sapin pectiné","fam":"Pinacées","type":"Conifère persistant","orig":"Montagnes d'Europe","lvl":5,"tip":"Aiguilles plates, souples, échancrées au bout, avec 2 bandes blanches dessous. L'aiguille arrachée laisse une cicatrice ronde et plate. Cônes dressés qui se désagrègent sur l'arbre.","diff":"L'épicéa a des aiguilles piquantes sur un petit coussinet, et des cônes pendants qui tombent entiers. « Le sapin se tient, l'épicéa pend. »","conf":["taxus-baccata","picea-abies"]},{"id":"thuja-occidentalis","lat":"Thuja occidentalis","fr":"Thuya du Canada","fam":"Cupressacées","type":"Conifère persistant","orig":"Amérique du Nord","lvl":5,"tip":"Rameaux aplatis en éventails, couverts de petites écailles. Petits cônes allongés dressés, qui s'ouvrent comme une tulipe. Odeur fruitée au froissement.","diff":"Le faux-cyprès de Lawson a des cônes ronds et des marques blanches en X sous les rameaux. Le Leyland a des rameaux moins plats et pousse bien plus vite.","conf":["chamaecyparis-lawsoniana","cuprocyparis-leylandii"]},{"id":"thuja-plicata","lat":"Thuja plicata","fr":"Thuya géant","fam":"Cupressacées","type":"Conifère persistant","orig":"Ouest de l'Amérique du Nord","lvl":5,"tip":"Rameaux plats luisants à l'odeur fruitée d'ananas. Marques blanchâtres en papillon dessous. Écorce rouge fibreuse. Très grand arbre.","diff":"Le thuya du Canada a un feuillage plus terne et jaunit en hiver.","conf":["thuja-occidentalis","chamaecyparis-lawsoniana"]},{"id":"picea-abies","lat":"Picea abies","fr":"Épicéa commun","fam":"Pinacées","type":"Conifère persistant","orig":"Europe","lvl":5,"tip":"Aiguilles piquantes, à 4 faces, fixées sur un petit coussinet qui rend le rameau rugueux une fois dénudé. Cônes pendants qui tombent entiers. C'est le « sapin de Noël » classique.","diff":"Le sapin a des aiguilles plates, souples et non piquantes, et des cônes dressés.","conf":["abies-alba"]},{"id":"picea-orientalis","lat":"Picea orientalis","fr":"Épicéa d'Orient","fam":"Pinacées","type":"Conifère persistant","orig":"Caucase, Turquie","lvl":5,"tip":"Aiguilles très courtes (moins d'1 cm), émoussées, vert foncé brillant, serrées contre le rameau.","diff":"L'épicéa commun a des aiguilles 2 fois plus longues et pointues.","conf":["picea-abies","abies-nordmanniana"]},{"id":"picea-omorika","lat":"Picea omorika","fr":"Épicéa de Serbie","fam":"Pinacées","type":"Conifère persistant","orig":"Serbie, Bosnie","lvl":5,"tip":"Silhouette en flèche très étroite aux branches pendantes relevées au bout. Aiguilles plates pour un épicéa, avec 2 bandes blanches dessous.","diff":"L'épicéa commun est bien plus large avec des aiguilles vertes à 4 faces.","conf":["picea-abies","abies-alba"]},{"id":"picea-sitchensis","lat":"Picea sitchensis","fr":"Épicéa de Sitka","fam":"Pinacées","type":"Conifère persistant","orig":"Côte pacifique nord-américaine","lvl":5,"tip":"Aiguilles plates, très raides et très piquantes, bleutées dessous. Cônes pendants aux écailles ondulées papyracées. Planté en forêt en Bretagne et dans le Massif central.","diff":"L'épicéa commun a des aiguilles vertes moins piquantes.","conf":["picea-abies","picea-pungens"]},{"id":"picea-pungens","lat":"Picea pungens","fr":"Épicéa du Colorado","fam":"Pinacées","type":"Conifère persistant","orig":"Montagnes Rocheuses","lvl":5,"tip":"Aiguilles raides, très piquantes, à 4 faces, souvent bleu argenté ('Glauca'), sur des coussinets. Cônes pendants.","diff":"Le sapin du Colorado est bleu mais ses aiguilles sont plates et souples.","conf":["picea-abies"]},{"id":"picea-glauca","lat":"Picea glauca","fr":"Épinette blanche","fam":"Pinacées","type":"Conifère persistant","orig":"Canada","lvl":5,"tip":"Aiguilles bleu-vert qui sentent le cassis ou la souris au froissement. Forme naine en cône parfait très répandue ('Conica').","diff":"L'épicéa du Colorado est plus piquant ; la forme 'Conica' est un cône dense vert clair.","conf":["picea-abies","picea-pungens"]},{"id":"picea-mariana","lat":"Picea mariana","fr":"Épinette noire","fam":"Pinacées","type":"Conifère persistant","orig":"Canada","lvl":5,"tip":"Petit épicéa des tourbières aux aiguilles courtes bleu-vert. Petits cônes ovales violacés qui restent groupés au sommet.","diff":"L'épinette blanche a des aiguilles plus longues et des cônes cylindriques.","conf":["picea-glauca","picea-abies"]},{"id":"artemisia-absinthium","lat":"Artemisia absinthium","fr":"Absinthe","fam":"Astéracées","type":"Sous-arbrisseau","orig":"Europe, Asie","lvl":6,"tip":"Feuilles découpées gris argenté, soyeuses, très amères et aromatiques. Panicules de petites boules jaunes.","diff":"La santoline a des feuilles en petits peignes et des boutons ronds bien visibles.","conf":["santolina-chamaecyparissus"]},{"id":"acanthus-mollis","lat":"Acanthus mollis","fr":"Acanthe","fam":"Acanthacées","type":"Vivace","orig":"Méditerranée","lvl":6,"tip":"Grandes feuilles vert foncé brillant, profondément découpées. Hampes de fleurs blanches et pourpres protégées par des bractées épineuses. Feuille du chapiteau corinthien.","diff":"Le panicaut a des feuilles épineuses bleues et des fleurs en têtes.","conf":["eryngium-planum"]},{"id":"achillea-millefolium","lat":"Achillea millefolium","fr":"Achillée millefeuille","fam":"Astéracées","type":"Vivace","orig":"Hémisphère Nord","lvl":6,"tip":"Feuilles très finement découpées comme une plume, aromatiques. Corymbes plats de petites fleurs blanches ou roses.","diff":"La carotte sauvage a des ombelles et des feuilles moins fines.","conf":["leucanthemum-vulgare"]},{"id":"alchemilla-mollis","lat":"Alchemilla mollis","fr":"Alchémille","fam":"Rosacées","type":"Vivace","orig":"Europe de l'Est, Caucase","lvl":6,"tip":"Feuilles rondes, plissées en éventail, veloutées. Les gouttes d'eau perlent à leur surface. Nuages de petites fleurs vert-jaune en juin.","diff":"L'heuchère a des feuilles lisses et colorées. L'alchémille, elle, a des feuilles veloutées vert tendre.","conf":["heuchera-micrantha"]},{"id":"aquilegia-vulgaris","lat":"Aquilegia vulgaris","fr":"Ancolie","fam":"Renonculacées","type":"Vivace","orig":"Europe","lvl":6,"tip":"Feuilles divisées en folioles lobées comme le trèfle, bleutées. Fleurs pendantes bleues, roses ou blanches, munies de 5 éperons recourbés.","diff":"Les éperons en crochet sont uniques.","conf":["geranium-sanguineum"]},{"id":"angelica-sylvestris","lat":"Angelica sylvestris","fr":"Angélique des bois","fam":"Apiacées","type":"Vivace","orig":"Europe","lvl":6,"tip":"Grande ombellifère des lieux humides. Tiges creuses violacées. Feuilles 2-3 fois divisées à gaine renflée. Ombelles blanc rosé bombées.","diff":"La berce a des feuilles lobées très velues ; le fenouil a des feuilles en fils et des fleurs jaunes.","conf":["foeniculum-vulgare","filipendula-ulmaria"]},{"id":"aristolochia-clematitis","lat":"Aristolochia clematitis","fr":"Aristoloche clématite","fam":"Aristolochiacées","type":"Vivace","orig":"Europe du Sud","lvl":6,"tip":"Vivace aux feuilles en cœur. Fleurs jaunes tubulaires renflées à la base, groupées à l'aisselle des feuilles. Fruits en poire. Toxique.","diff":"Le tamier a des fleurs vertes minuscules et des baies rouges.","conf":["tamus-communis"]},{"id":"asparagus-acutifolius","lat":"Asparagus acutifolius","fr":"Asperge sauvage","fam":"Asparagacées","type":"Sous-arbrisseau","orig":"Méditerranée","lvl":6,"tip":"Sous-arbrisseau du maquis aux tiges ligneuses couvertes de « feuilles » en aiguilles piquantes groupées. Jeunes pousses comestibles au printemps. Baies noires.","diff":"Le genévrier a de vraies aiguilles et des galbules.","conf":["juniperus-oxycedrus","ruscus-aculeatus"]},{"id":"aster-amellus","lat":"Aster amellus","fr":"Aster amelle","fam":"Astéracées","type":"Vivace","orig":"Europe","lvl":6,"tip":"Marguerites violettes à cœur jaune en fin d'été. Feuilles rugueuses ovales. Coteaux calcaires.","diff":"L'érigéron fleurit au printemps en petites pâquerettes blanches et roses.","conf":["echinacea-purpurea","erigeron-karvinskianus"]},{"id":"phalaris-arundinacea","lat":"Phalaris arundinacea","fr":"Baldingère","fam":"Poacées","type":"Graminée","orig":"Hémisphère Nord","lvl":6,"tip":"Grande graminée des berges aux feuilles larges, souvent panachées de blanc dans les jardins ('Picta'). Panicules violacées puis paille.","diff":"Le roseau commun est plus grand avec de gros plumeaux.","conf":["phragmites-australis"]},{"id":"bergenia-cordifolia","lat":"Bergenia cordifolia","fr":"Bergénia (plante des savetiers)","fam":"Saxifragacées","type":"Vivace","orig":"Sibérie, Altaï","lvl":6,"tip":"Grandes feuilles rondes, épaisses et luisantes, persistantes, qui rougissent en hiver. Frottées entre les doigts, elles grincent. Fleurs roses en fin d'hiver.","diff":"Le hosta a des feuilles fines aux nervures parallèles, qui disparaissent en hiver.","conf":["hosta-sieboldiana"]},{"id":"verbascum-thapsus","lat":"Verbascum thapsus","fr":"Bouillon-blanc","fam":"Scrophulariacées","type":"Bisannuelle","orig":"Europe","lvl":6,"tip":"Grande rosette de feuilles épaisses couvertes d'un feutre gris très doux. La 2e année, longue hampe dense de fleurs jaunes.","diff":"L'oreille d'ours a aussi des feuilles laineuses mais reste basse.","conf":["stachys-byzantina","digitalis-purpurea"]},{"id":"arundo-donax","lat":"Arundo donax","fr":"Canne de Provence","fam":"Poacées","type":"Graminée","orig":"Asie, Méditerranée","lvl":6,"tip":"Énorme roseau de 3 à 5 m aux tiges épaisses comme un bambou mais pleines aux nœuds. Feuilles larges bleutées, alternes sur deux rangs. Plumet en automne.","diff":"Le bambou a des feuilles en éventail au bout de rameaux et des tiges creuses à nœuds marqués.","conf":["phyllostachys-aurea","cortaderia-selloana"]},{"id":"dipsacus-fullonum","lat":"Dipsacus fullonum","fr":"Cardère sauvage","fam":"Caprifoliacées","type":"Bisannuelle","orig":"Europe","lvl":6,"tip":"Grande bisannuelle épineuse. Feuilles opposées soudées en coupe qui retient l'eau. Têtes ovales épineuses, fleurs mauves en anneaux.","diff":"Les chardons ont des feuilles libres et des fleurs en pompon au sommet.","conf":["echinops-ritro"]},{"id":"clematis-recta","lat":"Clematis recta","fr":"Clématite droite","fam":"Renonculacées","type":"Vivace","orig":"Europe","lvl":6,"tip":"Clématite herbacée dressée, non grimpante. Feuilles opposées compo
