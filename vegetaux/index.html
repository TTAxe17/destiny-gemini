comme des oreilles de lapin. Floraison dès avril. Préfère les sols acides.","diff":"La lavande vraie et le lavandin n'ont pas ces bractées en plumet au sommet de l'épi.","conf":["lavandula-angustifolia"]},{"id":"medicago-arborea","lat":"Medicago arborea","fr":"Luzerne arborescente","fam":"Fabacées","type":"Arbuste persistant","orig":"Méditerranée","lvl":8,"tip":"Arbuste du littoral aux feuilles à 3 folioles soyeuses grises. Fleurs jaunes en petites grappes. Gousses en spirale.","diff":"Le cytise a des grappes pendantes et pas de gousses spiralées.","conf":["coronilla-valentina","anthyllis-barba-jovis"]},{"id":"lycium-barbarum","lat":"Lycium barbarum","fr":"Lyciet (goji)","fam":"Solanacées","type":"Arbuste caduc","orig":"Chine","lvl":8,"tip":"Arbuste aux rameaux arqués souvent épineux. Feuilles étroites. Petites fleurs violettes, baies rouge-orange allongées (goji).","diff":"L'argousier a des baies orange serrées et des feuilles argentées.","conf":["hippophae-rhamnoides"]},{"id":"celtis-australis","lat":"Celtis australis","fr":"Micocoulier de Provence","fam":"Cannabacées","type":"Arbre caduc","orig":"Méditerranée","lvl":8,"tip":"Écorce grise et lisse comme celle du hêtre. Feuilles asymétriques, dentées, rugueuses, terminées par une longue pointe effilée. Petites baies noires sucrées sur un long pédoncule.","diff":"L'orme a des feuilles asymétriques aussi, mais sans longue pointe, et une écorce crevassée.","conf":["fagus-sylvatica","ulmus-minor"]},{"id":"myrtus-communis","lat":"Myrtus communis","fr":"Myrte commun","fam":"Myrtacées","type":"Arbuste persistant","orig":"Méditerranée","lvl":8,"tip":"Petites feuilles opposées pointues et brillantes. Par transparence, elles montrent des points translucides. Très aromatiques. Fleurs blanches aux étamines en houppe, baies bleu-noir.","diff":"Le buis a des feuilles arrondies sans parfum agréable ni points translucides.","conf":["buxus-sempervirens","pistacia-lentiscus"]},{"id":"rhamnus-alaternus","lat":"Rhamnus alaternus","fr":"Nerprun alaterne","fam":"Rhamnacées","type":"Arbuste persistant","orig":"Méditerranée","lvl":8,"tip":"Feuilles alternes, coriaces, luisantes, finement dentées, de forme variable. Petites fleurs jaunâtres très précoces, baies rouges puis noires.","diff":"Le filaria a des feuilles opposées. Regardez la disposition sur le rameau.","conf":["viburnum-tinus","phillyrea-angustifolia"]},{"id":"olea-europaea","lat":"Olea europaea","fr":"Olivier","fam":"Oléacées","type":"Arbre persistant","orig":"Méditerranée","lvl":8,"tip":"Feuilles opposées, étroites, gris-vert dessus et argentées dessous. Tronc noueux et creusé avec l'âge.","diff":"Le filaria (Phillyrea) a des feuilles plus vertes, sans revers argenté. L'éléagnus a des feuilles alternes ponctuées d'écailles rousses.","conf":["phillyrea-angustifolia"]},{"id":"paliurus-spina-christi","lat":"Paliurus spina-christi","fr":"Paliure (épine du Christ)","fam":"Rhamnacées","type":"Arbuste caduc","orig":"Méditerranée, Asie","lvl":8,"tip":"Rameaux en zigzag avec 2 épines à chaque nœud (une droite, une crochue). Feuilles ovales à 3 nervures. Fruits secs en disques ailés comme des chapeaux.","diff":"Le jujubier a des fruits charnus ovales.","conf":["ziziphus-jujuba"]},{"id":"chamaerops-humilis","lat":"Chamaerops humilis","fr":"Palmier nain","fam":"Arécacées","type":"Palmier","orig":"Méditerranée occidentale","lvl":8,"tip":"Le seul palmier indigène d'Europe. Forme une touffe de plusieurs troncs courts. Feuilles en éventail raides, souvent bleutées. Pétioles armés de fortes épines.","diff":"Le palmier de Chine a un tronc unique couvert de fibres et des pétioles presque lisses.","conf":["trachycarpus-fortunei"]},{"id":"thymelaea-hirsuta","lat":"Thymelaea hirsuta","fr":"Passerine hérissée","fam":"Thyméléacées","type":"Sous-arbrisseau","orig":"Méditerranée","lvl":8,"tip":"Sous-arbrisseau du littoral aux rameaux pendants couverts de minuscules feuilles écailleuses imbriquées, blanches et laineuses dessous.","diff":"Le tamaris a des feuilles en écailles mais c'est un arbuste à fleurs roses.","conf":["tamarix-gallica"]},{"id":"pinus-halepensis","lat":"Pinus halepensis","fr":"Pin d'Alep","fam":"Pinacées","type":"Conifère persistant","orig":"Méditerranée","lvl":8,"tip":"Aiguilles très fines, souples, vert clair, par 2. Écorce gris argenté sur les jeunes troncs. Cônes brun-rouge pointant vers l'arrière sur un pédoncule recourbé. Tronc souvent tortueux.","diff":"Le pin parasol a une couronne plate et régulière et de gros cônes ronds.","conf":["pinus-pinea"]},{"id":"pinus-pinea","lat":"Pinus pinea","fr":"Pin parasol","fam":"Pinacées","type":"Conifère persistant","orig":"Méditerranée","lvl":8,"tip":"Silhouette en parasol plat très reconnaissable. Aiguilles par 2, longues. Gros cônes ronds et lourds contenant les pignons. Écorce en grandes plaques rougeâtres.","diff":"Le pin d'Alep a une couronne irrégulière, des aiguilles fines vert clair et de petits cônes sur des pédoncules recourbés.","conf":["pinus-nigra","pinus-halepensis"]},{"id":"pistacia-lentiscus","lat":"Pistacia lentiscus","fr":"Pistachier lentisque","fam":"Anacardiacées","type":"Arbuste persistant","orig":"Méditerranée","lvl":8,"tip":"Feuilles composées d'un nombre pair de petites folioles (pas de foliole terminale), sur un axe ailé. Odeur résineuse forte. Petits fruits rouges puis noirs.","diff":"Le pistachier térébinthe est caduc et ses feuilles ont une foliole terminale. Le myrte a des feuilles simples.","conf":["myrtus-communis"]},{"id":"pistacia-terebinthus","lat":"Pistacia terebinthus","fr":"Pistachier térébinthe","fam":"Anacardiacées","type":"Arbuste caduc","orig":"Méditerranée","lvl":8,"tip":"Pistachier caduc. Feuilles composées à foliole terminale, à forte odeur de résine. Galles en cornes rouges. Fruits rouges puis bruns.","diff":"Le lentisque est persistant et ses feuilles n'ont pas de foliole terminale.","conf":["pistacia-lentiscus","rhus-typhina"]},{"id":"pittosporum-tobira","lat":"Pittosporum tobira","fr":"Pittosporum de Chine","fam":"Pittosporacées","type":"Arbuste persistant","orig":"Chine, Japon","lvl":8,"tip":"Feuilles obovales, épaisses, au bord légèrement enroulé, groupées en rosettes au bout des rameaux. Fleurs crème au parfum de fleur d'oranger.","diff":"Le Pittosporum tenuifolium a des petites feuilles ondulées et des tiges noires.","conf":["viburnum-tinus","pittosporum-tenuifolium"]},{"id":"osyris-alba","lat":"Osyris alba","fr":"Rouvet","fam":"Santalacées","type":"Sous-arbrisseau","orig":"Méditerranée","lvl":8,"tip":"Sous-arbrisseau parasite des racines, aux rameaux verts dressés et aux feuilles étroites. Petites fleurs jaunes parfumées, baies rouges.","diff":"Le genêt a des fleurs en papillon ; le rouvet a des fleurs étoilées minuscules.","conf":["spartium-junceum","daphne-gnidium"]},{"id":"salsola-vermiculata","lat":"Salsola vermiculata","fr":"Soude vermiculée","fam":"Amaranthacées","type":"Sous-arbrisseau","orig":"Méditerranée","lvl":8,"tip":"Sous-arbrisseau des littoraux et terres salées. Petites feuilles charnues grises. Fruits entourés d'ailes rosées.","diff":"L'arroche halime a des feuilles argentées plus larges.","conf":["atriplex-halimus"]},{"id":"rhus-coriaria","lat":"Rhus coriaria","fr":"Sumac des corroyeurs","fam":"Anacardiacées","type":"Arbuste caduc","orig":"Méditerranée","lvl":8,"tip":"Sumac aux feuilles composées à rachis ailé, velues. Grappes denses de fruits rouge-brun veloutés (épice sumac).","diff":"Le sumac de Virginie a des rameaux veloutés comme un bois de cerf et pas de rachis ailé.","conf":["rhus-typhina","pistacia-terebinthus"]},{"id":"tamarix-africana","lat":"Tamarix africana","fr":"Tamaris d'Afrique","fam":"Tamaricacées","type":"Arbuste caduc","orig":"Ouest de la Méditerranée","lvl":8,"tip":"Tamaris aux épis épais de fleurs blanches à rosées au printemps sur le bois de l'année précédente. Écorce sombre.","diff":"Le tamaris de France a des épis plus fins et roses.","conf":["tamarix-gallica","tamarix-parviflora"]},{"id":"tamarix-parviflora","lat":"Tamarix parviflora","fr":"Tamaris à petites fleurs","fam":"Tamaricacées","type":"Arbuste caduc","orig":"Balkans, Turquie","lvl":8,"tip":"Tamaris qui fleurit en avril-mai en épis roses le long des rameaux de l'année précédente, avant les feuilles. Fleurs à 4 pétales.","diff":"Le tamaris d'été fleurit en août sur les pousses de l'année.","conf":["tamarix-ramosissima","tamarix-gallica"]},{"id":"ligustrum-ovalifolium","lat":"Ligustrum ovalifolium","fr":"Troène de Californie","fam":"Oléacées","type":"Arbuste semi-persistant","orig":"Japon","lvl":8,"tip":"Feuilles opposées ovales, assez larges, vert brillant, au bord entier, sur des rameaux glabres. Le troène le plus courant des haies taillées. Formes panachées jaunes.","diff":"Le troène commun a des feuilles plus étroites et des rameaux légèrement duveteux. Le fusain du Japon a des feuilles finement crénelées.","conf":["ligustrum-vulgare","euonymus-japonicus"]},{"id":"ephedra-distachya","lat":"Ephedra distachya","fr":"Éphédra à deux épis","fam":"Éphédracées","type":"Sous-arbrisseau","orig":"Europe du Sud, Asie","lvl":8,"tip":"Sous-arbrisseau des dunes aux tiges vertes articulées, comme une prêle, sans feuilles visibles. Fruits charnus rouges.","diff":"La prêle est herbacée ; l'éphédra est ligneux.","conf":["genista-sagittalis"]},{"id":"acacia-melanoxylon","lat":"Acacia melanoxylon","fr":"Acacia à bois noir","fam":"Fabacées","type":"Arbre persistant","orig":"Australie","lvl":9,"tip":"Arbre aux phyllodes en lame droite à plusieurs nervures parallèles ; les jeunes plants ont des feuilles finement découpées. Pompons crème pâle.","diff":"Le mimosa d'hiver a des feuilles découpées et des pompons jaune vif.","conf":["acacia-dealbata","acacia-longifolia"]},{"id":"ailanthus-altissima","lat":"Ailanthus altissima","fr":"Ailante (faux vernis du Japon)","fam":"Simaroubacées","type":"Arbre caduc","orig":"Chine","lvl":9,"tip":"Très longues feuilles composées. Chaque foliole a 1 à 3 dents glanduleuses près de la base. Odeur désagréable. Espèce exotique envahissante.","diff":"Le noyer et le frêne n'ont pas ces petites dents glanduleuses à la base des folioles.","conf":["fraxinus-excelsior","juglans-regia"]},{"id":"fatsia-japonica","lat":"Fatsia japonica","fr":"Aralia du Japon","fam":"Araliacées","type":"Arbuste persistant","orig":"Japon","lvl":9,"tip":"Très grandes feuilles palmées, vernissées, à 7-9 lobes, sur de longs pétioles. Boules de fleurs crème en automne, puis baies noires. Ambiance tropicale à l'ombre.","diff":"Le ricin a des feuilles proches, mais pourpres ou vertes et très dentées, et c'est une plante annuelle.","conf":["hedera-helix"]},{"id":"ginkgo-biloba","lat":"Ginkgo biloba","fr":"Arbre aux quarante écus","fam":"Ginkgoacées","type":"Arbre caduc","orig":"Chine","lvl":9,"tip":"Feuille unique en éventail, aux nervures qui se divisent en fourche, souvent échancrée au centre. Groupée en bouquets sur des rameaux courts. Jaune d'or en automne.","diff":"Aucune autre plante n'a cette feuille. Les fruits des pieds femelles sentent le beurre rance.","conf":[]},{"id":"albizia-julibrissin","lat":"Albizia julibrissin","fr":"Arbre à soie","fam":"Fabacées","type":"Arbre caduc","orig":"Asie","lvl":9,"tip":"Feuillage très fin et plumeux, deux fois divisé, qui se replie la nuit. En été, houppes de fleurs roses soyeuses en pompons. Port en parasol.","diff":"Le févier a un feuillage proche, mais des fleurs discrètes et souvent des épines.","conf":["gleditsia-triacanthos","jacaranda-mimosifolia"]},{"id":"leptospermum-scoparium","lat":"Leptospermum scoparium","fr":"Arbre à thé (manuka)","fam":"Myrtacées","type":"Arbuste persistant","orig":"Nouvelle-Zélande, Australie","lvl":9,"tip":"Arbuste aux minuscules feuilles pointues et aromatiques. Couvert de petites fleurs blanches, roses ou rouges à 5 pétales. Petites capsules ligneuses.","diff":"Le myrte a des feuilles opposées plus grandes.","conf":["myrtus-communis","callistemon-citrinus"]},{"id":"aucuba-japonica","lat":"Aucuba japonica","fr":"Aucuba du Japon","fam":"Garryacées","type":"Arbuste persistant","orig":"Japon","lvl":9,"tip":"Grandes feuilles opposées vernissées et dentées, très souvent tachetées de jaune ('Variegata'). Rameaux verts. Baies rouges sur les pieds femelles. Supporte l'ombre sèche.","diff":"Le fusain du Japon a des feuilles plus petites. Le laurier-cerise a des feuilles alternes jamais tachetées de cette façon.","conf":["euonymus-japonicus"]},{"id":"nandina-domestica","lat":"Nandina domestica","fr":"Bambou sacré","fam":"Berbéridacées","type":"Arbuste persistant","orig":"Chine, Japon","lvl":9,"tip":"Ce n'est pas un bambou. Tiges dressées non ramifiées, avec des feuilles 2 ou 3 fois composées en petites folioles pointues, rouges en hiver. Grappes de baies rouges.","diff":"Un vrai bambou a des tiges creuses à nœuds et des feuilles simples, en lanières.","conf":["phyllostachys-aurea"]},{"id":"bougainvillea-spectabilis","lat":"Bougainvillea spectabilis","fr":"Bougainvillier","fam":"Nyctaginacées","type":"Liane persistante","orig":"Brésil","lvl":9,"tip":"Ce que l'on prend pour des pétales, ce sont 3 bractées colorées (magenta, orange, blanc) comme du papier. Elles entourent 3 petites fleurs tubulaires blanches. Tiges épineuses.","diff":"Le laurier-rose a de vraies fleurs à 5 pétales et des feuilles étroites.","conf":["nerium-oleander"]},{"id":"buddleja-globosa","lat":"Buddleja globosa","fr":"Buddleia à boules","fam":"Scrophulariacées","type":"Arbuste semi-persistant","orig":"Chili, Argentine","lvl":9,"tip":"Buddleia aux feuilles lancéolées ridées, feutrées dessous. Boules orange vif parfumées en juin.","diff":"L'arbre aux papillons a des panicules violettes allongées.","conf":["buddleja-davidii"]},{"id":"camellia-japonica","lat":"Camellia japonica","fr":"Camélia du Japon","fam":"Théacées","type":"Arbuste persistant","orig":"Japon, Chine, Corée","lvl":9,"tip":"Feuilles alternes, épaisses, vernissées, finement dentées. Gros boutons ronds. Grandes fleurs rouges, roses ou blanches en fin d'hiver. Terre acide.","diff":"Le laurier-cerise a des feuilles plus longues avec des glandes au revers. Le camélia a des dents fines tout le long.","conf":["prunus-laurocerasus","skimmia-japonica"]},{"id":"catalpa-bignonioides","lat":"Catalpa bignonioides","fr":"Catalpa","fam":"Bignoniacées","type":"Arbre caduc","orig":"Sud-est des États-Unis","lvl":9,"tip":"Très grandes feuilles en cœur, souvent groupées par 3 au même niveau. Elles sentent mauvais froissées. Fleurs blanches tachetées en juillet, puis longues gousses pendantes comme des haricots.","diff":"Le paulownia a des feuilles opposées très velues et fleurit en mauve avant les feuilles.","conf":["cercis-siliquastrum","paulownia-tomentosa"]},{"id":"quercus-rubra","lat":"Quercus rubra","fr":"Chêne rouge d'Amérique","fam":"Fagacées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":9,"tip":"Grandes feuilles à lobes pointus terminés par de fines soies, rouges en automne. Écorce grise lisse avec des bandes claires. Glands courts dans une cupule plate.","diff":"Les chênes européens ont des lobes arrondis. Une feuille de chêne à lobes pointus vient d'Amérique.","conf":["quercus-robur","liquidambar-styraciflua"]},{"id":"liquidambar-styraciflua","lat":"Liquidambar styraciflua","fr":"Copalme d'Amérique","fam":"Altingiacées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":9,"tip":"Feuille alterne en étoile à 5-7 lobes pointus, qui sent la résine au froissement. Rameaux souvent liégeux. Fruits en boules hérissées. Superbes couleurs d'automne.","diff":"Les érables ont des feuilles opposées. Le copalme les a alternes.","conf":["acer-platanoides","platanus-hispanica","acer-palmatum"]},{"id":"cordyline-australis","lat":"Cordyline australis","fr":"Cordyline (palmier de Torbay)","fam":"Asparagacées","type":"Arbre persistant","orig":"Nouvelle-Zélande","lvl":9,"tip":"Ce n'est pas un palmier. Touffes de longues feuilles étroites et souples au sommet de troncs qui se ramifient après la floraison. Panicules de petites fleurs crème parfumées.","diff":"Le yucca a des feuilles raides et piquantes. Le phormium n'a pas de tronc.","conf":["phormium-tenax","yucca-gloriosa"]},{"id":"cornus-florida","lat":"Cornus florida","fr":"Cornouiller à fleurs","fam":"Cornacées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":9,"tip":"Au printemps, 4 grandes bractées blanches ou roses, échancrées au sommet, entourent un bouton de vraies fleurs. Nervures arquées typiques des cornouillers.","diff":"Le cornouiller kousa a des bractées pointues, fleurit après les feuilles et donne des fruits en framboise.","conf":["cornus-sanguinea"]},{"id":"taxodium-distichum","lat":"Taxodium distichum","fr":"Cyprès chauve","fam":"Cupressacées","type":"Conifère caduc","orig":"Sud-est des États-Unis","lvl":9,"tip":"Conifère caduc à aiguilles plates alternes, roux cuivré en automne. Au bord de l'eau, il fait sortir du sol des racines-genoux (pneumatophores). Base du tronc évasée.","diff":"Le métaséquoia a des aiguilles opposées et un tronc plus cannelé.","conf":["metasequoia-glyptostroboides"]},{"id":"cryptomeria-japonica","lat":"Cryptomeria japonica","fr":"Cèdre du Japon","fam":"Cupressacées","type":"Conifère persistant","orig":"Japon","lvl":9,"tip":"Aiguilles courtes en alène, recourbées vers l'avant, disposées en spirale autour du rameau. Écorce rousse qui se détache en lanières. Petits cônes ronds hérissés.","diff":"Le séquoia géant a des écailles plaquées contre le rameau. Le cryptomeria a des aiguilles plus longues, recourbées et décollées.","conf":["sequoiadendron-giganteum","araucaria-araucana"]},{"id":"araucaria-araucana","lat":"Araucaria araucana","fr":"Désespoir des singes","fam":"Araucariacées","type":"Conifère persistant","orig":"Chili, Argentine","lvl":9,"tip":"Branches en candélabre couvertes de grosses écailles triangulaires, épaisses, très piquantes, qui se chevauchent. Silhouette étrange de fossile vivant.","diff":"Aucun autre conifère rustique n'a ces écailles larges et dures comme des écailles de reptile.","conf":["cryptomeria-japonica"]},{"id":"fascicularia-bicolor","lat":"Fascicularia bicolor","fr":"Fascicularia","fam":"Broméliacées","type":"Vivace","orig":"Chili","lvl":9,"tip":"Broméliacée terrestre en rosettes de feuilles épineuses, dont le centre devient rouge vif à la floraison, avec des fleurs bleues.","diff":"Les agaves ont des feuilles charnues plus larges.","conf":["agave-americana"]},{"id":"schinus-molle","lat":"Schinus molle","fr":"Faux poivrier","fam":"Anacardiacées","type":"Arbre persistant","orig":"Pérou","lvl":9,"tip":"Arbre aux rameaux pleureurs, aux feuilles composées très fines à odeur poivrée. Grappes de baies roses (« baies roses »).","diff":"Le saule pleureur n'a pas de feuilles composées ni d'odeur poivrée.","conf":["salix-babylonica","pistacia-lentiscus"]},{"id":"dicksonia-antarctica","lat":"Dicksonia antarctica","fr":"Fougère arborescente","fam":"Dicksoniacées","type":"Fougère","orig":"Australie, Tasmanie","lvl":9,"tip":"Grandes frondes (feuilles de fougère) en couronne au sommet d'un faux tronc fibreux, fait de racines. Les jeunes frondes se déroulent en crosse.","diff":"Les palmiers ont des feuilles en plume ou en éventail, sans crosses ni spores sous les feuilles.","conf":["phoenix-canariensis"]},{"id":"eucalyptus-globulus","lat":"Eucalyptus globulus","fr":"Gommier bleu","fam":"Myrtacées","type":"Arbre persistant","orig":"Australie, Tasmanie","lvl":9,"tip":"Jeunes feuilles bleu argenté, sans pétiole, embrassant la tige. Feuilles adultes en faucille pendante. Fruits en toupie à 4 côtes. Écorce qui pèle en longues bandes.","diff":"Le gommier cidre a des jeunes feuilles rondes plus petites et des fruits minuscules.","conf":["eucalyptus-gunnii"]},{"id":"eucalyptus-gunnii","lat":"Eucalyptus gunnii","fr":"Gommier cidre","fam":"Myrtacées","type":"Arbre persistant","orig":"Tasmanie","lvl":9,"tip":"Jeunes feuilles rondes, opposées, bleu argenté. Les feuilles adultes deviennent allongées en faucille et pendantes. Écorce qui pèle en plaques. Odeur d'eucalyptus au froissement.","diff":"L'olivier a des feuilles étroites mais pas rondes, et sans l'odeur camphrée.","conf":["olea-europaea"]},{"id":"griselinia-littoralis","lat":"Griselinia littoralis","fr":"Griselinia","fam":"Griseliniacées","type":"Arbuste persistant","orig":"Nouvelle-Zélande","lvl":9,"tip":"Arbuste de haie du littoral aux feuilles ovales épaisses, vert pomme brillant, asymétriques à la base.","diff":"Le pittosporum a des feuilles plus petites ou en rosettes.","conf":["pittosporum-tobira","elaeagnus-submacrophylla"]},{"id":"grevillea-rosmarinifolia","lat":"Grevillea rosmarinifolia","fr":"Grévilléa à feuilles de romarin","fam":"Protéacées","type":"Arbuste persistant","orig":"Australie","lvl":9,"tip":"Feuilles en aiguilles comme le romarin, mais piquantes et sans odeur. Fleurs rouge et crème en forme d'araignée, aux longs styles recourbés, en hiver-printemps.","diff":"Le romarin est aromatique et a des fleurs bleues à lèvres.","conf":["salvia-rosmarinus","callistemon-citrinus"]},{"id":"ophiopogon-japonicus","lat":"Ophiopogon japonicus","fr":"Herbe aux turquoises","fam":"Asparagacées","type":"Couvre-sol","orig":"Chine, Japon","lvl":9,"tip":"Touffes de feuilles fines comme des herbes, vert foncé et persistantes. Petites fleurs lilas cachées dans le feuillage, puis baies bleu turquoise. La variété 'Nigrescens' est noire.","diff":"Un carex a des tiges triangulaires et des épis bruns. L'ophiopogon a des baies bleues.","conf":["festuca-glauca"]},{"id":"jacaranda-mimosifolia","lat":"Jacaranda mimosifolia","fr":"Jacaranda","fam":"Bignoniacées","type":"Arbre semi-caduc","orig":"Argentine, Bolivie","lvl":9,"tip":"Feuillage très fin, deux fois divisé, comme une fougère. Nuages de clochettes bleu-mauve au printemps, souvent avant les feuilles. Fruits ronds et plats comme des castagnettes.","diff":"L'arbre à soie a le même feuillage plumeux, mais des fleurs en pompons roses.","conf":["albizia-julibrissin","paulownia-tomentosa"]},{"id":"lagerstroemia-indica","lat":"Lagerstroemia indica","fr":"Lilas des Indes","fam":"Lythracées","type":"Arbre caduc","orig":"Chine","lvl":9,"tip":"Écorce lisse qui s'exfolie en laissant des taches beige, grises et roses. Fleurs crêpées roses, rouges ou blanches en fin d'été. Petites feuilles entières presque opposées.","diff":"Le platane a lui aussi une écorce marbrée, mais c'est un grand arbre à grandes feuilles lobées.","conf":["platanus-hispanica"]},{"id":"phormium-tenax","lat":"Phormium tenax","fr":"Lin de Nouvelle-Zélande","fam":"Asphodélacées","type":"Vivace","orig":"Nouvelle-Zélande","lvl":9,"tip":"Éventail de grandes feuilles en glaive, rigides, pliées en V à la base. Elles se fendent en fibres très résistantes. Formes pourpres ou panachées.","diff":"Le cordyline a lui aussi des feuilles en lanières, mais réunies en plumet au sommet d'un tronc.","conf":["yucca-gloriosa","cordyline-australis"]},{"id":"magnolia-grandiflora","lat":"Magnolia grandiflora","fr":"Magnolia à grandes fleurs","fam":"Magnoliacées","type":"Arbre persistant","orig":"Sud-est des États-Unis","lvl":9,"tip":"Grandes feuilles épaisses et luisantes, dont le revers est souvent feutré de roux. Énormes fleurs blanches parfumées en été.","diff":"Le laurier-cerise a des feuilles plus fines, sans revers roux, et des grappes de petites fleurs.","conf":["prunus-laurocerasus"]},{"id":"maytenus-boaria","lat":"Maytenus boaria","fr":"Maïten","fam":"Célastracées","type":"Arbre persistant","orig":"Chili, Argentine","lvl":9,"tip":"Arbre persistant aux rameaux fins retombants. Petites feuilles lancéolées finement dentées. Capsules qui s'ouvrent sur des graines rouges.","diff":"Le saule pleureur perd ses feuilles.","conf":["salix-babylonica","schinus-molle"]},{"id":"acacia-dealbata","lat":"Acacia dealbata","fr":"Mimosa","fam":"Fabacées","type":"Arbre persistant","orig":"Australie","lvl":9,"tip":"Feuilles 2 fois divisées en minuscules folioles bleu-gris argenté. En février, pompons jaune vif très parfumés. Côte d'Azur, Var, Bretagne.","diff":"Le mimosa des quatre saisons a des feuilles simples (phyllodes) en lame.","conf":["acacia-retinodes","albizia-julibrissin"]},{"id":"acacia-retinodes","lat":"Acacia retinodes","fr":"Mimosa des quatre saisons","fam":"Fabacées","type":"Arbre persistant","orig":"Australie","lvl":9,"tip":"Mimosa aux « feuilles » en lames étroites et entières (phyllodes). Pompons jaune pâle presque toute l'année. Supporte le calcaire.","diff":"Le mimosa d'hiver a des feuilles très finement découpées.","conf":["acacia-dealbata"]},{"id":"acacia-longifolia","lat":"Acacia longifolia","fr":"Mimosa à longues feuilles","fam":"Fabacées","type":"Arbuste persistant","orig":"Australie","lvl":9,"tip":"Arbuste aux phyllodes longs et étroits. Épis cylindriques jaune vif (pas des pompons) en fin d'hiver. Envahit les dunes.","diff":"Le mimosa des quatre saisons a des pompons ronds.","conf":["acacia-retinodes","acacia-melanoxylon"]},{"id":"luma-apiculata","lat":"Luma apiculata","fr":"Myrte du Chili","fam":"Myrtacées","type":"Arbre persistant","orig":"Chili, Argentine","lvl":9,"tip":"Écorce cannelle qui s'exfolie en laissant des taches blanches. Petites feuilles opposées aromatiques. Fleurs blanches à étamines en houppe, baies noires.","diff":"Le myrte a une écorce sans taches.","conf":["myrtus-communis","lagerstroemia-indica"]},{"id":"metasequoia-glyptostroboides","lat":"Metasequoia glyptostroboides","fr":"Métaséquoia","fam":"Cupressacées","type":"Conifère caduc","orig":"Chine","lvl":9,"tip":"Conifère caduc à aiguilles plates et tendres, opposées le long des rameaux. Elles tombent avec le rameau en automne, rousses. Tronc creusé de cannelures profondes. Connu d'abord à l'état fossile.","diff":"Le cyprès chauve a des aiguilles alternes et produit des pneumatophores (racines-genoux) au bord de l'eau.","conf":["larix-decidua","taxodium-distichum"]},{"id":"trachycarpus-fortunei","lat":"Trachycarpus fortunei","fr":"Palmier de Chine","fam":"Arécacées","type":"Palmier","orig":"Chine","lvl":9,"tip":"Feuilles en éventail rondes, découpées. Tronc couvert d'une fibre brune serrée qui ressemble à une toile. C'est le palmier le plus rustique (jusqu'à environ -15 °C).","diff":"Le palmier nain (Chamaerops) forme une touffe de plusieurs troncs et ses pétioles portent de fortes épines.","conf":["chamaerops-humilis","washingtonia-filifera"]},{"id":"phoenix-canariensis","lat":"Phoenix canariensis","fr":"Palmier des Canaries","fam":"Arécacées","type":"Palmier","orig":"Îles Canaries","lvl":9,"tip":"Feuilles pennées (en plumes), très longues et arquées : couronne énorme et dense. Gros tronc marqué d'écailles en losange. Folioles du bas transformées en épines.","diff":"Le Washingtonia et le palmier de Chine ont des feuilles en éventail, pas en plume.","conf":["trachycarpus-fortunei","washingtonia-filifera"]},{"id":"washingtonia-filifera","lat":"Washingtonia filifera","fr":"Palmier jupon","fam":"Arécacées","type":"Palmier","orig":"Californie, Arizona","lvl":9,"tip":"Feuilles en éventail garnies de longs fils blancs qui pendent. Les vieilles feuilles sèches restent collées au tronc et forment une « jupe ». Tronc épais et droit.","diff":"Le palmier de Chine a un tronc couvert de fibres brunes et ses feuilles n'ont pas de fils blancs.","conf":["trachycarpus-fortunei","phoenix-canariensis"]},{"id":"paulownia-tomentosa","lat":"Paulownia tomentosa","fr":"Paulownia","fam":"Paulowniacées","type":"Arbre caduc","orig":"Chine","lvl":9,"tip":"Énormes feuilles opposées, veloutées des deux côtés. En avril, grandes clochettes mauves parfumées, avant les feuilles. Capsules brunes en forme d'œuf qui restent l'hiver.","diff":"Le catalpa fleurit en blanc après les feuilles et ses fruits sont de longues gousses.","conf":["catalpa-bignonioides"]},{"id":"pittosporum-undulatum","lat":"Pittosporum undulatum","fr":"Pittosporum ondulé","fam":"Pittosporacées","type":"Arbre persistant","orig":"Australie","lvl":9,"tip":"Arbre persistant aux feuilles ondulées vert brillant, au parfum de jasmin à la floraison. Capsules orange qui s'ouvrent sur des graines collantes.","diff":"Le pittosporum de Chine a des feuilles épaisses en rosettes et un port d'arbuste.","conf":["pittosporum-tobira","pittosporum-tenuifolium"]},{"id":"pittosporum-tenuifolium","lat":"Pittosporum tenuifolium","fr":"Pittosporum à petites feuilles","fam":"Pittosporacées","type":"Arbuste persistant","orig":"Nouvelle-Zélande","lvl":9,"tip":"Petites feuilles ovales au bord ondulé, vert clair, sur des rameaux noirs très contrastés. Nombreuses variétés panachées ou pourpres. Petites fleurs pourpre sombre au parfum de miel.","diff":"Le Pittosporum tobira a des feuilles épaisses en rosettes et des tiges grises.","conf":["pittosporum-tobira"]},{"id":"callistemon-citrinus","lat":"Melaleuca citrina","fr":"Rince-bouteille","fam":"Myrtacées","type":"Arbuste persistant","orig":"Australie","lvl":9,"tip":"Fleurs rouges en écouvillon autour des tiges : ce sont les étamines. La tige continue de pousser au-delà de la fleur. Feuilles étroites, raides, citronnées froissées. Longtemps appelé Callistemon citrinus.","diff":"Le grevillea a des fleurs en araignée ou en peigne, pas en goupillon cylindrique.","conf":["grevillea-rosmarinifolia"]},{"id":"skimmia-japonica","lat":"Skimmia japonica","fr":"Skimmia du Japon","fam":"Rutacées","type":"Arbuste persistant","orig":"Japon","lvl":9,"tip":"Petit arbuste en dôme. Feuilles lisses, groupées au bout des rameaux, qui sentent l'agrume froissées. Boutons rouges tout l'hiver, puis fleurs blanches parfumées.","diff":"Le piéris a des pousses rouges et des fleurs en clochettes pendantes, pas des boutons dressés.","conf":["choisya-ternata","pieris-japonica"]},{"id":"sequoiadendron-giganteum","lat":"Sequoiadendron giganteum","fr":"Séquoia géant","fam":"Cupressacées","type":"Conifère persistant","orig":"Sierra Nevada (Californie)","lvl":9,"tip":"Écorce rousse très épaisse et spongieuse : un coup de poing ne fait pas mal. Feuillage en écailles pointues plaquées en spirale sur des rameaux cordiformes. Silhouette conique massive.","diff":"Le séquoia à feuilles d'if (Sequoia sempervirens) a des aiguilles plates en 2 rangs, comme l'if.","conf":["cryptomeria-japonica","sequoia-sempervirens"]},{"id":"sequoia-sempervirens","lat":"Sequoia sempervirens","fr":"Séquoia à feuilles d'if","fam":"Cupressacées","type":"Conifère persistant","orig":"Côte de Californie","lvl":9,"tip":"Aiguilles plates disposées en 2 rangs, avec 2 bandes blanches dessous. Écorce rousse fibreuse épaisse. C'est le plus grand arbre du monde (plus de 115 m). Il rejette de souche.","diff":"Le séquoia géant a des écailles. L'if a une écorce fine qui s'écaille et pas de bandes blanches nettes.","conf":["taxus-baccata","sequoiadendron-giganteum"]},{"id":"ligustrum-vulgare","lat":"Ligustrum vulgare","fr":"Troène commun","fam":"Oléacées","type":"Arbuste semi-persistant","orig":"Europe","lvl":9,"tip":"Feuilles opposées, lancéolées, au bord entier. En juin, panicules de fleurs blanches à l'odeur forte, puis baies noires luisantes.","diff":"Le troène de Californie a des feuilles plus larges et ovales, plus persistantes, et des rameaux glabres.","conf":["ligustrum-ovalifolium","lonicera-nitida"]},{"id":"liriodendron-tulipifera","lat":"Liriodendron tulipifera","fr":"Tulipier de Virginie","fam":"Magnoliacées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":9,"tip":"Feuille unique à 4 lobes, au sommet coupé droit comme aux ciseaux. Fleurs en tulipes vert-jaune marquées d'orange en juin. Jaune d'or en automne.","diff":"Aucune autre feuille d'arbre n'a cette silhouette de T-shirt à sommet tronqué.","conf":["platanus-hispanica"]},{"id":"echium-candicans","lat":"Echium candicans","fr":"Vipérine de Madère","fam":"Boraginacées","type":"Arbuste persistant","orig":"Madère","lvl":9,"tip":"Arbuste aux feuilles lancéolées argentées et rugueuses en rosettes. Énormes épis coniques de fleurs bleues au printemps.","diff":"La vipérine commune est une plante herbacée bien plus petite.","conf":["lavandula-angustifolia"]},{"id":"yucca-gloriosa","lat":"Yucca gloriosa","fr":"Yucca glorieux","fam":"Asparagacées","type":"Arbuste persistant","orig":"Sud-est des États-Unis","lvl":9,"tip":"Rosette de feuilles en glaive, raides, à pointe piquante, portée sur un court tronc. Grandes panicules de clochettes blanches en fin d'été.","diff":"L'agave a des feuilles charnues, épineuses sur les bords. Le cordyline a des feuilles souples non piquantes.","conf":["agave-americana","cordyline-australis"]},{"id":"acer-palmatum","lat":"Acer palmatum","fr":"Érable du Japon","fam":"Sapindacées","type":"Arbuste caduc","orig":"Japon, Corée","lvl":9,"tip":"Feuilles opposées palmées, découpées profondément en 5 à 9 lobes pointus et dentés. Port étagé et gracieux. Couleurs d'automne flamboyantes.","diff":"Le copalme a des lobes semblables, mais en feuilles alternes, et c'est un grand arbre.","conf":["liquidambar-styraciflua"]},{"id":"acer-rubrum","lat":"Acer rubrum","fr":"Érable rouge","fam":"Sapindacées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":9,"tip":"Feuilles opposées à 3 (parfois 5) lobes dentés, glauques dessous, sur un pétiole rouge. Fleurs rouges en fin d'hiver avant les feuilles. Rouge écarlate en automne.","diff":"Le copalme a des feuilles alternes en étoile. L'érable plane a des lobes à pointes effilées et du latex.","conf":["acer-platanoides","liquidambar-styraciflua"]}];

const MASTER_DAYS = 3;              // une plante est « connue » après avoir été reconnue 3 jours différents
const UNLOCK = 0.5;                 // part du niveau précédent à connaître pour débloquer

const byId = Object.fromEntries(PLANTS.map(p=>[p.id,p]));
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => {a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0") };
const dayDiff = (a,b) => Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/864e5);

/* ---------- Progression (dans ce navigateur) ---------- */
const KEY = "herbier-vivant-v1";
let S = load();
function load(){
  let s=null; try{ s=JSON.parse(localStorage.getItem(KEY)) }catch(e){}
  const o = Object.assign({cards:{}, days:{}, streak:0, lastDay:null, best:0, all:false, maxLvl:1, mode:"classique", season:currentSeason()}, s||{});
  return o;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)) }catch(e){} }
const card = id => {
  const c = S.cards[id] || {box:0, ok:0, ko:0, last:null};
  if (c.days === undefined) { c.days = (c.box>=2 && c.last) ? 1 : 0; c.okDay = c.days ? c.last : null } // anciennes données
  return c;
};
const learning = id => { const c = card(id); return c.box>0 && c.days < MASTER_DAYS };
const known = id => card(id).days >= MASTER_DAYS;

function levelStats(n){
  const ps = PLANTS.filter(p=>p.lvl===n);
  const k = ps.filter(p=>known(p.id)).length;
  const seen = ps.filter(p=>card(p.id).box>0).length;
  return {total:ps.length, known:k, seen, ratio: ps.length? k/ps.length : 0};
}
function unlocked(n){ return S.all || n <= (S.maxLvl||1) }
function refreshUnlocks(){
  let m = S.maxLvl||1; const before = m;
  while (m < LEVELS.length && levelStats(m).ratio >= UNLOCK) m++;
  S.maxLvl = m; if (m!==before) save();
  return m > before;
}
function isDue(id){
  const c = card(id); if(!c.box || !c.last) return false;
  return dayDiff(c.last, today()) >= INTERVALS[Math.min(c.box, INTERVALS.length-1)];
}
function displayStreak(){
  let n = S.streak;
  if (S.lastDay && dayDiff(S.lastDay, today()) > 1) n = 0;
  $("#streakN").textContent = n;
}

/* ---------- Construction d'une séance ---------- */
function seasonCount(k){ const need=SEASONS[k].need; return PLANTS.filter(p=>!need || (IMAGES[p.id]||{})[need]).length }
function modeOK(p){
  if (S.mode!=="saison") return true;
  if (seasonCount(S.season) < SESSION_LEN) S.season = "ete";
  const need = SEASONS[S.season].need;
  return !need || !!(IMAGES[p.id]||{})[need];
}
function buildSession(level){
  let pool = PLANTS.filter(p => (level ? p.lvl===level : unlocked(p.lvl)) && modeOK(p));
  if (pool.length < SESSION_LEN) pool = PLANTS.filter(p => modeOK(p) && (level ? p.lvl<=level : true));
  let picks = [];
  if (level){
    const due = shuffle(pool.filter(p=>isDue(p.id)));
    const fresh = pool.filter(p=>!card(p.id).box);
    const weak = shuffle(pool.filter(p=>card(p.id).box>0 && !known(p.id)));
    picks = [...due, ...fresh.slice(0,5), ...weak, ...shuffle(pool)];
  } else {
    // révisions : d'abord les plantes les plus proches d'être connues (2/3 jours, puis 1/3)
    const due = shuffle(pool.filter(p=>isDue(p.id))).sort((a,b)=>card(b.id).days-card(a.id).days);
    // nouvelles plantes : dans l'ordre, des plus communes aux plus difficiles
    const fresh = pool.filter(p=>!card(p.id).box).sort((a,b)=>a.lvl-b.lvl);
    const nNew = Math.max(2, SESSION_LEN - Math.min(due.length, 8));
    const weak = shuffle(pool.filter(p=>card(p.id).box>0 && !known(p.id)));
    picks = [...due.slice(0,8), ...fresh.slice(0,nNew), ...weak, ...shuffle(pool)];
  }
  const seen = new Set(); const out=[];
  for(const p of picks){ if(!seen.has(p.id)){ seen.add(p.id); out.push(p) } if(out.length===SESSION_LEN) break }
  return shuffle(out).map(p => makeQuestion(p));
}
function makeQuestion(p){
  const mode = "lat"; // chaque réponse affiche le nom latin, avec le nom français en petit dessous
  const nChoices = p.lvl>=4 ? 6 : 4;
  const others = [];
  const add = q => { if(q && q.id!==p.id && !others.includes(q) && q[mode]!==p[mode]) others.push(q) };
  shuffle(p.conf).forEach(id=>add(byId[id]));
  shuffle(PLANTS.filter(q=>q.type===p.type && Math.abs(q.lvl-p.lvl)<=2)).forEach(add);
  shuffle(PLANTS.filter(q=>q.lvl===p.lvl)).forEach(add);
  shuffle(PLANTS).forEach(add);
  const choices = shuffle([p, ...others.slice(0,nChoices-1)]);
  return {p, mode, choices, answered:null, kind: S.mode, season: S.season};
}

/* ---------- Images ----------
   4 photos par plante (Pl@ntNet, licences Creative Commons) : feuille, fruit, écorce, port. */
const SLOTS = [["leaf","Feuille"],["fruit","Fruit"],["bark","Écorce"],["habit","Port"]];
function slotLabel(p, slot){
  const m = (IMAGES[p.id]||{})[slot] || {};
  const organ = m.organ || slot;
  const woody = /^(Arbre|Arbuste|Conifère|Liane|Palmier)/.test(p.type);
  return {leaf:"Feuille", flower:"Fleur", fruit:"Fruit", bark: woody?"Écorce":"Tige", twig: woody?"Rameau":"Tige", spores:"Spores", habit:"Port"}[organ] || "Photo";
}
function photos(p, season){
  const im = IMAGES[p.id]||{};
  if (season) return SEASONS[season].slots.map(([k,l])=>({slot:k, label: k==="fruit"||k==="bark"||k==="leaf"||k==="habit" ? slotLabel(p,k) : l, ...(im[k]||{})})).filter(x=>x.file);
  return SLOTS.map(([k])=>({slot:k, label:slotLabel(p,k), ...(im[k]||{})})).filter(x=>x.file);
}
function thumb(p){ const m=(IMAGES[p.id]||{}); const f=(m.leaf||m.habit||m.fruit||m.bark||{}).file; return f ? `<img src="${esc(f)}" alt="" loading="lazy">` : `<img alt="">` }
function creditHTML(m){
  if(!m) return "";
  return `Photo : ${esc(m.by||"Pl@ntNet")} · ${esc(m.lic||"")}${m.src?` · <a href="${esc(m.src)}" target="_blank" rel="noopener">Pl@ntNet</a>`:""}`;
}
function gallery(p, hide, season){
  const ph = photos(p, season);
  if (!ph.length) return `<div class="photo noimg">Photos indisponibles pour cette plante.</div>`;
  return `<div class="g4 ${ph.length===2?"g2":""}" data-pid="${p.id}">${ph.map((m,i)=>`<button class="g4-cell" type="button" data-gal="${p.id}" data-i="${i}" data-hide="${hide?1:0}" data-season="${season||""}" aria-label="Agrandir : ${esc(m.label)}">
    <img src="${esc(m.file)}" alt="${esc(hide?m.label+" du végétal à identifier":m.label+" de "+p.fr)}" loading="${hide?"eager":"lazy"}">
    <span class="g4-tag">${esc(m.label)}</span></button>`).join("")}</div>`;
}
/* Visionneuse plein écran : glisser ou flèches pour passer d'une photo à l'autre */
let viewer = null;
function openViewer(p, i, hide, season){
  const ph = photos(p, season); if(!ph.length) return;
  viewer = {p, ph, i, hide};
  modal.className = "zoomd";
  drawViewer();
  if(!modal.open) modal.showModal();
}
function drawViewer(){
  const {p, ph, i, hide} = viewer; const m = ph[i];
  modal.innerHTML = `<button class="close" type="button" aria-label="Fermer">✕</button>
    <div class="vw"><img src="${esc(m.file)}" alt="${esc(m.label)}">
      <button class="vw-nav vw-prev" type="button" aria-label="Photo précédente">‹</button>
      <button class="vw-nav vw-next" type="button" aria-label="Photo suivante">›</button></div>
    <div class="vw-bar"><div class="vw-tabs">${ph.map((x,j)=>`<button type="button" class="vw-tab" data-j="${j}" aria-current="${j===i}">${esc(x.label)}</button>`).join("")}</div>
      <div class="vw-credit">${hide?"":`<b>${esc(p.fr)}</b> · `}${creditHTML(m)}</div></div>`;
  modal.querySelector(".close").onclick=()=>modal.close();
  modal.querySelector(".vw-prev").onclick=()=>step(-1);
  modal.querySelector(".vw-next").onclick=()=>step(1);
  modal.querySelectorAll(".vw-tab").forEach(b=>b.onclick=()=>{ viewer.i=+b.dataset.j; drawViewer() });
  let x0=null; const im=modal.querySelector(".vw");
  im.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});
  im.addEventListener("touchend",e=>{ if(x0==null) return; const dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>40) step(dx<0?1:-1); x0=null });
}
function step(d){ if(!viewer) return; viewer.i=(viewer.i+d+viewer.ph.length)%viewer.ph.length; drawViewer() }
document.addEventListener("click", e=>{ const z=e.target.closest("[data-zoomsrc]"); if(z){ e.preventDefault(); viewer=null; modal.className="zoomd"; modal.innerHTML=`<button class="close" type="button" aria-label="Fermer">✕</button><div class="vw"><img src="${esc(z.dataset.zoomsrc)}" alt=""></div>`; modal.querySelector(".close").onclick=()=>modal.close(); if(!modal.open) modal.showModal() } });
document.addEventListener("click", e=>{ const g=e.target.closest("[data-gal]"); if(g){ e.preventDefault(); openViewer(byId[g.dataset.gal], +g.dataset.i, g.dataset.hide==="1", g.dataset.season||null) } });
document.addEventListener("keydown", e=>{ if(modal.open && viewer && modal.classList.contains("zoomd")){ if(e.key==="ArrowRight") step(1); if(e.key==="ArrowLeft") step(-1) } });

/* ---------- Séance ---------- */
function startSession(level){
  quiz = {level, qs: buildSession(level), i:0, good:0, knownBefore: PLANTS.filter(p=>known(p.id)).length};
  quiz.qs.forEach(q=>photos(q.p).forEach(m=>{ const i=new Image(); i.src=m.file })); // précharge les photos de la séance
  if (location.hash==="#seance") renderQuiz(); else location.hash = "#seance";
}
function renderQuiz(){
  const q = quiz.qs[quiz.i];
  const p = q.p;
  const lvlName = LEVELS[p.lvl-1].name;
  document.body.classList.add("in-session");
  const tag = q.kind==="saison" ? SEASONS[q.season].name : MODES[q.kind].name;
  app.innerHTML = `<section class="view quiz">
    <div class="qhead"><span class="qcount">${quiz.i+1} / ${quiz.qs.length}</span><span class="bar"><i style="width:${(quiz.i)/quiz.qs.length*100}%"></i></span>
      <span class="chip tagc">${esc(tag)}</span>
      <button class="btn btn-ghost small" id="quit" type="button" style="padding:8px 12px">Quitter</button></div>
    ${gallery(p, true, q.kind==="saison" ? q.season : null)}
    <div>
      <div class="eyebrow">Niveau ${p.lvl} · ${esc(lvlName)} · ${esc(p.type)}</div>
      <h2 class="qtitle">${q.kind==="ecrire" ? "Écrivez son nom latin" : "Quel est ce végétal ?"}</h2>
    </div>
    ${q.kind==="ecrire" ? `<form class="typed" id="typed" autocomplete="off">
        <input id="guess" type="text" inputmode="text" autocapitalize="sentences" spellcheck="false" placeholder="Ex. : Quercus robur" aria-label="Nom latin">
        <div class="row"><button class="btn btn-main" type="submit" style="flex:2">Valider</button><button class="btn btn-ghost" type="button" id="hint" style="flex:1">Indice</button><button class="btn btn-ghost" type="button" id="skip" style="flex:1">Je ne sais pas</button></div>
        <p class="small muted" id="hinttxt" style="margin:0">Le nom français est accepté aussi. Les petites fautes de frappe sont tolérées.</p>
      </form>`
    : `<div class="choices" id="choices">${q.choices.map((c,i)=>`<button class="choice" data-i="${i}" type="button"><span class="main latin">${esc(c.lat)}</span><span class="small muted">${esc(c.fr)}</span></button>`).join("")}</div>`}
    <div id="fb"></div>
  </section>`;
  $("#quit").onclick = ()=>{ quiz=null; document.body.classList.remove("in-session"); location.hash="#accueil" };
  if (q.kind==="ecrire"){
    const f=$("#typed"), g=$("#guess");
    f.onsubmit = e=>{ e.preventDefault(); if(g.value.trim()) answerTyped(g.value) };
    $("#skip").onclick = ()=>answerTyped("");
    $("#hint").onclick = ()=>{ q.hint=(q.hint||0)+1; $("#hinttxt").textContent = q.hint===1 ? `Genre : ${p.lat.replace(/^× /,"").split(" ")[0]}` : `Genre : ${p.lat.split(" ")[0]} · espèce en ${(p.lat.split(" ").slice(1).join(" ")||"").length} lettres, commence par « ${(p.lat.split(" ")[1]||"").slice(0,1)} »`; g.focus() };
    if (q.answered===null) setTimeout(()=>g.focus({preventScroll:true}), 50);
  } else app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  if (q.answered!==null) showFeedback(q);
}
/* Comparaison tolérante des noms écrits */
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/×|\bx\b/g," ").replace(/'[^']*'|\([^)]*\)|subsp\..*|var\..*/g," ").replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let prev=[...Array(n+1).keys()];
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur } return prev[n] }
const near = (a,b) => a && b && lev(a,b) <= Math.max(1, Math.floor(b.length/8));
function judge(text, p){
  const t = norm(text); if(!t) return {ok:false, why:"skip"};
  const lat = norm(p.lat), latWords = lat.split(" ");
  if (near(t, lat)) return {ok:true, exact: t===lat, how:"latin"};
  const frs = String(p.fr).split(/[()]/).map(norm).filter(Boolean);
  if (frs.some(f=>near(t,f))) return {ok:true, how:"français"};
  if (near(t.split(" ")[0], latWords[0])) return {ok:false, why:"genre"};
  return {ok:false, why:"faux"};
}
function answerTyped(text){
  const q = quiz.qs[quiz.i]; if(q.answered!==null) return;
  q.typed = text; q.judge = judge(text, q.p);
  q.answered = q.judge.ok ? q.choices.findIndex(c=>c.id===q.p.id) : -1;
  record(q, q.judge.ok);
}
function answer(i){
  const q = quiz.qs[quiz.i]; if(q.answered!==null) return;
  q.answered = i;
  record(q, q.choices[i].id===q.p.id);
}
function record(q, ok){
  const c = Object.assign({}, card(q.p.id));
  const t = today();
  if(ok){
    c.ok++; quiz.good++;
    q.newDay = c.okDay !== t;              // une seule progression par jour
    if (q.newDay){ c.box=Math.min(c.box+1, INTERVALS.length-1); c.days++; c.okDay=t }
  } else { c.box=1; c.ko++; c.days=0; c.okDay=null }
  c.last = t; S.cards[q.p.id]=c; save();
  q.ok = ok;
  try{ navigator.vibrate && navigator.vibrate(ok ? 18 : [30,50,30]) }catch(e){}
  showFeedback(q);
}
function showFeedback(q){
  const p=q.p, ok=q.ok;
  let wrong = null, typedMsg = "";
  if (q.kind==="ecrire"){
    const g=$("#guess"); if(g){ g.value=q.typed||""; g.disabled=true; g.classList.add(ok?"good":"bad") }
    app.querySelectorAll("#typed button").forEach(b=>b.hidden=true);
    const j=q.judge||{};
    typedMsg = ok ? (j.how==="français" ? `Bon nom français ! Le nom latin : <b class="latin">${esc(p.lat)}</b>` : j.exact ? "Orthographe parfaite." : `Presque parfait, l'orthographe exacte : <b class="latin">${esc(p.lat)}</b>`)
      : j.why==="skip" ? `La réponse : <b class="latin">${esc(p.lat)}</b>`
      : j.why==="genre" ? `Bon genre, mauvaise espèce. La réponse : <b class="latin">${esc(p.lat)}</b>`
      : `Vous avez écrit « ${esc(q.typed)} ». La réponse : <b class="latin">${esc(p.lat)}</b>`;
    $("#hinttxt").innerHTML = typedMsg;
  } else {
    app.querySelectorAll(".choice").forEach((b,i)=>{
      b.disabled=true; const c=q.choices[i];
      if(c.id===p.id) b.classList.add("good"); else if(i===q.answered) b.classList.add("bad"); else b.classList.add("dim");
    });
    if (!ok) wrong = q.choices[q.answered];
  }
  const last = quiz.i===quiz.qs.length-1;
  $("#fb").innerHTML = `<div class="card answer">
    <div class="verdict ${ok?"ok":"ko"}">${ok?"✓ Bien vu !":"✗ Ce n'était pas ça"}<span style="margin-left:auto;font-weight:600;font-size:.85rem">${progressText(p, ok, q.newDay)}</span></div>
    ${q.kind==="saison" ? `<div class="pad" style="padding-bottom:0"><div class="eyebrow" style="margin-bottom:6px">Toute l'année</div>${gallery(p,false)}</div>` : ""}
    ${sheetBody(p, wrong)}
  </div>
  <div class="nextbar"><button class="btn btn-main btn-wide" id="next" type="button">${last?"Voir le bilan":"Plante suivante →"}</button></div>`;
  $("#next").onclick = next;
  bindMinis($("#fb"));
  $("#fb").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"start"});
}
function progressText(p, ok, newDay){
  const d = card(p.id).days;
  if (!ok) return "Retour à 0/3 jours";
  if (d >= MASTER_DAYS) return newDay && d===MASTER_DAYS ? "Connue ! 3/3 jours" : "Connue";
  return newDay ? `Jour ${d}/3 réussi` : `Déjà réussie aujourd'hui (${d}/3)`;
}
function seasonsHTML(p){
  const im = IMAGES[p.id]||{};
  const items = [["spring","Printemps"],["autumn","Automne"],["winter","Hiver"]].filter(([k])=>im[k]);

function sheetBody(p, wrong){
  const looks = [...new Set([...(wrong?[wrong.id]:[]), ...p.conf])].map(id=>byId[id]).filter(Boolean).slice(0,4);

    <div class="names"><div class="latin">${esc(p.lat)}</div><div class="fr">${esc(p.fr)}</div></div>

    ${wrong?`<p class="small" style="margin:0">Vous avez répondu <b>${esc(wrong.fr)}</b> (<span class="latin">${esc(wrong.lat)}</span>). Comparez les deux ci-dessous.</p>`:""}
    ${looks.length?`<div><div class="eyebrow" style="margin-bottom:6px">${wrong?"À comparer":"Ses sosies"}</div><div class="look">${looks.map(miniHTML).join("")}</div></div>`:""}
  </div>`;
}
function miniHTML(p){ return `<button class="mini" data-id="${p.id}" type="button">${thumb(p)}<span>${esc(p.fr)}<br><em>${esc(p.lat)}</em></span></button>` }
function bindMinis(root){ root.querySelectorAll(".mini").forEach(b=>b.onclick=()=>openSheet(byId[b.dataset.id])) }
function next(){
  if (quiz.i < quiz.qs.length-1){ quiz.i++; renderQuiz(); window.scrollTo(0,0); return }
  finish();
}
function finish(){
  document.body.classList.remove("in-session");
  const t = today();
  const d = S.days[t] || {sessions:0, good:0, total:0};
  const first = d.sessions===0;
  d.sessions++; d.good+=quiz.good; d.total+=quiz.qs.length; S.days[t]=d;
  if (S.lastDay !== t){
    S.streak = (S.lastDay && dayDiff(S.lastDay,t)===1) ? S.streak+1 : 1;
    S.lastDay = t;
  }
  S.best = Math.max(S.best, S.streak);
  save(); displayStreak();
  const opened = refreshUnlocks() && !S.all;
  const missed = quiz.qs.filter(q=>!q.ok).map(q=>q.p);
  const g=quiz.good, n=quiz.qs.length;
  const word = g===n ? "Sans faute !" : g>=n*.8 ? "Très bon œil" : g>=n*.5 ? "Bonne séance" : "On progresse en se trompant";
  app.innerHTML = `<section class="view result">
    <div class="card pad" style="text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center">
      <div class="eyebrow">Bilan de la séance</div>
      <div class="score">${g}/${n}</div>
      <h2>${word}</h2>
      <p class="muted" style="margin:0">${first?`Jour validé : série de <b>${S.streak}</b> jour${S.streak>1?"s":""}.`:"Séance bonus enregistrée."} Revenez demain pour garder votre série.</p>
      <p style="margin:6px 0 0;font-weight:700">${(()=>{ const now=PLANTS.filter(p=>known(p.id)).length, d=now-quiz.knownBefore; return `${now} végétaux connus sur ${PLANTS.length}`+(d>0?` (+${d} aujourd'hui)`:"")+` · ${PLANTS.filter(p=>learning(p.id)).length} en cours d'apprentissage` })()}</p>
      <p class="small muted" style="margin:4px 0 0">Une plante devient « connue » quand vous la reconnaissez 3 jours différents. Une erreur la remet à zéro.</p>
      ${opened?`<p style="margin:6px 0 0;color:var(--leaf);font-weight:700">Nouveau niveau débloqué : ${esc(LEVELS[S.maxLvl-1].name)}</p>`:""}
    </div>
    ${missed.length?`<div><div class="eyebrow" style="margin-bottom:8px">À revoir (elles reviendront demain)</div><div class="look">${missed.map(miniHTML).join("")}</div></div>`:""}
    <div class="row"><button class="btn btn-main" id="again" type="button" style="flex:1">Encore ${SESSION_LEN} plantes</button><a class="btn btn-ghost" href="#partager" style="flex:1">Défier un ami</a></div>
  </section>`;
  bindMinis(app);
  const lvl = quiz.level; quiz=null;
  $("#again").onclick = ()=>startSession(lvl);
}

/* ---------- Fiche & zoom ---------- */
const modal = $("#modal");
function openSheet(p){
  viewer=null; modal.className="";
  modal.innerHTML = `<button class="close" type="button" aria-label="Fermer">✕</button><div class="pad" style="padding-bottom:0">${gallery(p,false)}</div>${sheetBody(p,null)}`;
  modal.querySelector(".close").onclick=()=>modal.close();
  bindMinis(modal);
  if(!modal.open) modal.showModal(); modal.scrollTop=0;
}
modal.addEventListener("click", e=>{ if(e.target===modal) modal.close() });
let tt; function toast(m){ let el=$(".toast"); if(!el){ el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el) } el.textContent=m; el.hidden=false; clearTimeout(tt); tt=setTimeout(()=>el.hidden=true,2600) }

document.addEventListener("keydown", e=>{
  if(location.hash!=="#seance"||!quiz||modal.open) return;
  const q=quiz.qs[quiz.i];
  if(q.kind!=="ecrire" && q.answered===null && /^[1-6]$/.test(e.key) && +e.key<=q.choices.length) answer(+e.key-1);
  else if(q.answered!==null && e.key==="Enter"){ e.preventDefault(); next() }
});

if (location.hash==="#seance") location.hash="#accueil";
route();
</script>

<script>if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
