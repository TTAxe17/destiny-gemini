sées. Bouquets de fleurs blanches parfumées, puis fruits plumeux.","diff":"La clématite des haies est une liane ligneuse.","conf":["clematis-vitalba","clematis-flammula"]},{"id":"digitalis-purpurea","lat":"Digitalis purpurea","fr":"Digitale pourpre","fam":"Plantaginacées","type":"Bisannuelle","orig":"Europe de l'Ouest","lvl":6,"tip":"Rosette de feuilles velues la 1re année. La 2e année, hampe de fleurs en doigts de gant pourpres tachetées à l'intérieur. Très toxique.","diff":"La rose trémière a des fleurs ouvertes en coupe.","conf":["alcea-rosea"]},{"id":"dryas-octopetala","lat":"Dryas octopetala","fr":"Dryade à huit pétales","fam":"Rosacées","type":"Sous-arbrisseau","orig":"Montagnes de l'hémisphère Nord","lvl":6,"tip":"Tapis rampant de montagne. Petites feuilles crénelées comme une feuille de chêne, blanches dessous. Fleurs blanches à 8 pétales, puis fruits plumeux.","diff":"L'anémone a des feuilles très découpées.","conf":["teucrium-chamaedrys"]},{"id":"eupatorium-cannabinum","lat":"Eupatorium cannabinum","fr":"Eupatoire chanvrine","fam":"Astéracées","type":"Vivace","orig":"Europe","lvl":6,"tip":"Grande vivace aux feuilles opposées divisées en 3-5 segments comme le chanvre. Corymbes de petites fleurs rose pâle en été.","diff":"La reine-des-prés a des fleurs crème et des feuilles alternes.","conf":["filipendula-ulmaria","valeriana-officinalis"]},{"id":"euphorbia-characias","lat":"Euphorbia characias","fr":"Euphorbe characias","fam":"Euphorbiacées","type":"Vivace","orig":"Méditerranée","lvl":6,"tip":"Tiges dressées couvertes de feuilles étroites bleu-vert, en goupillon. Grosses inflorescences vert-jaune au printemps. Latex blanc irritant à la coupe.","diff":"Tout latex blanc sur une vivace doit faire penser à une euphorbe. Portez des gants.","conf":[]},{"id":"euphorbia-amygdaloides","lat":"Euphorbia amygdaloides","fr":"Euphorbe des bois","fam":"Euphorbiacées","type":"Vivace","orig":"Europe","lvl":6,"tip":"Euphorbe des sous-bois aux feuilles en rosette, souvent rougeâtres. Inflorescences vert-jaune au printemps. Latex blanc.","diff":"L'euphorbe characias est plus grande et bleutée, des lieux secs.","conf":["euphorbia-characias"]},{"id":"foeniculum-vulgare","lat":"Foeniculum vulgare","fr":"Fenouil commun","fam":"Apiacées","type":"Vivace","orig":"Méditerranée","lvl":6,"tip":"Feuilles finement découpées en fils, à forte odeur d'anis. Tiges bleutées creuses. Grandes ombelles jaunes.","diff":"L'aneth est annuel ; l'angélique a des feuilles larges et des ombelles blanches.","conf":["angelica-sylvestris","achillea-millefolium"]},{"id":"pteridium-aquilinum","lat":"Pteridium aquilinum","fr":"Fougère aigle","fam":"Dennstaedtiacées","type":"Fougère","orig":"Monde entier","lvl":6,"tip":"Grandes frondes 3 fois divisées, isolées sur une longue tige raide. Forme d'immenses colonies sur sol acide.","diff":"Les autres fougères forment des touffes en couronne.","conf":["dryopteris-filix-mas"]},{"id":"dryopteris-filix-mas","lat":"Dryopteris filix-mas","fr":"Fougère mâle","fam":"Dryoptéridacées","type":"Fougère","orig":"Hémisphère Nord","lvl":6,"tip":"Fougère en entonnoir aux frondes 2 fois divisées, aux pinnules arrondies. Spores en points ronds sous les frondes.","diff":"La fougère aigle a une fronde isolée sur une longue tige ; le polystic a des pinnules pointues.","conf":["polystichum-setiferum","pteridium-aquilinum"]},{"id":"festuca-glauca","lat":"Festuca glauca","fr":"Fétuque bleue","fam":"Poacées","type":"Graminée","orig":"Sud de l'Europe","lvl":6,"tip":"Petit coussin dense de feuilles fines, raides, d'un bleu argenté. Courts épis paille en début d'été.","diff":"L'avoine bleue (Helictotrichon) est bien plus grande, avec des feuilles plus larges et plates.","conf":["nassella-tenuissima"]},{"id":"rubia-peregrina","lat":"Rubia peregrina","fr":"Garance voyageuse","fam":"Rubiacées","type":"Liane persistante","orig":"Méditerranée, Europe de l'Ouest","lvl":6,"tip":"Liane persistante aux feuilles en verticilles de 4-6, coriaces, au bord accrochant. Tiges carrées qui s'accrochent. Baies noires.","diff":"Le gaillet gratteron est annuel aux feuilles molles.","conf":["smilax-aspera"]},{"id":"gaura-lindheimeri","lat":"Oenothera lindheimeri","fr":"Gaura","fam":"Onagracées","type":"Vivace","orig":"Texas, Louisiane","lvl":6,"tip":"Longues tiges fines et souples portant de petites fleurs blanches ou roses, comme des papillons, de juin aux gelées. Souvent appelée Gaura lindheimeri.","diff":"L'érigéron forme un coussin bas de petites pâquerettes. La gaura a des tiges hautes et légères.","conf":["erigeron-karvinskianus"]},{"id":"teucrium-chamaedrys","lat":"Teucrium chamaedrys","fr":"Germandrée petit-chêne","fam":"Lamiacées","type":"Sous-arbrisseau","orig":"Europe","lvl":6,"tip":"Petit sous-arbrisseau aux feuilles opposées crénelées comme une feuille de chêne miniature. Fleurs roses à une seule lèvre.","diff":"Le thym a des feuilles minuscules entières.","conf":["thymus-vulgaris","satureja-montana"]},{"id":"lathyrus-latifolius","lat":"Lathyrus latifolius","fr":"Gesse à larges feuilles","fam":"Fabacées","type":"Liane vivace","orig":"Europe du Sud","lvl":6,"tip":"Gesse vivace grimpante aux tiges ailées. Feuilles à 2 folioles et vrilles. Grappes de fleurs roses en papillon.","diff":"Le pois de senteur est annuel et parfumé.","conf":["wisteria-sinensis"]},{"id":"symphytum-officinale","lat":"Symphytum officinale","fr":"Grande consoude","fam":"Boraginacées","type":"Vivace","orig":"Europe","lvl":6,"tip":"Grandes feuilles rugueuses qui se prolongent en ailes sur la tige. Fleurs tubulaires pendantes mauves ou crème, en crosse.","diff":"La bourrache est annuelle avec des fleurs bleues étoilées.","conf":["echium-vulgare"]},{"id":"althaea-officinalis","lat":"Althaea officinalis","fr":"Guimauve officinale","fam":"Malvacées","type":"Vivace","orig":"Europe","lvl":6,"tip":"Plante des lieux humides aux feuilles grises très veloutées. Fleurs rose très pâle. Racine utilisée pour la guimauve.","diff":"La mauve sylvestre a des feuilles vertes et des fleurs mauves veinées.","conf":["malva-sylvestris","alcea-rosea"]},{"id":"geranium-sanguineum","lat":"Geranium sanguineum","fr":"Géranium sanguin","fam":"Géraniacées","type":"Vivace","orig":"Europe","lvl":6,"tip":"Feuilles découpées en 5 à 7 lanières profondes. Fleurs magenta à 5 pétales. Le fruit pointu ressemble à un bec de grue. Feuillage rouge en automne.","diff":"Le « géranium » des balcons est un Pelargonium : feuilles rondes, épaisses et odorantes, non rustique.","conf":["heuchera-micrantha"]},{"id":"helleborus-foetidus","lat":"Helleborus foetidus","fr":"Hellébore fétide","fam":"Renonculacées","type":"Vivace","orig":"Europe de l'Ouest","lvl":6,"tip":"Feuilles découpées en lanières étroites, vert foncé, à odeur désagréable. Clochettes vert pâle bordées de pourpre en hiver.","diff":"L'hellébore d'Orient a des feuilles palmées larges et de grandes fleurs ouvertes.","conf":[]},{"id":"pennisetum-alopecuroides","lat":"Pennisetum alopecuroides","fr":"Herbe aux écouvillons","fam":"Poacées","type":"Graminée","orig":"Asie, Australie","lvl":6,"tip":"Touffe arrondie de feuilles fines. Épis cylindriques duveteux, comme des goupillons à biberon, en fin d'été.","diff":"Le miscanthus porte des plumeaux en éventail, pas des épis en écouvillon.","conf":["miscanthus-sinensis","nassella-tenuissima"]},{"id":"cortaderia-selloana","lat":"Cortaderia selloana","fr":"Herbe de la pampa","fam":"Poacées","type":"Graminée","orig":"Amérique du Sud","lvl":6,"tip":"Énorme touffe de feuilles très coupantes, retombantes. Grands plumets denses, blancs ou rosés, sur des tiges de 2 à 3 m. Envahissante sur le littoral atlantique.","diff":"Le miscanthus est plus petit, ses feuilles ne coupent pas et ses plumeaux sont plus lâches.","conf":["miscanthus-sinensis"]},{"id":"heuchera-micrantha","lat":"Heuchera micrantha","fr":"Heuchère","fam":"Saxifragacées","type":"Vivace","orig":"Amérique du Nord","lvl":6,"tip":"Rosette de feuilles arrondies et lobées, aux couleurs vives : pourpre, caramel, vert acide, souvent veinées. Fines tiges de minuscules clochettes.","diff":"Le géranium vivace a des feuilles plus profondément découpées, et de grandes fleurs à 5 pétales.","conf":["geranium-sanguineum","alchemilla-mollis"]},{"id":"hosta-sieboldiana","lat":"Hosta sieboldiana","fr":"Hosta","fam":"Asparagacées","type":"Vivace","orig":"Japon","lvl":6,"tip":"Grandes feuilles en cœur aux nervures parallèles marquées, souvent bleutées ou panachées, formant une touffe. Plante d'ombre très appréciée des limaces. Hampes de clochettes lilas.","diff":"Le bergénia a des feuilles épaisses et brillantes, persistantes, aux nervures en réseau.","conf":["bergenia-cordifolia"]},{"id":"humulus-lupulus","lat":"Humulus lupulus","fr":"Houblon","fam":"Cannabacées","type":"Liane vivace","orig":"Europe","lvl":6,"tip":"Liane volubile qui meurt chaque hiver. Feuilles opposées rugueuses à 3-5 lobes. Cônes verts papyracés et parfumés sur les pieds femelles.","diff":"La vigne a des vrilles ; le houblon s'enroule et a des feuilles rêches.","conf":["vitis-vinifera"]},{"id":"hyssopus-officinalis","lat":"Hyssopus officinalis","fr":"Hysope","fam":"Lamiacées","type":"Sous-arbrisseau","orig":"Europe du Sud","lvl":6,"tip":"Sous-arbrisseau aux feuilles étroites opposées, aromatiques. Épis de fleurs bleu-violet tournés d'un même côté.","diff":"La lavande a des feuilles grises et des épis sur de longues tiges nues.","conf":["lavandula-angustifolia","thymus-vulgaris"]},{"id":"helianthemum-nummularium","lat":"Helianthemum nummularium","fr":"Hélianthème jaune","fam":"Cistacées","type":"Sous-arbrisseau","orig":"Europe","lvl":6,"tip":"Petit sous-arbrisseau étalé aux feuilles opposées étroites. Fleurs jaunes à 5 pétales froissés, qui tombent en fin de journée.","diff":"Les cistes sont bien plus grands.","conf":["cistus-salviifolius","potentilla-fruticosa"]},{"id":"hemerocallis-fulva","lat":"Hemerocallis fulva","fr":"Hémérocalle fauve","fam":"Asphodélacées","type":"Vivace","orig":"Asie","lvl":6,"tip":"Feuilles en lanières arquées, pliées en V. Grandes fleurs orange en entonnoir, qui ne durent qu'un jour (d'où le nom anglais « daylily »).","diff":"L'agapanthe a des fleurs bleues regroupées en boule au sommet de la tige.","conf":["kniphofia-uvaria"]},{"id":"helichrysum-italicum","lat":"Helichrysum italicum","fr":"Immortelle d'Italie","fam":"Astéracées","type":"Sous-arbrisseau","orig":"Méditerranée","lvl":6,"tip":"Feuilles linéaires argentées à l'odeur de curry. Bouquets de petits boutons jaunes secs en été.","diff":"La santoline a des feuilles découpées en peigne.","conf":["santolina-chamaecyparissus","lavandula-angustifolia"]},{"id":"iris-germanica","lat":"Iris germanica","fr":"Iris des jardins","fam":"Iridacées","type":"Vivace","orig":"Méditerranée","lvl":6,"tip":"Rhizomes en surface. Feuilles en éventail plat, en sabre, bleutées. Fleurs à 3 pétales dressés et 3 pétales retombants à barbe.","diff":"L'iris des marais a des fleurs jaunes et pousse dans l'eau.","conf":["iris-pseudacorus"]},{"id":"iris-pseudacorus","lat":"Iris pseudacorus","fr":"Iris des marais","fam":"Iridacées","type":"Vivace","orig":"Europe","lvl":6,"tip":"Iris des bords de l'eau. Feuilles en glaive vert vif. Fleurs jaune vif en mai. Grosses capsules vertes.","diff":"L'iris des jardins pousse au sec avec des fleurs à barbe.","conf":["iris-germanica","typha-latifolia"]},{"id":"iris-foetidissima","lat":"Iris foetidissima","fr":"Iris fétide","fam":"Iridacées","type":"Vivace","orig":"Europe de l'Ouest","lvl":6,"tip":"Iris des sous-bois aux feuilles vert foncé à odeur désagréable. Fleurs mauve terne. Capsules qui s'ouvrent en hiver sur des graines orange vif.","diff":"L'iris des marais a des fleurs jaunes et pousse dans l'eau.","conf":["iris-pseudacorus","iris-germanica"]},{"id":"schoenoplectus-lacustris","lat":"Schoenoplectus lacustris","fr":"Jonc des chaisiers","fam":"Cypéracées","type":"Vivace","orig":"Europe","lvl":6,"tip":"Tiges rondes et épaisses (jusqu'à 2 m), vert foncé, spongieuses dedans. Épillets bruns en bouquet près du sommet. Bords d'étangs.","diff":"Le jonc épars est plus petit et forme des touffes denses.","conf":["juncus-effusus","typha-latifolia"]},{"id":"butomus-umbellatus","lat":"Butomus umbellatus","fr":"Jonc fleuri","fam":"Butomacées","type":"Vivace","orig":"Europe, Asie","lvl":6,"tip":"Plante aquatique aux feuilles longues et triangulaires. Ombelle de fleurs roses à 6 pétales au sommet d'une tige ronde.","diff":"La salicaire a des fleurs en épis.","conf":["lythrum-salicaria","iris-pseudacorus"]},{"id":"juncus-effusus","lat":"Juncus effusus","fr":"Jonc épars","fam":"Joncacées","type":"Vivace","orig":"Monde entier","lvl":6,"tip":"Touffe dense de tiges vertes, lisses, cylindriques, sans feuilles. Fleurs brunes en petit bouquet latéral sur la tige. Prairies humides.","diff":"Le jonc des chaisiers a des tiges bien plus hautes et épaisses.","conf":["schoenoplectus-lacustris","luzula-sylvatica"]},{"id":"lavandula-latifolia","lat":"Lavandula latifolia","fr":"Lavande aspic","fam":"Lamiacées","type":"Sous-arbrisseau","orig":"Ouest de la Méditerranée","lvl":6,"tip":"Lavande aux feuilles plus larges et grises. Tiges longues souvent ramifiées en 3. Odeur camphrée forte. Fleurit en fin d'été.","diff":"La lavande vraie a des feuilles plus étroites et une tige à un seul épi.","conf":["lavandula-angustifolia"]},{"id":"lavandula-angustifolia","lat":"Lavandula angustifolia","fr":"Lavande vraie","fam":"Lamiacées","type":"Sous-arbrisseau","orig":"Méditerranée","lvl":6,"tip":"Feuilles étroites gris-vert. Chaque tige florale porte un seul épi, court et compact. Plante compacte au parfum fin.","diff":"Le lavandin est plus grand, et ses tiges se ramifient en 3 épis. La lavande papillon porte de grandes bractées en oreilles de lapin.","conf":["perovskia-atriplicifolia","lavandula-stoechas"]},{"id":"carex-riparia","lat":"Carex riparia","fr":"Laîche des rives","fam":"Cypéracées","type":"Vivace","orig":"Europe","lvl":6,"tip":"Grande laîche des berges aux feuilles larges bleutées, tranchantes. Épis bruns dressés. Tiges triangulaires.","diff":"La laîche pendante a des épis longs et retombants.","conf":["carex-pendula"]},{"id":"carex-pendula","lat":"Carex pendula","fr":"Laîche pendante","fam":"Cypéracées","type":"Vivace","orig":"Europe","lvl":6,"tip":"Grande laîche aux feuilles larges et brillantes. Longs épis pendants, comme des chatons, sur des tiges triangulaires. Lieux humides et ombragés.","diff":"Les graminées ont des tiges rondes et creuses ; les laîches ont des tiges triangulaires.","conf":["molinia-caerulea"]},{"id":"ligularia-dentata","lat":"Ligularia dentata","fr":"Ligulaire","fam":"Astéracées","type":"Vivace","orig":"Chine, Japon","lvl":6,"tip":"Grandes feuilles rondes en cœur, souvent pourpres dessous. Marguerites orange en corymbes en été. Sol humide.","diff":"Le bergénia a des feuilles épaisses persistantes et des fleurs roses.","conf":["bergenia-cordifolia"]},{"id":"luzula-sylvatica","lat":"Luzula sylvatica","fr":"Luzule des bois","fam":"Joncacées","type":"Vivace","orig":"Europe","lvl":6,"tip":"Grandes touffes persistantes de sous-bois. Feuilles larges, luisantes, bordées de longs poils blancs. Inflorescences brunes.","diff":"Les laîches ont des feuilles sans poils au bord.","conf":["carex-pendula"]},{"id":"leucanthemum-vulgare","lat":"Leucanthemum vulgare","fr":"Marguerite","fam":"Astéracées","type":"Vivace","orig":"Europe","lvl":6,"tip":"Grandes marguerites blanches à cœur jaune sur tiges simples. Feuilles du bas en spatule dentée.","diff":"La pâquerette est bien plus petite, en rosette au ras du sol.","conf":["achillea-millefolium","erigeron-karvinskianus"]},{"id":"typha-latifolia","lat":"Typha latifolia","fr":"Massette","fam":"Typhacées","type":"Vivace","orig":"Hémisphère Nord","lvl":6,"tip":"Plante aquatique aux longues feuilles plates. Épi brun en forme de saucisse veloutée au sommet de la tige.","diff":"L'iris des marais a des fleurs jaunes et des feuilles en éventail.","conf":["iris-pseudacorus"]},{"id":"malva-sylvestris","lat":"Malva sylvestris","fr":"Mauve sylvestre","fam":"Malvacées","type":"Vivace","orig":"Europe","lvl":6,"tip":"Feuilles rondes à 5-7 lobes peu profonds. Fleurs mauves veinées de pourpre foncé à 5 pétales échancrés. Fruits en petites meules.","diff":"La guimauve a des feuilles veloutées grises et des fleurs rose pâle.","conf":["althaea-officinalis","alcea-rosea"]},{"id":"hypericum-perforatum","lat":"Hypericum perforatum","fr":"Millepertuis perforé","fam":"Hypéricacées","type":"Vivace","orig":"Europe","lvl":6,"tip":"Feuilles opposées criblées de points translucides (regardez par transparence). Fleurs jaunes à 5 pétales ponctués de noir. Tige à 2 lignes saillantes.","diff":"Le millepertuis à grandes fleurs est un couvre-sol aux fleurs bien plus grandes.","conf":["hypericum-calycinum"]},{"id":"miscanthus-sinensis","lat":"Miscanthus sinensis","fr":"Miscanthus (roseau de Chine)","fam":"Poacées","type":"Graminée","orig":"Asie de l'Est","lvl":6,"tip":"Grosse touffe de feuilles marquées d'une nervure centrale blanche. En fin d'été, plumeaux soyeux en éventail, argentés ou rosés, qui tiennent l'hiver.","diff":"L'herbe de la pampa est bien plus grande. Ses feuilles sont coupantes et ses plumets denses en épi.","conf":["cortaderia-selloana","pennisetum-alopecuroides"]},{"id":"molinia-caerulea","lat":"Molinia caerulea","fr":"Molinie bleue","fam":"Poacées","type":"Graminée","orig":"Europe","lvl":6,"tip":"Graminée en touffe aux feuilles fines. Tiges florales hautes, raides et nues, avec un épi lâche violacé. Jaune d'or en automne.","diff":"Le calamagrostis a des épis plus serrés et précoces.","conf":[]},{"id":"nepeta-faassenii","lat":"Nepeta × faassenii","fr":"Népéta (herbe aux chats)","fam":"Lamiacées","type":"Vivace","orig":"Hybride horticole","lvl":6,"tip":"Coussin de petites feuilles gris-vert, crénelées et aromatiques. Tige carrée. Épis lâches de fleurs bleu lavande en mai-juin.","diff":"La lavande a des feuilles étroites et un épi compact au bout d'une tige nue. La népéta a des feuilles en cœur crénelées.","conf":["lavandula-angustifolia","salvia-nemorosa"]},{"id":"oenothera-biennis","lat":"Oenothera biennis","fr":"Onagre bisannuelle","fam":"Onagracées","type":"Bisannuelle","orig":"Amérique du Nord","lvl":6,"tip":"Rosette la 1re année, puis tige dressée. Grandes fleurs jaune pâle à 4 pétales qui s'ouvrent le soir. Longues capsules.","diff":"Le bouillon-blanc a des feuilles laineuses et des fleurs plus petites serrées.","conf":["verbascum-thapsus","gaura-lindheimeri"]},{"id":"stachys-byzantina","lat":"Stachys byzantina","fr":"Oreille d'ours","fam":"Lamiacées","type":"Vivace","orig":"Turquie, Caucase","lvl":6,"tip":"Feuilles épaisses couvertes d'un feutre blanc très doux. Tiges carrées. Épis laineux de petites fleurs roses.","diff":"La sauge officinale a des feuilles plus fermes et grisâtres.","conf":["salvia-officinalis"]},{"id":"origanum-vulgare","lat":"Origanum vulgare","fr":"Origan","fam":"Lamiacées","type":"Vivace","orig":"Europe","lvl":6,"tip":"Feuilles opposées ovales, aromatiques, tiges carrées rougeâtres. Bouquets de petites fleurs roses entourées de bractées pourpres.","diff":"Le thym est ligneux et a de minuscules feuilles.","conf":["thymus-vulgaris","satureja-montana"]},{"id":"osmunda-regalis","lat":"Osmunda regalis","fr":"Osmonde royale","fam":"Osmondacées","type":"Fougère","orig":"Europe","lvl":6,"tip":"Grande fougère des zones humides. Frondes 2 fois divisées à pinnules larges. Les frondes fertiles portent au sommet des grappes brunes de spores.","diff":"La fougère plume d'autruche a des frondes fertiles séparées, brunes et raides.","conf":[]},{"id":"eryngium-planum","lat":"Eryngium planum","fr":"Panicaut bleu","fam":"Apiacées","type":"Vivace","orig":"Europe centrale, Asie","lvl":6,"tip":"Petites têtes de fleurs bleu métallique entourées de bractées épineuses étroites. Tiges bleues ramifiées.","diff":"L'échinops a des boules rondes sans collerette.","conf":["echinops-ritro"]},{"id":"polystichum-setiferum","lat":"Polystichum setiferum","fr":"Polystic à soies","fam":"Dryoptéridacées","type":"Fougère","orig":"Europe","lvl":6,"tip":"Fougère persistante aux frondes 2 fois divisées, aux pinnules munies d'une petite pointe sétacée. Pétiole couvert d'écailles brunes.","diff":"La fougère mâle n'a pas de pointes aux pinnules et perd ses frondes.","conf":["dryopteris-filix-mas"]},{"id":"filipendula-ulmaria","lat":"Filipendula ulmaria","fr":"Reine-des-prés","fam":"Rosacées","type":"Vivace","orig":"Europe","lvl":6,"tip":"Prairies humides. Feuilles composées à grandes folioles, blanches dessous. Panicules mousseuses crème au parfum de miel et d'amande.","diff":"L'eupatoire a des fleurs roses et des feuilles opposées.","conf":["eupatorium-cannabinum","valeriana-officinalis"]},{"id":"persicaria-amplexicaulis","lat":"Persicaria amplexicaulis","fr":"Renouée amplexicaule","fam":"Polygonacées","type":"Vivace","orig":"Himalaya","lvl":6,"tip":"Grandes feuilles en cœur qui embrassent la tige. Épis fins rouge vif de juillet aux gelées.","diff":"La salicaire a des épis plus longs et des feuilles étroites.","conf":["lythrum-salicaria"]},{"id":"fallopia-japonica","lat":"Fallopia japonica","fr":"Renouée du Japon","fam":"Polygonacées","type":"Vivace","orig":"Japon","lvl":6,"tip":"Tiges creuses à nœuds comme un bambou, tachées de rouge. Grandes feuilles en cœur tronqué. Petites fleurs blanches en grappes. Espèce très envahissante.","diff":"Le bambou garde ses feuilles l'hiver ; la renouée meurt jusqu'au sol.","conf":["phyllostachys-aurea","fallopia-baldschuanica"]},{"id":"rodgersia-podophylla","lat":"Rodgersia podophylla","fr":"Rodgersia","fam":"Saxifragacées","type":"Vivace","orig":"Japon, Corée","lvl":6,"tip":"Feuilles palmées à 5 folioles dentées au bout, bronze. Panicules de fleurs crème. Lieux frais.","diff":"Le marronnier a des feuilles palmées aussi, mais c'est un arbre.","conf":["aesculus-hippocastanum"]},{"id":"alcea-rosea","lat":"Alcea rosea","fr":"Rose trémière","fam":"Malvacées","type":"Bisannuelle","orig":"Asie occidentale","lvl":6,"tip":"Grandes feuilles rondes rugueuses. Hautes hampes de grandes fleurs en coupe de toutes couleurs le long de la tige.","diff":"La digitale a des fleurs tubulaires pendantes.","conf":["digitalis-purpurea","hibiscus-syriacus"]},{"id":"sparganium-erectum","lat":"Sparganium erectum","fr":"Rubanier dressé","fam":"Typhacées","type":"Vivace","orig":"Europe, Asie","lvl":6,"tip":"Plante des berges aux feuilles en lanières triangulaires à la base. Fleurs en boules hérissées le long de tiges ramifiées.","diff":"La massette a un épi en saucisse brune.","conf":["typha-latifolia","iris-pseudacorus"]},{"id":"rudbeckia-fulgida","lat":"Rudbeckia fulgida","fr":"Rudbeckia","fam":"Astéracées","type":"Vivace","orig":"Amérique du Nord","lvl":6,"tip":"Marguerites jaune d'or au cœur noir-brun bombé, de juillet à octobre. Feuilles rugueuses et poilues.","diff":"L'échinacée a des pétales roses et un cœur orange piquant.","conf":["echinacea-purpurea"]},{"id":"ruta-graveolens","lat":"Ruta graveolens","fr":"Rue officinale","fam":"Rutacées","type":"Sous-arbrisseau","orig":"Balkans","lvl":6,"tip":"Feuilles bleu-vert découpées en lobes arrondis, à forte odeur. Petites fleurs jaunes à pétales en cuillère. Le contact au soleil brûle la peau.","diff":"Les bleus de la rue et sa forte odeur la distinguent ; attention aux brûlures.","conf":["santolina-chamaecyparissus"]},{"id":"lythrum-salicaria","lat":"Lythrum salicaria","fr":"Salicaire","fam":"Lythracées","type":"Vivace","orig":"Europe","lvl":6,"tip":"Plante des berges. Tiges carrées, feuilles opposées lancéolées. Longs épis de fleurs rose pourpre en été.","diff":"La salicaire a des tiges dressées en épis bien plus denses que la verveine.","conf":["salvia-nemorosa","verbena-bonariensis"]},{"id":"smilax-aspera","lat":"Smilax aspera","fr":"Salsepareille d'Europe","fam":"Smilacacées","type":"Liane persistante","orig":"Méditerranée","lvl":6,"tip":"Liane épineuse du maquis aux tiges en zigzag. Feuilles en cœur ou en flèche, coriaces, avec des vrilles à la base. Baies rouges en grappes.","diff":"Le lierre n'a pas d'épines ni de vrilles.","conf":["hedera-helix","tamus-communis"]},{"id":"santolina-chamaecyparissus","lat":"Santolina chamaecyparissus","fr":"Santoline","fam":"Astéracées","type":"Sous-arbrisseau","orig":"Ouest de la Méditerranée","lvl":6,"tip":"Coussin argenté aux feuilles découpées comme de petits peignes, à odeur forte. Boutons jaunes ronds en juillet.","diff":"L'immortelle a des feuilles étroites entières à odeur de curry.","conf":["helichrysum-italicum","artemisia-absinthium"]},{"id":"satureja-montana","lat":"Satureja montana","fr":"Sarriette des montagnes","fam":"Lamiacées","type":"Sous-arbrisseau","orig":"Europe du Sud","lvl":6,"tip":"Sous-arbrisseau aux feuilles étroites, pointues, luisantes, très aromatiques. Petites fleurs blanc rosé en fin d'été.","diff":"L'hysope a des fleurs bleues en épis.","conf":["hyssopus-officinalis","thymus-vulgaris"]},{"id":"perovskia-atriplicifolia","lat":"Salvia yangii","fr":"Sauge d'Afghanistan (pérovskia)","fam":"Lamiacées","type":"Sous-arbrisseau","orig":"Asie centrale","lvl":6,"tip":"Tiges blanc argenté. Feuillage gris très découpé au parfum de sauge. Nuages de petites fleurs bleu lavande en fin d'été. Anciennement Perovskia atriplicifolia.","diff":"La lavande a des feuilles entières étroites et un épi compact. Le pérovskia a des tiges blanches et des feuilles découpées.","conf":["lavandula-angustifolia","verbena-bonariensis"]},{"id":"phlomis-fruticosa","lat":"Phlomis fruticosa","fr":"Sauge de Jérusalem","fam":"Lamiacées","type":"Arbuste persistant","orig":"Méditerranée orientale","lvl":6,"tip":"Arbuste aux feuilles opposées gris-vert, laineuses. Fleurs jaune vif en casque, en verticilles étagés le long de la tige.","diff":"La sauge officinale a des fleurs bleues.","conf":["salvia-officinalis","cistus-albidus"]},{"id":"salvia-nemorosa","lat":"Salvia nemorosa","fr":"Sauge des bois","fam":"Lamiacées","type":"Vivace","orig":"Europe centrale, Asie","lvl":6,"tip":"Épis dressés et serrés de fleurs violet profond. Les bractées violettes restent après la fleur. Feuilles ridées et aromatiques. Tige carrée.","diff":"La népéta a des épis plus lâches, bleu pâle, et un port en coussin étalé.","conf":["nepeta-faassenii"]},{"id":"salvia-officinalis","lat":"Salvia officinalis","fr":"Sauge officinale","fam":"Lamiacées","type":"Sous-arbrisseau","orig":"Méditerranée","lvl":6,"tip":"Feuilles opposées gris-vert, épaisses, granuleuses, au parfum caractéristique. Tiges carrées. Épis de fleurs bleu-violet en juin.","diff":"La sauge de Jérusalem a des fleurs jaunes et des feuilles plus feutrées.","conf":["phlomis-fruticosa","stachys-byzantina"]},{"id":"polygonatum-multiflorum","lat":"Polygonatum multiflorum","fr":"Sceau de Salomon","fam":"Asparagacées","type":"Vivace","orig":"Europe","lvl":6,"tip":"Tige arquée portant des feuilles alternes ovales sur 2 rangs. Clochettes blanches pendantes par 2-5 sous la tige. Baies noires.","diff":"Le muguet a des feuilles basales et des clochettes sur une hampe.","conf":[]},{"id":"asplenium-scolopendrium","lat":"Asplenium scolopendrium","fr":"Scolopendre","fam":"Aspléniacées","type":"Fougère","orig":"Europe","lvl":6,"tip":"Fougère aux frondes entières, en langue, brillantes. Spores en lignes parallèles dessous comme des pattes de mille-pattes.","diff":"Les autres fougères ont des frondes découpées.","conf":["polystichum-setiferum"]},{"id":"solidago-canadensis","lat":"Solidago canadensis","fr":"Solidage du Canada","fam":"Astéracées","type":"Vivace","orig":"Amérique du Nord","lvl":6,"tip":"Grandes tiges feuillées. Panicules pyramidales de minuscules fleurs jaunes en fin d'été, en plumet arqué. Envahissante.","diff":"La tanaisie a des boutons jaunes plats et des feuilles découpées.","conf":["tanacetum-vulgare"]},{"id":"nassella-tenuissima","lat":"Nassella tenuissima","fr":"Stipa cheveux d'ange","fam":"Poacées","type":"Graminée","orig":"Amériques","lvl":6,"tip":"Touffe de feuilles très fines comme des cheveux, qui ondulent au moindre vent. Épis blond paille en été. Souvent vendue sous l'ancien nom Stipa tenuissima.","diff":"La fétuque bleue a des feuilles fines mais raides, bleu-gris, en coussin.","conf":["pennisetum-alopecuroides","festuca-glauca"]},{"id":"stipa-pennata","lat":"Stipa pennata","fr":"Stipe penné","fam":"Poacées","type":"Graminée","orig":"Europe, Asie","lvl":6,"tip":"Graminée des pelouses sèches. Graines prolongées par une longue arête plumeuse argentée (jusqu'à 30 cm) qui ondule au vent.","diff":"La stipa cheveux d'ange a des épis courts sans longues plumes.","conf":["nassella-tenuissima"]},{"id":"tamus-communis","lat":"Tamus communis","fr":"Tamier","fam":"Dioscoréacées","type":"Liane vivace","orig":"Europe","lvl":6,"tip":"Liane volubile sans vrilles. Feuilles en cœur, entières, luisantes. Grappes de baies rouges toxiques en automne.","diff":"La bryone a des feuilles lobées rugueuses et des vrilles.","conf":["smilax-aspera"]},{"id":"tanacetum-vulgare","lat":"Tanacetum vulgare","fr":"Tanaisie","fam":"Astéracées","type":"Vivace","orig":"Europe","lvl":6,"tip":"Feuilles découpées en peigne, à forte odeur camphrée. Corymbes de boutons jaunes plats, sans pétales.","diff":"L'achillée a des fleurs blanches à petits pétales.","conf":["achillea-millefolium","santolina-chamaecyparissus"]},{"id":"thymus-vulgaris","lat":"Thymus vulgaris","fr":"Thym commun","fam":"Lamiacées","type":"Sous-arbrisseau","orig":"Ouest de la Méditerranée","lvl":6,"tip":"Petit sous-arbrisseau en coussin. Minuscules feuilles grises aux bords enroulés, très aromatiques. Fleurs roses ou blanches.","diff":"Le serpolet est rampant et ses feuilles sont plates.","conf":["salvia-rosmarinus","hyssopus-officinalis"]},{"id":"kniphofia-uvaria","lat":"Kniphofia uvaria","fr":"Tritoma (faux aloès)","fam":"Asphodélacées","type":"Vivace","orig":"Afrique du Sud","lvl":6,"tip":"Touffe de feuilles étroites en V. Épis en torche, rouges en haut et jaunes en bas, sur des tiges nues en été.","diff":"L'hémérocalle a de grandes fleurs ouvertes isolées, pas un épi dense en torche.","conf":["hemerocallis-fulva"]},{"id":"valeriana-officinalis","lat":"Valeriana officinalis","fr":"Valériane officinale","fam":"Caprifoliacées","type":"Vivace","orig":"Europe","lvl":6,"tip":"Feuilles opposées composées de folioles dentées. Corymbes de petites fleurs blanc rosé parfumées. Racines à odeur forte.","diff":"L'eupatoire a des feuilles divisées en 3-5 segments seulement.","conf":["eupatorium-cannabinum","filipendula-ulmaria"]},{"id":"centranthus-ruber","lat":"Centranthus ruber","fr":"Valériane rouge","fam":"Caprifoliacées","type":"Vivace","orig":"Méditerranée","lvl":6,"tip":"Feuilles opposées glauques, charnues. Bouquets de petites fleurs rouges, roses ou blanches à éperon. Pousse dans les vieux murs.","diff":"L'érigéron pousse aussi dans les murs mais ses fleurs sont des pâquerettes.","conf":["erigeron-karvinskianus"]},{"id":"erigeron-karvinskianus","lat":"Erigeron karvinskianus","fr":"Vergerette de Karvinski","fam":"Astéracées","type":"Vivace","orig":"Mexique","lvl":6,"tip":"Coussin de petites pâquerettes blanches qui virent au rose, d'avril aux gelées. Se ressème dans les murets et les fissures.","diff":"La pâquerette pousse en rosette au ras du gazon, avec une seule fleur par tige.","conf":["gaura-lindheimeri"]},{"id":"verbena-bonariensis","lat":"Verbena bonariensis","fr":"Verveine de Buenos Aires","fam":"Verbénacées","type":"Vivace","orig":"Amérique du Sud","lvl":6,"tip":"Hautes tiges raides et carrées, presque sans feuilles, portant de petits bouquets plats violets. Effet transparent dans les massifs. Se ressème partout.","diff":"La sauge d'Afghanistan a des épis bleu lavande et un feuillage gris argenté.","conf":["perovskia-atriplicifolia"]},{"id":"echium-vulgare","lat":"Echium vulgare","fr":"Vipérine commune","fam":"Boraginacées","type":"Bisannuelle","orig":"Europe","lvl":6,"tip":"Tige hérissée de poils raides. Feuilles étroites rugueuses. Fleurs bleu vif aux étamines rouges saillantes, en crosses.","diff":"La vipérine de Madère est un arbuste.","conf":["echium-candicans","symphytum-officinale"]},{"id":"yucca-filamentosa","lat":"Yucca filamentosa","fr":"Yucca filamenteux","fam":"Asparagacées","type":"Arbuste persistant","orig":"Sud-est des États-Unis","lvl":6,"tip":"Rosette sans tronc de feuilles en glaive bordées de fils blancs qui se détachent. Hampe de clochettes blanches en été.","diff":"Le yucca glorieux a un court tronc et des feuilles plus raides sans fils.","conf":["yucca-gloriosa","agave-americana"]},{"id":"echinacea-purpurea","lat":"Echinacea purpurea","fr":"Échinacée pourpre","fam":"Astéracées","type":"Vivace","orig":"Amérique du Nord","lvl":6,"tip":"Grandes marguerites rose pourpré aux pétales retombants, autour d'un cœur orangé bombé et piquant au toucher.","diff":"La rudbeckia a des pétales jaunes et un cœur noir. Ses pétales sont moins retombants.","conf":["rudbeckia-fulgida"]},{"id":"echinops-ritro","lat":"Echinops ritro","fr":"Échinops","fam":"Astéracées","type":"Vivace","orig":"Europe du Sud","lvl":6,"tip":"Boules parfaites de fleurs bleu métallique en été. Feuilles découpées et épineuses, blanches dessous.","diff":"Le panicaut a des fleurs entourées d'une collerette de bractées.","conf":["eryngium-planum"]},{"id":"epilobium-angustifolium","lat":"Epilobium angustifolium","fr":"Épilobe en épi","fam":"Onagracées","type":"Vivace","orig":"Hémisphère Nord","lvl":6,"tip":"Grandes colonies sur les coupes forestières. Feuilles étroites comme le saule. Épis de fleurs roses, puis graines à aigrettes cotonneuses.","diff":"La salicaire a des tiges carrées et des feuilles opposées.","conf":["lythrum-salicaria"]},{"id":"prunus-brigantina","lat":"Prunus brigantina","fr":"Abricotier de Briançon","fam":"Rosacées","type":"Arbuste caduc","orig":"Alpes du Sud","lvl":7,"tip":"Abricotier sauvage des Alpes du Sud aux feuilles ovales doublement dentées. Fleurs blanches en bouquets, petits fruits jaunes.","diff":"L'abricotier cultivé a des feuilles en cœur et de gros fruits.","conf":["prunus-armeniaca","prunus-cerasifera"]},{"id":"vaccinium-uliginosum","lat":"Vaccinium uliginosum","fr":"Airelle des marais","fam":"Éricacées","type":"Sous-arbrisseau","orig":"Hémisphère Nord","lvl":7,"tip":"Myrtille des tourbières aux feuilles bleu-vert au bord entier, aux tiges brunes et rondes. Baies bleues à chair blanche.","diff":"La myrtille a des tiges vertes anguleuses et une chair violette.","conf":["vaccinium-myrtillus","vaccinium-vitis-idaea"]},{"id":"sorbus-aria","lat":"Sorbus aria","fr":"Alisier blanc","fam":"Rosacées","type":"Arbre caduc","orig":"Europe","lvl":7,"tip":"Feuille simple ovale doublement dentée, dont le revers est blanc feutré : l'arbre scintille au vent. Fruits rouges. (Nom récent : Aria edulis.)","diff":"Le sorbier des oiseleurs a des feuilles composées. Le peuplier blanc a des feuilles lobées.","conf":["sorbus-aucuparia"]},{"id":"sorbus-chamaemespilus","lat":"Sorbus chamaemespilus","fr":"Alisier nain","fam":"Rosacées","type":"Arbuste caduc","orig":"Montagnes d'Europe","lvl":7,"tip":"Petit arbuste de montagne aux feuilles ovales dentées. Fleurs roses en corymbes serrés. Fruits rouges.","diff":"L'alisier blanc est un arbre à revers blanc ; l'alisier nain est bas à fleurs roses.","conf":["sorbus-aria","cotoneaster-integerrimus"]},{"id":"alnus-glutinosa","lat":"Alnus glutinosa","fr":"Aulne glutineux","fam":"Bétulacées","type":"Arbre caduc","orig":"Europe","lvl":7,"tip":"Feuille ronde, souvent tronquée ou échancrée au sommet, collante quand elle est jeune. Petits cônes ligneux noirs (strobiles) qui restent l'hiver. Pousse au bord de l'eau.","diff":"Le noisetier a une feuille pointue et ne porte pas de petits cônes. Les petits cônes noirs signent l'aulne.","conf":["corylus-avellana"]},{"id":"erica-ciliaris","lat":"Erica ciliaris","fr":"Bruyère ciliée","fam":"Éricacées","type":"Sous-arbrisseau","orig":"Europe de l'Ouest","lvl":7,"tip":"Bruyère aux feuilles ciliées par 3. Grosses fleurs rose vif tournées d'un seul côté de l'épi.","diff":"La bruyère à quatre angles a des fleurs en bouquet terminal.","conf":["erica-tetralix"]},{"id":"daboecia-cantabrica","lat":"Daboecia cantabrica","fr":"Bruyère de Saint-Daboec","fam":"Éricacées","type":"Sous-arbrisseau","orig":"Europe de l'Ouest","lvl":7,"tip":"Sous-arbrisseau aux petites feuilles ovales, blanches dessous. Grosses clochettes pourpres en grappes lâches.","diff":"Les bruyères ont des feuilles en aiguilles et des fleurs plus petites.","conf":["calluna-vulgaris"]},{"id":"erica-vagans","lat":"Erica vagans","fr":"Bruyère vagabonde","fam":"Éricacées","type":"Sous-arbrisseau","orig":"Europe de l'Ouest","lvl":7,"tip":"Bruyère basse des landes atlantiques aux longs épis cylindriques de fleurs roses ou blanches aux anthères brunes saillantes.","diff":"La bruyère cendrée a des fleurs pourpres en urnes sans anthères saillantes.","conf":["erica-multiflora"]},{"id":"erica-scoparia","lat":"Erica scoparia","fr":"Bruyère à balais","fam":"Éricacées","type":"Arbuste persistant","orig":"Ouest de la Méditerranée","lvl":7,"tip":"Grande bruyère à balais (jusqu'à 2 m) aux minuscules fleurs verdâtres discrètes. Rameaux utilisés pour les brande.","diff":"La bruyère arborescente a des fleurs blanches bien visibles.","conf":["erica-arborea","calluna-vulgaris"]},{"id":"erica-tetralix","lat":"Erica tetralix","fr":"Bruyère à quatre angles","fam":"Éricacées","type":"Sous-arbrisseau","orig":"Europe de l'Ouest","lvl":7,"tip":"Bruyère des tourbières aux feuilles grises ciliées par 4. Fleurs rose pâle en bouquet au sommet de la tige.","diff":"La bruyère ciliée a des fleurs en épis d'un même côté.","conf":["erica-ciliaris","calluna-vulgaris"]},{"id":"empetrum-nigrum","lat":"Empetrum nigrum","fr":"Camarine noire","fam":"Éricacées","type":"Sous-arbrisseau","orig":"Hémisphère Nord","lvl":7,"tip":"Sous-arbrisseau rampant aux feuilles en aiguilles roulées, comme une bruyère. Petites baies noires luisantes.","diff":"La callune et les bruyères ont des fleurs roses mais pas de baies noires.","conf":["calluna-vulgaris","vaccinium-myrtillus"]},{"id":"lonicera-caerulea","lat":"Lonicera caerulea","fr":"Camérisier bleu","fam":"Caprifoliacées","type":"Arbuste caduc","orig":"Montagnes de l'hémisphère Nord","lvl":7,"tip":"Camérisier des montagnes aux feuilles ovales. Fleurs jaune pâle par paires. Baie bleue pruinée allongée issue de 2 fleurs soudées (le haskap).","diff":"Le camérisier noir a des baies noires luisantes.","conf":["lonicera-nigra","lonicera-xylosteum"]},{"id":"lonicera-alpigena","lat":"Lonicera alpigena","fr":"Camérisier des Alpes","fam":"Caprifoliacées","type":"Arbuste caduc","orig":"Montagnes d'Europe","lvl":7,"tip":"Feuilles opposées grandes et luisantes. Fleurs rouge brunâtre par paires. Baies rouges brillantes soudées par deux comme des cerises jumelles.","diff":"Le camérisier à balais a des baies rouges plus petites et des feuilles grises duveteuses.","conf":["lonicera-xylosteum","lonicera-nigra"]},{"id":"lonicera-nigra","lat":"Lonicera nigra","fr":"Camérisier noir","fam":"Caprifoliacées","type":"Arbuste caduc","orig":"Montagnes d'Europe","lvl":7,"tip":"Camérisier des montagnes. Feuilles opposées ovales, glabres. Fleurs roses par paires sur un long pédoncule, puis 2 baies noires soudées à la base.","diff":"Le camérisier à balais a des baies rouges et des feuilles duveteuses.","conf":["lonicera-xylosteum","lonicera-alpigena"]},{"id":"vaccinium-oxycoccos","lat":"Vaccinium oxycoccos","fr":"Canneberge","fam":"Éricacées","type":"Sous-arbrisseau","orig":"Hémisphère Nord","lvl":7,"tip":"Tiges très fines rampant sur les sphaignes. Minuscules feuilles. Fleurs roses aux pétales retroussés. Grosses baies rouges.","diff":"L'airelle rouge a des tiges dressées et des baies plus petites en grappes.","conf":["vaccinium-vitis-idaea"]},{"id":"lonicera-nitida","lat":"Lonicera nitida","fr":"Chèvrefeuille arbustif","fam":"Caprifoliacées","type":"Arbuste persistant","orig":"Chine","lvl":7,"tip":"Minuscules feuilles opposées (environ 1 cm), ovales, sur de longs rameaux arqués disposés en arêtes. Repousse très vite après la taille.","diff":"Le buis a des feuilles un peu plus grandes, souvent échancrées, des rameaux à 4 angles et une odeur caractéristique.","conf":["buxus-sempervirens","ilex-crenata"]},{"id":"lonicera-etrusca","lat":"Lonicera etrusca","fr":"Chèvrefeuille d'Étrurie","fam":"Caprifoliacées","type":"Liane caduque","orig":"Méditerranée","lvl":7,"tip":"Chèvrefeuille caduc des garrigues. Feuilles du haut soudées autour de la tige. Fleurs crème et rose groupées sur un long pédoncule.","diff":"Le chèvrefeuille des Baléares est persistant à fleurs sans pédoncule.","conf":["lonicera-implexa","lonicera-periclymenum"]},{"id":"lonicera-implexa","lat":"Lonicera implexa","fr":"Chèvrefeuille des Baléares","fam":"Caprifoliacées","type":"Liane persistante","orig":"Méditerranée","lvl":7,"tip":"Chèvrefeuille persistant du Midi. Feuilles du haut soudées en coupe autour de la tige, glauques dessous. Fleurs crème rosé parfumées.","diff":"Le chèvrefeuille d'Étrurie est caduc et ses fleurs sont sur de longs pédoncules.","conf":["lonicera-etrusca","lonicera-periclymenum"]},{"id":"quercus-pubescens","lat":"Quercus pubescens","fr":"Chêne pubescent","fam":"Fagacées","type":"Arbre caduc","orig":"Europe du Sud","lvl":7,"tip":"Feuille plus petite, aux lobes souvent ondulés. Le revers et les jeunes rameaux sont couverts d'un duvet gris doux au toucher. Chêne des coteaux secs et calcaires.","diff":"Passez le doigt sous la feuille : le pubescent est velouté, le sessile presque glabre.","conf":["quercus-robur","quercus-petraea"]},{"id":"quercus-petraea","lat":"Quercus petraea","fr":"Chêne sessile (rouvre)","fam":"Fagacées","type":"Arbre caduc","orig":"Europe","lvl":7,"tip":"Feuille à pétiole bien visible (1-2 cm), lobes réguliers, base en coin sans oreillettes. Glands collés directement au rameau.","diff":"Retenez le croisement : le chêne pédonculé a une feuille sans pétiole et des glands à long pédoncule. Le sessile a l'inverse.","conf":["quercus-robur","quercus-pubescens"]},{"id":"clematis-flammula","lat":"Clematis flammula","fr":"Clématite brûlante","fam":"Renonculacées","type":"Liane persistante","orig":"Méditerranée","lvl":7,"tip":"Clématite du Midi aux feuilles 2 fois divisées en petites folioles étroites. Nuages de fleurs blanches au parfum d'amande en fin d'été. Sève irritante.","diff":"La clématite des haies a des folioles plus grandes, dentées.","conf":["clematis-vitalba"]},{"id":"cornus-alba","lat":"Cornus alba","fr":"Cornouiller blanc","fam":"Cornacées","type":"Arbuste caduc","orig":"Sibérie, Chine","lvl":7,"tip":"Rameaux rouge corail éclatant en hiver. Feuilles opposées aux nervures arquées (fils blancs à la déchirure). Petits fruits blancs bleutés. Formes panachées.","diff":"Le cornouiller sanguin a des rameaux rouge sombre, surtout côté soleil, et des fruits noirs.","conf":["cornus-sanguinea"]},{"id":"cornus-sanguinea","lat":"Cornus sanguinea","fr":"Cornouiller sanguin","fam":"Cornacées","type":"Arbuste caduc","orig":"Europe","lvl":7,"tip":"Feuilles opposées aux nervures arquées qui convergent vers la pointe. Déchirez doucement une feuille : de fins fils blancs la retiennent. Rameaux rouges en hiver.","diff":"Le cornouiller blanc a des rameaux rouge plus vif et des fruits blancs. Le cornouiller sanguin a des fruits noirs.","conf":["cornus-alba","cornus-mas"]},{"id":"cotoneaster-integerrimus","lat":"Cotoneaster integerrimus","fr":"Cotonéaster commun","fam":"Rosacées","type":"Arbuste caduc","orig":"Europe","lvl":7,"tip":"Petit arbuste des rocailles. Petites feuilles ovales, gris feutré dessous. Fleurs rosées, fruits rouges pendants.","diff":"L'amélanchier des bois a des fleurs blanches à pétales étroits et des fruits noirs.","conf":["amelanchier-ovalis","cotoneaster-horizontalis"]},{"id":"cytisus-nigricans","lat":"Cytisus nigricans","fr":"Cytise noircissant","fam":"Fabacées","type":"Arbuste caduc","orig":"Europe centrale","lvl":7,"tip":"Arbuste aux feuilles à 3 folioles. Longues grappes dressées de fleurs jaunes en été, qui noircissent en séchant.","diff":"Le cytise commun a des grappes pendantes.","conf":["laburnum-anagyroides","cytisus-scoparius"]},{"id":"euonymus-europaeus","lat":"Euonymus europaeus","fr":"Fusain d'Europe (bonnet d'évêque)","fam":"Célastracées","type":"Arbuste caduc","orig":"Europe","lvl":7,"tip":"Fruits rose vif à 4 lobes qui s'ouvrent sur des graines orange. Jeunes rameaux verts à 4 angles, parfois liégeux. Feuilles opposées finement dentées.","diff":"Le cornouiller sanguin a lui aussi des feuilles opposées, mais à nervures arquées et sans dents.","conf":["cornus-sanguinea"]},{"id":"daphne-gnidium","lat":"Daphne gnidium","fr":"Garou","fam":"Thyméléacées","type":"Arbuste persistant","orig":"Méditerranée","lvl":7,"tip":"Garou de la garrigue : tiges dressées couvertes de feuilles étroites, gris-vert, serrées. Petites fleurs blanches parfumées en fin d'été, baies rouges toxiques.","diff":"Le romarin a des feuilles aromatiques aux bords enroulés.","conf":["salvia-rosmarinus","daphne-laureola"]},{"id":"juniperus-oxycedrus","lat":"Juniperus oxycedrus","fr":"Genévrier cade","fam":"Cupressacées","type":"Conifère persistant","orig":"Méditerranée","lvl":7,"tip":"Aiguilles par 3, piquantes, avec 2 bandes blanches dessus. Baies (galbules) rouge-brun luisantes. Garrigue.","diff":"Le genévrier commun a une seule bande blanche et des baies bleu-noir.","conf":["juniperus-communis","juniperus-phoenicea"]},{"id":"juniperus-phoenicea","lat":"Juniperus phoenicea","fr":"Genévrier de Phénicie","fam":"Cupressacées","type":"Conifère persistant","orig":"Méditerranée","lvl":7,"tip":"Genévrier du littoral aux rameaux couverts de petites écailles serrées. Baies rouge-brun luisantes. Port compact.","diff":"Le cade a des aiguilles piquantes ; le genévrier de Phénicie a des écailles.","conf":["juniperus-oxycedrus","juniperus-thurifera"]},{"id":"juniperus-thurifera","lat":"Juniperus thurifera","fr":"Genévrier thurifère","fam":"Cupressacées","type":"Conifère persistant","orig":"Ouest de la Méditerranée","lvl":7,"tip":"Arbre des montagnes sèches du Sud (Alpes du Sud, Pyrénées). Rameaux à écailles odorantes. Baies bleu-noir pruinées. Troncs massifs et tortueux.","diff":"Le genévrier de Phénicie a des baies rouges et pousse sur le littoral.","conf":["juniperus-phoenicea","juniperus-communis"]},{"id":"genista-sagittalis","lat":"Genista sagittalis","fr":"Genêt ailé","fam":"Fabacées","type":"Sous-arbrisseau","orig":"Europe","lvl":7,"tip":"Tiges vertes aplaties, ailées et articulées, presque sans feuilles. Fleurs jaunes en grappes courtes.","diff":"Le genêt à balais a des tiges anguleuses mais pas ailées.","conf":["cytisus-scoparius","genista-pilosa"]},{"id":"genista-hispanica","lat":"Genista hispanica","fr":"Genêt d'Espagne épineux","fam":"Fabacées","type":"Sous-arbrisseau","orig":"Espagne, sud de la France","lvl":7,"tip":"Coussin très épineux et dense. Fleurs jaune vif groupées en têtes au sommet des rameaux au printemps.","diff":"L'ajonc est plus haut, avec des fleurs isolées le long des épines.","conf":["ulex-europaeus","genista-tinctoria"]},{"id":"genista-tinctoria","lat":"Genista tinctoria","fr":"Genêt des teinturiers","fam":"Fabacées","type":"Sous-arbrisseau","orig":"Europe","lvl":7,"tip":"Petit sous-arbrisseau sans épines. Feuilles simples lancéolées. Grappes de fleurs jaunes en papillon en été. Pelouses et prairies.","diff":"Le genêt à balais est plus grand, aux tiges anguleuses presque sans feuilles.","conf":["cytisus-scoparius","genista-hispanica"]},{"id":"genista-pilosa","lat":"Genista pilosa","fr":"Genêt poilu","fam":"Fabacées","type":"Sous-arbrisseau","orig":"Europe","lvl":7,"tip":"Petit genêt sans épines, couché, aux petites feuilles soyeuses argentées dessous. Fleurs jaunes au printemps.","diff":"Le genêt des teinturiers est plus dressé et glabre.","conf":["genista-tinctoria","genista-sagittalis"]},{"id":"ribes-alpinum","lat":"Ribes alpinum","fr":"Groseillier des Alpes","fam":"Grossulariacées","type":"Arbuste caduc","orig":"Europe","lvl":7,"tip":"Groseillier sans épines aux petites feuilles à 3 lobes. Grappes dressées de fleurs vert-jaune, petites baies rouges fades. Haies taillées en montagne.","diff":"Le groseillier rouge a des grappes pendantes et de plus grandes feuilles.","conf":["ribes-rubrum","physocarpus-opulifolius"]},{"id":"ribes-petraeum","lat":"Ribes petraeum","fr":"Groseillier des rochers","fam":"Grossulariacées","type":"Arbuste caduc","orig":"Montagnes d'Europe","lvl":7,"tip":"Groseillier de montagne aux grandes feuilles à 3 lobes pointus. Grappes de fleurs rougeâtres, baies rouges acides.","diff":"Le groseillier rouge a des feuilles à lobes arrondis.","conf":["ribes-rubrum","ribes-alpinum"]},{"id":"viscum-album","lat":"Viscum album","fr":"Gui","fam":"Santalacées","type":"Arbuste persistant (parasite)","orig":"Europe","lvl":7,"tip":"Boule de rameaux verts ramifiés en fourche, accrochée dans les arbres (pommiers, peupliers, tilleuls). Feuilles opposées épaisses vert-jaune. Baies blanches gluantes en hiver.","diff":"Un nid d'oiseau est brun et sans feuilles ; le gui reste vert toute l'année.","conf":[]},{"id":"hydrangea-paniculata","lat":"Hydrangea paniculata","fr":"Hortensia paniculé","fam":"Hydrangéacées","type":"Arbuste caduc","orig":"Chine, Japon","lvl":7,"tip":"Fleurs en cônes allongés blanc crème qui rosissent en fin d'été. Feuilles mates, parfois groupées par 3. Supporte mieux le soleil et le calcaire que l'hortensia classique.","diff":"L'hortensia commun fleurit en boules bleues ou roses et ses feuilles sont brillantes.","conf":["hydrangea-macrophylla","hydrangea-quercifolia"]},{"id":"hydrangea-quercifolia","lat":"Hydrangea quercifolia","fr":"Hortensia à feuilles de chêne","fam":"Hydrangéacées","type":"Arbuste caduc","orig":"Sud-est des États-Unis","lvl":7,"tip":"Grandes feuilles lobées comme une feuille de chêne, rouge pourpre en automne. Panicules blanches coniques. Écorce cannelle qui s'exfolie.","diff":"L'hortensia paniculé a des feuilles simples et ovales, sans lobes.","conf":["hydrangea-macrophylla","hydrangea-paniculata"]},{"id":"ilex-aquifolium","lat":"Ilex aquifolium","fr":"Houx commun","fam":"Aquifoliacées","type":"Arbuste persistant","orig":"Europe","lvl":7,"tip":"Feuilles simples, coriaces, très brillantes, aux bords ondulés et épineux (souvent moins épineuses en haut de l'arbre). Baies rouges seulement sur les pieds femelles.","diff":"Le mahonia a des feuilles composées de plusieurs folioles épineuses. L'osmanthe à feuilles de houx a des feuilles opposées.","conf":["mahonia-aquifolium","osmanthus-heterophyllus"]},{"id":"ilex-crenata","lat":"Ilex crenata","fr":"Houx crénelé","fam":"Aquifoliacées","type":"Arbuste persistant","orig":"Japon","lvl":7,"tip":"Petites feuilles alternes, vert foncé, au bord finement crénelé, sans épines. Baies noires. Très utilisé en remplacement du buis contre la pyrale.","diff":"Le buis a des feuilles opposées au bord lisse. Regardez la disposition sur le rameau.","conf":["buxus-sempervirens","lonicera-nitida"]},{"id":"taxus-baccata","lat":"Taxus baccata","fr":"If commun","fam":"Taxacées","type":"Conifère persistant","orig":"Europe","lvl":7,"tip":"Aiguilles plates et souples, vert foncé dessus, vert pâle dessous, sans bandes blanches. Pas de cône : une « baie » rouge (arille). Tout est toxique sauf la chair rouge.","diff":"Le sapin pectiné porte deux bandes blanches sous l'aiguille et des cônes dressés.","conf":["abies-alba","picea-abies"]},{"id":"jasminum-nudiflorum","lat":"Jasminum nudiflorum","fr":"Jasmin d'hiver","fam":"Oléacées","type":"Arbuste caduc","orig":"Chine","lvl":7,"tip":"Rameaux verts, quadrangulaires, retombants. Fleurs jaunes à 5-6 pétales de décembre à mars, sans parfum. Feuilles trifoliolées opposées.","diff":"Le forsythia fleurit en mars-avril sur des rameaux bruns, avec des fleurs à 4 pétales.","conf":["forsythia-intermedia"]},{"id":"prunus-lusitanica","lat":"Prunus lusitanica","fr":"Laurier du Portugal","fam":"Rosacées","type":"Arbuste persistant","orig":"Péninsule ibérique","lvl":7,"tip":"Feuilles vert sombre brillantes, plus petites et plus fines que le laurier-cerise, sur des pétioles rouges très visibles. Longues grappes blanches en juin.","diff":"Le laurier-cerise a des pétioles verts et de plus grandes feuilles, avec des glandes au revers.","conf":["prunus-laurocerasus"]},{"id":"hedera-helix","lat":"Hedera helix","fr":"Lierre grimpant","fam":"Araliacées","type":"Liane persistante","orig":"Europe","lvl":7,"tip":"Deux formes de feuilles sur une même plante : à 3-5 lobes sur les tiges rampantes, entières en losange sur les rameaux fleuris. Tiges munies de crampons. Il fleurit en automne.","diff":"Le lierre des Canaries ou d'Irlande a des feuilles bien plus grandes et des tiges rougeâtres.","conf":[]},{"id":"vaccinium-myrtillus","lat":"Vaccinium myrtillus","fr":"Myrtille","fam":"Éricacées","type":"Sous-arbrisseau","orig":"Europe","lvl":7,"tip":"Sous-arbrisseau de 30 à 50 cm aux tiges vertes anguleuses. Petites feuilles ovales finement dentées, caduques. Clochettes roses, myrtilles bleu-noir.","diff":"L'airelle rouge est persistante à baies rouges ; le myrtillier américain est un grand arbuste.","conf":["vaccinium-vitis-idaea","vaccinium-corymbosum"]},{"id":"ulmus-minor","lat":"Ulmus minor","fr":"Orme champêtre","fam":"Ulmacées","type":"Arbre caduc","orig":"Europe","lvl":7,"tip":"Feuille très asymétrique à la base (une moitié descend plus bas sur le pétiole), doublement dentée, rugueuse. Fruits ailés ronds (samares) avec la graine au centre.","diff":"Le charme et le noisetier ont une base de feuille symétrique. Le micocoulier a une feuille asymétrique, mais terminée par une longue pointe et à 3 nervures principales.","conf":["carpinus-betulus","celtis-australis"]},{"id":"osmanthus-heterophyllus","lat":"Osmanthus heterophyllus","fr":"Osmanthe à feuilles de houx","fam":"Oléacées","type":"Arbuste persistant","orig":"Japon","lvl":7,"tip":"Feuilles épineuses comme le houx, mais opposées. Les feuilles du haut sont souvent entières. Petites fleurs blanches très parfumées en automne.","diff":"Le houx a des feuilles alternes. Une feuille épineuse opposée, c'est l'osmanthe.","conf":["ilex-aquifolium"]},{"id":"myrica-gale","lat":"Myrica gale","fr":"Piment royal","fam":"Myricacées","type":"Arbuste caduc","orig":"Europe du Nord-Ouest","lvl":7,"tip":"Arbuste des tourbières aux feuilles obovales dentées vers la pointe, très aromatiques (résine). Chatons brun-rouge.","diff":"Les saules des marais n'ont pas cette odeur résineuse.","conf":["salix-repens","salix-cinerea"]},{"id":"prunus-cerasifera","lat":"Prunus cerasifera","fr":"Prunier myrobolan","fam":"Rosacées","type":"Arbre caduc","orig":"Asie occidentale","lvl":7,"tip":"Floraison blanche ou rose pâle très précoce, en février-mars. En ville, surtout la forme pourpre 'Pissardii' : feuillage pourpre, petites feuilles ovales dentées.","diff":"Le hêtre pourpre a des feuilles au bord entier et cilié, et c'est un grand arbre.","conf":["prunus-serrulata","prunus-spinosa"]},{"id":"arctostaphylos-uva-ursi","lat":"Arctostaphylos uva-ursi","fr":"Raisin d'ours","fam":"Éricacées","type":"Sous-arbrisseau","orig":"Hémisphère Nord","lvl":7,"tip":"Tapis rampant persistant aux petites feuilles en spatule, luisantes, à nervures en réseau. Clochettes blanc rosé, baies rouges farineuses.","diff":"L'airelle rouge a des feuilles ponctuées de brun dessous et des baies juteuses.","conf":["vaccinium-vitis-idaea"]},{"id":"rhododendron-ferrugineum","lat":"Rhododendron ferrugineum","fr":"Rhododendron ferrugineux","fam":"Éricacées","type":"Arbuste persistant","orig":"Alpes, Pyrénées","lvl":7,"tip":"Petit rhododendron des montagnes aux feuilles persistantes couvertes dessous d'écailles rouille. Fleurs rose vif en juillet.","diff":"Le rhododendron pontique est beaucoup plus grand avec des feuilles glabres.","conf":["rhododendron-ponticum"]},{"id":"rubus-caesius","lat":"Rubus caesius","fr":"Ronce bleuâtre","fam":"Rosacées","type":"Arbuste caduc","orig":"Europe","lvl":7,"tip":"Ronce rampante aux tiges couvertes d'une pruine bleutée. Feuilles à 3 folioles. Mûres à gros grains peu nombreux, pruinées bleu.","diff":"La ronce commune a des tiges arquées sans pruine et des mûres noires luisantes.","conf":["rubus-fruticosus"]},{"id":"rosa-gallica","lat":"Rosa gallica","fr":"Rosier de France","fam":"Rosacées","type":"Arbuste caduc","orig":"Europe du Sud","lvl":7,"tip":"Petit rosier drageonnant aux tiges couvertes d'aiguillons fins et de soies glanduleuses. Grandes fleurs rose foncé parfumées. Fruits ronds rouge brique.","diff":"L'églantier est plus haut, à aiguillons crochus et fleurs pâles.","conf":["rosa-canina","rosa-rugosa"]},{"id":"rosa-pendulina","lat":"Rosa pendulina","fr":"Rosier des Alpes","fam":"Rosacées","type":"Arbuste caduc","orig":"Montagnes d'Europe","lvl":7,"tip":"Rosier des montagnes presque sans aiguillons, aux rameaux rougeâtres. Fleurs rose vif. Fruits rouges allongés et pendants.","diff":"L'églantier a de nombreux aiguillons crochus.","conf":["rosa-canina","rosa-glauca"]},{"id":"rosa-sempervirens","lat":"Rosa sempervirens","fr":"Rosier toujours vert","fam":"Rosacées","type":"Arbuste persistant","orig":"Méditerranée","lvl":7,"tip":"Rosier lianescent persistant du Midi. Folioles luisantes coriaces. Fleurs blanches en bouquets, styles soudés en colonne.","diff":"Le rosier des champs perd ses feuilles.","conf":["rosa-arvensis","smilax-aspera"]},{"id":"salix-eleagnos","lat":"Salix eleagnos","fr":"Saule drapé","fam":"Salicacées","type":"Arbuste caduc","orig":"Europe du Sud","lvl":7,"tip":"Saule des graviers des rivières de montagne. Feuilles très étroites, enroulées, blanches et laineuses dessous, comme du romarin.","diff":"L'osier blanc a des feuilles plus larges et plus longues.","conf":["salix-viminalis","salix-purpurea"]},{"id":"salix-repens","lat":"Salix repens","fr":"Saule rampant","fam":"Salicacées","type":"Arbuste caduc","orig":"Europe","lvl":7,"tip":"Petit saule rampant des dunes et landes humides. Petites feuilles ovales argentées et soyeuses dessous.","diff":"Les autres saules sont des arbustes dressés.","conf":["salix-cinerea","myrica-gale"]},{"id":"salix-rosmarinifolia","lat":"Salix rosmarinifolia","fr":"Saule à feuilles de romarin","fam":"Salicacées","type":"Arbuste caduc","orig":"Europe","lvl":7,"tip":"Petit saule aux feuilles très étroites, soyeuses et argentées dessous, comme le romarin. Landes humides.","diff":"Le saule drapé est plus grand et vit sur les graviers des rivières.","conf":["salix-eleagnos","salix-repens"]},{"id":"salix-aurita","lat":"Salix aurita","fr":"Saule à oreillettes","fam":"Salicacées","type":"Arbuste caduc","orig":"Europe","lvl":7,"tip":"Petit saule aux feuilles ridées à pointe tordue, avec de grandes stipules en forme d'oreille à la base du pétiole.","diff":"Le saule cendré a des stipules plus petites et des feuilles plus longues.","conf":["salix-cinerea","salix-caprea"]},{"id":"salix-triandra","lat":"Salix triandra","fr":"Saule à trois étamines","fam":"Salicacées","type":"Arbuste caduc","orig":"Europe","lvl":7,"tip":"Saule des berges à l'écorce qui se détache en plaques comme le platane. Feuilles lancéolées luisantes, glabres. Fleurs à 3 étamines.","diff":"L'osier blanc a des feuilles argentées soyeuses dessous.","conf":["salix-viminalis"]},{"id":"salix-retusa","lat":"Salix retusa","fr":"Saule émoussé","fam":"Salicacées","type":"Sous-arbrisseau","orig":"Alpes, Pyrénées","lvl":7,"tip":"Saule nain rampant des montagnes aux petites feuilles en spatule, échancrées au sommet.","diff":"Le saule herbacé a des feuilles rondes plus petites.","conf":["dryas-octopetala"]},{"id":"sophora-japonica","lat":"Styphnolobium japonicum","fr":"Sophora du Japon","fam":"Fabacées","type":"Arbre caduc","orig":"Chine","lvl":7,"tip":"Feuilles composées de folioles ovales pointues, sans épines. Jeunes rameaux bien verts. Fleurs crème en fin d'été. Gousses en chapelet de perles.","diff":"Le robinier a des folioles arrondies au bout, une paire d'épines à chaque feuille, et fleurit en mai.","conf":["robinia-pseudoacacia"]},{"id":"sorbus-aucuparia","lat":"Sorbus aucuparia","fr":"Sorbier des oiseleurs","fam":"Rosacées","type":"Arbre caduc","orig":"Europe","lvl":7,"tip":"Feuilles composées alternes de 11 à 15 folioles dentées. Bourgeons violacés et poilus. Grappes de petits fruits rouge orangé en fin d'été.","diff":"Le frêne a lui aussi des feuilles composées, mais opposées, avec des bourgeons noirs.","conf":["fraxinus-excelsior","sorbus-aria"]},{"id":"tilia-platyphyllos","lat":"Tilia platyphyllos","fr":"Tilleul à grandes feuilles","fam":"Malvacées","type":"Arbre caduc","orig":"Europe","lvl":7,"tip":"Grandes feuilles en cœur, velues dessous, avec des touffes de poils blancs aux aisselles des nervures. Fruits à 5 côtes saillantes. Floraison 2 semaines avant le tilleul à petites feuilles.","diff":"Le tilleul à petites feuilles a des poils roux et des fruits presque lisses.","conf":["tilia-cordata"]},{"id":"viburnum-opulus","lat":"Viburnum opulus","fr":"Viorne obier","fam":"Viburnacées","type":"Arbuste caduc","orig":"Europe","lvl":7,"tip":"Feuilles opposées à 3 lobes. Petites glandes en forme de cupule sur le pétiole. Fleurs en plateaux bordés de grandes fleurs stériles. Fruits rouges translucides.","diff":"L'érable champêtre a une feuille proche mais sans glandes sur le pétiole, et il produit du latex.","conf":["hydrangea-macrophylla","acer-campestre"]},{"id":"acer-campestre","lat":"Acer campestre","fr":"Érable champêtre","fam":"Sapindacées","type":"Arbre caduc","orig":"Europe","lvl":7,"tip":"Petites feuilles opposées à 3-5 lobes arrondis. Un peu de latex au pétiole cassé. Rameaux souvent liégeux. Samares alignées à l'horizontale. Très utilisé en haies.","diff":"La viorne obier a des glandes sur le pétiole. Les autres érables ont de bien plus grandes feuilles.","conf":["acer-platanoides","viburnum-opulus"]},{"id":"agave-americana","lat":"Agave americana","fr":"Agave d'Amérique","fam":"Asparagacées","type":"Succulente","orig":"Mexique","lvl":8,"tip":"Énorme rosette de feuilles charnues bleu-gris, bordées d'épines et terminées par une forte pointe noire. Fleurit une seule fois, sur une hampe de plusieurs mètres, puis meurt.","diff":"Le yucca a des feuilles plus fines, non charnues, souvent sur un tronc, et fleurit chaque année.","conf":["yucca-gloriosa"]},{"id":"styrax-officinalis","lat":"Styrax officinalis","fr":"Aliboufier","fam":"Styracacées","type":"Arbuste caduc","orig":"Méditerranée orientale","lvl":8,"tip":"Arbuste des garrigues de Provence aux feuilles ovales feutrées dessous. Clochettes blanches parfumées en mai. Fruits ronds gris.","diff":"Le styrax du Japon a des feuilles glabres.","conf":[]},{"id":"arbutus-unedo","lat":"Arbutus unedo","fr":"Arbousier","fam":"Éricacées","type":"Arbuste persistant","orig":"Méditerranée, côte atlantique","lvl":8,"tip":"Feuilles dentées et vernissées, sur un pétiole rougeâtre. En automne, clochettes blanches et fruits ronds granuleux, rouges à maturité, en même temps. Écorce rousse qui s'exfolie.","diff":"Le laurier-tin a des feuilles opposées entières et des baies bleues.","conf":["viburnum-tinus"]},{"id":"atriplex-halimus","lat":"Atriplex halimus","fr":"Arroche halime","fam":"Amaranthacées","type":"Arbuste persistant","orig":"Méditerranée","lvl":8,"tip":"Arbuste du littoral aux feuilles argentées, épaisses, un peu salées. Très résistant au sel et à la sécheresse. Utilisé en haie de bord de mer.","diff":"L'olivier de Bohême a des feuilles plus étroites et des fruits charnus.","conf":["elaeagnus-angustifolia","teucrium-fruticans"]},{"id":"anthyllis-barba-jovis","lat":"Anthyllis barba-jovis","fr":"Barbe de Jupiter","fam":"Fabacées","type":"Arbuste persistant","orig":"Méditerranée","lvl":8,"tip":"Arbuste du littoral aux feuilles composées argentées et soyeuses. Petites têtes de fleurs jaune pâle au printemps.","diff":"La coronille de Valence a des folioles bleues arrondies et des fleurs jaune vif.","conf":["coronilla-valentina","teucrium-fruticans"]},{"id":"erica-multiflora","lat":"Erica multiflora","fr":"Bruyère multiflore","fam":"Éricacées","type":"Arbuste persistant","orig":"Méditerranée","lvl":8,"tip":"Bruyère du Midi qui fleurit en automne en épis roses, aux anthères pourpres saillantes. Aiguilles par 4-5.","diff":"La bruyère arborescente fleurit au printemps en blanc.","conf":["erica-arborea","calluna-vulgaris"]},{"id":"ononis-natrix","lat":"Ononis natrix","fr":"Bugrane jaune","fam":"Fabacées","type":"Sous-arbrisseau","orig":"Méditerranée","lvl":8,"tip":"Sous-arbrisseau collant et velu aux feuilles à 3 folioles. Fleurs jaunes veinées de rouge en papillon.","diff":"Le genêt n'est pas collant et a des tiges presque sans feuilles.","conf":["spartium-junceum"]},{"id":"bupleurum-fruticosum","lat":"Bupleurum fruticosum","fr":"Buplèvre ligneux","fam":"Apiacées","type":"Arbuste persistant","orig":"Méditerranée","lvl":8,"tip":"Arbuste persistant aux feuilles entières, bleu-vert, coriaces, à nervure claire. Ombelles de fleurs jaunes en été.","diff":"Le laurier-rose a des fleurs roses et des feuilles plus longues.","conf":["nerium-oleander"]},{"id":"calicotome-spinosa","lat":"Calicotome spinosa","fr":"Calicotome épineux","fam":"Fabacées","type":"Arbuste caduc","orig":"Méditerranée","lvl":8,"tip":"Genêt du maquis aux rameaux terminés par de fortes épines. Feuilles à 3 folioles. Fleurs jaunes, gousses épaisses.","diff":"L'ajonc n'a pas de feuilles visibles, seulement des épines.","conf":["ulex-europaeus","spartium-junceum"]},{"id":"cneorum-tricoccon","lat":"Cneorum tricoccon","fr":"Camélée","fam":"Cnéoracées","type":"Sous-arbrisseau","orig":"Ouest de la Méditerranée","lvl":8,"tip":"Petit sous-arbrisseau des garrigues de Provence aux feuilles étroites, épaisses. Petites fleurs jaunes, fruits à 3 lobes ronds, rouges puis noirs.","diff":"L'alaterne a des feuilles plus larges dentées.","conf":["rhamnus-alaternus","phillyrea-angustifolia"]},{"id":"ceratonia-siliqua","lat":"Ceratonia siliqua","fr":"Caroubier","fam":"Fabacées","type":"Arbre persistant","orig":"Méditerranée","lvl":8,"tip":"Feuilles composées paires de folioles rondes, épaisses et luisantes. Longues gousses brun foncé (caroubes), sucrées. Fleurs directement sur les vieux rameaux.","diff":"Le pistachier lentisque a aussi des feuilles paires, mais à folioles étroites et à odeur résineuse.","conf":["pistacia-lentiscus"]},{"id":"elaeagnus-submacrophylla","lat":"Elaeagnus × submacrophylla","fr":"Chalef d'Ebbinge","fam":"Élaéagnacées","type":"Arbuste persistant","orig":"Hybride horticole","lvl":8,"tip":"Revers des feuilles argenté et ponctué de petites écailles rousses, comme les jeunes rameaux. Fleurs discrètes très parfumées en octobre-novembre. Souvent vendu sous le nom Elaeagnus × ebbingei.","diff":"Le chalef piquant a des rameaux épineux et des feuilles ondulées. L'olivier a des feuilles opposées étroites sans écailles rousses.","conf":["elaeagnus-pungens","olea-europaea"]},{"id":"quercus-coccifera","lat":"Quercus coccifera","fr":"Chêne kermès","fam":"Fagacées","type":"Arbuste persistant","orig":"Méditerranée","lvl":8,"tip":"Chêne buissonnant de la garrigue. Petites feuilles coriaces, luisantes des deux côtés, très épineuses. Glands dans une cupule hérissée d'écailles piquantes.","diff":"Le chêne vert a des feuilles grises feutrées dessous ; le houx a de grosses baies rouges.","conf":["quercus-ilex","ilex-aquifolium"]},{"id":"quercus-ilex","lat":"Quercus ilex","fr":"Chêne vert (yeuse)","fam":"Fagacées","type":"Arbre persistant","orig":"Méditerranée","lvl":8,"tip":"Feuilles persistantes, coriaces, vert sombre dessus, gris feutré dessous. Les jeunes feuilles sont souvent dentées et piquantes comme du houx, puis entières. Glands dans une cupule veloutée.","diff":"Le chêne-liège a une écorce épaisse et spongieuse. Le houx a des feuilles vernissées des deux côtés.","conf":["ilex-aquifolium","quercus-suber","phillyrea-angustifolia"]},{"id":"quercus-rotundifolia","lat":"Quercus rotundifolia","fr":"Chêne à feuilles rondes","fam":"Fagacées","type":"Arbre persistant","orig":"Péninsule Ibérique, Afrique du Nord","lvl":8,"tip":"Chêne vert du Sud-Ouest et d'Espagne aux feuilles plus rondes, gris-bleu, et aux glands doux comestibles.","diff":"Le chêne vert a des feuilles plus allongées et des glands amers.","conf":["quercus-ilex","quercus-coccifera"]},{"id":"quercus-suber","lat":"Quercus suber","fr":"Chêne-liège","fam":"Fagacées","type":"Arbre persistant","orig":"Méditerranée occidentale","lvl":8,"tip":"Écorce épaisse, spongieuse et crevassée : c'est le liège. Les troncs démasclés (écorcés) sont rouge brique. Feuilles proches du chêne vert, un peu dentées.","diff":"Le chêne vert a une écorce fine, grise et dure. Enfoncez l'ongle dans l'écorce pour trancher.","conf":["quercus-ilex"]},{"id":"cistus-albidus","lat":"Cistus albidus","fr":"Ciste cotonneux","fam":"Cistacées","type":"Sous-arbrisseau","orig":"Méditerranée occidentale","lvl":8,"tip":"Feuilles opposées blanchâtres, feutrées et veloutées, sans pétiole. Fleurs rose lilas froissées comme du papier crépon, au cœur jaune, qui ne durent qu'un jour.","diff":"Le ciste de Montpellier a des feuilles vert sombre collantes et des fleurs blanches.","conf":["teucrium-fruticans"]},{"id":"cistus-creticus","lat":"Cistus creticus","fr":"Ciste de Crète","fam":"Cistacées","type":"Arbuste persistant","orig":"Méditerranée","lvl":8,"tip":"Ciste aux feuilles ovales ondulées, vertes et poilues, un peu collantes. Fleurs rose pourpre froissées.","diff":"Le ciste cotonneux a des feuilles blanches feutrées et des fleurs rose pâle.","conf":["cistus-albidus"]},{"id":"cistus-monspeliensis","lat":"Cistus monspeliensis","fr":"Ciste de Montpellier","fam":"Cistacées","type":"Arbuste persistant","orig":"Méditerranée","lvl":8,"tip":"Ciste aux feuilles étroites, vert sombre, très collantes et aromatiques. Petites fleurs blanches en bouquets.","diff":"Le ciste à feuilles de sauge a des feuilles ovales rugueuses et des fleurs isolées.","conf":["cistus-salviifolius","cistus-ladanifer"]},{"id":"cistus-ladanifer","lat":"Cistus ladanifer","fr":"Ciste ladanifère","fam":"Cistacées","type":"Arbuste persistant","orig":"Ouest de la Méditerranée","lvl":8,"tip":"Ciste aux feuilles étroites très collantes (le ladanum). Grandes fleurs blanches avec une tache pourpre à la base de chaque pétale.","diff":"Le ciste pourpre a des fleurs roses tachées.","conf":["cistus-monspeliensis"]},{"id":"cistus-laurifolius","lat":"Cistus laurifolius","fr":"Ciste à feuilles de laurier","fam":"Cistacées","type":"Arbuste persistant","orig":"Ouest de la Méditerranée","lvl":8,"tip":"Ciste aux feuilles ovales, collantes, vert foncé dessus, à 3 nervures. Fleurs blanches à cœur jaune en bouquets sur de longs pédoncules.","diff":"Le ciste ladanifère a des feuilles étroites et des fleurs tachées de pourpre.","conf":["cistus-ladanifer","cistus-salviifolius"]},{"id":"cistus-salviifolius","lat":"Cistus salviifolius","fr":"Ciste à feuilles de sauge","fam":"Cistacées","type":"Arbuste persistant","orig":"Méditerranée","lvl":8,"tip":"Ciste bas aux feuilles ovales rugueuses comme la sauge. Fleurs blanches isolées sur de longs pédoncules.","diff":"Le ciste de Montpellier a des feuilles étroites collantes.","conf":["cistus-monspeliensis","cistus-albidus"]},{"id":"coronilla-valentina","lat":"Coronilla valentina","fr":"Coronille de Valence","fam":"Fabacées","type":"Arbuste persistant","orig":"Méditerranée","lvl":8,"tip":"Arbuste aux feuilles composées bleu-vert de 5 à 9 folioles arrondies. Couronnes de fleurs jaunes parfumées en hiver et au printemps.","diff":"La coronille arbrisseau a des fleurs en petits groupes et perd ses feuilles.","conf":["colutea-arborescens"]},{"id":"coriaria-myrtifolia","lat":"Coriaria myrtifolia","fr":"Corroyère à feuilles de myrte","fam":"Coriariacées","type":"Arbuste caduc","orig":"Ouest de la Méditerranée","lvl":8,"tip":"Arbuste aux rameaux arqués en zigzag et aux feuilles opposées à 3 nervures. Baies noires très toxiques, regroupées en étoile.","diff":"Le myrte a des feuilles aromatiques et des baies isolées.","conf":["myrtus-communis","phillyrea-angustifolia"]},{"id":"cupressus-sempervirens","lat":"Cupressus sempervirens","fr":"Cyprès de Provence","fam":"Cupressacées","type":"Conifère persistant","orig":"Méditerranée orientale","lvl":8,"tip":"Silhouette en colonne étroite et dense, vert sombre. Feuillage en petites écailles sur des rameaux non aplatis. Cônes ronds de 3 cm, à écailles en bouclier.","diff":"Le thuya et le faux-cyprès ont des rameaux aplatis en éventail.","conf":["thuja-occidentalis","cuprocyparis-leylandii"]},{"id":"euphorbia-dendroides","lat":"Euphorbia dendroides","fr":"Euphorbe arborescente","fam":"Euphorbiacées","type":"Arbuste caduc","orig":"Méditerranée","lvl":8,"tip":"Petit arbre en boule du littoral. Tiges charnues, latex blanc. Perd ses feuilles en été et devient rouge avant de les perdre. Fleurit en jaune en hiver.","diff":"L'euphorbe characias est une vivace aux tiges non ramifiées.","conf":["euphorbia-characias"]},{"id":"opuntia-ficus-indica","lat":"Opuntia ficus-indica","fr":"Figuier de Barbarie","fam":"Cactacées","type":"Succulente","orig":"Mexique","lvl":8,"tip":"Cactus aux raquettes ovales charnues portant de petites touffes de poils piquants (glochides). Fleurs jaunes, figues de Barbarie rouges ou orange.","diff":"L'agave a des feuilles en rosette, pas des raquettes.","conf":["agave-americana"]},{"id":"phillyrea-angustifolia","lat":"Phillyrea angustifolia","fr":"Filaria à feuilles étroites","fam":"Oléacées","type":"Arbuste persistant","orig":"Méditerranée","lvl":8,"tip":"Feuilles opposées, étroites, vert foncé des deux côtés, coriaces. Petites fleurs crème parfumées au printemps, puis drupes bleu-noir. Excellent en haie libre sèche.","diff":"L'olivier a un revers argenté. L'alaterne a des feuilles alternes.","conf":["olea-europaea","rhamnus-alaternus"]},{"id":"phillyrea-latifolia","lat":"Phillyrea latifolia","fr":"Filaria à larges feuilles","fam":"Oléacées","type":"Arbuste persistant","orig":"Méditerranée","lvl":8,"tip":"Filaria aux feuilles opposées plus larges et dentées, coriaces, vert sombre. Petites fleurs et drupes bleu-noir.","diff":"Le filaria à feuilles étroites a des feuilles entières ; l'alaterne a des feuilles alternes.","conf":["phillyrea-angustifolia","rhamnus-alaternus"]},{"id":"vitex-agnus-castus","lat":"Vitex agnus-castus","fr":"Gattilier","fam":"Lamiacées","type":"Arbuste caduc","orig":"Méditerranée","lvl":8,"tip":"Feuilles opposées palmées à 5-7 folioles étroites, aromatiques. Épis de fleurs bleu-violet en été. Bords des cours d'eau du Midi.","diff":"L'arbre aux papillons a des feuilles simples.","conf":["buddleja-davidii","lavandula-angustifolia"]},{"id":"spartium-junceum","lat":"Spartium junceum","fr":"Genêt d'Espagne","fam":"Fabacées","type":"Arbuste caduc","orig":"Méditerranée","lvl":8,"tip":"Tiges vertes, rondes et lisses comme des joncs, presque sans feuilles. Grandes fleurs jaune vif très parfumées en mai-juin.","diff":"Le genêt à balais a des tiges anguleuses et fleurit plus tôt.","conf":["cytisus-scoparius","calicotome-spinosa"]},{"id":"teucrium-fruticans","lat":"Teucrium fruticans","fr":"Germandrée arbustive","fam":"Lamiacées","type":"Arbuste persistant","orig":"Méditerranée occidentale","lvl":8,"tip":"Rameaux blancs et feutrés. Petites feuilles opposées, vertes dessus, blanc argenté dessous. Fleurs bleu pâle à une seule lèvre, presque toute l'année.","diff":"Le romarin a des aiguilles étroites à bords enroulés et une forte odeur camphrée.","conf":["salvia-rosmarinus","cistus-albidus"]},{"id":"teucrium-polium","lat":"Teucrium polium","fr":"Germandrée tomenteuse","fam":"Lamiacées","type":"Sous-arbrisseau","orig":"Méditerranée","lvl":8,"tip":"Petit sous-arbrisseau gris laineux aux feuilles crénelées enroulées. Têtes de petites fleurs blanches ou jaunâtres.","diff":"La germandrée petit-chêne a des feuilles vertes et des fleurs roses.","conf":["teucrium-chamaedrys","helichrysum-italicum"]},{"id":"globularia-alypum","lat":"Globularia alypum","fr":"Globulaire buissonnante","fam":"Plantaginacées","type":"Sous-arbrisseau","orig":"Méditerranée","lvl":8,"tip":"Sous-arbrisseau de la garrigue aux feuilles coriaces bleu-vert. Capitules ronds bleu-violet en hiver.","diff":"Les autres globulaires sont des vivaces basses en rosette.","conf":["teucrium-fruticans"]},{"id":"limoniastrum-monopetalum","lat":"Limoniastrum monopetalum","fr":"Grand statice","fam":"Plumbaginacées","type":"Sous-arbrisseau","orig":"Méditerranée","lvl":8,"tip":"Sous-arbrisseau du bord de mer aux feuilles charnues gris-bleu, en spatule. Fleurs roses à 5 pétales en épis.","diff":"Les statices sont des vivaces en rosette.","conf":["atriplex-halimus"]},{"id":"punica-granatum","lat":"Punica granatum","fr":"Grenadier","fam":"Lythracées","type":"Arbuste caduc","orig":"Iran, Asie centrale","lvl":8,"tip":"Petites feuilles brillantes, étroites, rougeâtres au débourrement. Fleurs rouge orangé vif au calice charnu en couronne, qui reste au sommet de la grenade.","diff":"Le lilas des Indes fleurit aussi en été, mais ses fleurs sont crêpées en panicules et son écorce est tachetée.","conf":["lagerstroemia-indica"]},{"id":"carpobrotus-edulis","lat":"Carpobrotus edulis","fr":"Griffe de sorcière","fam":"Aïzoacées","type":"Succulente","orig":"Afrique du Sud","lvl":8,"tip":"Plante grasse rampante aux feuilles triangulaires en section, charnues. Grandes fleurs jaunes ou roses à nombreux pétales fins. Envahit les dunes et falaises.","diff":"Les autres plantes grasses rampantes ont des feuilles rondes.","conf":["opuntia-ficus-indica"]},{"id":"halimium-halimifolium","lat":"Halimium halimifolium","fr":"Halimium","fam":"Cistacées","type":"Sous-arbrisseau","orig":"Ouest de la Méditerranée","lvl":8,"tip":"Sous-arbrisseau des dunes aux feuilles grises. Fleurs jaune d'or, souvent avec une tache brune à la base des pétales.","diff":"Les cistes ont des fleurs blanches ou roses.","conf":["cistus-albidus","helianthemum-nummularium"]},{"id":"jasminum-fruticans","lat":"Jasminum fruticans","fr":"Jasmin jaune","fam":"Oléacées","type":"Arbuste persistant","orig":"Méditerranée","lvl":8,"tip":"Arbuste aux tiges vertes anguleuses. Feuilles alternes à 3 folioles. Fleurs jaunes tubulaires au printemps, baies noires.","diff":"Le jasmin d'hiver a des feuilles opposées et fleurit en hiver.","conf":["jasminum-nudiflorum"]},{"id":"nerium-oleander","lat":"Nerium oleander","fr":"Laurier-rose","fam":"Apocynacées","type":"Arbuste persistant","orig":"Méditerranée","lvl":8,"tip":"Feuilles étroites et coriaces, souvent groupées par 3 au même niveau, à nervure centrale saillante. Fleurs roses, blanches ou rouges tout l'été. Toutes les parties sont très toxiques.","diff":"Le laurier-sauce a des feuilles alternes, aromatiques et plus larges.","conf":["laurus-nobilis","olea-europaea"]},{"id":"laurus-nobilis","lat":"Laurus nobilis","fr":"Laurier-sauce","fam":"Lauracées","type":"Arbuste persistant","orig":"Méditerranée","lvl":8,"tip":"Feuilles alternes coriaces au bord légèrement ondulé, très aromatiques quand on les froisse. Petites fleurs jaunâtres en bouquets au printemps.","diff":"Le laurier-cerise a des feuilles plus grandes, très brillantes, avec des glandes au revers, et il n'a pas l'odeur de cuisine.","conf":["prunus-laurocerasus","nerium-oleander"]},{"id":"lavandula-dentata","lat":"Lavandula dentata","fr":"Lavande dentée","fam":"Lamiacées","type":"Sous-arbrisseau","orig":"Ouest de la Méditerranée","lvl":8,"tip":"Lavande aux feuilles finement dentées en peigne, vert-gris. Épis surmontés de petites bractées violettes. Fleurit presque toute l'année.","diff":"La lavande papillon a des bractées plus grandes et des feuilles entières.","conf":["lavandula-stoechas","lavandula-angustifolia"]},{"id":"lavandula-stoechas","lat":"Lavandula stoechas","fr":"Lavande papillon","fam":"Lamiacées","type":"Sous-arbrisseau","orig":"Méditerranée","lvl":8,"tip":"Épis courts et trapus, surmontés de grandes bractées violettes dressées
