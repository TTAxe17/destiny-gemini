<script>
const PLANTS = [{"id":"quercus-robur","lat":"Quercus robur","fr":"Chêne pédonculé","fam":"Fagacées","type":"Arbre caduc","orig":"Europe","lvl":1,"tip":"Feuille à lobes arrondis, presque sans pétiole, avec deux petites « oreillettes » à la base. Les glands pendent au bout d'un long pédoncule.","diff":"Le chêne sessile a l'inverse : une feuille bien pétiolée sans oreillettes, et des glands collés au rameau.","conf":["quercus-petraea","quercus-pubescens"]},{"id":"fagus-sylvatica","lat":"Fagus sylvatica","fr":"Hêtre commun","fam":"Fagacées","type":"Arbre caduc","orig":"Europe","lvl":1,"tip":"Écorce gris clair et lisse comme de la peau. Feuille ovale au bord ondulé, frangé de cils soyeux quand elle est jeune. Bourgeons très longs et pointus, en forme de cigare.","diff":"Le charme a une feuille doublement dentée et plissée, et un tronc cannelé « musclé ». Le hêtre a un bord de feuille lisse et cilié.","conf":["carpinus-betulus"]},{"id":"carpinus-betulus","lat":"Carpinus betulus","fr":"Charme commun","fam":"Bétulacées","type":"Arbre caduc","orig":"Europe","lvl":1,"tip":"Feuille doublement dentée, aux nervures parallèles très marquées qui la font paraître plissée. Tronc gris cannelé. En haie taillée, il garde ses feuilles sèches en hiver.","diff":"Le hêtre a une feuille au bord entier, ondulé et cilié. Le charme est denté en scie.","conf":["fagus-sylvatica","corylus-avellana"]},{"id":"acer-platanoides","lat":"Acer platanoides","fr":"Érable plane","fam":"Sapindacées","type":"Arbre caduc","orig":"Europe","lvl":1,"tip":"Feuilles opposées à 5 lobes terminés par de longues pointes fines. Cassez le pétiole : un latex blanc perle. Samares écartées presque à plat.","diff":"Le sycomore a des lobes à dents émoussées, sans latex. Le platane a des feuilles alternes. Retenez que tous les érables ont des feuilles opposées.","conf":["acer-pseudoplatanus","platanus-hispanica"]},{"id":"acer-pseudoplatanus","lat":"Acer pseudoplatanus","fr":"Érable sycomore","fam":"Sapindacées","type":"Arbre caduc","orig":"Europe","lvl":1,"tip":"Grandes feuilles opposées à 5 lobes peu profonds, à dents irrégulières et arrondies, dessous glauque. Écorce qui s'écaille en plaques sur les vieux sujets. Samares en V serré.","diff":"L'érable plane a des pointes effilées et du latex blanc. Le platane, lui, a des feuilles alternes.","conf":["acer-platanoides","platanus-hispanica"]},{"id":"platanus-hispanica","lat":"Platanus × hispanica","fr":"Platane commun","fam":"Platanacées","type":"Arbre caduc","orig":"Hybride horticole","lvl":1,"wiki":"Platanus × hispanica","tip":"Écorce qui se détache en plaques et laisse un tronc marbré façon camouflage. Feuilles alternes ; la base du pétiole coiffe et cache le bourgeon. Fruits en boules pendantes qui restent l'hiver.","diff":"Les érables ont la même silhouette de feuille, mais leurs feuilles sont opposées et leur écorce n'est pas marbrée.","conf":["acer-pseudoplatanus","liquidambar-styraciflua"]},{"id":"tilia-cordata","lat":"Tilia cordata","fr":"Tilleul à petites feuilles","fam":"Malvacées","type":"Arbre caduc","orig":"Europe","lvl":1,"tip":"Feuille en cœur, asymétrique à la base. Au revers, de petites touffes de poils roux à l'aisselle des nervures. Les fleurs pendent sous une bractée en forme de languette.","diff":"Le tilleul à grandes feuilles a une feuille plus grande et velue, avec des touffes de poils blancs au revers.","conf":["tilia-platyphyllos"]},{"id":"betula-pendula","lat":"Betula pendula","fr":"Bouleau verruqueux","fam":"Bétulacées","type":"Arbre caduc","orig":"Europe","lvl":1,"tip":"Écorce blanche qui se détache en fines lanières, crevassée de noir à la base. Jeunes rameaux pendants couverts de petites verrues. Feuille en losange, doublement dentée.","diff":"Le bouleau pubescent a des rameaux dressés, duveteux et sans verrues. Le bouleau de l'Himalaya a une écorce d'un blanc pur, sans crevasses noires.","conf":["populus-nigra"]},{"id":"fraxinus-excelsior","lat":"Fraxinus excelsior","fr":"Frêne commun","fam":"Oléacées","type":"Arbre caduc","orig":"Europe","lvl":1,"tip":"Feuilles composées opposées de 9 à 13 folioles dentées. Signe immanquable en hiver : des bourgeons noirs et veloutés, comme du charbon.","diff":"Le sorbier des oiseleurs a lui aussi des feuilles composées, mais alternes et à bourgeons violacés et poilus.","conf":["sorbus-aucuparia","sambucus-nigra","juglans-regia"]},{"id":"prunus-laurocerasus","lat":"Prunus laurocerasus","fr":"Laurier-cerise (laurier-palme)","fam":"Rosacées","type":"Arbuste persistant","orig":"Europe de l'Est, Asie Mineure","lvl":1,"tip":"Grandes feuilles vert vif, épaisses et brillantes. Retournez-en une : 2 à 4 petites glandes près de la base. Froissée, elle sent l'amande amère (plante toxique).","diff":"Le laurier-sauce a une feuille plus petite, au bord ondulé, très aromatique et sans glandes. Le laurier du Portugal a des pétioles rouges.","conf":["laurus-nobilis","prunus-lusitanica"]},{"id":"buxus-sempervirens","lat":"Buxus sempervirens","fr":"Buis commun","fam":"Buxacées","type":"Arbuste persistant","orig":"Europe, Afrique du Nord","lvl":1,"tip":"Petites feuilles opposées, ovales, souvent échancrées au sommet, au bord entier. Rameaux à 4 angles. Odeur caractéristique, un peu animale.","diff":"Le houx crénelé et le chèvrefeuille arbustif lui ressemblent, mais le houx crénelé a des feuilles alternes et finement dentées.","conf":["ilex-crenata","lonicera-nitida"]},{"id":"ligustrum-vulgare","lat":"Ligustrum vulgare","fr":"Troène commun","fam":"Oléacées","type":"Arbuste semi-persistant","orig":"Europe","lvl":1,"tip":"Feuilles opposées, lancéolées, au bord entier. En juin, panicules de fleurs blanches à l'odeur forte, puis baies noires luisantes.","diff":"Le troène de Californie a des feuilles plus larges et ovales, plus persistantes, et des rameaux glabres.","conf":["ligustrum-ovalifolium","lonicera-nitida"]},{"id":"hedera-helix","lat":"Hedera helix","fr":"Lierre grimpant","fam":"Araliacées","type":"Liane persistante","orig":"Europe","lvl":1,"tip":"Deux formes de feuilles sur une même plante : à 3-5 lobes sur les tiges rampantes, entières en losange sur les rameaux fleuris. Tiges munies de crampons. Il fleurit en automne.","diff":"Le lierre des Canaries ou d'Irlande a des feuilles bien plus grandes et des tiges rougeâtres.","conf":[]},{"id":"lavandula-angustifolia","lat":"Lavandula angustifolia","fr":"Lavande vraie","fam":"Lamiacées","type":"Sous-arbrisseau","orig":"Méditerranée","lvl":1,"tip":"Feuilles étroites gris-vert. Chaque tige florale porte un seul épi, court et compact. Plante compacte au parfum fin.","diff":"Le lavandin est plus grand, et ses tiges se ramifient en 3 épis. La lavande papillon porte de grandes bractées en oreilles de lapin.","conf":["lavandula-intermedia","lavandula-stoechas","perovskia-atriplicifolia"]},{"id":"salvia-rosmarinus","lat":"Salvia rosmarinus","fr":"Romarin","fam":"Lamiacées","type":"Arbuste persistant","orig":"Méditerranée","lvl":1,"wiki":"Romarin","tip":"Feuilles en aiguilles coriaces, vert foncé dessus, blanches dessous, aux bords enroulés. Odeur camphrée puissante. Fleurs bleu pâle en hiver et au printemps. (Ancien nom : Rosmarinus officinalis.)","diff":"La lavande a des feuilles plus molles, grises des deux côtés, et des fleurs en épis au bout de longues tiges.","conf":["lavandula-angustifolia","teucrium-fruticans"]},{"id":"photinia-fraseri","lat":"Photinia × fraseri","fr":"Photinia 'Red Robin'","fam":"Rosacées","type":"Arbuste persistant","orig":"Hybride horticole","lvl":1,"wiki":"Photinia × fraseri","tip":"Jeunes pousses rouge vif au printemps et après chaque taille. Feuilles alternes, coriaces, finement dentées.","diff":"Le piéris a lui aussi des pousses rouges, mais ses feuilles sont serrées en rosettes et il fleurit en clochettes blanches pendantes.","conf":["pieris-japonica","prunus-laurocerasus"]},{"id":"laurus-nobilis","lat":"Laurus nobilis","fr":"Laurier-sauce","fam":"Lauracées","type":"Arbuste persistant","orig":"Méditerranée","lvl":1,"tip":"Feuilles alternes coriaces au bord légèrement ondulé, très aromatiques quand on les froisse. Petites fleurs jaunâtres en bouquets au printemps.","diff":"Le laurier-cerise a des feuilles plus grandes, très brillantes, avec des glandes au revers, et il n'a pas l'odeur de cuisine.","conf":["prunus-laurocerasus","nerium-oleander"]},{"id":"taxus-baccata","lat":"Taxus baccata","fr":"If commun","fam":"Taxacées","type":"Conifère persistant","orig":"Europe","lvl":1,"tip":"Aiguilles plates et souples, vert foncé dessus, vert pâle dessous, sans bandes blanches. Pas de cône : une « baie » rouge (arille). Tout est toxique sauf la chair rouge.","diff":"Le sapin pectiné porte deux bandes blanches sous l'aiguille et des cônes dressés.","conf":["abies-alba","picea-abies"]},{"id":"thuja-occidentalis","lat":"Thuja occidentalis","fr":"Thuya du Canada","fam":"Cupressacées","type":"Conifère persistant","orig":"Amérique du Nord","lvl":1,"tip":"Rameaux aplatis en éventails, couverts de petites écailles. Petits cônes allongés dressés, qui s'ouvrent comme une tulipe. Odeur fruitée au froissement.","diff":"Le faux-cyprès de Lawson a des cônes ronds et des marques blanches en X sous les rameaux. Le Leyland a des rameaux moins plats et pousse bien plus vite.","conf":["chamaecyparis-lawsoniana","cuprocyparis-leylandii"]},{"id":"pinus-sylvestris","lat":"Pinus sylvestris","fr":"Pin sylvestre","fam":"Pinacées","type":"Conifère persistant","orig":"Europe, Asie","lvl":1,"tip":"Aiguilles par 2, courtes (4-7 cm), torsadées et bleutées. Le haut du tronc a une écorce orange saumoné, très reconnaissable de loin.","diff":"Le pin noir d'Autriche a des aiguilles plus longues, raides et vert sombre, et une écorce grise jusqu'en haut.","conf":["pinus-nigra","pinus-pinea"]},{"id":"hydrangea-macrophylla","lat":"Hydrangea macrophylla","fr":"Hortensia","fam":"Hydrangéacées","type":"Arbuste caduc","orig":"Japon","lvl":1,"tip":"Grandes feuilles opposées, dentées et brillantes. Fleurs en boules ou en plateaux, bleues en sol acide, roses en sol calcaire.","diff":"L'hortensia paniculé fleurit en cônes allongés blancs. L'hortensia à feuilles de chêne a des feuilles lobées.","conf":["hydrangea-paniculata","hydrangea-quercifolia","viburnum-opulus"]},{"id":"rosa-canina","lat":"Rosa canina","fr":"Églantier","fam":"Rosacées","type":"Arbuste caduc","orig":"Europe","lvl":1,"tip":"Tiges arquées garnies d'aiguillons crochus. Feuilles composées de 5 à 7 folioles dentées. Fleurs simples à 5 pétales rose pâle, puis cynorhodons rouges.","diff":"La ronce a des feuilles à 3-5 folioles disposées en main, et des fruits noirs.","conf":[]},{"id":"forsythia-intermedia","lat":"Forsythia × intermedia","fr":"Forsythia","fam":"Oléacées","type":"Arbuste caduc","orig":"Hybride horticole","lvl":1,"wiki":"Forsythia","tip":"En mars, explosion de fleurs jaune vif à 4 pétales, avant les feuilles. Coupez une tige : la moelle est creuse ou cloisonnée.","diff":"Le jasmin d'hiver fleurit plus tôt, en plein hiver. Ses fleurs ont 5-6 pétales et ses rameaux sont verts et quadrangulaires.","conf":["jasminum-nudiflorum"]},{"id":"buddleja-davidii","lat":"Buddleja davidii","fr":"Arbre aux papillons","fam":"Scrophulariacées","type":"Arbuste caduc","orig":"Chine","lvl":1,"tip":"Longues panicules parfumées, violettes, mauves ou blanches, en été, toujours entourées de papillons. Feuilles opposées lancéolées, blanches et feutrées dessous. Envahissant.","diff":"Le lilas fleurit au printemps, et ses feuilles en cœur sont lisses des deux côtés.","conf":["syringa-vulgaris"]},{"id":"olea-europaea","lat":"Olea europaea","fr":"Olivier","fam":"Oléacées","type":"Arbre persistant","orig":"Méditerranée","lvl":1,"tip":"Feuilles opposées, étroites, gris-vert dessus et argentées dessous. Tronc noueux et creusé avec l'âge.","diff":"Le filaria (Phillyrea) a des feuilles plus vertes, sans revers argenté. L'éléagnus a des feuilles alternes ponctuées d'écailles rousses.","conf":["phillyrea-angustifolia","elaeagnus-ebbingei"]},{"id":"cornus-sanguinea","lat":"Cornus sanguinea","fr":"Cornouiller sanguin","fam":"Cornacées","type":"Arbuste caduc","orig":"Europe","lvl":1,"tip":"Feuilles opposées aux nervures arquées qui convergent vers la pointe. Déchirez doucement une feuille : de fins fils blancs la retiennent. Rameaux rouges en hiver.","diff":"Le cornouiller blanc a des rameaux rouge plus vif et des fruits blancs. Le cornouiller sanguin a des fruits noirs.","conf":["cornus-alba","cornus-mas"]},{"id":"corylus-avellana","lat":"Corylus avellana","fr":"Noisetier","fam":"Bétulacées","type":"Arbuste caduc","orig":"Europe","lvl":1,"tip":"Feuille presque ronde, doublement dentée, rugueuse au toucher, à pointe courte. Chatons jaunes dès janvier. Pousse en cépée de nombreuses tiges.","diff":"Le charme a une feuille ovale plus allongée, lisse, aux nervures très parallèles.","conf":["carpinus-betulus","alnus-glutinosa"]},{"id":"sambucus-nigra","lat":"Sambucus nigra","fr":"Sureau noir","fam":"Viburnacées","type":"Arbuste caduc","orig":"Europe","lvl":1,"tip":"Feuilles opposées composées de 5 à 7 folioles, à l'odeur désagréable une fois froissées. Moelle blanche abondante. Larges ombelles de fleurs crème, puis baies noires pendantes.","diff":"Le frêne a des folioles plus nombreuses et des bourgeons noirs. Le sureau a des tiges grises couvertes de lenticelles.","conf":["fraxinus-excelsior"]},{"id":"viburnum-tinus","lat":"Viburnum tinus","fr":"Laurier-tin","fam":"Viburnacées","type":"Arbuste persistant","orig":"Méditerranée","lvl":1,"tip":"Feuilles opposées, persistantes, ovales et entières, avec de petites touffes de poils à l'aisselle des nervures. Fleurs blanches en plein hiver, boutons roses, baies bleu métallique.","diff":"Le laurier-sauce a des feuilles alternes et aromatiques. Le laurier-tin a des feuilles opposées, sans odeur.","conf":["laurus-nobilis","rhamnus-alaternus"]},{"id":"ilex-aquifolium","lat":"Ilex aquifolium","fr":"Houx commun","fam":"Aquifoliacées","type":"Arbuste persistant","orig":"Europe","lvl":1,"tip":"Feuilles simples, coriaces, très brillantes, aux bords ondulés et épineux (souvent moins épineuses en haut de l'arbre). Baies rouges seulement sur les pieds femelles.","diff":"Le mahonia a des feuilles composées de plusieurs folioles épineuses. L'osmanthe à feuilles de houx a des feuilles opposées.","conf":["mahonia-aquifolium","osmanthus-heterophyllus"]},{"id":"magnolia-grandiflora","lat":"Magnolia grandiflora","fr":"Magnolia à grandes fleurs","fam":"Magnoliacées","type":"Arbre persistant","orig":"Sud-est des États-Unis","lvl":2,"tip":"Grandes feuilles épaisses et luisantes, dont le revers est souvent feutré de roux. Énormes fleurs blanches parfumées en été.","diff":"Le laurier-cerise a des feuilles plus fines, sans revers roux, et des grappes de petites fleurs.","conf":["prunus-laurocerasus"]},{"id":"cercis-siliquastrum","lat":"Cercis siliquastrum","fr":"Arbre de Judée","fam":"Fabacées","type":"Arbre caduc","orig":"Méditerranée orientale","lvl":2,"tip":"Feuilles rondes en cœur, au bord entier. Au printemps, fleurs rose magenta directement sur le bois, même sur le tronc, avant les feuilles. Gousses plates violacées en hiver.","diff":"Le tilleul a aussi des feuilles en cœur, mais dentées et asymétriques.","conf":["tilia-cordata","catalpa-bignonioides"]},{"id":"lagerstroemia-indica","lat":"Lagerstroemia indica","fr":"Lilas des Indes","fam":"Lythracées","type":"Arbre caduc","orig":"Chine","lvl":2,"tip":"Écorce lisse qui s'exfolie en laissant des taches beige, grises et roses. Fleurs crêpées roses, rouges ou blanches en fin d'été. Petites feuilles entières presque opposées.","diff":"Le platane a lui aussi une écorce marbrée, mais c'est un grand arbre à grandes feuilles lobées.","conf":["platanus-hispanica"]},{"id":"syringa-vulgaris","lat":"Syringa vulgaris","fr":"Lilas commun","fam":"Oléacées","type":"Arbuste caduc","orig":"Balkans","lvl":2,"tip":"Feuilles opposées en cœur, au bord entier, lisses. Bourgeons verts groupés par paires. Grappes très parfumées en avril-mai.","diff":"L'arbre aux papillons fleurit en été, avec des feuilles allongées et feutrées dessous.","conf":["buddleja-davidii"]},{"id":"nerium-oleander","lat":"Nerium oleander","fr":"Laurier-rose","fam":"Apocynacées","type":"Arbuste persistant","orig":"Méditerranée","lvl":2,"tip":"Feuilles étroites et coriaces, souvent groupées par 3 au même niveau, à nervure centrale saillante. Fleurs roses, blanches ou rouges tout l'été. Toutes les parties sont très toxiques.","diff":"Le laurier-sauce a des feuilles alternes, aromatiques et plus larges.","conf":["laurus-nobilis","olea-europaea"]},{"id":"pittosporum-tobira","lat":"Pittosporum tobira","fr":"Pittosporum de Chine","fam":"Pittosporacées","type":"Arbuste persistant","orig":"Chine, Japon","lvl":2,"tip":"Feuilles obovales, épaisses, au bord légèrement enroulé, groupées en rosettes au bout des rameaux. Fleurs crème au parfum de fleur d'oranger.","diff":"Le Pittosporum tenuifolium a des petites feuilles ondulées et des tiges noires.","conf":["pittosporum-tenuifolium","viburnum-tinus"]},{"id":"elaeagnus-ebbingei","lat":"Elaeagnus × ebbingei","fr":"Chalef d'Ebbinge","fam":"Élaéagnacées","type":"Arbuste persistant","orig":"Hybride horticole","lvl":2,"wiki":"Elaeagnus × submacrophylla","tip":"Revers des feuilles argenté et ponctué de petites écailles rousses, comme les jeunes rameaux. Fleurs discrètes, très parfumées, en octobre-novembre.","diff":"L'olivier a des feuilles plus étroites, opposées, sans écailles rousses.","conf":["olea-europaea"]},{"id":"choisya-ternata","lat":"Choisya ternata","fr":"Oranger du Mexique","fam":"Rutacées","type":"Arbuste persistant","orig":"Mexique","lvl":2,"tip":"Feuilles opposées à 3 folioles brillantes. Froissées, elles sentent fort, entre agrume et épices. Fleurs blanches étoilées au printemps.","diff":"Sa feuille en trèfle à 3 doigts et son odeur forte le distinguent des autres arbustes à feuilles vernissées.","conf":["skimmia-japonica"]},{"id":"abelia-grandiflora","lat":"Abelia × grandiflora","fr":"Abélia","fam":"Caprifoliacées","type":"Arbuste semi-persistant","orig":"Hybride horticole","lvl":2,"wiki":"Abelia × grandiflora","tip":"Petites feuilles opposées, brillantes, finement dentées. Petites clochettes blanc rosé de juin à octobre. Le calice rose reste après la floraison et colore l'arbuste.","diff":"Le chèvrefeuille arbustif a de minuscules feuilles entières et une floraison discrète.","conf":["lonicera-nitida"]},{"id":"spiraea-vanhouttei","lat":"Spiraea × vanhouttei","fr":"Spirée de Van Houtte","fam":"Rosacées","type":"Arbuste caduc","orig":"Hybride horticole","lvl":2,"wiki":"Spiraea × vanhouttei","tip":"Rameaux arqués couverts de petits bouquets ronds de fleurs blanches en avril-mai. Petites feuilles en losange, dentées vers la pointe, bleutées dessous.","diff":"La spirée du Japon fleurit en été, en plateaux roses au bout des tiges.","conf":["deutzia-scabra"]},{"id":"deutzia-scabra","lat":"Deutzia scabra","fr":"Deutzia","fam":"Hydrangéacées","type":"Arbuste caduc","orig":"Japon","lvl":2,"tip":"Feuilles opposées, rugueuses comme du papier de verre, à cause de poils étoilés. Écorce qui pèle en lanières. Tiges creuses. Grappes de fleurs blanches étoilées en juin.","diff":"Le seringat (Philadelphus) a des feuilles lisses et des fleurs plus grandes, très parfumées. La spirée a des feuilles alternes.","conf":["spiraea-vanhouttei"]},{"id":"mahonia-aquifolium","lat":"Mahonia aquifolium","fr":"Mahonia à feuilles de houx","fam":"Berbéridacées","type":"Arbuste persistant","orig":"Ouest de l'Amérique du Nord","lvl":2,"wiki":"Berberis aquifolium","tip":"Feuilles composées de 5 à 9 folioles épineuses et luisantes. Grappes de fleurs jaunes en fin d'hiver, puis baies bleu-noir pruinées. Le bois est jaune à la coupe.","diff":"Le houx a une feuille simple, unique, et des baies rouges. Comptez les folioles pour trancher.","conf":["ilex-aquifolium"]},{"id":"berberis-thunbergii","lat":"Berberis thunbergii","fr":"Épine-vinette de Thunberg","fam":"Berbéridacées","type":"Arbuste caduc","orig":"Japon","lvl":2,"tip":"Petites feuilles entières en rosettes, avec une épine simple sous chacune. Le bois est jaune vif à la coupe. Souvent planté en forme pourpre ('Atropurpurea'). Baies rouges brillantes.","diff":"Le buisson ardent a des feuilles dentées et des fruits en grosses grappes. L'épine-vinette commune a des épines à 3 branches.","conf":["pyracantha-coccinea"]},{"id":"pyracantha-coccinea","lat":"Pyracantha coccinea","fr":"Buisson ardent","fam":"Rosacées","type":"Arbuste persistant","orig":"Sud de l'Europe","lvl":2,"tip":"Rameaux très épineux. Petites feuilles finement crénelées. En automne, masses de fruits rouges, orange ou jaunes.","diff":"Les cotonéasters ont des fruits semblables, mais ils n'ont jamais d'épines.","conf":["cotoneaster-horizontalis","crataegus-monogyna"]},{"id":"cotoneaster-horizontalis","lat":"Cotoneaster horizontalis","fr":"Cotonéaster horizontal","fam":"Rosacées","type":"Arbuste caduc","orig":"Chine","lvl":2,"tip":"Rameaux ramifiés en arêtes de poisson, étalés à plat. Petites feuilles rondes et brillantes. Fruits rouges. Aucune épine.","diff":"Le buisson ardent porte des épines et des feuilles crénelées.","conf":["pyracantha-coccinea"]},{"id":"euonymus-japonicus","lat":"Euonymus japonicus","fr":"Fusain du Japon","fam":"Célastracées","type":"Arbuste persistant","orig":"Japon, Corée","lvl":2,"tip":"Feuilles opposées, épaisses et vernissées, finement crénelées. Rameaux verts et quadrangulaires. Formes panachées très fréquentes.","diff":"Le troène a des feuilles au bord entier. Le fusain a des dents fines, à sentir du bout du doigt.","conf":["ligustrum-ovalifolium","euonymus-europaeus"]},{"id":"euonymus-europaeus","lat":"Euonymus europaeus","fr":"Fusain d'Europe (bonnet d'évêque)","fam":"Célastracées","type":"Arbuste caduc","orig":"Europe","lvl":2,"tip":"Fruits rose vif à 4 lobes qui s'ouvrent sur des graines orange. Jeunes rameaux verts à 4 angles, parfois liégeux. Feuilles opposées finement dentées.","diff":"Le cornouiller sanguin a lui aussi des feuilles opposées, mais à nervures arquées et sans dents.","conf":["cornus-sanguinea"]},{"id":"viburnum-opulus","lat":"Viburnum opulus","fr":"Viorne obier","fam":"Viburnacées","type":"Arbuste caduc","orig":"Europe","lvl":2,"tip":"Feuilles opposées à 3 lobes. Petites glandes en forme de cupule sur le pétiole. Fleurs en plateaux bordés de grandes fleurs stériles. Fruits rouges translucides.","diff":"L'érable champêtre a une feuille proche mais sans glandes sur le pétiole, et il produit du latex.","conf":["acer-campestre","hydrangea-macrophylla"]},{"id":"acer-campestre","lat":"Acer campestre","fr":"Érable champêtre","fam":"Sapindacées","type":"Arbre caduc","orig":"Europe","lvl":2,"tip":"Petites feuilles opposées à 3-5 lobes arrondis. Un peu de latex au pétiole cassé. Rameaux souvent liégeux. Samares alignées à l'horizontale. Très utilisé en haies.","diff":"La viorne obier a des glandes sur le pétiole. Les autres érables ont de bien plus grandes feuilles.","conf":["viburnum-opulus","acer-platanoides"]},{"id":"acer-palmatum","lat":"Acer palmatum","fr":"Érable du Japon","fam":"Sapindacées","type":"Arbuste caduc","orig":"Japon, Corée","lvl":2,"tip":"Feuilles opposées palmées, découpées profondément en 5 à 9 lobes pointus et dentés. Port étagé et gracieux. Couleurs d'automne flamboyantes.","diff":"Le copalme a des lobes semblables, mais en feuilles alternes, et c'est un grand arbre.","conf":["liquidambar-styraciflua"]},{"id":"ginkgo-biloba","lat":"Ginkgo biloba","fr":"Arbre aux quarante écus","fam":"Ginkgoacées","type":"Arbre caduc","orig":"Chine","lvl":2,"tip":"Feuille unique en éventail, aux nervures qui se divisent en fourche, souvent échancrée au centre. Groupée en bouquets sur des rameaux courts. Jaune d'or en automne.","diff":"Aucune autre plante n'a cette feuille. Les fruits des pieds femelles sentent le beurre rance.","conf":[]},{"id":"liquidambar-styraciflua","lat":"Liquidambar styraciflua","fr":"Copalme d'Amérique","fam":"Altingiacées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":2,"tip":"Feuille alterne en étoile à 5-7 lobes pointus, qui sent la résine au froissement. Rameaux souvent liégeux. Fruits en boules hérissées. Superbes couleurs d'automne.","diff":"Les érables ont des feuilles opposées. Le copalme les a alternes.","conf":["acer-platanoides","acer-palmatum","platanus-hispanica"]},{"id":"prunus-cerasifera","lat":"Prunus cerasifera","fr":"Prunier myrobolan","fam":"Rosacées","type":"Arbre caduc","orig":"Asie occidentale","lvl":2,"tip":"Floraison blanche ou rose pâle très précoce, en février-mars. En ville, surtout la forme pourpre 'Pissardii' : feuillage pourpre, petites feuilles ovales dentées.","diff":"Le hêtre pourpre a des feuilles au bord entier et cilié, et c'est un grand arbre.","conf":["prunus-serrulata","prunus-spinosa"]},{"id":"prunus-serrulata","lat":"Prunus serrulata","fr":"Cerisier du Japon","fam":"Rosacées","type":"Arbre caduc","orig":"Japon, Chine, Corée","lvl":2,"tip":"Écorce brun-rouge brillante rayée de lenticelles horizontales. Feuilles dont les dents finissent par un petit fil. Fleurs souvent doubles, roses, en avril.","diff":"Le merisier a la même écorce, mais des fleurs simples blanches et des dents de feuille sans fil.","conf":["prunus-avium","prunus-cerasifera"]},{"id":"robinia-pseudoacacia","lat":"Robinia pseudoacacia","fr":"Robinier faux-acacia","fam":"Fabacées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":2,"tip":"Feuilles composées de folioles ovales au bord entier, avec une paire d'épines à la base de chaque feuille. Grappes blanches parfumées en mai. Écorce très crevassée.","diff":"Le févier a des folioles bien plus petites et de grosses épines ramifiées sur le tronc.","conf":["gleditsia-triacanthos","sophora-japonica"]},{"id":"gleditsia-triacanthos","lat":"Gleditsia triacanthos","fr":"Févier d'Amérique","fam":"Fabacées","type":"Arbre caduc","orig":"Amérique du Nord","lvl":2,"tip":"Petites folioles nombreuses ; feuilles souvent deux fois divisées. Énormes épines ramifiées sur le tronc (sauf la forme 'Inermis' plantée en ville). Longues gousses tordues.","diff":"Le robinier a des folioles plus grandes et une petite paire d'épines à chaque feuille, pas sur le tronc.","conf":["robinia-pseudoacacia","albizia-julibrissin"]},{"id":"albizia-julibrissin","lat":"Albizia julibrissin","fr":"Arbre à soie","fam":"Fabacées","type":"Arbre caduc","orig":"Asie","lvl":2,"tip":"Feuillage très fin et plumeux, deux fois divisé, qui se replie la nuit. En été, houppes de fleurs roses soyeuses en pompons. Port en parasol.","diff":"Le févier a un feuillage proche, mais des fleurs discrètes et souvent des épines.","conf":["gleditsia-triacanthos","jacaranda-mimosifolia"]},{"id":"catalpa-bignonioides","lat":"Catalpa bignonioides","fr":"Catalpa","fam":"Bignoniacées","type":"Arbre caduc","orig":"Sud-est des États-Unis","lvl":2,"tip":"Très grandes feuilles en cœur, souvent groupées par 3 au même niveau. Elles sentent mauvais froissées. Fleurs blanches tachetées en juillet, puis longues gousses pendantes comme des haricots.","diff":"Le paulownia a des feuilles opposées très velues et fleurit en mauve avant les feuilles.","conf":["paulownia-tomentosa","cercis-siliquastrum"]},{"id":"paulownia-tomentosa","lat":"Paulownia tomentosa","fr":"Paulownia","fam":"Paulowniacées","type":"Arbre caduc","orig":"Chine","lvl":2,"tip":"Énormes feuilles opposées, veloutées des deux côtés. En avril, grandes clochettes mauves parfumées, avant les feuilles. Capsules brunes en forme d'œuf qui restent l'hiver.","diff":"Le catalpa fleurit en blanc après les feuilles et ses fruits sont de longues gousses.","conf":["catalpa-bignonioides"]},{"id":"aesculus-hippocastanum","lat":"Aesculus hippocastanum","fr":"Marronnier d'Inde","fam":"Sapindacées","type":"Arbre caduc","orig":"Balkans","lvl":2,"tip":"Feuilles opposées en main, à 5-7 grandes folioles. Gros bourgeons bruns et collants en hiver. Chandelles de fleurs blanches en avril. Bogue à quelques piquants épars.","diff":"Le châtaignier a des feuilles simples, alternes, en dents de scie, et des bogues hérissées comme un oursin.","conf":["castanea-sativa"]},{"id":"castanea-sativa","lat":"Castanea sativa","fr":"Châtaignier","fam":"Fagacées","type":"Arbre caduc","orig":"Europe du Sud","lvl":2,"tip":"Longues feuilles simples alternes, aux dents terminées par une pointe. Écorce aux crevasses souvent spiralées. Bogues couvertes de piquants serrés.","diff":"Le marronnier a des feuilles composées en main. On ne mange pas son fruit (toxique).","conf":["aesculus-hippocastanum","quercus-robur"]},{"id":"juglans-regia","lat":"Juglans regia","fr":"Noyer commun","fam":"Juglandacées","type":"Arbre caduc","orig":"Asie centrale","lvl":2,"tip":"Feuilles composées alternes de 5 à 9 grandes folioles entières, la terminale la plus grande. Odeur forte et typique au froissement. Moelle cloisonnée en échelle.","diff":"Le frêne a des folioles dentées, plus nombreuses, en feuilles opposées.","conf":["fraxinus-excelsior","ailanthus-altissima"]},{"id":"ailanthus-altissima","lat":"Ailanthus altissima","fr":"Ailante (faux vernis du Japon)","fam":"Simaroubacées","type":"Arbre caduc","orig":"Chine","lvl":2,"tip":"Très longues feuilles composées. Chaque foliole a 1 à 3 dents glanduleuses près de la base. Odeur désagréable. Espèce exotique envahissante.","diff":"Le noyer et le frêne n'ont pas ces petites dents glanduleuses à la base des folioles.","conf":["juglans-regia","fraxinus-excelsior"]},{"id":"salix-babylonica","lat":"Salix babylonica","fr":"Saule pleureur","fam":"Salicacées","type":"Arbre caduc","orig":"Chine","lvl":2,"tip":"Longs rameaux fins qui retombent jusqu'au sol. Feuilles étroites lancéolées et finement dentées. On l'aime au bord de l'eau. (Les sujets plantés sont souvent l'hybride Salix × sepulcralis.)","diff":"Le bouleau pleureur a des feuilles en losange et une écorce blanche.","conf":["betula-pendula"]},{"id":"populus-nigra","lat":"Populus nigra","fr":"Peuplier noir","fam":"Salicacées","type":"Arbre caduc","orig":"Europe","lvl":2,"tip":"Feuille triangulaire, pointue, sur un pétiole aplati qui la fait trembler au vent. Le cultivar 'Italica' forme une colonne étroite le long des routes.","diff":"Le bouleau a une feuille proche mais doublement dentée et une écorce blanche.","conf":["betula-pendula","cupressus-sempervirens"]},{"id":"cedrus-atlantica","lat":"Cedrus atlantica","fr":"Cèdre de l'Atlas","fam":"Pinacées","type":"Conifère persistant","orig":"Afrique du Nord","lvl":2,"tip":"Aiguilles courtes en rosettes sur de petits rameaux courts. Cônes en forme de tonnelets dressés sur les branches. La flèche (sommet) se tient droite. Forme bleue 'Glauca' très plantée.","diff":"Le cèdre du Liban a des étages horizontaux en plateaux. Le déodar a une flèche qui retombe. Le mélèze perd ses aiguilles en hiver.","conf":["cedrus-libani","cedrus-deodara","larix-decidua"]},{"id":"cupressus-sempervirens","lat":"Cupressus sempervirens","fr":"Cyprès de Provence","fam":"Cupressacées","type":"Conifère persistant","orig":"Méditerranée orientale","lvl":2,"tip":"Silhouette en colonne étroite et dense, vert sombre. Feuillage en petites écailles sur des rameaux non aplatis. Cônes ronds de 3 cm, à écailles en bouclier.","diff":"Le thuya et le faux-cyprès ont des rameaux aplatis en éventail.","conf":["thuja-occidentalis","cuprocyparis-leylandii"]},{"id":"phyllostachys-aurea","lat":"Phyllostachys aurea","fr":"Bambou doré","fam":"Poacées","type":"Bambou","orig":"Chine","lvl":2,"tip":"Chez les Phyllostachys, chaque entre-nœud porte une gouttière d'un côté. Chez celui-ci, les nœuds du bas sont tassés et irréguliers. Bambou traçant, à planter avec une barrière anti-rhizome.","diff":"Les Fargesia sont des bambous non traçants, en touffe, sans gouttière sur le chaume.","conf":[]},{"id":"trachycarpus-fortunei","lat":"Trachycarpus fortunei","fr":"Palmier de Chine","fam":"Arécacées","type":"Palmier","orig":"Chine","lvl":2,"tip":"Feuilles en éventail rondes, découpées. Tronc couvert d'une fibre brune serrée qui ressemble à une toile. C'est le palmier le plus rustique (jusqu'à environ -15 °C).","diff":"Le palmier nain (Chamaerops) forme une touffe de plusieurs troncs et ses pétioles portent de fortes épines.","conf":["chamaerops-humilis","washingtonia-filifera"]},{"id":"agapanthus-africanus","lat":"Agapanthus africanus","fr":"Agapanthe","fam":"Amaryllidacées","type":"Vivace","orig":"Afrique du Sud","lvl":3,"wiki":"Agapanthus","tip":"Touffe de feuilles en lanières charnues. En été, une tige nue porte une boule de fleurs bleues ou blanches en trompettes.","diff":"L'hémérocalle a des fleurs plus grandes, orange ou jaunes, groupées en petit nombre et ramifiées, jamais en boule.","conf":["hemerocallis-fulva","allium-giganteum"]},{"id":"hemerocallis-fulva","lat":"Hemerocallis fulva","fr":"Hémérocalle fauve","fam":"Asphodélacées","type":"Vivace","orig":"Asie","lvl":3,"tip":"Feuilles en lanières arquées, pliées en V. Grandes fleurs orange en entonnoir, qui ne durent qu'un jour (d'où le nom anglais « daylily »).","diff":"L'agapanthe a des fleurs bleues regroupées en boule au sommet de la tige.","conf":["agapanthus-africanus","kniphofia-uvaria"]},{"id":"miscanthus-sinensis","lat":"Miscanthus sinensis","fr":"Miscanthus (roseau de Chine)","fam":"Poacées","type":"Graminée","orig":"Asie de l'Est","lvl":3,"tip":"Grosse touffe de feuilles marquées d'une nervure centrale blanche. En fin d'été, plumeaux soyeux en éventail, argentés ou rosés, qui tiennent l'hiver.","diff":"L'herbe de la pampa est bien plus grande. Ses feuilles sont coupantes et ses plumets denses en épi.","conf":["cortaderia-selloana","pennisetum-alopecuroides"]},{"id":"cortaderia-selloana","lat":"Cortaderia selloana","fr":"Herbe de la pampa","fam":"Poacées","type":"Graminée","orig":"Amérique du Sud","lvl":3,"tip":"Énorme touffe de feuilles très coupantes, retombantes. Grands plumets denses, blancs ou rosés, sur des tiges de 2 à 3 m. Envahissante sur le littoral atlantique.","diff":"Le miscanthus est plus petit, ses feuilles ne coupent pas et ses plumeaux sont plus lâches.","conf":["miscanthus-sinensis"]},{"id":"nassella-tenuissima","lat":"Nassella tenuissima","fr":"Stipa cheveux d'ange","fam":"Poacées","type":"Graminée","orig":"Amériques","lvl":3,"tip":"Touffe de feuilles très fines comme des cheveux, qui ondulent au moindre vent. Épis blond paille en été. Souvent vendue sous l'ancien nom Stipa tenuissima.","diff":"La fétuque bleue a des feuilles fines mais raides, bleu-gris, en coussin.","conf":["festuca-glauca","pennisetum-alopecuroides"]},{"id":"pennisetum-alopecuroides","lat":"Pennisetum alopecuroides","fr":"Herbe aux écouvillons","fam":"Poacées","type":"Graminée","orig":"Asie, Australie","lvl":3,"wiki":"Cenchrus purpurascens","tip":"Touffe arrondie de feuilles fines. Épis cylindriques duveteux, comme des goupillons à biberon, en fin d'été.","diff":"Le miscanthus porte des plumeaux en éventail, pas des épis en écouvillon.","conf":["miscanthus-sinensis","nassella-tenuissima"]},{"id":"festuca-glauca","lat":"Festuca glauca","fr":"Fétuque bleue","fam":"Poacées","type":"Graminée","orig":"Sud de l'Europe","lvl":3,"tip":"Petit coussin dense de feuilles fines, raides, d'un bleu argenté. Courts épis paille en début d'été.","diff":"L'avoine bleue (Helictotrichon) est bien plus grande, avec des feuilles plus larges et plates.","conf":["nassella-tenuissima"]},{"id":"echinacea-purpurea","lat":"Echinacea purpurea","fr":"Échinacée pourpre","fam":"Astéracées","type":"Vivace","orig":"Amérique du Nord","lvl":3,"tip":"Grandes marguerites rose pourpré aux pétales retombants, autour d'un cœur orangé bombé et piquant au toucher.","diff":"La rudbeckia a des pétales jaunes et un cœur noir. Ses pétales sont moins retombants.","conf":["rudbeckia-fulgida"]},{"id":"rudbeckia-fulgida","lat":"Rudbeckia fulgida","fr":"Rudbeckia","fam":"Astéracées","type":"Vivace","orig":"Amérique du Nord","lvl":3,"tip":"Marguerites jaune d'or au cœur noir-brun bombé, de juillet à octobre. Feuilles rugueuses et poilues.","diff":"L'échinacée a des pétales roses et un cœur orange piquant.","conf":["echinacea-purpurea"]},{"id":"verbena-bonariensis","lat":"Verbena bonariensis","fr":"Verveine de Buenos Aires","fam":"Verbénacées","type":"Vivace","orig":"Amérique du Sud","lvl":3,"tip":"Hautes tiges raides et carrées, presque sans feuilles, portant de petits bouquets plats violets. Effet transparent dans les massifs. Se ressème partout.","diff":"La sauge d'Afghanistan a des épis bleu lavande et un feuillage gris argenté.","conf":["perovskia-atriplicifolia"]},{"id":"gaura-lindheimeri","lat":"Oenothera lindheimeri","fr":"Gaura","fam":"Onagracées","type":"Vivace","orig":"Texas, Louisiane","lvl":3,"wiki":"Oenothera lindheimeri","tip":"Longues tiges fines et souples portant de petites fleurs blanches ou roses, comme des papillons, de juin aux gelées. Souvent appelée Gaura lindheimeri.","diff":"L'érigéron forme un coussin bas de petites pâquerettes. La gaura a des tiges hautes et légères.","conf":["erigeron-karvinskianus"]},{"id":"nepeta-faassenii","lat":"Nepeta × faassenii","fr":"Népéta (herbe aux chats)","fam":"Lamiacées","type":"Vivace","orig":"Hybride horticole","lvl":3,"wiki":"Nepeta × faassenii","tip":"Coussin de petites feuilles gris-vert, crénelées et aromatiques. Tige carrée. Épis lâches de fleurs bleu lavande en mai-juin.","diff":"La lavande a des feuilles étroites et un épi compact au bout d'une tige nue. La népéta a des feuilles en cœur crénelées.","conf":["lavandula-angustifolia","salvia-nemorosa"]},{"id":"salvia-nemorosa","lat":"Salvia nemorosa","fr":"Sauge des bois","fam":"Lamiacées","type":"Vivace","orig":"Europe centrale, Asie","lvl":3,"tip":"Épis dressés et serrés de fleurs violet profond. Les bractées violettes restent après la fleur. Feuilles ridées et aromatiques. Tige carrée.","diff":"La népéta a des épis plus lâches, bleu pâle, et un port en coussin étalé.","conf":["nepeta-faassenii"]},{"id":"perovskia-atriplicifolia","lat":"Salvia yangii","fr":"Sauge d'Afghanistan (pérovskia)","fam":"Lamiacées","type":"Sous-arbrisseau","orig":"Asie centrale","lvl":3,"wiki":"Salvia yangii","tip":"Tiges blanc argenté. Feuillage gris très découpé au parfum de sauge. Nuages de petites fleurs bleu lavande en fin d'été. Anciennement Perovskia atriplicifolia.","diff":"La lavande a des feuilles entières étroites et un épi compact. Le pérovskia a des tiges blanches et des feuilles découpées.","conf":["lavandula-angustifolia","verbena-bonariensis"]},{"id":"hosta-sieboldiana","lat":"Hosta sieboldiana","fr":"Hosta","fam":"Asparagacées","type":"Vivace","orig":"Japon","lvl":3,"wiki":"Hosta","tip":"Grandes feuilles en cœur aux nervures parallèles marquées, souvent bleutées ou panachées, formant une touffe. Plante d'ombre très appréciée des limaces. Hampes de clochettes lilas.","diff":"Le bergénia a des feuilles épaisses et brillantes, persistantes, aux nervures en réseau.","conf":["bergenia-cordifolia"]},{"id":"heuchera-micrantha","lat":"Heuchera micrantha","fr":"Heuchère","fam":"Saxifragacées","type":"Vivace","orig":"Amérique du Nord","lvl":3,"wiki":"Heuchera","tip":"Rosette de feuilles arrondies et lobées, aux couleurs vives : pourpre, caramel, vert acide, souvent veinées. Fines tiges de minuscules clochettes.","diff":"Le géranium vivace a des feuilles plus profondément découpées, et de grandes fleurs à 5 pétales.","conf":["geranium-sanguineum","alchemilla-mollis"]},{"id":"geranium-sanguineum","lat":"Geranium sanguineum","fr":"Géranium sanguin","fam":"Géraniacées","type":"Vivace","orig":"Europe","lvl":3,"tip":"Feuilles découpées en 5 à 7 lanières profondes. Fleurs magenta à 5 pétales. Le fruit pointu ressemble à un bec de grue. Feuillage rouge en automne.","diff":"Le « géranium » des balcons est un Pelargonium : feuilles rondes, épaisses et odorantes, non rustique.","conf":["heuchera-micrantha"]},{"id":"alchemilla-mollis","lat":"Alchemilla mollis","fr":"Alchémille","fam":"Rosacées","type":"Vivace","orig":"Europe de l'Est, Caucase","lvl":3,"tip":"Feuilles rondes, plissées en éventail, veloutées. Les gouttes d'eau perlent à leur surface. Nuages de petites fleurs vert-jaune en juin.","diff":"L'heuchère a des feuilles lisses et colorées. L'alchémille, elle, a des feuilles veloutées vert tendre.","conf":["heuchera-micrantha"]},{"id":"erigeron-karvinskianus","lat":"Erigeron karvinskianus","fr":"Vergerette de Karvinski","fam":"Astéracées","type":"Vivace","orig":"Mexique","lvl":3,"tip":"Coussin de petites pâquerettes blanches qui virent au rose, d'avril aux gelées. Se ressème dans les murets et les fissures.","diff":"La pâquerette pousse en rosette au ras du gazon, avec une seule fleur par tige.","conf":["gaura-lindheimeri"]},{"id":"bergenia-cordifolia","lat":"Bergenia cordifolia","fr":"Bergénia (plante des savetiers)","fam":"Saxifragacées","type":"Vivace","orig":"Sibérie, Altaï","lvl":3,"tip":"Grandes feuilles rondes, épaisses et luisantes, persistantes, qui rougissent en hiver. Frottées entre les doigts, elles grincent. Fleurs roses en fin d'hiver.","diff":"Le hosta a des feuilles fines aux nervures parallèles, qui disparaissent en hiver.","conf":["hosta-sieboldiana"]},{"id":"euphorbia-characias","lat":"Euphorbia characias","fr":"Euphorbe characias","fam":"Euphorbiacées","type":"Vivace","orig":"Méditerranée","lvl":3,"tip":"Tiges dressées couvertes de feuilles étroites bleu-vert, en goupillon. Grosses inflorescences vert-jaune au printemps. Latex blanc irritant à la coupe.","diff":"Tout latex blanc sur une vivace doit faire penser à une euphorbe. Portez des gants.","conf":[]},{"id":"phormium-tenax","lat":"Phormium tenax","fr":"Lin de Nouvelle-Zélande","fam":"Asphodélacées","type":"Vivace","orig":"Nouvelle-Zélande","lvl":3,"tip":"Éventail de grandes feuilles en glaive, rigides, pliées en V à la base. Elles se fendent en fibres très résistantes. Formes pourpres ou panachées.","diff":"Le cordyline a lui aussi des feuilles en lanières, mais réunies en plumet au sommet d'un tronc.","conf":["cordyline-australis","yucca-gloriosa"]},{"id":"kniphofia-uvaria","lat":"Kniphofia uvaria","fr":"Tritoma (faux aloès)","fam":"Asphodélacées","type":"Vivace","orig":"Afrique du Sud","lvl":3,"tip":"Touffe de feuilles étroites en V. Épis en torche, rouges en haut et jaunes en bas, sur des tiges nues en été.","diff":"L'hémérocalle a de grandes fleurs ouvertes isolées, pas un épi dense en torche.","conf":["hemerocallis-fulva"]},{"id":"allium-giganteum","lat":"Allium giganteum","fr":"Ail géant d'ornement","fam":"Amaryllidacées","type":"Bulbe","orig":"Asie centrale","lvl":3,"tip":"Boule parfaite violette de plusieurs centaines de petites étoiles, sur une très longue tige nue. Feuilles en lanières qui sèchent à la floraison. Odeur d'ail.","diff":"L'agapanthe a des fleurs en trompettes plus grandes, et une boule plus lâche.","conf":["agapanthus-africanus"]},{"id":"quercus-petraea","lat":"Quercus petraea","fr":"Chêne sessile (rouvre)","fam":"Fagacées","type":"Arbre caduc","orig":"Europe","lvl":4,"tip":"Feuille à pétiole bien visible (1-2 cm), lobes réguliers, base en coin sans oreillettes. Glands collés directement au rameau.","diff":"Retenez le croisement : le chêne pédonculé a une feuille sans pétiole et des glands à long pédoncule. Le sessile a l'inverse.","conf":["quercus-robur","quercus-pubescens"]},{"id":"quercus-pubescens","lat":"Quercus pubescens","fr":"Chêne pubescent","fam":"Fagacées","type":"Arbre caduc","orig":"Europe du Sud","lvl":4,"tip":"Feuille plus petite, aux lobes souvent ondulés. Le revers et les jeunes rameaux sont couverts d'un duvet gris doux au toucher. Chêne des coteaux secs et calcaires.","diff":"Passez le doigt sous la feuille : le pubescent est velouté, le sessile presque glabre.","conf":["quercus-petraea","quercus-robur"]},{"id":"tilia-platyphyllos","lat":"Tilia platyphyllos","fr":"Tilleul à grandes feuilles","fam":"Malvacées","type":"Arbre caduc","orig":"Europe","lvl":4,"tip":"Grandes feuilles en cœur, velues dessous, avec des touffes de poils blancs aux aisselles des nervures. Fruits à 5 côtes saillantes. Floraison 2 semaines avant le tilleul à petites feuilles.","diff":"Le tilleul à petites feuilles a des poils roux et des fruits presque lisses.","conf":["tilia-cordata"]},{"id":"ulmus-minor","lat":"Ulmus minor","fr":"Orme champêtre","fam":"Ulmacées","type":"Arbre caduc","orig":"Europe","lvl":4,"tip":"Feuille très asymétrique à la base (une moitié descend plus bas sur le pétiole), doublement dentée, rugueuse. Fruits ailés ronds (samares) avec la graine au centre.","diff":"Le charme et le noisetier ont une base de feuille symétrique. Le micocoulier a une feuille asymétrique, mais terminée par une longue pointe et à 3 nervures principales.","conf":["carpinus-betulus","celtis-australis"]},{"id":"prunus-avium","lat":"Prunus avium","fr":"Merisier","fam":"Rosacées","type":"Arbre caduc","orig":"Europe","lvl":4,"tip":"Écorce brun-rouge brillante, qui se déroule en bandes horizontales. Deux glandes rouges au sommet du pétiole. Feuilles grandes et pendantes. Fleurs blanches en bouquets.","diff":"Le cerisier du Japon a des dents de feuille terminées par un fil et des fleurs souvent doubles roses.","conf":["prunus-serrulata","prunus-cerasifera"]},{"id":"sorbus-aucuparia","lat":"Sorbus aucuparia","fr":"Sorbier des oiseleurs","fam":"Rosacées","type":"Arbre caduc","orig":"Europe","lvl":4,"tip":"Feuilles composées alternes de 11 à 15 folioles dentées. Bourgeons violacés et poilus. Grappes de petits fruits rouge orangé en fin d'été.","diff":"Le frêne a lui aussi des feuilles composées, mais opposées, avec des bourgeons noirs.","conf":["fraxinus-excelsior","sorbus-aria"]},{"id":"sorbus-aria","lat":"Sorbus aria","fr":"Alisier blanc","fam":"Rosacées","type":"Arbre caduc","orig":"Europe","lvl":4,"wiki":"Aria edulis","tip":"Feuille simple ovale doublement dentée, dont le revers est blanc feutré : l'arbre scintille au vent. Fruits rouges. (Nom récent : Aria edulis.)","diff":"Le sorbier des oiseleurs a des feuilles composées. Le peuplier blanc a des feuilles lobées.","conf":["sorbus-aucuparia"]},{"id":"crataegus-monogyna","lat":"Crataegus monogyna","fr":"Aubépine monogyne","fam":"Rosacées","type":"Arbuste caduc","orig":"Europe","lvl":4,"tip":"Rameaux épineux. Petites feuilles profondément découpées en 3-7 lobes. Fleurs blanches en mai, puis petits fruits rouges (cenelles) à un seul noyau.","diff":"Le prunellier a des feuilles ovales non lobées, fleurit avant ses feuilles et donne des fruits bleu-noir.","conf":["prunus-spinosa","pyracantha-coccinea"]},{"id":"prunus-spinosa","lat":"Prunus spinosa","fr":"Prunellier (épine noire)","fam":"Rosacées","type":"Arbuste caduc","orig":"Europe","lvl":4,"tip":"Rameaux sombres et très épineux. Floraison blanche en mars, avant les feuilles. Petites feuilles ovales dentées. Prunelles bleu-noir pruinées.","diff":"L'aubépine fleurit après ses feuilles, plus tard. Ses feuilles sont lobées et ses fruits rouges.","conf":["crataegus-monogyna","prunus-cerasifera"]},{"id":"ligustrum-ovalifolium","lat":"Ligustrum ovalifolium","fr":"Troène de Californie","fam":"Oléacées","type":"Arbuste semi-persistant","orig":"Japon","lvl":4,"tip":"Feuilles opposées ovales, assez larges, vert brillant, au bord entier, sur des rameaux glabres. Le troène le plus courant des haies taillées. Formes panachées jaunes.","diff":"Le troène commun a des feuilles plus étroites et des rameaux légèrement duveteux. Le fusain du Japon a des feuilles finement crénelées.","conf":["ligustrum-vulgare","euonymus-japonicus"]},{"id":"lonicera-nitida","lat":"Lonicera nitida","fr":"Chèvrefeuille arbustif","fam":"Caprifoliacées","type":"Arbuste persistant","orig":"Chine","lvl":4,"tip":"Minuscules feuilles opposées (environ 1 cm), ovales, sur de longs rameaux arqués disposés en arêtes. Repousse très vite après la taille.","diff":"Le buis a des feuilles un peu plus grandes, souvent échancrées, des rameaux à 4 angles et une odeur caractéristique.","conf":["buxus-sempervirens","ilex-crenata"]},{"id":"ilex-crenata","lat":"Ilex crenata","fr":"Houx crénelé","fam":"Aquifoliacées","type":"Arbuste persistant","orig":"Japon","lvl":4,"tip":"Petites feuilles alternes, vert foncé, au bord finement crénelé, sans épines. Baies noires. Très utilisé en remplacement du buis contre la pyrale.","diff":"Le buis a des feuilles opposées au bord lisse. Regardez la disposition sur le rameau.","conf":["buxus-sempervirens","lonicera-nitida"]},{"id":"osmanthus-heterophyllus","lat":"Osmanthus heterophyllus","fr":"Osmanthe à feuilles de houx","fam":"Oléacées","type":"Arbuste persistant","orig":"Japon","lvl":4,"tip":"Feuilles épineuses comme le houx, mais opposées. Les feuilles du haut sont souvent entières. Petites fleurs blanches très parfumées en automne.","diff":"Le houx a des feuilles alternes. Une feuille épineuse opposée, c'est l'osmanthe.","conf":["ilex-aquifolium"]},{"id":"pieris-japonica","lat":"Pieris japonica","fr":"Andromède du Japon (piéris)","fam":"Éricacées","type":"Arbuste persistant","orig":"Japon","lvl":4,"tip":"Feuilles étroites serrées en rosettes au bout des rameaux. Jeunes pousses rouge vif ou bronze. Grappes pendantes de clochettes blanches comme du muguet, au printemps. Terre de bruyère.","diff":"Le photinia a aussi des pousses rouges, mais des feuilles plus grandes, réparties le long des tiges, et des fleurs en corymbes plats.","conf":["photinia-fraseri"]},{"id":"hydrangea-paniculata","lat":"Hydrangea paniculata","fr":"Hortensia paniculé","fam":"Hydrangéacées","type":"Arbuste caduc","orig":"Chine, Japon","lvl":4,"tip":"Fleurs en cônes allongés blanc crème qui rosissent en fin d'été. Feuilles mates, parfois groupées par 3. Supporte mieux le soleil et le calcaire que l'hortensia classique.","diff":"L'hortensia commun fleurit en boules bleues ou roses et ses feuilles sont brillantes.","conf":["hydrangea-macrophylla","hydrangea-quercifolia"]},{"id":"hydrangea-quercifolia","lat":"Hydrangea quercifolia","fr":"Hortensia à feuilles de chêne","fam":"Hydrangéacées","type":"Arbuste caduc","orig":"Sud-est des États-Unis","lvl":4,"tip":"Grandes feuilles lobées comme une feuille de chêne, rouge pourpre en automne. Panicules blanches coniques. Écorce cannelle qui s'exfolie.","diff":"L'hortensia paniculé a des feuilles simples et ovales, sans lobes.","conf":["hydrangea-paniculata","hydrangea-macrophylla"]},{"id":"cornus-alba","lat":"Cornus alba","fr":"Cornouiller blanc","fam":"Cornacées","type":"Arbuste caduc","orig":"Sibérie, Chine","lvl":4,"tip":"Rameaux rouge corail éclatant en hiver. Feuilles opposées aux nervures arquées (fils blancs à la déchirure). Petits fruits blancs bleutés. Formes panachées.","diff":"Le cornouiller sanguin a des rameaux rouge sombre, surtout côté soleil, et des fruits noirs.","conf":["cornus-sanguinea"]},{"id":"cornus-mas","lat":"Cornus mas","fr":"Cornouiller mâle","fam":"Cornacées","type":"Arbuste caduc","orig":"Europe","lvl":4,"tip":"Petites fleurs jaunes en pompons dès février, avant les feuilles. Feuilles à nervures arquées. Fruits rouges oblongs comestibles (cornouilles).","diff":"Le forsythia a de plus grandes fleurs à 4 pétales. Son bois n'a pas de fils dans les feuilles. Le cornouiller mâle a de petits pompons jaunes.","conf":["forsythia-intermedia","cornus-sanguinea"]},{"id":"alnus-glutinosa","lat":"Alnus glutinosa","fr":"Aulne glutineux","fam":"Bétulacées","type":"Arbre caduc","orig":"Europe","lvl":4,"tip":"Feuille ronde, souvent tronquée ou échancrée au sommet, collante quand elle est jeune. Petits cônes ligneux noirs (strobiles) qui restent l'hiver. Pousse au bord de l'eau.","diff":"Le noisetier a une feuille pointue et ne porte pas de petits cônes. Les petits cônes noirs signent l'aulne.","conf":["corylus-avellana"]},{"id":"lavandula-intermedia","lat":"Lavandula × intermedia","fr":"Lavandin","fam":"Lamiacées","type":"Sous-arbrisseau","orig":"Hybride","lvl":4,"wiki":"Lavandula × intermedia","tip":"Plus grand et vigoureux que la lavande vraie. Ses longues tiges se ramifient et portent un épi principal plus 2 épis latéraux. Épis plus longs et pointus. Odeur plus camphrée.","diff":"La lavande vraie a une tige non ramifiée avec un seul épi court. Comptez les épis par tige.","conf":["lavandula-angustifolia"]},{"id":"jasminum-nudiflorum","lat":"Jasminum nudiflorum","fr":"Jasmin d'hiver","fam":"Oléacées","type":"Arbuste caduc","orig":"Chine","lvl":4,"tip":"Rameaux verts, quadrangulaires, retombants. Fleurs jaunes à 5-6 pétales de décembre à mars, sans parfum. Feuilles trifoliolées opposées.","diff":"Le forsythia fleurit en mars-avril sur des rameaux bruns, avec des fleurs à 4 pétales.","conf":["forsythia-intermedia"]},{"id":"abies-alba","lat":"Abies alba","fr":"Sapin pectiné","fam":"Pinacées","type":"Conifère persistant","orig":"Montagnes d'Europe","lvl":4,"tip":"Aiguilles plates, souples, échancrées au bout, avec 2 bandes blanches dessous. L'aiguille arrachée laisse une cicatrice ronde et plate. Cônes dressés qui se désagrègent sur l'arbre.","diff":"L'épicéa a des aiguilles piquantes sur un petit coussinet, et des cônes pendants qui tombent entiers. « Le sapin se tient, l'épicéa pend. »","conf":["picea-abies","taxus-baccata"]},{"id":"picea-abies","lat":"Picea abies","fr":"Épicéa commun","fam":"Pinacées","type":"Conifère persistant","orig":"Europe","lvl":4,"tip":"Aiguilles piquantes, à 4 faces, fixées sur un petit coussinet qui rend le rameau rugueux une fois dénudé. Cônes pendants qui tombent entiers. C'est le « sapin de Noël » classique.","diff":"Le sapin a des aiguilles plates, souples et non piquantes, et des cônes dressés.","conf":["abies-alba"]},{"id":"larix-decidua","lat":"Larix decidua","fr":"Mélèze d'Europe","fam":"Pinacées","type":"Conifère caduc","orig":"Alpes, Carpates","lvl":4,"tip":"Conifère qui perd ses aiguilles : elles virent au jaune d'or en automne. Aiguilles tendres en touffes sur des rameaux courts. Petits cônes dressés.","diff":"Le cèdre a des rosettes similaires, mais persistantes et raides, et de gros cônes en tonneau.","conf":["cedrus-atlantica","metasequoia-glyptostroboides"]},{"id":"cedrus-libani","lat":"Cedrus libani","fr":"Cèdre du Liban","fam":"Pinacées","type":"Conifère persistant","orig":"Liban, Turquie","lvl":4,"tip":"Adulte, il forme de grands étages horizontaux en plateaux et un sommet aplati. Aiguilles vert sombre un peu plus longues que l'Atlas. Jeune, sa flèche s'incline légèrement.","diff":"Le cèdre de l'Atlas a des branches qui montent en oblique et des aiguilles courtes, souvent bleutées. Le déodar a des rameaux retombants.","conf":["cedrus-atlantica","cedrus-deodara"]},{"id":"cedrus-deodara","lat":"Cedrus deodara","fr":"Cèdre de l'Himalaya","fam":"Pinacées","type":"Conifère persistant","orig":"Himalaya","lvl":4,"tip":"Aiguilles longues (jusqu'à 5 cm) et souples. Branches et flèche retombantes, ce qui lui donne un port pleureur gracieux.","diff":"Les cèdres de l'Atlas et du Liban ont des aiguilles plus courtes et un sommet qui ne retombe pas.","conf":["cedrus-atlantica","cedrus-libani"]},{"id":"chamaecyparis-lawsoniana","lat":"Chamaecyparis lawsoniana","fr":"Faux-cyprès de Lawson","fam":"Cupressacées","type":"Conifère persistant","orig":"Ouest des États-Unis","lvl":4,"tip":"Rameaux plats en éventail, avec de fines marques blanches en X dessous. Flèche qui retombe. Petits cônes ronds. Odeur de persil au froissement.","diff":"Le thuya a des cônes allongés en tulipe et pas de marques en X. Le Leyland a une flèche dressée et des cônes bruns plus gros.","conf":["thuja-occidentalis","cuprocyparis-leylandii"]},{"id":"cuprocyparis-leylandii","lat":"× Cuprocyparis leylandii","fr":"Cyprès de Leyland","fam":"Cupressacées","type":"Conifère persistant","orig":"Hybride horticole","lvl":4,"wiki":"× Cuprocyparis leylandii","tip":"Croissance très rapide (plus d'1 m par an). Rameaux denses, légèrement aplatis, irréguliers en 3D, vert grisé. Flèche dressée. Le grand classique des haies hautes.","diff":"Le thuya a des rameaux bien plus plats et réguliers, à l'odeur fruitée. Le faux-cyprès a une flèche retombante.","conf":["thuja-occidentalis","chamaecyparis-lawsoniana"]},{"id":"pinus-nigra","lat":"Pinus nigra","fr":"Pin noir d'Autriche","fam":"Pinacées","type":"Conifère persistant","orig":"Europe du Sud","lvl":4,"tip":"Aiguilles par 2, longues (8-15 cm), raides et vert très sombre. Écorce grise à noirâtre jusqu'en haut. Cône brillant symétrique. Supporte le calcaire et les embruns.","diff":"Le pin sylvestre a des aiguilles courtes et bleutées et une écorce orangée en haut du tronc.","conf":["pinus-sylvestris","pinus-pinea"]},{"id":"prunus-lusitanica","lat":"Prunus lusitanica","fr":"Laurier du Portugal","fam":"Rosacées","type":"Arbuste persistant","orig":"Péninsule ibérique","lvl":4,"tip":"Feuilles vert sombre brillantes, plus petites et plus fines que le laurier-cerise, sur des pétioles rouges très visibles. Longues grappes blanches en juin.","diff":"Le laurier-cerise a des pétioles verts et de plus grandes feuilles, avec des glandes au revers.","conf":["prunus-laurocerasus"]},{"id":"lavandula-stoechas","lat":"Lavandula stoechas","fr":"Lavande papillon","fam":"Lamiacées","type":"Sous-arbrisseau","orig":"Méditerranée","lvl":4,"tip":"Épis courts et trapus, surmontés de grandes bractées violettes dressées comme des oreilles de lapin. Floraison dès avril. Préfère les sols acides.","diff":"La lavande vraie et le lavandin n'ont pas ces bractées en plumet au sommet de l'épi.","conf":["lavandula-angustifolia","lavandula-intermedia"]},{"id":"sophora-japonica","lat":"Styphnolobium japonicum","fr":"Sophora du Japon","fam":"Fabacées","type":"Arbre caduc","orig":"Chine","lvl":4,"wiki":"Styphnolobium japonicum","tip":"Feuilles composées de folioles ovales pointues, sans épines. Jeunes rameaux bien verts. Fleurs crème en fin d'été. Gousses en chapelet de perles.","diff":"Le robinier a des folioles arrondies au bout, une paire d'épines à chaque feuille, et fleurit en mai.","conf":["robinia-pseudoacacia"]},{"id":"quercus-ilex","lat":"Quercus ilex","fr":"Chêne vert (yeuse)","fam":"Fagacées","type":"Arbre persistant","orig":"Méditerranée","lvl":5,"tip":"Feuilles persistantes, coriaces, vert sombre dessus, gris feutré dessous. Les jeunes feuilles sont souvent dentées et piquantes comme du houx, puis entières. Glands dans une cupule veloutée.","diff":"Le chêne-liège a une écorce épaisse et spongieuse. Le houx a des feuilles vernissées des deux côtés.","conf":["quercus-suber","ilex-aquifolium","phillyrea-angustifolia"]},{"id":"quercus-suber","lat":"Quercus suber","fr":"Chêne-liège","fam":"Fagacées","type":"Arbre persistant","orig":"Méditerranée occidentale","lvl":5,"tip":"Écorce épaisse, spongieuse et crevassée : c'est le liège. Les troncs démasclés (écorcés) sont rouge brique. Feuilles proches du chêne vert, un peu dentées.","diff":"Le chêne vert a une écorce fine, grise et dure. Enfoncez l'ongle dans l'écorce pour trancher.","conf":["quercus-ilex"]},{"id":"pinus-pinea","lat":"Pinus pinea","fr":"Pin parasol","fam":"Pinacées","type":"Conifère persistant","orig":"Méditerranée","lvl":5,"tip":"Silhouette en parasol plat très reconnaissable. Aiguilles par 2, longues. Gros cônes ronds et lourds contenant les pignons. Écorce en grandes plaques rougeâtres.","diff":"Le pin d'Alep a une couronne irrégulière, des aiguilles fines vert clair et de petits cônes sur des pédoncules recourbés.","conf":["pinus-halepensis","pinus-nigra"]},{"id":"pinus-halepensis","lat":"Pinus halepensis","fr":"Pin d'Alep","fam":"Pinacées","type":"Conifère persistant","orig":"Méditerranée","lvl":5,"tip":"Aiguilles très fines, souples, vert clair, par 2. Écorce gris argenté sur les jeunes troncs. Cônes brun-rouge pointant vers l'arrière sur un pédoncule recourbé. Tronc souvent tortueux.","diff":"Le pin parasol a une couronne plate et régulière et de gros cônes ronds.","conf":["pinus-pinea"]},{"id":"arbutus-unedo","lat":"Arbutus unedo","fr":"Arbousier","fam":"Éricacées","type":"Arbuste persistant","orig":"Méditerranée, côte atlantique","lvl":5,"tip":"Feuilles dentées et vernissées, sur un pétiole rougeâtre. En automne, clochettes blanches et fruits ronds granuleux, rouges à maturité, en même temps. Écorce rousse qui s'exfolie.","diff":"Le laurier-tin a des feuilles opposées entières et des baies bleues.","conf":["viburnum-tinus"]},{"id":"pistacia-lentiscus","lat":"Pistacia lentiscus","fr":"Pistachier lentisque","fam":"Anacardiacées","type":"Arbuste persistant","orig":"Méditerranée","lvl":5,"tip":"Feuilles composées d'un nombre pair de petites folioles (pas de foliole terminale), sur un axe ailé. Odeur résineuse forte. Petits fruits rouges puis noirs.","diff":"Le pistachier térébinthe est caduc et ses feuilles ont une foliole terminale. Le myrte a des feuilles simples.","conf":["myrtus-communis"]},{"id":"cistus-albidus","lat":"Cistus albidus","fr":"Ciste cotonneux","fam":"Cistacées","type":"Sous-arbrisseau","orig":"Méditerranée occidentale","lvl":5,"tip":"Feuilles opposées blanchâtres, feutrées et veloutées, sans pétiole. Fleurs rose lilas froissées comme du papier crépon, au cœur jaune, qui ne durent qu'un jour.","diff":"Le ciste de Montpellier a des feuilles vert sombre collantes et des fleurs blanches.","conf":["teucrium-fruticans"]},{"id":"myrtus-communis","lat":"Myrtus communis","fr":"Myrte commun","fam":"Myrtacées","type":"Arbuste persistant","orig":"Méditerranée","lvl":5,"tip":"Petites feuilles opposées pointues et brillantes. Par transparence, elles montrent des points translucides. Très aromatiques. Fleurs blanches aux étamines en houppe, baies bleu-noir.","diff":"Le buis a des feuilles arrondies sans parfum agréable ni points translucides.","conf":["buxus-sempervirens","pistacia-lentiscus"]},{"id":"phillyrea-angustifolia","lat":"Phillyrea angustifolia","fr":"Filaria à feuilles étroites","fam":"Oléacées","type":"Arbuste persistant","orig":"Méditerranée","lvl":5,"tip":"Feuilles opposées, étroites, vert foncé des deux côtés, coriaces. Petites fleurs crème parfumées au printemps, puis drupes bleu-noir. Excellent en haie libre sèche.","diff":"L'olivier a un revers argenté. L'alaterne a des feuilles alternes.","conf":["olea-europaea","rhamnus-alaternus"]},{"id":"rhamnus-alaternus","lat":"Rhamnus alaternus","fr":"Nerprun alaterne","fam":"Rhamnacées","type":"Arbuste persistant","orig":"Méditerranée","lvl":5,"tip":"Feuilles alternes, coriaces, luisantes, finement dentées, de forme variable. Petites fleurs jaunâtres très précoces, baies rouges puis noires.","diff":"Le filaria a des feuilles opposées. Regardez la disposition sur le rameau.","conf":["phillyrea-angustifolia","viburnum-tinus"]},{"id":"teucrium-fruticans","lat":"Teucrium fruticans","fr":"Germandrée arbustive","fam":"Lamiacées","type":"Arbuste persistant","orig":"Méditerranée occidentale","lvl":5,"tip":"Rameaux blancs et feutrés. Petites feuilles opposées, vertes dessus, blanc argenté dessous. Fleurs bleu pâle à une seule lèvre, presque toute l'année.","diff":"Le romarin a des aiguilles étroites à bords enroulés et une forte odeur camphrée.","conf":["salvia-rosmarinus","cistus-albidus"]},{"id":"celtis-australis","lat":"Celtis australis","fr":"Micocoulier de Provence","fam":"Cannabacées","type":"Arbre caduc","orig":"Méditerranée","lvl":5,"tip":"Écorce grise et lisse comme celle du hêtre. Feuilles asymétriques, dentées, rugueuses, terminées par une longue pointe effilée. Petites baies noires sucrées sur un long pédoncule.","diff":"L'orme a des feuilles asymétriques aussi, mais sans longue pointe, et une écorce crevassée.","conf":["ulmus-minor","fagus-sylvatica"]},{"id":"ficus-carica","lat":"Ficus carica","fr":"Figuier","fam":"Moracées","type":"Arbre caduc","orig":"Méditerranée, Asie occidentale","lvl":5,"tip":"Grandes feuilles rugueuses à 3-5 lobes. Latex blanc irritant à la coupe. Écorce grise et lisse. Les figues poussent directement à l'aisselle des feuilles.","diff":"Le platane a des feuilles lobées lisses, sans latex, et une écorce en plaques.","conf":["platanus-hispanica"]},{"id":"punica-granatum","lat":"Punica granatum","fr":"Grenadier","fam":"Lythracées","type":"Arbuste caduc","orig":"Iran, Asie centrale","lvl":5,"tip":"Petites feuilles brillantes, étroites, rougeâtres au débourrement. Fleurs rouge orangé vif au calice charnu en couronne, qui reste au sommet de la grenade.","diff":"Le lilas des Indes fleurit aussi en été, mais ses fleurs sont crêpées en panicules et son écorce est tachetée.","conf":["lagerstroemia-indica"]},{"id":"agave-americana","lat":"Agave americana","fr":"Agave d'Amérique","fam":"Asparagacées","type":"Succulente","orig":"Mexique","lvl":5,"tip":"Énorme rosette de feuilles charnues bleu-gris, bordées d'épines et terminées par une forte pointe noire. Fleurit une seule fois, sur une hampe de plusieurs mètres, puis meurt.","diff":"Le yucca a des feuilles plus fines, non charnues, souvent sur un tronc, et fleurit chaque année.","conf":["yucca-gloriosa"]},{"id":"yucca-gloriosa","lat":"Yucca gloriosa","fr":"Yucca glorieux","fam":"Asparagacées","type":"Arbuste persistant","orig":"Sud-est des États-Unis","lvl":5,"tip":"Rosette de feuilles en glaive, raides, à pointe piquante, portée sur un court tronc. Grandes panicules de clochettes blanches en fin d'été.","diff":"L'agave a des feuilles charnues, épineuses sur les bords. Le cordyline a des feuilles souples non piquantes.","conf":["agave-americana","cordyline-australis"]},{"id":"chamaerops-humilis","lat":"Chamaerops humilis","fr":"Palmier nain","fam":"Arécacées","type":"Palmier","orig":"Méditerranée occidentale","lvl":5,"tip":"Le seul palmier indigène d'Europe. Forme une touffe de plusieurs troncs courts. Feuilles en éventail raides, souvent bleutées. Pétioles armés de fortes épines.","diff":"Le palmier de Chine a un tronc unique couvert de fibres et des pétioles presque lisses.","conf":["trachycarpus-fortunei"]},{"id":"phoenix-canariensis","lat":"Phoenix canariensis","fr":"Palmier des Canaries","fam":"Arécacées","type":"Palmier","orig":"Îles Canaries","lvl":5,"tip":"Feuilles pennées (en plumes), très longues et arquées : couronne énorme et dense. Gros tronc marqué d'écailles en losange. Folioles du bas transformées en épines.","diff":"Le Washingtonia et le palmier de Chine ont des feuilles en éventail, pas en plume.","conf":["washingtonia-filifera","trachycarpus-fortunei"]},{"id":"callistemon-citrinus","lat":"Melaleuca citrina","fr":"Rince-bouteille","fam":"Myrtacées","type":"Arbuste persistant","orig":"Australie","lvl":5,"wiki":"Melaleuca citrina","tip":"Fleurs rouges en écouvillon autour des tiges : ce sont les étamines. La tige continue de pousser au-delà de la fleur. Feuilles étroites, raides, citronnées froissées. Longtemps appelé Callistemon citrinus.","diff":"Le grevillea a des fleurs en araignée ou en peigne, pas en goupillon cylindrique.","conf":["grevillea-rosmarinifolia"]},{"id":"ceratonia-siliqua","lat":"Ceratonia siliqua","fr":"Caroubier","fam":"Fabacées","type":"Arbre persistant","orig":"Méditerranée","lvl":5,"tip":"Feuilles composées paires de folioles rondes, épaisses et luisantes. Longues gousses brun foncé (caroubes), sucrées. Fleurs directement sur les vieux rameaux.","diff":"Le pistachier lentisque a aussi des feuilles paires, mais à folioles étroites et à odeur résineuse.","conf":["pistacia-lentiscus"]},{"id":"cryptomeria-japonica","lat":"Cryptomeria japonica","fr":"Cèdre du Japon","fam":"Cupressacées","type":"Conifère persistant","orig":"Japon","lvl":6,"tip":"Aiguilles courtes en alène, recourbées vers l'avant, disposées en spirale autour du rameau. Écorce rousse qui se détache en lanières. Petits cônes ronds hérissés.","diff":"Le séquoia géant a des écailles plaquées contre le rameau. Le cryptomeria a des aiguilles plus longues, recourbées et décollées.","conf":["sequoiadendron-giganteum","araucaria-araucana"]},{"id":"camellia-japonica","lat":"Camellia japonica","fr":"Camélia du Japon","fam":"Théacées","type":"Arbuste persistant","orig":"Japon, Chine, Corée","lvl":6,"tip":"Feuilles alternes, épaisses, vernissées, finement dentées. Gros boutons ronds. Grandes fleurs rouges, roses ou blanches en fin d'hiver. Terre acide.","diff":"Le laurier-cerise a des feuilles plus longues avec des glandes au revers. Le camélia a des dents fines tout le long.","conf":["prunus-laurocerasus","skimmia-japonica"]},{"id":"nandina-domestica","lat":"Nandina domestica","fr":"Bambou sacré","fam":"Berbéridacées","type":"Arbuste persistant","orig":"Chine, Japon","lvl":6,"tip":"Ce n'est pas un bambou. Tiges dressées non ramifiées, avec des feuilles 2 ou 3 fois composées en petites folioles pointues, rouges en hiver. Grappes de baies rouges.","diff":"Un vrai bambou a des tiges creuses à nœuds et des feuilles simples, en lanières.","conf":["phyllostachys-aurea"]},{"id":"fatsia-japonica","lat":"Fatsia japonica","fr":"Aralia du Japon","fam":"Araliacées","type":"Arbuste persistant","orig":"Japon","lvl":6,"tip":"Très grandes feuilles palmées, vernissées, à 7-9 lobes, sur de longs pétioles. Boules de fleurs crème en automne, puis baies noires. Ambiance tropicale à l'ombre.","diff":"Le ricin a des feuilles proches, mais pourpres ou vertes et très dentées, et c'est une plante annuelle.","conf":["hedera-helix"]},{"id":"skimmia-japonica","lat":"Skimmia japonica","fr":"Skimmia du Japon","fam":"Rutacées","type":"Arbuste persistant","orig":"Japon","lvl":6,"tip":"Petit arbuste en dôme. Feuilles lisses, groupées au bout des rameaux, qui sentent l'agrume froissées. Boutons rouges tout l'hiver, puis fleurs blanches parfumées.","diff":"Le piéris a des pousses rouges et des fleurs en clochettes pendantes, pas des boutons dressés.","conf":["pieris-japonica","choisya-ternata"]},{"id":"aucuba-japonica","lat":"Aucuba japonica","fr":"Aucuba du Japon","fam":"Garryacées","type":"Arbuste persistant","orig":"Japon","lvl":6,"tip":"Grandes feuilles opposées vernissées et dentées, très souvent tachetées de jaune ('Variegata'). Rameaux verts. Baies rouges sur les pieds femelles. Supporte l'ombre sèche.","diff":"Le fusain du Japon a des feuilles plus petites. Le laurier-cerise a des feuilles alternes jamais tachetées de cette façon.","conf":["euonymus-japonicus"]},{"id":"ophiopogon-japonicus","lat":"Ophiopogon japonicus","fr":"Herbe aux turquoises","fam":"Asparagacées","type":"Couvre-sol","orig":"Chine, Japon","lvl":6,"tip":"Touffes de feuilles fines comme des herbes, vert foncé et persistantes. Petites fleurs lilas cachées dans le feuillage, puis baies bleu turquoise. La variété 'Nigrescens' est noire.","diff":"Un carex a des tiges triangulaires et des épis bruns. L'ophiopogon a des baies bleues.","conf":["festuca-glauca"]},{"id":"wisteria-sinensis","lat":"Wisteria sinensis","fr":"Glycine de Chine","fam":"Fabacées","type":"Liane caduque","orig":"Chine","lvl":6,"tip":"Liane volubile qui s'enroule dans le sens inverse des aiguilles d'une montre, vue d'en dessous. Feuilles composées de 7 à 13 folioles. Grappes mauves parfumées qui s'ouvrent toutes ensemble.","diff":"La glycine du Japon s'enroule dans l'autre sens, a 13 à 19 folioles et des grappes plus longues qui s'ouvrent progressivement.","conf":["robinia-pseudoacacia"]},{"id":"metasequoia-glyptostroboides","lat":"Metasequoia glyptostroboides","fr":"Métaséquoia","fam":"Cupressacées","type":"Conifère caduc","orig":"Chine","lvl":6,"tip":"Conifère caduc à aiguilles plates et tendres, opposées le long des rameaux. Elles tombent avec le rameau en automne, rousses. Tronc creusé de cannelures profondes. Connu d'abord à l'état fossile.","diff":"Le cyprès chauve a des aiguilles alternes et produit des pneumatophores (racines-genoux) au bord de l'eau.","conf":["taxodium-distichum","larix-decidua"]},{"id":"taxodium-distichum","lat":"Taxodium distichum","fr":"Cyprès chauve","fam":"Cupressacées","type":"Conifère caduc","orig":"Sud-est des États-Unis","lvl":6,"tip":"Conifère caduc à aiguilles plates alternes, roux cuivré en automne. Au bord de l'eau, il fait sortir du sol des racines-genoux (pneumatophores). Base du tronc évasée.","diff":"Le métaséquoia a des aiguilles opposées et un tronc plus cannelé.","conf":["metasequoia-glyptostroboides"]},{"id":"sequoiadendron-giganteum","lat":"Sequoiadendron giganteum","fr":"Séquoia géant","fam":"Cupressacées","type":"Conifère persistant","orig":"Sierra Nevada (Californie)","lvl":6,"tip":"Écorce rousse très épaisse et spongieuse : un coup de poing ne fait pas mal. Feuillage en écailles pointues plaquées en spirale sur des rameaux cordiformes. Silhouette conique massive.","diff":"Le séquoia à feuilles d'if (Sequoia sempervirens) a des aiguilles plates en 2 rangs, comme l'if.","conf":["sequoia-sempervirens","cryptomeria-japonica"]},{"id":"sequoia-sempervirens","lat":"Sequoia sempervirens","fr":"Séquoia à feuilles d'if","fam":"Cupressacées","type":"Conifère persistant","orig":"Côte de Californie","lvl":6,"tip":"Aiguilles plates disposées en 2 rangs, avec 2 bandes blanches dessous. Écorce rousse fibreuse épaisse. C'est le plus grand arbre du monde (plus de 115 m). Il rejette de souche.","diff":"Le séquoia géant a des écailles. L'if a une écorce fine qui s'écaille et pas de bandes blanches nettes.","conf":["sequoiadendron-giganteum","taxus-baccata"]},{"id":"liriodendron-tulipifera","lat":"Liriodendron tulipifera","fr":"Tulipier de Virginie","fam":"Magnoliacées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":6,"tip":"Feuille unique à 4 lobes, au sommet coupé droit comme aux ciseaux. Fleurs en tulipes vert-jaune marquées d'orange en juin. Jaune d'or en automne.","diff":"Aucune autre feuille d'arbre n'a cette silhouette de T-shirt à sommet tronqué.","conf":["platanus-hispanica"]},{"id":"cornus-florida","lat":"Cornus florida","fr":"Cornouiller à fleurs","fam":"Cornacées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":6,"tip":"Au printemps, 4 grandes bractées blanches ou roses, échancrées au sommet, entourent un bouton de vraies fleurs. Nervures arquées typiques des cornouillers.","diff":"Le cornouiller kousa a des bractées pointues, fleurit après les feuilles et donne des fruits en framboise.","conf":["cornus-sanguinea"]},{"id":"quercus-rubra","lat":"Quercus rubra","fr":"Chêne rouge d'Amérique","fam":"Fagacées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":6,"tip":"Grandes feuilles à lobes pointus terminés par de fines soies, rouges en automne. Écorce grise lisse avec des bandes claires. Glands courts dans une cupule plate.","diff":"Les chênes européens ont des lobes arrondis. Une feuille de chêne à lobes pointus vient d'Amérique.","conf":["quercus-robur","liquidambar-styraciflua"]},{"id":"acer-rubrum","lat":"Acer rubrum","fr":"Érable rouge","fam":"Sapindacées","type":"Arbre caduc","orig":"Est de l'Amérique du Nord","lvl":6,"tip":"Feuilles opposées à 3 (parfois 5) lobes dentés, glauques dessous, sur un pétiole rouge. Fleurs rouges en fin d'hiver avant les feuilles. Rouge écarlate en automne.","diff":"Le copalme a des feuilles alternes en étoile. L'érable plane a des lobes à pointes effilées et du latex.","conf":["liquidambar-styraciflua","acer-platanoides"]},{"id":"araucaria-araucana","lat":"Araucaria araucana","fr":"Désespoir des singes","fam":"Araucariacées","type":"Conifère persistant","orig":"Chili, Argentine","lvl":6,"tip":"Branches en candélabre couvertes de grosses écailles triangulaires, épaisses, très piquantes, qui se chevauchent. Silhouette étrange de fossile vivant.","diff":"Aucun autre conifère rustique n'a ces écailles larges et dures comme des écailles de reptile.","conf":["cryptomeria-japonica"]},{"id":"eucalyptus-gunnii","lat":"Eucalyptus gunnii","fr":"Gommier cidre","fam":"Myrtacées","type":"Arbre persistant","orig":"Tasmanie","lvl":6,"tip":"Jeunes feuilles rondes, opposées, bleu argenté. Les feuilles adultes deviennent allongées en faucille et pendantes. Écorce qui pèle en plaques. Odeur d'eucalyptus au froissement.","diff":"L'olivier a des feuilles étroites mais pas rondes, et sans l'odeur camphrée.","conf":["olea-europaea"]},{"id":"grevillea-rosmarinifolia","lat":"Grevillea rosmarinifolia","fr":"Grévilléa à feuilles de romarin","fam":"Protéacées","type":"Arbuste persistant","orig":"Australie","lvl":6,"tip":"Feuilles en aiguilles comme le romarin, mais piquantes et sans odeur. Fleurs rouge et crème en forme d'araignée, aux longs styles recourbés, en hiver-printemps.","diff":"Le romarin est aromatique et a des fleurs bleues à lèvres.","conf":["salvia-rosmarinus","callistemon-citrinus"]},{"id":"dicksonia-antarctica","lat":"Dicksonia antarctica","fr":"Fougère arborescente","fam":"Dicksoniacées","type":"Fougère","orig":"Australie, Tasmanie","lvl":6,"tip":"Grandes frondes (feuilles de fougère) en couronne au sommet d'un faux tronc fibreux, fait de racines. Les jeunes frondes se déroulent en crosse.","diff":"Les palmiers ont des feuilles en plume ou en éventail, sans crosses ni spores sous les feuilles.","conf":["phoenix-canariensis"]},{"id":"cordyline-australis","lat":"Cordyline australis","fr":"Cordyline (palmier de Torbay)","fam":"Asparagacées","type":"Arbre persistant","orig":"Nouvelle-Zélande","lvl":6,"tip":"Ce n'est pas un palmier. Touffes de longues feuilles étroites et souples au sommet de troncs qui se ramifient après la floraison. Panicules de petites fleurs crème parfumées.","diff":"Le yucca a des feuilles raides et piquantes. Le phormium n'a pas de tronc.","conf":["yucca-gloriosa","phormium-tenax"]},{"id":"pittosporum-tenuifolium","lat":"Pittosporum tenuifolium","fr":"Pittosporum à petites feuilles","fam":"Pittosporacées","type":"Arbuste persistant","orig":"Nouvelle-Zélande","lvl":6,"tip":"Petites feuilles ovales au bord ondulé, vert clair, sur des rameaux noirs très contrastés. Nombreuses variétés panachées ou pourpres. Petites fleurs pourpre sombre au parfum de miel.","diff":"Le Pittosporum tobira a des feuilles épaisses en rosettes et des tiges grises.","conf":["pittosporum-tobira"]},{"id":"strelitzia-reginae","lat":"Strelitzia reginae","fr":"Oiseau de paradis","fam":"Strélitziacées","type":"Vivace","orig":"Afrique du Sud","lvl":6,"tip":"Fleur en tête d'oiseau : une spathe horizontale verte et pourpre, d'où sortent des pétales orange et une la
