<title>Herbier Vivant</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Serif:ital@0;1&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : une colonne étroite de « fiches d'herbier » ; photo en haut, étiquette de pépinière dessous. */
:root{
  --bg:#eef2ec;          /* papier d'herbier, teinté sauge */
  --surface:#ffffff;
  --surface-2:#e3eadf;
  --ink:#18241c;
  --muted:#56655a;
  --line:#cdd8cb;
  --leaf:#2c5a3a;        /* vert feuillage */
  --leaf-soft:#d6e6d6;
  --tag:#b9761a;         /* étiquette de pépinière */
  --tag-soft:#f4e2c4;
  --ok:#2f7d45; --ok-soft:#dcefdf;
  --ko:#b23b2c; --ko-soft:#f6dcd7;
  --shadow:0 1px 2px rgba(24,36,28,.06),0 6px 20px rgba(24,36,28,.07);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-latin:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101712; --surface:#18221b; --surface-2:#202d24; --ink:#e4ece5; --muted:#9aab9e; --line:#2d3d32;
  --leaf:#8fc79d; --leaf-soft:#22382a; --tag:#e3a64a; --tag-soft:#3a2d17;
  --ok:#7fcf92; --ok-soft:#1d3524; --ko:#f08d7f; --ko-soft:#3d221e; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101712; --surface:#18221b; --surface-2:#202d24; --ink:#e4ece5; --muted:#9aab9e; --line:#2d3d32;
  --leaf:#8fc79d; --leaf-soft:#22382a; --tag:#e3a64a; --tag-soft:#3a2d17;
  --ok:#7fcf92; --ok-soft:#1d3524; --ko:#f08d7f; --ko-soft:#3d221e; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
.latin{font-family:var(--f-latin);font-style:italic;font-weight:400}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px;border-radius:8px}
a{color:var(--leaf)}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em}
.brand small{display:block;font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:-2px}
.streak{display:flex;align-items:center;gap:6px;background:var(--tag-soft);color:var(--ink);border-radius:999px;padding:6px 12px;font-weight:700;font-variant-numeric:tabular-nums;font-size:.9rem;white-space:nowrap}
.streak i{font-style:normal;color:var(--tag)}

/* Navigation basse */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.75rem;font-weight:600;padding:6px 4px;border-radius:10px}
nav.tabs a[aria-current="page"]{color:var(--leaf);background:var(--leaf-soft)}
nav.tabs svg{width:22px;height:22px}

section.view{padding-block:20px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.muted{color:var(--muted)}

/* Accueil */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.hero h1{font-size:clamp(1.6rem,5vw,2.2rem);font-weight:800;letter-spacing:-.02em}
.hero p{margin:6px 0 0;color:var(--muted);max-width:46ch}
.ring{width:96px;height:96px;flex:none}
.ring text{font-family:var(--f-display);font-weight:800;fill:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 20px;font-weight:700;cursor:pointer;text-decoration:none;font-size:1rem}
.btn-main{background:var(--leaf);color:var(--bg)}
.btn-main:hover{filter:brightness(1.08)}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.btn-ghost:hover{background:var(--line)}
.btn-wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:.72rem;color:var(--muted)}
.week .d{aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;color:var(--muted);margin-bottom:3px}
.week .d.on{background:var(--leaf);color:var(--bg)}
.week .d.today{outline:2px solid var(--tag)}

/* Niveaux */
.levels{display:flex;flex-direction:column;gap:10px}
.lvl{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);cursor:pointer}
.lvl:hover:not([disabled]){border-color:var(--leaf)}
.lvl[disabled]{cursor:not-allowed;opacity:.6}
.lvl .num{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;background:var(--leaf-soft);color:var(--leaf)}
.lvl h3{font-size:1.02rem}
.lvl p{margin:2px 0 6px;font-size:.85rem;color:var(--muted)}
.lvl .meta{font-size:.8rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--leaf);border-radius:99px}

/* Quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.qhead .bar{flex:1}
.qcount{font-variant-numeric:tabular-nums;font-weight:700;font-size:.9rem;color:var(--muted);white-space:nowrap}
.photo{position:relative;border-radius:var(--r);overflow:hidden;background:var(--surface-2);aspect-ratio:4/3;max-width:100%}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .credit{position:absolute;right:0;bottom:0;max-width:100%;background:rgba(0,0,0,.55);color:#fff;font-size:.68rem;padding:3px 8px;border-top-left-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo .credit a{color:#fff}
.photo .zoom{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.5);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:.78rem;cursor:pointer}
.photo.noimg{display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
.qtitle{font-size:1.25rem;font-weight:700}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.choices{grid-template-columns:1fr}}
.choice{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;min-height:56px;display:flex;flex-direction:column;justify-content:center}
.choice:hover:not([disabled]){border-color:var(--leaf)}
.choice .main{font-weight:600}
.choice .main.latin{font-size:1.18rem;font-weight:400}
.choice[disabled]{cursor:default}
.choice.good{border-color:var(--ok);background:var(--ok-soft)}
.choice.bad{border-color:var(--ko);background:var(--ko-soft)}
.choice.dim{opacity:.55}

/* Fiche réponse */
.answer{overflow:hidden}
.verdict{padding:12px 18px;font-weight:700;display:flex;align-items:center;gap:8px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.ko{background:var(--ko-soft);color:var(--ko)}
.label{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.names .fr{font-family:var(--f-display);font-size:1.4rem;font-weight:700}
.names .latin{font-size:1.35rem;color:var(--leaf)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.76rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chip.tagc{background:var(--tag-soft);color:var(--ink)}
.tip{border-left:3px solid var(--tag);padding:2px 0 2px 12px}
.tip h4,.diff h4{margin:0 0 3px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--tag)}
.diff h4{color:var(--leaf)}
.tip p,.diff p{margin:0}
.diff{border-left:3px solid var(--leaf);padding:2px 0 2px 12px}
.look{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.mini{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);cursor:pointer;text-align:left;padding:0}
.mini img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--surface-2)}
.mini span{display:block;padding:6px 8px;font-size:.8rem;line-height:1.25}
.mini span em{font-family:var(--f-latin);font-size:.9rem;color:var(--muted)}

/* Herbier */
.search{display:flex;gap:8px;flex-wrap:wrap}
.search input,.search select{flex:1 1 180px;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.grid .mini span b{display:block;font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--line);vertical-align:middle}
.dot.m1{background:var(--tag)} .dot.m2{background:var(--leaf)}

/* Modale */
dialog{border:0;padding:0;border-radius:var(--r);max-width:min(640px,calc(100vw - 24px));width:100%;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,16,12,.6)}
dialog .close{position:absolute;right:10px;top:10px;z-index:2;border:0;border-radius:999px;width:36px;height:36px;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;font-size:1.1rem}
dialog .photo{border-radius:0;aspect-ratio:4/3}
dialog.zoomd{max-width:min(1000px,calc(100vw - 24px));background:#000}
dialog.zoomd img{width:100%;max-height:85vh;object-fit:contain;display:block}

/* Résultat */
.result h2{font-size:1.8rem}
.score{font-family:var(--f-display);font-size:3rem;font-weight:800;color:var(--leaf);font-variant-numeric:tabular-nums}
.share-url{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;background:var(--surface-2);padding:12px;border-radius:10px;word-break:break-all;user-select:all}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:calc(100vw - 32px)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.small{font-size:.85rem}
@media (prefers-reduced-motion:no-preference){
  .choice,.lvl,.btn{transition:background .15s,border-color .15s,filter .15s}
  .answer{animation:rise .25s ease-out}
  @keyframes rise{from{transform:translateY(6px)}to{transform:none}}
}

<script>
const PLANTS = /*PLANTS*/[];
const IMAGES = /*IMAGES*/{};
const SHARE_URL = /*SHARE_URL*/"";

const LEVELS = [
  {n:1, name:"Les incontournables", sub:"Arbres et arbustes qu'on croise partout en France"},
  {n:2, name:"Jardins et espaces verts", sub:"Les classiques des pépinières et des villes"},
  {n:3, name:"Vivaces et graminées", sub:"Les massifs d'aujourd'hui"},
  {n:4, name:"Les sosies", sub:"Espèces qu'on confond, à départager au détail près"},
  {n:5, name:"Méditerranée", sub:"Garrigue, maquis et jardins du Sud"},
  {n:6, name:"Végétaux du monde", sub:"Japon, Amériques, Océanie, Afrique du Sud"},
];
const SESSION_LEN = 10;
const INTERVALS = [0,1,2,4,8,16,32]; // jours avant révision selon la boîte
const MASTER_BOX = 3;               // boîte à partir de laquelle une plante est « connue »
const UNLOCK = 0.5;                 // part du niveau précédent à connaître pour débloquer

const byId = Object.fromEntries(PLANTS.map(p=>[p.id,p]));
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => {a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0") };
const dayDiff = (a,b) => Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/864e5);

/* ---------- Progression (dans ce navigateur) ---------- */
const KEY = "herbier-vivant-v1";
let S = load();
function load(){
  let s=null; try{ s=JSON.parse(localStorage.getItem(KEY)) }catch(e){}
  return Object.assign({cards:{}, days:{}, streak:0, lastDay:null, best:0, all:false, maxLvl:1}, s||{});
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)) }catch(e){} }
const card = id => S.cards[id] || {box:0, ok:0, ko:0, last:null};
const known = id => card(id).box >= MASTER_BOX;

function levelStats(n){
  const ps = PLANTS.filter(p=>p.lvl===n);
  const k = ps.filter(p=>known(p.id)).length;
  const seen = ps.filter(p=>card(p.id).box>0).length;
  return {total:ps.length, known:k, seen, ratio: ps.length? k/ps.length : 0};
}
function unlocked(n){ return S.all || n <= (S.maxLvl||1) }
function refreshUnlocks(){
  let m = S.maxLvl||1; const before = m;
  while (m < LEVELS.length && levelStats(m).ratio >= UNLOCK) m++;
  S.maxLvl = m; if (m!==before) save();
  return m > before;
}
function isDue(id){
  const c = card(id); if(!c.box || !c.last) return false;
  return dayDiff(c.last, today()) >= INTERVALS[Math.min(c.box, INTERVALS.length-1)];
}
function displayStreak(){
  let n = S.streak;
  if (S.lastDay && dayDiff(S.lastDay, today()) > 1) n = 0;
  $("#streakN").textContent = n;
}

/* ---------- Construction d'une séance ---------- */
function buildSession(level){
  const pool = PLANTS.filter(p => level ? p.lvl===level : unlocked(p.lvl));
  let picks = [];
  if (level){
    const due = shuffle(pool.filter(p=>isDue(p.id)));
    const fresh = pool.filter(p=>!card(p.id).box);
    const weak = shuffle(pool.filter(p=>card(p.id).box>0 && !known(p.id)));
    picks = [...due, ...fresh.slice(0,5), ...weak, ...shuffle(pool)];
  } else {
    const due = shuffle(pool.filter(p=>isDue(p.id))).sort((a,b)=>card(a.id).box-card(b.id).box);
    // nouvelles plantes : dans l'ordre, des plus communes aux plus difficiles
    const fresh = pool.filter(p=>!card(p.id).box).sort((a,b)=>a.lvl-b.lvl);
    const nNew = Math.max(3, SESSION_LEN - Math.min(due.length, 7));
    const weak = shuffle(pool.filter(p=>card(p.id).box>0 && !known(p.id)));
    picks = [...due.slice(0,7), ...fresh.slice(0,nNew), ...weak, ...shuffle(pool)];
  }
  const seen = new Set(); const out=[];
  for(const p of picks){ if(!seen.has(p.id)){ seen.add(p.id); out.push(p) } if(out.length===SESSION_LEN) break }
  return shuffle(out).map(p => makeQuestion(p));
}
function makeQuestion(p){
  const latinChance = p.lvl>=4 ? .6 : p.lvl>=2 ? .4 : .25;
  const mode = Math.random() < latinChance ? "lat" : "fr";
  const nChoices = p.lvl>=4 ? 6 : 4;
  const others = [];
  const add = q => { if(q && q.id!==p.id && !others.includes(q) && q[mode]!==p[mode]) others.push(q) };
  shuffle(p.conf).forEach(id=>add(byId[id]));
  shuffle(PLANTS.filter(q=>q.type===p.type && Math.abs(q.lvl-p.lvl)<=2)).forEach(add);
  shuffle(PLANTS.filter(q=>q.lvl===p.lvl)).forEach(add);
  shuffle(PLANTS).forEach(add);
  const choices = shuffle([p, ...others.slice(0,nChoices-1)]);
  return {p, mode, choices, answered:null};
}

/* ---------- Images ----------
   Photo locale si elle existe (dossier img/), sinon le navigateur la cherche sur Wikipédia
   (image principale de l'article, en évitant les planches dessinées). Résultat mis en cache. */
const PLATE = /k[oö]e?hler|illustration|sturm|thom[eé]|botanical|plate|flora|tafel|drawing|\.svg$|\.png$|\.tif|(?<![a-z])(map|range)(?![a-z])|distribution|herbarium/i;
const IMG_KEY = "herbier-vivant-img-v1";
let IMGC = {}; try{ IMGC = JSON.parse(localStorage.getItem(IMG_KEY))||{} }catch(e){}
const pending = {};
function localImg(p){ const m=IMAGES[p.id]; return m && m.file ? {src:m.file, commons:m.commons, artist:m.artist, license:m.license} : null }
function sized(url){ return url.split("?")[0].replace(/\/\d+px-/, "/500px-") }
async function wiki(lang, path){
  const r = await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/${path}`);
  if(!r.ok) throw new Error(r.status); return r.json();
}
async function findRemote(p){
  const t = encodeURIComponent((p.wiki||p.lat).replace(/ /g,"_"));
  const tried = [];
  for (const lang of ["fr","en"]){
    try{
      const d = await wiki(lang, "summary/"+t);
      tried.push(lang);
      if (d.originalimage && d.thumbnail){
        const name = decodeURIComponent(d.originalimage.source.split("?")[0].split("/").pop());
        if (!PLATE.test(name)){
          const src = d.originalimage.width>500 && d.thumbnail.source.includes("/thumb/") ? sized(d.thumbnail.source) : d.originalimage.source.split("?")[0];
          return {src, commons:name};
        }
      }
    }catch(e){}
  }
  for (const lang of tried){
    try{
      const d = await wiki(lang, "media-list/"+t);
      for (const it of d.items||[]){
        const name = (it.title||"").replace(/^(File|Fichier):/,"");
        if (it.type!=="image" || !/\.jpe?g$/i.test(name) || PLATE.test(name) || !(it.srcset||[]).length) continue;
        let src = it.srcset[0].src; if (src.startsWith("//")) src = "https:"+src;
        return {src: sized(src), commons:name};
      }
    }catch(e){}
  }
  return null;
}
function getImg(p){
  const l = localImg(p); if (l) return Promise.resolve(l);
  if (IMGC[p.id]) return Promise.resolve(IMGC[p.id]);
  if (!pending[p.id]) pending[p.id] = findRemote(p).then(r=>{ if(r){ IMGC[p.id]=r; try{ localStorage.setItem(IMG_KEY, JSON.stringify(IMGC)) }catch(e){} } return r });
  return pending[p.id];
}
function creditHTML(m){
  if(!m||!m.commons) return "";
  const url="https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(m.commons.replace(/ /g,"_"));
  return `Photo : ${esc(m.artist||"Wikimedia Commons")}${m.license?" · "+esc(m.license):""} · <a href="${url}" target="_blank" rel="noopener">source et licence</a>`;
}
async function fill(el){
  const p = byId[el.dataset.pid]; if(!p || el.dataset.done) return; el.dataset.done = "1";
  const m = await getImg(p);
  const box = el.closest(".photo");
  if (!m){
    if (box){ box.classList.add("noimg"); box.innerHTML = "Photo indisponible (connexion à Wikipédia impossible).<br>Fiez-vous à la description." }
    return;
  }
  el.src = m.src;
  if (box){
    const z = box.querySelector(".zoom"); if (z){ z.dataset.zoom = m.src; z.hidden = false }
    const c = box.querySelector(".credit"); if (c){ c.innerHTML = creditHTML(m); c.hidden = false }
  }
}
const io = "IntersectionObserver" in window ? new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ io.unobserve(e.target); fill(e.target) } }), {rootMargin:"400px"}) : null;
function hydrate(root){ (root||document).querySelectorAll("img[data-pid]:not([data-done])").forEach(el=> io ? io.observe(el) : fill(el)) }
new MutationObserver(()=>hydrate()).observe(document.body, {childList:true, subtree:true});
function thumb(p){ return `<img data-pid="${p.id}" alt="" loading="lazy">` }
function photo(p, hide){
  const alt = hide ? "Photo du végétal à identifier" : `${p.fr} (${p.lat})`;
  return `<div class="photo"><img data-pid="${p.id}" alt="${esc(alt)}"><button class="zoom" type="button" hidden>Agrandir</button><span class="credit" hidden></span></div>`;
}

/* ---------- Séance ---------- */
function startSession(level){
  quiz = {level, qs: buildSession(level), i:0, good:0};
  quiz.qs.forEach(q=>getImg(q.p)); // précharge les photos de la séance
  if (location.hash==="#seance") renderQuiz(); else location.hash = "#seance";
}
function renderQuiz(){
  const q = quiz.qs[quiz.i];
  const p = q.p;
  const lvlName = LEVELS[p.lvl-1].name;
  app.innerHTML = `<section class="view">
    <div class="qhead"><span class="qcount">${quiz.i+1} / ${quiz.qs.length}</span><span class="bar"><i style="width:${(quiz.i)/quiz.qs.length*100}%"></i></span>
      <button class="btn btn-ghost small" id="quit" type="button" style="padding:8px 12px">Quitter</button></div>
    ${photo(p, true)}
    <div>
      <div class="eyebrow">Niveau ${p.lvl} · ${esc(lvlName)} · ${esc(p.type)}</div>
      <h2 class="qtitle">${q.mode==="lat" ? "Quel est son nom latin ?" : "Quel est ce végétal ?"}</h2>
    </div>
    <div class="choices" id="choices">${q.choices.map((c,i)=>`<button class="choice" data-i="${i}" type="button"><span class="main ${q.mode==="lat"?"latin":""}">${esc(c[q.mode])}</span></button>`).join("")}</div>
    <div id="fb"></div>
  </section>`;
  $("#quit").onclick = ()=>{ quiz=null; location.hash="#accueil" };
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  if (q.answered!==null) showFeedback(q);
}
function answer(i){
  const q = quiz.qs[quiz.i]; if(q.answered!==null) return;
  q.answered = i;
  const ok = q.choices[i].id===q.p.id;
  const c = Object.assign({box:0,ok:0,ko:0,last:null}, S.cards[q.p.id]);
  if(ok){ c.box=Math.min(c.box+1, INTERVALS.length-1); c.ok++; quiz.good++ } else { c.box=1; c.ko++ }
  c.last = today(); S.cards[q.p.id]=c; save();
  showFeedback(q);
}
function showFeedback(q){
  const p=q.p, ok=q.choices[q.answered].id===p.id;
  app.querySelectorAll(".choice").forEach((b,i)=>{
    b.disabled=true; const c=q.choices[i];
    if(c.id===p.id) b.classList.add("good"); else if(i===q.answered) b.classList.add("bad"); else b.classList.add("dim");
    b.insertAdjacentHTML("beforeend", `<span class="small muted ${q.mode==="lat"?"":"latin"}" style="${q.mode==="lat"?"":"font-size:1rem"}">${esc(q.mode==="lat"?c.fr:c.lat)}</span>`);
  });
  const wrong = q.choices[q.answered];
  const last = quiz.i===quiz.qs.length-1;
  $("#fb").innerHTML = `<div class="card answer">
    <div class="verdict ${ok?"ok":"ko"}">${ok?"✓ Bien vu !":"✗ Ce n'était pas ça"}</div>
    ${sheetBody(p, ok?null:wrong)}
    <div class="pad" style="padding-top:0"><button class="btn btn-main btn-wide" id="next" type="button">${last?"Voir le bilan":"Plante suivante"}</button></div>
  </div>`;
  $("#next").onclick = next;
  bindMinis($("#fb"));
  $("#fb").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"start"});
}
function sheetBody(p, wrong){
  const looks = [...new Set([...(wrong?[wrong.id]:[]), ...p.conf])].map(id=>byId[id]).filter(Boolean).slice(0,4);
  return `<div class="label">
    <div class="names"><div class="fr">${esc(p.fr)}</div><div class="latin">${esc(p.lat)}</div></div>
    <div class="chips"><span class="chip tagc">${esc(p.fam)}</span><span class="chip">${esc(p.type)}</span><span class="chip">Origine : ${esc(p.orig)}</span><span class="chip">Niveau ${p.lvl}</span></div>
    <div class="tip"><h4>Pour le reconnaître</h4><p>${esc(p.tip)}</p></div>
    <div class="diff"><h4>Pour ne pas confondre</h4><p>${esc(p.diff)}</p></div>
    ${wrong?`<p class="small" style="margin:0">Vous avez répondu <b>${esc(wrong.fr)}</b> (<span class="latin">${esc(wrong.lat)}</span>). Comparez les deux ci-dessous.</p>`:""}
    ${looks.length?`<div><div class="eyebrow" style="margin-bottom:6px">${wrong?"À comparer":"Ses sosies"}</div><div class="look">${looks.map(miniHTML).join("")}</div></div>`:""}
  </div>`;
}
function miniHTML(p){ return `<button class="mini" data-id="${p.id}" type="button">${thumb(p)}<span>${esc(p.fr)}<br><em>${esc(p.lat)}</em></span></button>` }
function bindMinis(root){ root.querySelectorAll(".mini").forEach(b=>b.onclick=()=>openSheet(byId[b.dataset.id])) }
function next(){
  if (quiz.i < quiz.qs.length-1){ quiz.i++; renderQuiz(); window.scrollTo(0,0); return }
  finish();
}
function finish(){
  const t = today();
  const d = S.days[t] || {sessions:0, good:0, total:0};
  const first = d.sessions===0;
  d.sessions++; d.good+=quiz.good; d.total+=quiz.qs.length; S.days[t]=d;
  if (S.lastDay !== t){
    S.streak = (S.lastDay && dayDiff(S.lastDay,t)===1) ? S.streak+1 : 1;
    S.lastDay = t;
  }
  S.best = Math.max(S.best, S.streak);
  save(); displayStreak();
  const opened = refreshUnlocks() && !S.all;
  const missed = quiz.qs.filter(q=>q.choices[q.answered].id!==q.p.id).map(q=>q.p);
  const g=quiz.good, n=quiz.qs.length;
  const word = g===n ? "Sans faute !" : g>=n*.8 ? "Très bon œil" : g>=n*.5 ? "Bonne séance" : "On progresse en se trompant";
  app.innerHTML = `<section class="view result">
    <div class="card pad" style="text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center">
      <div class="eyebrow">Bilan de la séance</div>
      <div class="score">${g}/${n}</div>
      <h2>${word}</h2>
      <p class="muted" style="margin:0">${first?`Jour validé : série de <b>${S.streak}</b> jour${S.streak>1?"s":""}.`:"Séance bonus enregistrée."} Revenez demain pour garder votre série.</p>
      ${opened?`<p style="margin:6px 0 0;color:var(--leaf);font-weight:700">Nouveau niveau débloqué : ${esc(LEVELS[S.maxLvl-1].name)}</p>`:""}
    </div>
    ${missed.length?`<div><div class="eyebrow" style="margin-bottom:8px">À revoir (elles reviendront demain)</div><div class="look">${missed.map(miniHTML).join("")}</div></div>`:""}
    <div class="row"><button class="btn btn-main" id="again" type="button" style="flex:1">Encore ${SESSION_LEN} plantes</button><a class="btn btn-ghost" href="#partager" style="flex:1">Défier un ami</a></div>
  </section>`;
  bindMinis(app);
  const lvl = quiz.level; quiz=null;
  $("#again").onclick = ()=>startSession(lvl);
}

let tt; function toast(m){ let el=$(".toast"); if(!el){ el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el) } el.textContent=m; el.hidden=false; clearTimeout(tt); tt=setTimeout(()=>el.hidden=true,2600) }

document.addEventListener("keydown", e=>{
  if(location.hash!=="#seance"||!quiz||modal.open) return;
  const q=quiz.qs[quiz.i];
  if(q.answered===null && /^[1-6]$/.test(e.key) && +e.key<=q.choices.length) answer(+e.key-1);
  else if(q.answered!==null && e.key==="Enter"){ e.preventDefault(); next() }
});

if (location.hash==="#seance") location.hash="#accueil";
route();
